name: AI editor acceptance assets
description: Download unchanged, checksum-pinned Microsoft Hex Editor gallery assets.
runs:
  using: composite
  steps:
    - name: Download signed Marketplace assets
      shell: bash
      env:
        BASE: https://ms-vscode.gallerycdn.vsassets.io/extensions/ms-vscode/hexeditor/1.11.1/1730650070908
        # When the Marketplace CDN in BASE does not answer, each asset comes from
        # the Marketplace's own asset API, which its gallery API redirects to and
        # which serves the same bytes from outside that CDN (#1322). Its path names
        # the version but not the CDN's upload stamp.
        ORIGIN: https://ms-vscode.gallery.vsassets.io/_apis/public/gallery/publisher/ms-vscode/extension/hexeditor/1.11.1/assetbyname
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/ai-editor-assets"
        mkdir -p "$dir"
        fetch="$GITHUB_WORKSPACE/test/acceptance/clients/fetch-pinned.sh"
        "$fetch" a7e639542019cee516ae5a89df82340230924a9c9b93c1e4106726f66651143d "$dir/manifest.json" \
          "$BASE/Microsoft.VisualStudio.Code.Manifest" "$ORIGIN/Microsoft.VisualStudio.Code.Manifest"
        "$fetch" 441e583a9df4b5f304cc6c97a4ec0f207cd7a9995119cfa95e22777e87a0a3b6 "$dir/package.vsix" \
          "$BASE/Microsoft.VisualStudio.Services.VSIXPackage" "$ORIGIN/Microsoft.VisualStudio.Services.VSIXPackage"
        "$fetch" 0505d7a8c2be5b4072b439ecb9032642ecf640d766b34c36308b7cc20fb0a9c0 "$dir/signature.zip" \
          "$BASE/Microsoft.VisualStudio.Services.VsixSignature" "$ORIGIN/Microsoft.VisualStudio.Services.VsixSignature"
        echo "ARTIFACTWEAVE_AI_EDITOR_ASSETS=$dir" >> "$GITHUB_ENV"
