# Every dependency tracks its latest release. Updates arrive daily, grouped
# into one PR per ecosystem, majors included; auto-merge.yml merges each PR
# once the quality gate passes on it, so the gate is the only thing that can
# hold an update back. Terraform providers are the exception: they hold
# majors, because a provider major merged on mocked tests alone could break a
# real apply (decision 0030).
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]
    commit-message:
      # "chore(deps): …": conventional, and not a releasable change
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      go-modules:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # The infrastructure roots: the reference deployments and their modules,
  # and the lab's bootstraps. deploy/artifactweave is left out:
  # test/terraform/run.sh pins its jfrog provider zips by SHA-256, which
  # Dependabot cannot update, so deps-refresh.yml moves those providers with
  # their pins (deploy/ci/jfrog-providers.sh; docs/testing/ci.md, "Terraform
  # scenarios").
  - package-ecosystem: "terraform"
    directories:
      - "/deploy/platform/terraform/**"
      - "/deploy/ci/terraform/*"
    schedule:
      interval: "daily"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      terraform-providers:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore"
      include: "scope"
