# Every dependency tracks its latest release. Updates arrive daily, grouped
# into one PR per ecosystem, majors included. auto-merge.yml merges ordinary
# dependency PRs after the quality gate; acceptance client images require an
# eligible human review and manual merge. Terraform providers hold majors,
# because a provider major merged on mocked tests alone could break a real
# apply (decision 0030).
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]
    commit-message:
      # "chore(deps): …": conventional, and not a releasable change
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      go-modules:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # The infrastructure roots: the reference deployments and their modules,
  # and the lab's bootstraps. deploy/artifactweave is left out:
  # test/terraform/run.sh pins its jfrog provider zips by SHA-256, which
  # Dependabot cannot update, so deps-refresh.yml moves those providers with
  # their pins (deploy/ci/jfrog-providers.sh; docs/testing/ci.md, "Terraform
  # scenarios").
  - package-ecosystem: "terraform"
    directories:
      - "/deploy/platform/terraform/**"
      - "/deploy/ci/terraform/*"
    schedule:
      interval: "daily"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      terraform-providers:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # Native acceptance images track all released updates, including majors.
  # A client version change still needs real-client CI and an eligible review;
  # auto-merge.yml leaves this directory's PRs for human qualification.
  - package-ecosystem: "docker"
    directory: "/test/acceptance/clients"
    schedule:
      interval: "daily"
    groups:
      acceptance-clients:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # The second Maven client holds the 3.9 line (#284), so only its patches
  # move it; the main image in /test/acceptance/clients takes 3.10 and on.
  - package-ecosystem: "docker"
    directory: "/test/acceptance/clients/maven-3.9"
    schedule:
      interval: "daily"
    ignore:
      - dependency-name: "maven"
        versions: [">= 3.10"]
    groups:
      acceptance-clients-maven-3-9:
        patterns: ["*"]
        update-types: ["patch"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # The second npm client holds Node 24 LTS, the prior Node line beside the
  # newest Node in node.Dockerfile (decision 0034, #294). While it shared the
  # /test/acceptance/clients entry, a grouped update (#934) moved it to Node
  # 26 and left no lane running npm on Node 24 (#1119). The image has a
  # directory of its own because an ignore applies to a whole entry: on
  # /test/acceptance/clients it would also stop node.Dockerfile and
  # bower.Dockerfile taking new Node majors. Node 24 minor, patch and digest
  # updates still arrive.
  - package-ecosystem: "docker"
    directory: "/test/acceptance/clients/node-npm12"
    schedule:
      interval: "daily"
    ignore:
      - dependency-name: "node"
        versions: [">= 25"]
    groups:
      acceptance-clients-node-npm12:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # The Puppet client stays on Ruby 3.3. Puppet 8.10.0, the newest Puppet
  # gem, cannot extract a module archive on Ruby 3.4: safe_posix_fork closes
  # the descriptor of its own /proc/self/fd walk, which Ruby 3.4 reports as
  # Errno::EBADF, so every Puppet scenario failed once #1121 moved the image
  # to Ruby 3.4 (#1126). On Ruby 4 the gem does not install, since every
  # Facter 4 release declares Ruby below 4.0 (#895, #906, #934). The image
  # has a directory of its own because an ignore applies to a whole entry: on
  # /test/acceptance/clients it would also stop chef, cocoapods and ruby
  # taking newer Ruby releases. Ruby 3.3 patch and digest updates still
  # arrive. Ruby 3.3 is supported until March 2027, so revisit the hold
  # before then: once a Puppet gem, or a successor such as OpenVox that the
  # client recipes accept, installs modules on Ruby 3.4, raise the bound to
  # ">= 4"; once it installs on Ruby 4 too, delete the ignore, or move the
  # Dockerfile back beside the others and delete this entry.
  - package-ecosystem: "docker"
    directory: "/test/acceptance/clients/puppet"
    schedule:
      interval: "daily"
    ignore:
      - dependency-name: "ruby"
        versions: [">= 3.4"]
    groups:
      acceptance-clients-puppet:
        patterns: ["*"]
        update-types: ["patch"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # The FrogML client stays below Python 3.14: FrogML 3.0.0, like its newest
  # release, declares Python >=3.9,<3.14, so pip refused it on the Python
  # 3.15 image that #934 moved it to. Its own directory keeps the hold off
  # python.Dockerfile and ansible.Dockerfile, which track the newest Python.
  # Python 3.13 patch and digest updates still arrive. Lift the hold once a
  # pinned FrogML release accepts the newer Python: delete the ignore, or
  # move the Dockerfile back beside the others and delete this entry.
  - package-ecosystem: "docker"
    directory: "/test/acceptance/clients/frogml"
    schedule:
      interval: "daily"
    ignore:
      - dependency-name: "python"
        versions: [">= 3.14"]
    groups:
      acceptance-clients-frogml:
        patterns: ["*"]
        update-types: ["patch"]
    commit-message:
      prefix: "chore"
      include: "scope"
