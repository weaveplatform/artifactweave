name: deps | Auto-merge

# Merges dependency PRs, Dependabot's and deps-refresh.yml's, once the quality
# gate has passed on exactly the commit being merged. Native acceptance client
# image updates need an eligible human review, so this workflow skips those PRs.
# This workflow_run job rather than GitHub's auto-merge does not depend on the plan
# allowing auto-merge or on branch protection naming the gate: the gate's own
# result is the condition. Majors merge too; a major that breaks the build
# fails the gate and the PR stays open for a person. The one exception is the
# JFrog Terraform providers: deps-refresh.yml raises their majors on
# deps/jfrog-providers-major, which is not listed here, so a person reviews
# them.
#
# Terraform dependency PRs first refresh their generated README tables. The
# App's docs commit reruns the gate; only that passing head can merge.
# workflow_run uses secrets, so only default-branch scripts/configuration run.
# PR Terraform inputs are read as data through git objects, never checked out.
on:
  workflow_run:
    workflows: ['go | Quality gate']
    types: [completed]

permissions:
  contents: read

jobs:
  terraform-docs:
    name: '📖 Refresh Terraform dependency docs'
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.conclusion == 'success' ||
       github.event.workflow_run.conclusion == 'failure') &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/terraform/')
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-dependency-docs-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Check out trusted automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Install the deployment check's pinned tools
        run: ./deploy/check.sh tools

      # An App commit triggers the PR gate; GITHUB_TOKEN would suppress it.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ vars.RP_APP_ID }}
          private-key: ${{ secrets.RP_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read

      - name: Refresh generated provider references
        env:
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          version=$(sed -n 's/^TERRAFORM_DOCS_VERSION=//p' deploy/check.sh)
          export TERRAFORM_DOCS="$PWD/.tools/terraform-docs-$version/terraform-docs"
          python3 deploy/ci/terraform_docs.py

  merge:
    name: '🤖 Merge passing dependency PRs'
    needs: [terraform-docs]
    if: >-
      always() &&
      (needs.terraform-docs.result == 'success' || needs.terraform-docs.result == 'skipped') &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      (startsWith(github.event.workflow_run.head_branch, 'dependabot/') ||
       github.event.workflow_run.head_branch == 'deps/refresh' ||
       github.event.workflow_run.head_branch == 'deps/jfrog-providers')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      # Merging with the App token means the merge commit on main triggers
      # the push workflows (the gate on main, release-please); a merge made
      # with GITHUB_TOKEN would not.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        continue-on-error: true
        with:
          app-id: ${{ vars.RP_APP_ID }}
          private-key: ${{ secrets.RP_APP_PRIVATE_KEY }}

      - name: Merge
        env:
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          FALLBACK_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export GH_TOKEN="${APP_TOKEN:-$FALLBACK_TOKEN}"
          pr=$(gh pr list -R "$REPO" --head "$HEAD_BRANCH" --state open \
                --json number,author,headRefOid \
                -q '.[] | select(.author.login == "app/dependabot" or .author.login == "app/weaveplatform-release-please") | "\(.number) \(.headRefOid)"')
          if [ -z "$pr" ]; then
            echo "no open dependency PR from a trusted author on $HEAD_BRANCH"
            exit 0
          fi
          number=${pr% *}; head=${pr#* }
          if [ "$head" != "$HEAD_SHA" ]; then
            echo "PR #$number moved on since the gate ran ($HEAD_SHA -> $head); the next gate run decides"
            exit 0
          fi
          client_images=$(gh pr view "$number" -R "$REPO" --json files \
            -q '[.files[].path | startswith("test/acceptance/clients/")] | any')
          if [ "$client_images" = true ]; then
            echo "native acceptance client updates require an eligible review and manual merge"
            exit 0
          fi
          # A PR that touches workflow files needs the workflows permission to
          # merge; the App does not have it, GITHUB_TOKEN merges those.
          gh pr merge "$number" -R "$REPO" --squash --delete-branch --match-head-commit "$HEAD_SHA" \
            || GH_TOKEN="$FALLBACK_TOKEN" gh pr merge "$number" -R "$REPO" --squash --delete-branch --match-head-commit "$HEAD_SHA"
