name: go | Real-cloud conformance

# Runs the blob contract and the research 18 probes against real Google Cloud
# Storage, Azure Blob Storage (issue #12) and Amazon S3 (issue #128).
# Emulators miss behaviour the backends rely on (compose preconditions,
# copy-source authorisation, signed URLs, service limits), so this run is the
# only check of it. It is opt-in and
# manual because it needs cloud credentials and costs a few cents a run; it is
# not part of the quality gate. docs/testing/ci.md lists the secrets and
# variables it reads.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which clouds to test'
        type: choice
        options: [all, gcs, azure, s3]
        default: all

permissions:
  contents: read

env:
  GOWORK: 'off'

jobs:
  gcs:
    name: 'Google Cloud Storage'
    if: inputs.target == 'all' || inputs.target == 'gcs'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The workload identity provider admits this repository's environment
    # subjects only (deploy/ci/terraform/gcp), so the job must
    # run in cloud-conformance to be trusted at all.
    environment: cloud-conformance
    # id-token lets google-github-actions/auth exchange the job's OIDC token
    # for the service account (Workload Identity Federation): no stored key.
    permissions:
      contents: read
      id-token: write
    env:
      ARTIFACTWEAVE_TEST_GCS_BUCKET: ${{ vars.CONFORMANCE_GCS_BUCKET }}
      ARTIFACTWEAVE_TEST_GCS_ACCESS_ID: ${{ vars.CONFORMANCE_GCP_SERVICE_ACCOUNT }}
      GCP_WIF_PROVIDER: ${{ vars.CONFORMANCE_GCP_WIF_PROVIDER }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Download Go modules
        uses: ./.github/actions/go-mod-download

      # The tests skip without configuration; a dispatched run that skipped
      # would look like a pass, so missing configuration fails here instead.
      - name: Check configuration
        shell: bash
        run: |
          if [ -z "$ARTIFACTWEAVE_TEST_GCS_BUCKET" ] || [ -z "$ARTIFACTWEAVE_TEST_GCS_ACCESS_ID" ] \
            || [ -z "$GCP_WIF_PROVIDER" ]; then
            echo "::error::Set the CONFORMANCE_GCS_BUCKET, CONFORMANCE_GCP_SERVICE_ACCOUNT and CONFORMANCE_GCP_WIF_PROVIDER variables (make ci-github-vars CLOUD=gcp, then make gcp-github-vars)"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.CONFORMANCE_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.CONFORMANCE_GCP_SERVICE_ACCOUNT }}

      - name: Contract and probes
        shell: bash
        run: |
          set -o pipefail
          go test -count=1 -timeout 25m -v -run 'TestAccContractOnRealGCS|TestAccRealGCSProbes' ./pkg/blob/gcs/ \
            | tee "$RUNNER_TEMP/gcs.log"

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Google Cloud Storage probes'
            echo '```'
            grep -o 'PROBE .*' "$RUNNER_TEMP/gcs.log" || echo 'no probe output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  azure:
    name: 'Azure Blob Storage'
    if: inputs.target == 'all' || inputs.target == 'azure'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Azure matches the federated credential's subject exactly; running in an
    # environment gives the subject repo:<repo>:environment:cloud-conformance
    # whatever branch or event dispatched the run.
    environment: cloud-conformance
    # id-token lets azure/login exchange the job's OIDC token for the
    # managed identity (workload identity federation): no stored secret, and
    # the storage account allows no Shared Key anyway.
    permissions:
      contents: read
      id-token: write
    env:
      ARTIFACTWEAVE_TEST_AZURE_ACCOUNT: ${{ vars.CONFORMANCE_AZURE_ACCOUNT }}
      ARTIFACTWEAVE_TEST_AZURE_CONTAINER: ${{ vars.CONFORMANCE_AZURE_CONTAINER }}
      # The Put Block From URL ranges up to 4,000 MiB are copied server-side
      # from a 101 MiB upload: they cost about a minute, not traffic.
      ARTIFACTWEAVE_TEST_AZURE_LARGE_RANGES: '1'
      # Not the AZURE_* names: DefaultAzureCredential reads those and would
      # try other credential types before the Azure CLI login.
      CONFORMANCE_AZURE_CLIENT_ID: ${{ vars.CONFORMANCE_AZURE_CLIENT_ID }}
      CONFORMANCE_AZURE_TENANT_ID: ${{ vars.CONFORMANCE_AZURE_TENANT_ID }}
      CONFORMANCE_AZURE_SUBSCRIPTION_ID: ${{ vars.CONFORMANCE_AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Download Go modules
        uses: ./.github/actions/go-mod-download

      - name: Check configuration
        shell: bash
        run: |
          for v in ARTIFACTWEAVE_TEST_AZURE_ACCOUNT ARTIFACTWEAVE_TEST_AZURE_CONTAINER \
            CONFORMANCE_AZURE_CLIENT_ID CONFORMANCE_AZURE_TENANT_ID CONFORMANCE_AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::Set the CONFORMANCE_AZURE_ACCOUNT, CONFORMANCE_AZURE_CONTAINER, CONFORMANCE_AZURE_CLIENT_ID, CONFORMANCE_AZURE_TENANT_ID and CONFORMANCE_AZURE_SUBSCRIPTION_ID variables (make ci-github-vars CLOUD=azure, then make azure-github-vars)"
              exit 1
            fi
          done

      # The tests authenticate with DefaultAzureCredential, which finds this
      # Azure CLI login; the probes sign copy sources with a user delegation
      # key from it.
      - name: Authenticate to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.CONFORMANCE_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.CONFORMANCE_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.CONFORMANCE_AZURE_SUBSCRIPTION_ID }}

      - name: Contract and probes
        shell: bash
        run: |
          set -o pipefail
          go test -count=1 -timeout 25m -v -run 'TestAccContractOnRealAzure|TestAccRealAzureProbes' ./pkg/blob/azure/ \
            | tee "$RUNNER_TEMP/azure.log"

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Azure Blob Storage probes'
            echo '```'
            grep -o 'PROBE .*' "$RUNNER_TEMP/azure.log" || echo 'no probe output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  s3:
    name: 'Amazon S3'
    if: inputs.target == 'all' || inputs.target == 's3'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The conformance role trusts this environment's subject exactly
    # (deploy/ci/terraform/aws), whatever branch or event
    # dispatched the run.
    environment: cloud-conformance
    # id-token lets configure-aws-credentials exchange the job's OIDC token
    # for the role (sts:AssumeRoleWithWebIdentity): no stored AWS key.
    permissions:
      contents: read
      id-token: write
    env:
      ARTIFACTWEAVE_TEST_S3_BUCKET: ${{ vars.CONFORMANCE_S3_BUCKET }}
      ARTIFACTWEAVE_TEST_S3_REGION: ${{ vars.CONFORMANCE_AWS_REGION }}
      # A secret, so the account ID in the ARN stays out of the public logs.
      CONFORMANCE_AWS_ROLE_ARN: ${{ secrets.CONFORMANCE_AWS_ROLE_ARN }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Download Go modules
        uses: ./.github/actions/go-mod-download

      - name: Check configuration
        shell: bash
        run: |
          for v in ARTIFACTWEAVE_TEST_S3_BUCKET ARTIFACTWEAVE_TEST_S3_REGION CONFORMANCE_AWS_ROLE_ARN; do
            if [ -z "${!v}" ]; then
              echo "::error::Set the CONFORMANCE_S3_BUCKET and CONFORMANCE_AWS_REGION variables and the CONFORMANCE_AWS_ROLE_ARN secret (make ci-github-vars CLOUD=aws, then make aws-github-vars)"
              exit 1
            fi
          done

      # The tests use the AWS default credential chain, which finds the
      # session this step exports.
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.CONFORMANCE_AWS_ROLE_ARN }}
          aws-region: ${{ vars.CONFORMANCE_AWS_REGION }}
          role-session-name: cloud-conformance-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Contract and probes
        shell: bash
        run: |
          set -o pipefail
          go test -count=1 -timeout 25m -v -run 'TestAccContractOnRealS3|TestAccRealS3Probes' ./pkg/blob/s3/ \
            | tee "$RUNNER_TEMP/s3.log"

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Amazon S3 probes'
            echo '```'
            grep -o 'PROBE .*' "$RUNNER_TEMP/s3.log" || echo 'no probe output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
