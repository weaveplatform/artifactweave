name: deploy | Platform deployer check

# Proves GitHub's trust in the deployer identities that the bootstraps create
# (deploy/platform/terraform/{gcp,azure}/bootstrap, decision 0030): the job
# runs in the cloud-platform environment, exchanges its OIDC token for the
# deployer on each cloud, and makes read-only calls that need the deployer's
# rights. It creates nothing and costs nothing. The scenario workflow (#129)
# builds on the same trust.

# Also on pull requests that change the trust itself, so such a change is
# proven before it merges (a dispatch only finds workflows on the default
# branch). The job still waits for the maintainer's approval in the
# environment, and pull requests from forks get no OIDC token.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'deploy/platform/terraform/*/bootstrap/**'
      - 'deploy/platform/terraform/github-environments.sh'
      - '.github/workflows/platform-auth-check.yml'

permissions:
  contents: read

jobs:
  check:
    name: 'Deployer trust'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The clouds trust this environment's subject exactly, and the
    # environment asks the maintainer to approve every run.
    environment: cloud-platform
    permissions:
      contents: read
      id-token: write
    env:
      PLATFORM_GCP_PROJECT: ${{ vars.PLATFORM_GCP_PROJECT }}
      PLATFORM_GCP_STATE_BUCKET: ${{ vars.PLATFORM_GCP_STATE_BUCKET }}
      PLATFORM_AZURE_RESOURCE_GROUP: ${{ vars.PLATFORM_AZURE_RESOURCE_GROUP }}
      PLATFORM_AZURE_STATE_ACCOUNT: ${{ vars.PLATFORM_AZURE_STATE_ACCOUNT }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check configuration
        shell: bash
        env:
          PLATFORM_GCP_WIF_PROVIDER: ${{ vars.PLATFORM_GCP_WIF_PROVIDER }}
          PLATFORM_GCP_SERVICE_ACCOUNT: ${{ vars.PLATFORM_GCP_SERVICE_ACCOUNT }}
          PLATFORM_AZURE_CLIENT_ID: ${{ vars.PLATFORM_AZURE_CLIENT_ID }}
          PLATFORM_AZURE_TENANT_ID: ${{ vars.PLATFORM_AZURE_TENANT_ID }}
          PLATFORM_AZURE_SUBSCRIPTION_ID: ${{ vars.PLATFORM_AZURE_SUBSCRIPTION_ID }}
        run: |
          for v in PLATFORM_GCP_WIF_PROVIDER PLATFORM_GCP_SERVICE_ACCOUNT PLATFORM_GCP_PROJECT \
            PLATFORM_GCP_STATE_BUCKET PLATFORM_AZURE_CLIENT_ID PLATFORM_AZURE_TENANT_ID \
            PLATFORM_AZURE_SUBSCRIPTION_ID PLATFORM_AZURE_RESOURCE_GROUP PLATFORM_AZURE_STATE_ACCOUNT; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not set (make platform-github-vars SCENARIO=gcp/bootstrap and SCENARIO=azure/bootstrap)"
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud as the deployer
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.PLATFORM_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.PLATFORM_GCP_SERVICE_ACCOUNT }}

      # Storage admin on the project, and DNS admin on the scenarios' zone.
      - name: Read the state bucket and the DNS zone
        shell: bash
        run: |
          gcloud storage buckets describe "gs://$PLATFORM_GCP_STATE_BUCKET" --format='value(name,location)'
          gcloud dns record-sets list --zone gcp-artifact-weaveplatform-run \
            --project "$PLATFORM_GCP_PROJECT" --format='value(name,type)' --limit 5

      - name: Authenticate to Azure as the deployer
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.PLATFORM_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.PLATFORM_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.PLATFORM_AZURE_SUBSCRIPTION_ID }}

      # Contributor on the scenarios group, and a blob data role on the state
      # account (which allows no Shared Key, so this is Entra ID end to end).
      - name: Read the scenarios group and the state container
        shell: bash
        run: |
          az group show --name "$PLATFORM_AZURE_RESOURCE_GROUP" --query '{name:name,location:location}' -o tsv
          az storage blob list --account-name "$PLATFORM_AZURE_STATE_ACCOUNT" --container-name tfstate \
            --auth-mode login --num-results 5 --query '[].name' -o tsv
