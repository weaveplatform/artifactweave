name: deploy | Platform scenarios

# Applies, tests, destroys and reaps the reference deployments under
# deploy/platform/terraform (decision 0030) on real clouds. Every cloud call
# is made as the deployer identity the bootstraps trust, from the
# cloud-platform environment, so the maintainer approves each run. Manual
# dispatch only: a scenario costs money while it exists, and test destroys
# what it applied in a step that always runs.
#
#   test     apply a fresh instance, run test/platform against it, destroy it
#   apply    create an instance and leave it (for exploration); destroy it later
#   destroy  destroy an instance from its remote state
#   reap     destroy every instance of the cloud whose expires-at has passed,
#            and resources that outlived their state
#
# Pull requests that change this workflow, the scenario driver, test/platform,
# a scenario or a module run the same driver as a proof, behind the same
# approval, for the scenarios prove-matrix.sh chooses from the changed paths:
# every cloud's single-bucket when the driver changes, the scenarios a
# test/platform file names, every scenario that sources a changed module, and
# each scenario whose Terraform or ci-vars.sh changes. READMEs, Makefiles and
# mocked tests prove nothing. The prove-all label proves every scenario that
# runs in CI, on the push that adds it and every later one; adding any other
# label proves nothing. Each proof runs test, then an apply and a destroy that
# finds only the remote state (as two separate dispatches would), then an
# instance that has already expired and a reap that removes it, then a check
# that nothing of the run remains. A scenario prove-matrix.sh marks "test"
# (azure/cdn, whose Front Door Premium profile bills by the hour) runs the
# test, its destroy and the final check only: one instance, not three. A
# dispatch only finds workflows on the default branch, so this is how a
# change is proven before it merges. Pull requests from forks get no OIDC
# token and do not run.
on:
  workflow_dispatch:
    inputs:
      cloud:
        description: 'Cloud whose bootstrap trust and state store to use; multicloud logs in to all three and keeps its state in GCP''s store'
        type: choice
        options: [gcp, azure, aws, multicloud]
        required: true
      scenario:
        description: 'Scenario directory under deploy/platform/terraform/<cloud>'
        type: string
        default: single-bucket
      action:
        description: 'test, apply, destroy or reap'
        type: choice
        options: [test, apply, destroy, reap]
        default: test
      instance:
        description: 'Instance name (a-z, 0-9, -). Defaults to r<run id> for test and apply; required for destroy'
        type: string
        required: false
      ttl_minutes:
        description: 'apply and test: minutes until expires-at, after which reap removes the instance'
        type: string
        default: '240'
  pull_request:
    # labeled lets the prove-all label start a run; the plan job ignores every
    # other label. The paths filter still applies, so the label proves only
    # pull requests this workflow covers.
    types: [opened, synchronize, reopened, labeled]
    paths:
      - '.github/workflows/platform-scenarios.yml'
      - 'deploy/ci/scenario-ci.sh'
      - 'deploy/ci/platform-tests.sh'
      - 'deploy/ci/prove-matrix.sh'
      - 'deploy/ci/cloudfront-key.sh'
      - 'deploy/ci/cloud-cdn-key.sh'
      # <cloud>/<scenario>/ and modules/<cloud>/<capability>/. The bootstraps
      # live in deploy/ci/terraform, outside this filter; platform-auth-check
      # proves their trust instead.
      - 'deploy/platform/terraform/*/*/**'
      - 'test/platform/**'

permissions:
  contents: read

env:
  GOWORK: 'off'
  TF_IN_AUTOMATION: '1'

jobs:
  plan:
    name: 'Plan the runs'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # The changed paths of the pull request, which prove-matrix.sh reads.
      pull-requests: read
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Inputs reach the shell through the environment, never interpolated
      # into the script; scenario-ci.sh validates every name it is given.
      # A pull request proves what prove-matrix.sh chooses; each proof gets
      # its own run tag (the scenario's initials appended), so its reap and
      # check-clean see only its own instances and proofs run in parallel.
      # Its concurrency group names the run too: GitHub cancels a waiting job
      # when a newer one joins its group, so a group shared across runs let
      # one pull request's proof, waiting for approval, cancel another's.
      - name: Build the matrix
        id: matrix
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          PR: ${{ github.event.pull_request.number }}
          PR_ACTION: ${{ github.event.action }}
          ADDED_LABEL: ${{ github.event.label.name }}
          PROVE_ALL: ${{ contains(github.event.pull_request.labels.*.name, 'prove-all') }}
          RUN_ID: ${{ github.run_id }}
          IN_CLOUD: ${{ inputs.cloud }}
          IN_SCENARIO: ${{ inputs.scenario }}
          IN_ACTION: ${{ inputs.action }}
          IN_INSTANCE: ${{ inputs.instance }}
          IN_TTL: ${{ inputs.ttl_minutes }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            if [ "$SAME_REPO" != true ]; then
              include='[]'
            elif [ "$PR_ACTION" = labeled ] && [ "$ADDED_LABEL" != prove-all ]; then
              # Labelling a pull request is no reason to spend money.
              include='[]'
            else
              if [ "$PROVE_ALL" = true ]; then
                pairs=$(deploy/ci/prove-matrix.sh --all)
              else
                pairs=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' |
                  deploy/ci/prove-matrix.sh)
              fi
              include=$(jq -Rcn --arg pr "$PR" --arg run "$RUN_ID" '[inputs | select(length > 0) |
                split(" ") as [$c, $s, $l] | ([$s | splits("-") | .[0:1]] | join("")) as $code |
                {cloud: $c, scenario: $s, action: "prove", lifecycle: ($l // "full"), instance: "", ttl: "",
                 run_tag: ("pr" + $pr + "-" + $run + "-" + $code), lock: ("prove-" + $s + "-" + $run),
                 title: ("prove " + $c + "/" + $s)}]' <<<"$pairs")
            fi
          else
            instance=$IN_INSTANCE
            if [ -z "$instance" ] && { [ "$IN_ACTION" = test ] || [ "$IN_ACTION" = apply ]; }; then
              instance="r$RUN_ID"
            fi
            if [ "$IN_ACTION" = destroy ] && [ -z "$instance" ]; then
              echo "::error::destroy needs the instance to destroy"
              exit 1
            fi
            lock="$IN_SCENARIO-$instance"
            [ "$IN_ACTION" = reap ] && lock=reap
            include=$(jq -cn --arg c "$IN_CLOUD" --arg s "$IN_SCENARIO" --arg a "$IN_ACTION" \
              --arg i "$instance" --arg t "$IN_TTL" --arg l "$lock" \
              '[{cloud: $c, scenario: $s, action: $a, instance: $i, ttl: $t, run_tag: "", lock: $l,
                 title: ($a + " " + $c + "/" + $s + (if $i == "" then "" else " " + $i end))}]')
          fi
          echo "include=$include" >> "$GITHUB_OUTPUT"
          echo "$include" | jq .

  run:
    needs: plan
    if: needs.plan.outputs.include != '[]'
    name: ${{ matrix.title }}
    runs-on: ubuntu-latest
    # A CDN proof applies and destroys three CloudFront distributions, each
    # minutes to deploy and again to disable; a job cut off mid-destroy
    # leaves its instance to the next reap.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    # The clouds trust this environment's subject exactly, and the
    # environment asks the maintainer to approve every run.
    environment: cloud-platform
    concurrency:
      group: platform-${{ matrix.cloud }}-${{ matrix.lock }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      CLOUD: ${{ matrix.cloud }}
      SCENARIO: ${{ matrix.scenario }}
      INSTANCE: ${{ matrix.instance }}
      TTL_MINUTES: ${{ matrix.ttl }}
      ACTION: ${{ matrix.action }}
      RUN_TAG: ${{ matrix.run_tag }}
      PLATFORM_GCP_PROJECT: ${{ vars.PLATFORM_GCP_PROJECT }}
      PLATFORM_GCP_STATE_BUCKET: ${{ vars.PLATFORM_GCP_STATE_BUCKET }}
      PLATFORM_GCP_SERVICE_ACCOUNT: ${{ vars.PLATFORM_GCP_SERVICE_ACCOUNT }}
      # The bootstrap's zone (its managed zone's name), where gcp/cdn gives
      # each instance a host and reap finds the records a lost instance left.
      PLATFORM_GCP_DNS_ZONE: ${{ vars.PLATFORM_GCP_DNS_ZONE }}
      PLATFORM_AZURE_SUBSCRIPTION_ID: ${{ vars.PLATFORM_AZURE_SUBSCRIPTION_ID }}
      PLATFORM_AZURE_RESOURCE_GROUP: ${{ vars.PLATFORM_AZURE_RESOURCE_GROUP }}
      PLATFORM_AZURE_STATE_ACCOUNT: ${{ vars.PLATFORM_AZURE_STATE_ACCOUNT }}
      PLATFORM_AWS_REGION: ${{ vars.PLATFORM_AWS_REGION }}
      PLATFORM_AWS_STATE_BUCKET: ${{ vars.PLATFORM_AWS_STATE_BUCKET }}
      # The bootstrap's zone, where aws/cdn gives each instance a host and
      # reap finds the records a lost instance left.
      PLATFORM_AWS_DNS_ZONE_ID: ${{ vars.PLATFORM_AWS_DNS_ZONE_ID }}
      # A secret, so the account ID in the ARN stays out of the public logs.
      # Every scenario's ci-vars.sh makes the deployer the run acts as its app
      # principal (this role on AWS, PLATFORM_GCP_SERVICE_ACCOUNT on GCP, and
      # whoever applies on Azure), so each scenario grants its stores to it.
      PLATFORM_AWS_ROLE_ARN: ${{ secrets.PLATFORM_AWS_ROLE_ARN }}
      CLOUDSDK_CORE_PROJECT: ${{ vars.PLATFORM_GCP_PROJECT }}
      # Terraform's azurerm provider and backend exchange the job's OIDC
      # token for the deployer themselves; az login below serves the CLI
      # and artifactweave's Azure SDK chain.
      ARM_USE_OIDC: 'true'
      ARM_CLIENT_ID: ${{ vars.PLATFORM_AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.PLATFORM_AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.PLATFORM_AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Download Go modules
        uses: ./.github/actions/go-mod-download

      # test/platform runs jf rt dl through a CDN scenario's edge.
      - name: JFrog CLI (pinned)
        uses: ./.github/actions/jfrog-cli

      # The same pinned download as the quality gate's terraform job.
      - name: Terraform (pinned)
        env:
          TF_VERSION: '1.17.0'
          TF_SHA256: 'c168cab7c637a8769fdb90089ddd19de701bc6ff8aca64dc2e2185fe46f59f67'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/terraform.zip" \
            "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
          echo "${TF_SHA256}  $RUNNER_TEMP/terraform.zip" | sha256sum -c -
          unzip -q -d "$RUNNER_TEMP/terraform" "$RUNNER_TEMP/terraform.zip"
          "$RUNNER_TEMP/terraform/terraform" version
          echo "$RUNNER_TEMP/terraform" >> "$GITHUB_PATH"

      # A multicloud scenario has a store on every cloud, so its job logs in
      # to all three; each cloud trusts this one environment's subject.
      - name: Authenticate to Google Cloud as the deployer
        if: matrix.cloud == 'gcp' || matrix.cloud == 'multicloud'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.PLATFORM_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.PLATFORM_GCP_SERVICE_ACCOUNT }}

      - name: Authenticate to Azure as the deployer
        if: matrix.cloud == 'azure' || matrix.cloud == 'multicloud'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.PLATFORM_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.PLATFORM_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.PLATFORM_AZURE_SUBSCRIPTION_ID }}

      # Terraform, the S3 backend, the CLI and artifactweave's AWS SDK chain
      # all read the session this step exports (an hour, the role's limit).
      - name: Authenticate to AWS as the deployer
        if: matrix.cloud == 'aws' || matrix.cloud == 'multicloud'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.PLATFORM_AWS_ROLE_ARN }}
          aws-region: ${{ vars.PLATFORM_AWS_REGION }}
          role-session-name: platform-scenarios-${{ github.run_id }}
          mask-aws-account-id: true

      # Dispatch: the one action asked for.
      - name: ${{ matrix.action }}
        if: matrix.action != 'prove'
        run: deploy/ci/scenario-ci.sh "$ACTION"

      - name: Destroy the test instance
        if: always() && matrix.action == 'test'
        run: deploy/ci/scenario-ci.sh destroy

      # Pull request proof.
      - name: 'Prove: test (apply, test/platform)'
        if: matrix.action == 'prove'
        env:
          INSTANCE: ${{ matrix.run_tag }}-t
          TTL_MINUTES: '120'
        run: deploy/ci/scenario-ci.sh test

      - name: 'Prove: destroy the test instance'
        if: always() && matrix.action == 'prove'
        env:
          INSTANCE: ${{ matrix.run_tag }}-t
        run: deploy/ci/scenario-ci.sh destroy

      # The AWS session lasts an hour, the role's limit, and a proof of a
      # CDN scenario can outlast it: CloudFront takes minutes to deploy and
      # again to disable before each delete. A fresh session for the second
      # half keeps every later step inside one.
      - name: 'Prove: renew the AWS session'
        if: matrix.action == 'prove' && (matrix.cloud == 'aws' || matrix.cloud == 'multicloud') && matrix.lifecycle != 'test'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.PLATFORM_AWS_ROLE_ARN }}
          aws-region: ${{ vars.PLATFORM_AWS_REGION }}
          role-session-name: platform-scenarios-${{ github.run_id }}
          mask-aws-account-id: true

      - name: 'Prove: apply, as one dispatch would'
        if: matrix.action == 'prove' && matrix.lifecycle != 'test'
        env:
          INSTANCE: ${{ matrix.run_tag }}-l
          TTL_MINUTES: '120'
        run: deploy/ci/scenario-ci.sh apply

      - name: 'Prove: destroy from the remote state alone, as a later dispatch would'
        if: matrix.action == 'prove' && matrix.lifecycle != 'test'
        env:
          INSTANCE: ${{ matrix.run_tag }}-l
        run: deploy/ci/scenario-ci.sh destroy

      - name: 'Prove: apply an instance that has already expired'
        if: matrix.action == 'prove' && matrix.lifecycle != 'test'
        env:
          INSTANCE: ${{ matrix.run_tag }}-o
          TTL_MINUTES: '-5'
        run: deploy/ci/scenario-ci.sh apply

      # Only this proof's instances: proofs of other scenarios on the same
      # cloud run alongside and keep theirs. The hyphen ends the tag, so a
      # tag that begins another's (a mirror's -m, a multi-region's -mr)
      # reaps only its own.
      - name: 'Prove: reap removes it'
        if: matrix.action == 'prove' && matrix.lifecycle != 'test'
        env:
          REAP_PREFIX: ${{ matrix.run_tag }}-
        run: deploy/ci/scenario-ci.sh reap

      - name: 'Prove: nothing of this run remains'
        if: matrix.action == 'prove'
        run: deploy/ci/scenario-ci.sh check-clean

      # A failure late in a long proof may come after the session ended.
      - name: 'Prove: renew the AWS session to clean up'
        if: failure() && matrix.action == 'prove' && (matrix.cloud == 'aws' || matrix.cloud == 'multicloud')
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.PLATFORM_AWS_ROLE_ARN }}
          aws-region: ${{ vars.PLATFORM_AWS_REGION }}
          role-session-name: platform-scenarios-${{ github.run_id }}
          mask-aws-account-id: true

      # A failed proof step must not leave anything billable behind.
      - name: 'Prove: clean up after a failure'
        if: failure() && matrix.action == 'prove'
        run: |
          status=0
          for suffix in t l o; do
            INSTANCE="$RUN_TAG-$suffix" deploy/ci/scenario-ci.sh destroy || status=1
          done
          deploy/ci/scenario-ci.sh check-clean || status=1
          exit "$status"
