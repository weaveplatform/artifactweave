name: PR Title Validation

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate-pr-title:
    name: '✅ Validate PR Title'
    runs-on: ubuntu-latest
    steps:

      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Check PR Title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN="^(([Ff]eat|[Ff]ix|[Dd]ocs|[Ss]tyle|[Rr]efactor|[Tt]est|[Cc]hore|[Bb]uild|[Cc]i|[Pp]erf)(\(.+\))?: .+|dependabot.*)$"
          
          if ! echo "$PR_TITLE" | grep -qE "$PATTERN"; then
            echo "❌ ERROR: Invalid PR title format"
            echo ""
            echo "Got PR title: $PR_TITLE"
            echo ""
            echo "PR titles must:"
            echo "1. Start with one of these prefixes (case-insensitive first letter):"
            echo "   - feat     / Feat     (for new features)"
            echo "   - fix      / Fix      (for bug fixes)"
            echo "   - docs     / Docs     (for documentation)"
            echo "   - style    / Style    (for formatting)"
            echo "   - refactor / Refactor (for code restructuring)"
            echo "   - test     / Test     (for adding tests)"
            echo "   - chore    / Chore    (for maintenance)"
            echo "   - build    / Build    (for build system)"
            echo "   - ci       / CI       (for CI/CD)"
            echo "   - perf     / Perf     (for performance)"
            echo ""
            echo "2. Optionally include a scope in parentheses after the type"
            echo ""
            echo "3. Include a description after a colon and space"
            echo ""
            echo "Examples:"
            echo "✅ feat: add new resource"
            echo "✅ feat(api): add new endpoint"
            echo "✅ fix: resolve connection timeout"
            echo "✅ fix(database): fix query performance"
            echo "✅ dependabot: bump lodash from 4.17.20 to 4.17.21"
            exit 1
          fi
          
          echo "✅ PR title '$PR_TITLE' follows the conventional commit format and is compatible with the release-please"

  # release-please tags the version in the release pull request's title when it
  # merges, while the branch carries the version it computed. A title edited by
  # hand therefore tags a version the commit does not hold: #1154 was retitled
  # 0.3.0 and tagged v0.3.0 on a 0.2.1 commit, and #1624 was retitled 0.4.0
  # over 0.3.1 content (#1947). `edited` reruns this on every title change.
  release-version:
    name: '🔖 Check the release version'
    # Branch identity, not the title: the title is what is under check.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release-please--branches--main'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Title, manifest, CHANGELOG and version markers agree
        env:
          GOWORK: 'off'
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: go run ./tools/releaseversion -title "$PR_TITLE"
