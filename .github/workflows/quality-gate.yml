name: go | Quality gate

# The stable required gate selects docs, one mapped format, deployment, or
# full qualification. Release-please and manual runs always select full.

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: 'off'
  # GitHub-hosted runners are discarded after every job, so testcontainers'
  # reaper (Ryuk) has nothing to clean up here, and starting it sometimes
  # times out ("wait for reaper ... context deadline exceeded", #148).
  # testcontainers-go v0.44.0 reads this variable in
  # github.com/testcontainers/testcontainers-go/internal/config/config.go
  # and then skips connectReaper (docker.go). The emulators still terminate
  # through testcontainers.CleanupContainer at the end of each test; the one
  # PostgreSQL container per test binary (internal/platform/sql/sqltest)
  # lives until the runner is discarded. Local runs keep the reaper.
  TESTCONTAINERS_RYUK_DISABLED: 'true'

jobs:
  impact:
    name: 'Select CI tests'
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.plan.outputs.profile }}
      merge_base: ${{ steps.plan.outputs.merge_base }}
      owner: ${{ steps.plan.outputs.owner }}
      units: ${{ steps.plan.outputs.units }}
      tags: ${{ steps.plan.outputs.tags }}
      clients: ${{ steps.plan.outputs.clients }}
      coverpkg: ${{ steps.plan.outputs.coverpkg }}
      changed_packages: ${{ steps.plan.outputs.changed_packages }}
      unit_packages: ${{ steps.plan.outputs.unit_packages }}
      acceptance_packages: ${{ steps.plan.outputs.acceptance_packages }}
      fuzz_packages: ${{ steps.plan.outputs.fuzz_packages }}
      unit_run: ${{ steps.plan.outputs.unit_run }}
      acceptance_run: ${{ steps.plan.outputs.acceptance_run }}
      has_unit: ${{ steps.plan.outputs.has_unit }}
      has_acceptance: ${{ steps.plan.outputs.has_acceptance }}
      terraform_provider: ${{ steps.plan.outputs.terraform_provider }}
      terraform_deployment: ${{ steps.plan.outputs.terraform_deployment }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      # The PR merge ref contains the base/head parents; full history is needed
      # to resolve the actual merge-base after rebases and stacked changes.
      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Verify every Go test has a declared kind
        run: go run ./tools/testnames

      - name: Select profile
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RELEASE_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'release-please--branches--main' }}
          FULL_OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          go run ./tools/citestselection \
            -base "$BASE_SHA" -head "$HEAD_SHA" -release-pr="$RELEASE_PR" -full-override="$FULL_OVERRIDE" \
            -github-output "$GITHUB_OUTPUT" -summary "$GITHUB_STEP_SUMMARY" \
            -selection-json "$RUNNER_TEMP/test-selection.json"

      - name: Retain exact selected Go test names
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-selection
          path: ${{ runner.temp }}/test-selection.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify package format inventory
        run: go run ./tools/formatinventory -check

      - name: Verify client connection recipes
        run: |
          python3 -m unittest discover -s tools/depsync -p '*_test.py'
          python3 tools/depsync/sync.py --check
          go run ./tools/clientrecipes -check
          python3 tools/clientrecipes/check_snippets.py

  docs:
    name: 'Documentation checks'
    needs: [impact]
    if: needs.impact.outputs.profile == 'docs'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check changed documentation whitespace
        env:
          MERGE_BASE: ${{ needs.impact.outputs.merge_base }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$MERGE_BASE" "$HEAD_SHA" --

      - name: Validate retained evidence JSON
        run: |
          for path in docs/testing/evidence/*.json; do
            [ -f "$path" ] || continue
            python3 -m json.tool "$path" > /dev/null
          done

  # One job per OS rather than an OS matrix. When the concurrency group
  # cancels a run while Select CI tests is still running, every job waiting
  # on it reports a cancelled check under its literal name. A matrix job's
  # literal name holds its unexpanded matrix.os expression, so no check of
  # the run that replaces it has that name and the cancelled check stays on
  # the pull request. The macOS and Windows jobs reuse this job's condition
  # and steps through YAML aliases; Actions has no merge key, so each job
  # sets its own name and runner.
  unit-linux:
    name: 'Go unit tests (ubuntu-latest)'
    needs: [impact]
    if: &unit-selected (needs.impact.outputs.profile == 'full' || needs.impact.outputs.profile == 'format') && needs.impact.outputs.has_unit == 'true'
    runs-on: ubuntu-latest
    steps: &unit-steps
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Download Go modules
        uses: ./.github/actions/go-mod-download

      - name: Vet
        env:
          PROFILE: ${{ needs.impact.outputs.profile }}
          UNITS: ${{ needs.impact.outputs.units }}
        shell: bash
        run: |
          if [ "$PROFILE" = full ]; then
            go vet ./...
          else
            read -ra packages <<< "$UNITS"
            go vet "${packages[@]}"
          fi

      - name: Verify the selected TestUnit set is runnable
        env:
          UNIT_PACKAGES: ${{ needs.impact.outputs.unit_packages }}
          UNIT_RUN: ${{ needs.impact.outputs.unit_run }}
          FUZZ_PACKAGES: ${{ needs.impact.outputs.fuzz_packages }}
        shell: bash
        run: |
          read -ra packages <<< "$UNIT_PACKAGES"
          read -ra fuzz_packages <<< "$FUZZ_PACKAGES"
          [ "${#packages[@]}" -gt 0 ] || [ "${#fuzz_packages[@]}" -gt 0 ] || { echo 'selected Go unit and fuzz sets are empty'; exit 1; }
          if [ "${#packages[@]}" -gt 0 ]; then
            go test -list "$UNIT_RUN" "${packages[@]}" > "$RUNNER_TEMP/unit-list.txt"
            count=$(grep -Ec '^TestUnit[A-Z0-9_]' "$RUNNER_TEMP/unit-list.txt" || true)
            [ "$count" -gt 0 ] || { echo 'selected Go unit tests are absent on this OS'; exit 1; }
            echo "Runnable TestUnit entry points: $count in ${#packages[@]} selected packages." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${#fuzz_packages[@]}" -gt 0 ]; then
            go test -list '^Fuzz' "${fuzz_packages[@]}" > "$RUNNER_TEMP/fuzz-list.txt"
            count=$(grep -Ec '^Fuzz[A-Z0-9_]' "$RUNNER_TEMP/fuzz-list.txt" || true)
            [ "$count" -gt 0 ] || { echo 'selected fuzz seed corpora are absent on this OS'; exit 1; }
            echo "Runnable fuzz seed entry points: $count in ${#fuzz_packages[@]} selected packages." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Unit tests (race, shuffle, coverage)
        shell: bash
        env:
          PROFILE: ${{ needs.impact.outputs.profile }}
          UNIT_PACKAGES: ${{ needs.impact.outputs.unit_packages }}
          FUZZ_PACKAGES: ${{ needs.impact.outputs.fuzz_packages }}
          UNIT_RUN: ${{ needs.impact.outputs.unit_run }}
          FORMAT_COVERPKG: ${{ needs.impact.outputs.coverpkg }}
        run: |
          if [ "$PROFILE" = full ]; then
            make test UNIT_PKGS="$UNIT_PACKAGES" FUZZ_PKGS="$FUZZ_PACKAGES" UNIT_RUN="$UNIT_RUN"
          else
            make test UNIT_PKGS="$UNIT_PACKAGES" FUZZ_PKGS="$FUZZ_PACKAGES" UNIT_RUN="$UNIT_RUN" COVERPKG="$FORMAT_COVERPKG"
          fi

      # The three jobs share this step, so the job id gives each artifact its
      # own name: cover-unit-linux, cover-unit-macos and cover-unit-windows.
      - name: Upload unit coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cover-${{ github.job }}
          path: cover/unit
          include-hidden-files: true
          retention-days: 7

  unit-macos:
    name: 'Go unit tests (macos-latest)'
    needs: [impact]
    if: *unit-selected
    runs-on: macos-latest
    steps: *unit-steps

  unit-windows:
    name: 'Go unit tests (windows-latest)'
    needs: [impact]
    if: *unit-selected
    runs-on: windows-latest
    steps: *unit-steps

  acceptance-go:
    name: 'Go acceptance tests (Linux packages)'
    needs: [impact]
    if: (needs.impact.outputs.profile == 'full' || needs.impact.outputs.profile == 'format') && needs.impact.outputs.has_acceptance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Download Go modules
        uses: ./.github/actions/go-mod-download

      - name: Verify the selected TestAcc set is runnable on Linux
        env:
          ACC_PACKAGES: ${{ needs.impact.outputs.acceptance_packages }}
          ACC_RUN: ${{ needs.impact.outputs.acceptance_run }}
        shell: bash
        run: |
          read -ra packages <<< "$ACC_PACKAGES"
          [ "${#packages[@]}" -gt 0 ] || { echo 'selected Go acceptance package set is empty'; exit 1; }
          go test -list "$ACC_RUN" "${packages[@]}" > "$RUNNER_TEMP/acceptance-list.txt"
          count=$(grep -Ec '^TestAcc[A-Z0-9_]' "$RUNNER_TEMP/acceptance-list.txt" || true)
          [ "$count" -gt 0 ] || { echo 'selected Go acceptance tests are absent on Linux'; exit 1; }
          echo "Runnable TestAcc entry points: $count in ${#packages[@]} selected packages." >> "$GITHUB_STEP_SUMMARY"

      - name: Package TestAcc suites (coverage)
        env:
          PROFILE: ${{ needs.impact.outputs.profile }}
          ACC_PACKAGES: ${{ needs.impact.outputs.acceptance_packages }}
          ACC_RUN: ${{ needs.impact.outputs.acceptance_run }}
          FORMAT_COVERPKG: ${{ needs.impact.outputs.coverpkg }}
        run: |
          if [ "$PROFILE" = full ]; then
            make accept-go ACC_PKGS="$ACC_PACKAGES" ACC_RUN="$ACC_RUN"
          else
            make accept-go ACC_PKGS="$ACC_PACKAGES" ACC_RUN="$ACC_RUN" COVERPKG="$FORMAT_COVERPKG"
          fi

      - name: Upload package acceptance coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cover-accept-go
          path: cover/accept-go
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  lint:
    name: 'Lint (blocking)'
    needs: [impact]
    if: needs.impact.outputs.profile == 'full' || needs.impact.outputs.profile == 'format'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Download Go modules
        uses: ./.github/actions/go-mod-download

      # The linter version lives in a plain file so the deps refresh job can
      # move it without the workflows permission a workflow edit would need.
      - name: Linter version
        id: lintver
        run: echo "version=$(tr -d '[:space:]' < .github/golangci-lint-version)" >> "$GITHUB_OUTPUT"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.lintver.outputs.version }}
          args: --config=.golangci.yml --new=false --fix=false ${{ needs.impact.outputs.profile == 'format' && needs.impact.outputs.units || './...' }}

      # golangci-lint run does not report golines, so formatting is checked
      # on its own: fmt --diff prints each change it would make and exits 1.
      # The action above put the pinned binary on PATH.
      - name: Formatting
        run: make fmt-check

      # The bundled specs, generated servers, clients and 501 stubs are
      # committed; a fragment edit without `make generate` fails here.
      - name: Generated code is current
        if: needs.impact.outputs.profile == 'full'
        run: make verify-generate

  vuln:
    name: 'govulncheck'
    needs: [impact]
    if: needs.impact.outputs.profile == 'full'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Download Go modules
        uses: ./.github/actions/go-mod-download

      - name: govulncheck
        run: make vuln

  build:
    name: 'Cross-compile'
    needs: [impact]
    if: needs.impact.outputs.profile == 'full'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Download Go modules
        uses: ./.github/actions/go-mod-download

      - name: Build every cmd/* binary for every release platform (CGO disabled)
        run: make build

  # Acceptance runs the real binary with the real clients (decision 0015).
  # It is Linux-only: the macOS runners have no Docker daemon and the Windows
  # runners only run Windows containers, so the container-backed scenarios
  # cannot run there. The unit jobs still cover those OSes through fakes.
  acceptance:
    name: 'Go acceptance (Linux, native clients)'
    needs: [impact]
    if: needs.impact.outputs.profile == 'full' || (needs.impact.outputs.profile == 'format' && needs.impact.outputs.owner != 'nuget')
    # Exercise Docker 29's containerd image store during ubuntu-latest's
    # mixed 24.04/26.04 rollout, including single-image build-info proof.
    runs-on: ubuntu-26.04
    # The 45m acceptance wrapper includes image readiness and compilation
    # outside Go's 35m test timer. Leave time for the remaining native checks and
    # coverage upload after it finishes.
    timeout-minutes: 55
    env:
      # Image extraction can exhaust the runner disk. Keep the build result
      # on tmpfs so the acceptance monitor can still report that failure.
      CLIENT_IMAGES_STATUS: /dev/shm/artifactweave-client-images.status
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare native image disk space
        run: |
          df -h / "$RUNNER_TEMP"
          # These hosted-runner SDKs are unused here. Native clients run in
          # their pinned containers; Go, Python and Docker remain available.
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h / "$RUNNER_TEMP"
          docker system df

      # The package client images (test/acceptance/clients), built in the
      # background while the job sets up its pinned tools. Acceptance waits
      # for the complete selected image set before starting client scenarios,
      # so a late image cannot exhaust a scenario's shorter readiness timer.
      # The status file reports build failures, with the log printed below.
      - name: Client images (background)
        env:
          CLIENTS: ${{ needs.impact.outputs.profile == 'full' && 'node,maven,npm12,maven39,python,luarocks,composer,ruby,hex,bower,alpine,cargo,debian,fedora,gitlfs,opkg,swift,dart,cocoapods,p2,jetbrains,conda,vscode,r,vagrant,puppet,ansible,frogml,chef,nix' || needs.impact.outputs.clients }}
        run: |
          : "${CLIENT_IMAGES_STATUS:?}"
          rm -f "$CLIENT_IMAGES_STATUS" "$CLIENT_IMAGES_STATUS.tmp"
          (
            set -e
            trap 'printf "%s\n" "$?" > "$CLIENT_IMAGES_STATUS.tmp"; mv "$CLIENT_IMAGES_STATUS.tmp" "$CLIENT_IMAGES_STATUS"' EXIT
            if [[ ",$CLIENTS," == *,gitlfs,* ]]; then
            docker build -t artifactweave-accept-gitlfs \
              -f test/acceptance/clients/git-lfs.Dockerfile test/acceptance/clients
            fi
            if [[ ",$CLIENTS," == *,node,* ]]; then
            docker build -t artifactweave-accept-node \
              -f test/acceptance/clients/node.Dockerfile test/acceptance/clients
            fi
            if [[ ",$CLIENTS," == *,maven,* ]]; then
            docker build -t artifactweave-accept-maven \
              -f test/acceptance/clients/maven.Dockerfile test/acceptance/clients
            fi
            if [[ ",$CLIENTS," == *,npm12,* ]]; then
            docker build -t artifactweave-accept-npm12 test/acceptance/clients/node-npm12
            fi
            if [[ ",$CLIENTS," == *,maven39,* ]]; then
            docker build -t artifactweave-accept-maven39 test/acceptance/clients/maven-3.9
            fi
            if [[ ",$CLIENTS," == *,sbt,* ]]; then
            docker build -t artifactweave-accept-sbt \
              -f test/acceptance/clients/sbt.Dockerfile test/acceptance/clients
            fi
            if [[ ",$CLIENTS," == *,python,* ]]; then
            docker build -t artifactweave-accept-python \
              -f test/acceptance/clients/python.Dockerfile test/acceptance/clients
            fi
            if [[ ",$CLIENTS," == *,luarocks,* ]]; then
            docker build -t artifactweave-accept-luarocks \
              -f test/acceptance/clients/luarocks.Dockerfile test/acceptance/clients
            fi
            if [[ ",$CLIENTS," == *,composer,* ]]; then
            docker build -t artifactweave-accept-composer \
              -f test/acceptance/clients/composer.Dockerfile test/acceptance/clients
            fi
            if [[ ",$CLIENTS," == *,ruby,* ]]; then
            docker build -t artifactweave-accept-ruby \
              -f test/acceptance/clients/ruby.Dockerfile test/acceptance/clients
            fi
            if [[ ",$CLIENTS," == *,hex,* ]]; then
            docker build -t artifactweave-accept-hex \
              -f test/acceptance/clients/hex.Dockerfile test/acceptance/clients
            fi
            if [[ ",$CLIENTS," == *,bower,* ]]; then
            docker build -t artifactweave-accept-bower \
              -f test/acceptance/clients/bower.Dockerfile test/acceptance/clients
            fi
            if [[ ",$CLIENTS," == *,alpine,* ]]; then
            docker build -t artifactweave-accept-alpine \
              -f test/acceptance/clients/alpine.Dockerfile test/acceptance/clients
            fi
            if [[ ",$CLIENTS," == *,cargo,* ]]; then
            docker build -t artifactweave-accept-cargo \
              -f test/acceptance/clients/cargo.Dockerfile test/acceptance/clients
            fi
            if [[ ",$CLIENTS," == *,debian,* ]]; then
            docker build -t artifactweave-accept-debian \
              -f test/acceptance/clients/debian.Dockerfile test/acceptance/clients
            fi
            if [[ ",$CLIENTS," == *,fedora,* ]]; then
            docker build -t artifactweave-accept-fedora \
              -f test/acceptance/clients/fedora.Dockerfile test/acceptance/clients
            fi
            if [[ ",$CLIENTS," == *,opkg,* ]]; then
            docker build -t artifactweave-accept-opkg \
              -f test/acceptance/clients/opkg.Dockerfile test/acceptance/clients
            fi
            if [[ ",$CLIENTS," == *,swift,* ]]; then
            docker build -t artifactweave-accept-swift \
              -f test/acceptance/clients/swift.Dockerfile test/acceptance/clients
            fi
            if [[ ",$CLIENTS," == *,chef,* ]]; then
            docker build -t artifactweave-accept-chef \
              -f test/acceptance/clients/chef.Dockerfile test/acceptance/clients
            fi
            if [[ ",$CLIENTS," == *,nix,* ]]; then
            docker build -t artifactweave-accept-nix \
              -f test/acceptance/clients/nix.Dockerfile test/acceptance/clients
            fi
            if [[ ",$CLIENTS," == *,puppet,* ]]; then
            docker build -t artifactweave-accept-puppet test/acceptance/clients/puppet
            fi
            if [[ ",$CLIENTS," == *,dart,* ]]; then
            docker build -t artifactweave-accept-dart \
              -f test/acceptance/clients/dart.Dockerfile test/acceptance/clients
            fi
            if [[ ",$CLIENTS," == *,cocoapods,* ]]; then
            docker build -t artifactweave-accept-cocoapods \
              -f test/acceptance/clients/cocoapods.Dockerfile test/acceptance/clients
            fi
            if [[ ",$CLIENTS," == *,vagrant,* ]]; then
            docker build --platform=linux/amd64 -t artifactweave-accept-vagrant \
              -f test/acceptance/clients/vagrant.Dockerfile test/acceptance/clients
            fi
            if [[ ",$CLIENTS," == *,p2,* ]]; then
            docker build -t artifactweave-accept-p2 \
              -f test/acceptance/clients/p2.Dockerfile test/acceptance/clients
            fi
            if [[ ",$CLIENTS," == *,jetbrains,* ]]; then
            docker build -t artifactweave-accept-jetbrains \
              -f test/acceptance/clients/jetbrains.Dockerfile test/acceptance/clients
            fi
            if [[ ",$CLIENTS," == *,conda,* ]]; then
            docker build -t artifactweave-accept-conda \
              -f test/acceptance/clients/conda.Dockerfile test/acceptance/clients
            fi
            if [[ ",$CLIENTS," == *,vscode,* ]]; then
            docker build -t artifactweave-accept-vscode \
              -f test/acceptance/clients/vscode.Dockerfile test/acceptance/clients
            fi
            if [[ ",$CLIENTS," == *,frogml,* ]]; then
            docker build -t artifactweave-accept-frogml test/acceptance/clients/frogml
            fi
            if [[ ",$CLIENTS," == *,ansible,* ]]; then
            docker build -t artifactweave-accept-ansible \
              -f test/acceptance/clients/ansible.Dockerfile test/acceptance/clients
            fi
            if [[ ",$CLIENTS," == *,r,* ]]; then
            docker build -t artifactweave-accept-r \
              -f test/acceptance/clients/r.Dockerfile test/acceptance/clients
            fi
          ) > "$RUNNER_TEMP/client-images.log" 2>&1 &

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Download Go modules
        uses: ./.github/actions/go-mod-download

      # Maven's plugins for the Maven scenarios, which mount this directory
      # and never install their own artifacts into it. The key is the
      # fixture POMs, which pin every plugin version.
      - name: Maven plugin cache
        if: needs.impact.outputs.profile == 'full' || contains(format(',{0},', needs.impact.outputs.clients), ',maven,')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-plugins-${{ hashFiles('test/acceptance/testdata/maven/**/pom.xml') }}

      - name: JFrog CLI (pinned)
        if: needs.impact.outputs.profile == 'full' || contains(format(',{0},', needs.impact.outputs.clients), ',jf,')
        uses: ./.github/actions/jfrog-cli

      - name: APM CLI (pinned)
        if: needs.impact.outputs.profile == 'full' || contains(format(',{0},', needs.impact.outputs.clients), ',apm,')
        uses: ./.github/actions/apm-client

      - name: AI editor Marketplace assets (pinned)
        if: needs.impact.outputs.profile == 'full' || contains(format(',{0},', needs.impact.outputs.clients), ',vscode,')
        uses: ./.github/actions/ai-editor-assets

      # crane, oras and cosign for the registry features, and helm and
      # terraform for P8's, each a pinned release checked against its
      # published sha256. The runner's own docker covers docker login, push
      # and pull.
      - name: Registry clients (pinned)
        if: needs.impact.outputs.profile == 'full' || contains(needs.impact.outputs.clients, 'crane') || contains(needs.impact.outputs.clients, 'oras') || contains(needs.impact.outputs.clients, 'cosign') || contains(needs.impact.outputs.clients, 'helm') || contains(needs.impact.outputs.clients, 'terraform')
        uses: ./.github/actions/registry-clients
        with:
          clients: ${{ needs.impact.outputs.profile == 'full' && 'crane,oras,cosign,helm,terraform' || needs.impact.outputs.clients }}

      # The two clients and their dependencies come from the hashed file
      # that test/acceptance/clients/pip-lock.sh writes, first from PyPI and
      # then from TUNA's mirror of PyPI, as the Python client images do, so
      # one PyPI fault does not fail the job and the mirror can serve only
      # PyPI's bytes (#1321, #1439; python.Dockerfile says why TUNA). The
      # file holds the SHA-256 of every wheel of each pinned release. bash -e
      # does not stop on a loop whose last pip failed, hence the exit.
      - name: Hugging Face Hub and Xet clients (pinned)
        if: needs.impact.outputs.profile == 'full' || needs.impact.outputs.owner == 'huggingface'
        env:
          HF_HUB_VERSION: '2.4.0'
          HF_XET_VERSION: '1.8.0'
        run: |
          python3 -m venv "$RUNNER_TEMP/huggingface-hub"
          for index in https://pypi.org/simple https://pypi.tuna.tsinghua.edu.cn/simple; do
            "$RUNNER_TEMP/huggingface-hub/bin/pip" install --no-cache-dir --require-hashes --only-binary=:all: \
              --index-url "$index" -r test/acceptance/clients/huggingface.requirements.txt && break
          done || exit 1
          "$RUNNER_TEMP/huggingface-hub/bin/python" -c \
            'import importlib.metadata,os,huggingface_hub,hf_xet; assert huggingface_hub.__version__ == os.environ["HF_HUB_VERSION"]; assert importlib.metadata.version("hf-xet") == os.environ["HF_XET_VERSION"]; print("huggingface_hub", huggingface_hub.__version__, "hf_xet", importlib.metadata.version("hf-xet"))'
          echo "ARTIFACTWEAVE_HF_BIN=$RUNNER_TEMP/huggingface-hub/bin/hf" >> "$GITHUB_ENV"

      - name: Acceptance features (coverage-instrumented binary)
        env:
          ARTIFACTWEAVE_REQUIRE_DOCKER: '1'
          PROFILE: ${{ needs.impact.outputs.profile }}
          ARTIFACTWEAVE_NODE_IMAGE: artifactweave-accept-node
          ARTIFACTWEAVE_NPM12_IMAGE: artifactweave-accept-npm12
          ARTIFACTWEAVE_MAVEN_IMAGE: artifactweave-accept-maven
          ARTIFACTWEAVE_MAVEN39_IMAGE: artifactweave-accept-maven39
          ARTIFACTWEAVE_SBT_IMAGE: artifactweave-accept-sbt
          ARTIFACTWEAVE_PYTHON_IMAGE: artifactweave-accept-python
          ARTIFACTWEAVE_LUAROCKS_IMAGE: artifactweave-accept-luarocks
          ARTIFACTWEAVE_COMPOSER_IMAGE: artifactweave-accept-composer
          ARTIFACTWEAVE_RUBY_IMAGE: artifactweave-accept-ruby
          ARTIFACTWEAVE_HEX_IMAGE: artifactweave-accept-hex
          ARTIFACTWEAVE_BOWER_IMAGE: artifactweave-accept-bower
          ARTIFACTWEAVE_ALPINE_IMAGE: artifactweave-accept-alpine
          ARTIFACTWEAVE_CARGO_IMAGE: artifactweave-accept-cargo
          ARTIFACTWEAVE_DEBIAN_IMAGE: artifactweave-accept-debian
          ARTIFACTWEAVE_FEDORA_IMAGE: artifactweave-accept-fedora
          ARTIFACTWEAVE_GITLFS_IMAGE: artifactweave-accept-gitlfs
          ARTIFACTWEAVE_OPKG_IMAGE: artifactweave-accept-opkg
          ARTIFACTWEAVE_CHEF_IMAGE: artifactweave-accept-chef
          ARTIFACTWEAVE_NIX_IMAGE: artifactweave-accept-nix
          ARTIFACTWEAVE_PUPPET_IMAGE: artifactweave-accept-puppet
          ARTIFACTWEAVE_DART_IMAGE: artifactweave-accept-dart
          ARTIFACTWEAVE_COCOAPODS_IMAGE: artifactweave-accept-cocoapods
          ARTIFACTWEAVE_VAGRANT_IMAGE: artifactweave-accept-vagrant
          ARTIFACTWEAVE_P2_IMAGE: artifactweave-accept-p2
          ARTIFACTWEAVE_JETBRAINS_IMAGE: artifactweave-accept-jetbrains
          ARTIFACTWEAVE_CONDA_IMAGE: artifactweave-accept-conda
          ARTIFACTWEAVE_VSCODE_IMAGE: artifactweave-accept-vscode
          ARTIFACTWEAVE_FROGML_IMAGE: artifactweave-accept-frogml
          ARTIFACTWEAVE_ANSIBLE_IMAGE: artifactweave-accept-ansible
          ARTIFACTWEAVE_R_IMAGE: artifactweave-accept-r
          ARTIFACTWEAVE_ACCEPT_COVERPKG: ${{ needs.impact.outputs.coverpkg }}
          # Full runs split NuGet and JVM recipes into required partitions.
          # Narrow Maven runs retain the JVM recipes in this job.
          # The JFrog Gradle wrapper remains informational in its own job.
          ARTIFACTWEAVE_ACCEPT_TAGS: ${{ needs.impact.outputs.profile == 'full' && '~@nuget&&~@gradle&&~@bowerlive&&~@jvmrecipes' || needs.impact.outputs.tags }}
        run: |
          accept_pid=
          accept_done=0
          images_done=0
          stop_acceptance() {
            if [[ -n "$accept_pid" ]]; then
              kill -- "-$accept_pid" 2>/dev/null || kill "$accept_pid" 2>/dev/null || true
              wait "$accept_pid" || true
            fi
          }
          # Bound image readiness, compilation and the suite together. Client
          # readiness timers must not include the sequential image build queue.
          deadline=$((SECONDS + 2700))
          while :; do
            if [[ -f "$CLIENT_IMAGES_STATUS" ]]; then
              image_status=$(<"$CLIENT_IMAGES_STATUS")
              if [[ "$image_status" != 0 ]]; then
                echo "::error::Native client image build failed (exit $image_status)"
                tail -80 "$RUNNER_TEMP/client-images.log" >&2
                stop_acceptance
                exit 1
              fi
              images_done=1
            fi
            if (( images_done )) && [[ -z "$accept_pid" ]]; then
              if [ "$PROFILE" = full ]; then
                setsid make accept ACCEPT_TIMEOUT=35m &
              else
                setsid make accept ACCEPT_RUN='^TestAccFeatures\z' &
              fi
              accept_pid=$!
            fi
            if [[ -n "$accept_pid" ]] && (( ! accept_done )) && ! jobs -pr | grep -Fxq "$accept_pid"; then
              wait "$accept_pid"
              accept_done=1
            fi
            if (( accept_done && images_done )); then
              break
            fi
            if (( SECONDS >= deadline )); then
              echo '::error::Timed out waiting for acceptance or native client image builds'
              stop_acceptance
              exit 1
            fi
            sleep 2
          done

      # Each Maven image pins a floating tag such as maven:3.9-eclipse-temurin
      # by digest, so only the image itself says which Maven and JDK releases
      # the scenarios ran. The Maven recipe's client label sends readers here
      # for them (#1241): the image build log is printed only on failure.
      # jf mvn runs the runner's own Maven, which moves with the runner image,
      # and the JFrog extractor starts only on the Maven lines it supports
      # (#523), so the runner's release is printed too.
      - name: Maven client versions
        if: ${{ !cancelled() && (needs.impact.outputs.profile == 'full' || contains(format(',{0},', needs.impact.outputs.clients), ',maven,') || contains(format(',{0},', needs.impact.outputs.clients), ',jf,')) }}
        run: |
          echo "runner:"
          mvn --version || echo "no mvn on PATH"
          for image in artifactweave-accept-maven artifactweave-accept-maven39; do
            if docker image inspect "$image" >/dev/null 2>&1; then
              echo "$image:"
              docker run --rm "$image" mvn --version
            else
              echo "$image: not built"
            fi
          done

      - name: SwiftPM native client acceptance
        if: needs.impact.outputs.profile == 'full' || contains(format(',{0},', needs.impact.outputs.clients), ',swift,')
        env:
          ARTIFACTWEAVE_SWIFT_IMAGE: artifactweave-accept-swift
        run: |
          timeout 10m bash -c 'until docker image inspect artifactweave-accept-swift >/dev/null 2>&1; do sleep 5; done'
          go test ./internal/artifacts/ecosystem/swift/http -run '^TestAccSwiftPM' -count=1 -v

      - name: Hugging Face Hub, Xet and legacy migration native acceptance
        if: needs.impact.outputs.profile == 'full' || needs.impact.outputs.owner == 'huggingface'
        run: |
          HF_CLIENT_PYTHON="$RUNNER_TEMP/huggingface-hub/bin/python" \
            go test ./internal/artifacts/ecosystem/huggingface/http -run '^TestAccPinnedClient' -count=1 -timeout=5m -v
          HF_XET_PYTHON="$RUNNER_TEMP/huggingface-hub/bin/python" \
            go test ./test/server/artifacts/huggingface -run '^TestAccHuggingFaceNativeXet$' -count=1 -timeout=5m -v

      - name: VCS REST curl client acceptance
        if: needs.impact.outputs.profile == 'full' || needs.impact.outputs.owner == 'vcs'
        env:
          ARTIFACTWEAVE_REQUIRE_CURL: '1'
        run: |
          curl --version
          go test ./test/server/artifacts/vcs -run '^TestAccVCSRemoteRESTAndSubgroup$' -count=1 -v

      - name: Bazel Bzlmod acceptance (L/R/V/F)
        if: needs.impact.outputs.profile == 'full' || contains(format(',{0},', needs.impact.outputs.clients), ',bazel,')
        env:
          ARTIFACTWEAVE_BAZEL_CLIENT: '1'
        run: go test ./internal/artifacts/ecosystem/bazelmodules/http -run '^TestAccBazelClient$' -count=1 -timeout=7m -v

      - name: Record native client image identities
        if: always()
        run: |
          timeout 10s docker image ls --no-trunc --digests --format '{{json .}}' \
            | sort > "$RUNNER_TEMP/native-client-images.jsonl"

      - name: Retain native client image identities and build versions
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-client-identities-core
          path: |
            ${{ runner.temp }}/native-client-images.jsonl
            ${{ runner.temp }}/client-images.log
          if-no-files-found: error
          retention-days: 30

      - name: Client image build log
        if: failure()
        run: |
          if [[ -f "$CLIENT_IMAGES_STATUS" ]]; then
            echo "Client image build exit status: $(<"$CLIENT_IMAGES_STATUS")"
          else
            echo 'Client image build did not complete'
          fi
          cat "$RUNNER_TEMP/client-images.log"

      - name: Upload acceptance coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cover-accept
          path: cover/accept
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  acceptance-conan:
    name: 'Go acceptance (Linux, Conan 1 and 2 clients)'
    needs: [impact]
    if: needs.impact.outputs.profile == 'full' || (needs.impact.outputs.profile == 'format' && needs.impact.outputs.owner == 'conan')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Download Go modules
        uses: ./.github/actions/go-mod-download

      - name: Set up Python for Conan 1 and 2
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # The two clients and their dependencies come from the hashed files
      # that test/acceptance/clients/pip-lock.sh writes, first from PyPI and
      # then from TUNA's mirror of PyPI, as the Hugging Face step does, so one
      # PyPI fault does not fail the job and the mirror can serve only PyPI's
      # bytes (#1321, #1455). Conan 1.66.0, patch-ng 1.17.4 and pluginbase
      # 1.0.1 publish only sdists. The venv's pip is Python 3.12's bundled
      # 25.0.1, which installs an isolated build's setuptools without hash
      # checks and has no --build-constraint (pip 25.3 added it), so the
      # Conan 1 venv installs setuptools from its own hashed file first and
      # builds them with it, --no-build-isolation. bash -e does not stop on a
      # loop whose last pip failed, hence each exit.
      - name: Pinned Conan clients
        env:
          CONAN2_VERSION: '2.34.0'
          CONAN1_VERSION: '1.66.0'
        run: |
          python3 -m venv "$RUNNER_TEMP/conan2"
          python3 -m venv "$RUNNER_TEMP/conan1"
          for index in https://pypi.org/simple https://pypi.tuna.tsinghua.edu.cn/simple; do
            "$RUNNER_TEMP/conan2/bin/pip" install --no-cache-dir --require-hashes --only-binary=:all: \
              --index-url "$index" -r test/acceptance/clients/conan2.requirements.txt && break
          done || exit 1
          for index in https://pypi.org/simple https://pypi.tuna.tsinghua.edu.cn/simple; do
            "$RUNNER_TEMP/conan1/bin/pip" install --no-cache-dir --require-hashes --only-binary=:all: \
              --index-url "$index" -r test/acceptance/clients/conan1.build-requirements.txt && break
          done || exit 1
          for index in https://pypi.org/simple https://pypi.tuna.tsinghua.edu.cn/simple; do
            "$RUNNER_TEMP/conan1/bin/pip" install --no-cache-dir --require-hashes --no-build-isolation \
              --index-url "$index" -r test/acceptance/clients/conan1.requirements.txt && break
          done || exit 1
          "$RUNNER_TEMP/conan2/bin/conan" --version | grep -Fx "Conan version $CONAN2_VERSION"
          "$RUNNER_TEMP/conan1/bin/conan" --version | grep -Fx "Conan version $CONAN1_VERSION"

      - name: Conan 1 and 2 native protocol acceptance (coverage)
        env:
          ARTIFACTWEAVE_CONAN2_BIN: ${{ runner.temp }}/conan2/bin/conan
          ARTIFACTWEAVE_CONAN1_BIN: ${{ runner.temp }}/conan1/bin/conan
        run: make conan-accept

      - name: Upload Conan native client coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cover-conan
          path: cover/conan
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  # NuGet's native matrix, on the .NET SDK's LTS line and its newest line,
  # runs beside the other acceptance scenarios. The required filters are
  # disjoint and exhaustive for non-Gradle deterministic pickles, including
  # untagged features; the opt-in live Bower upstream probe is excluded.
  # TestAccFeatures fails on zero picks.
  acceptance-nuget:
    name: 'Go acceptance (Linux, NuGet native clients)'
    needs: [impact]
    if: needs.impact.outputs.profile == 'full' || (needs.impact.outputs.profile == 'format' && needs.impact.outputs.owner == 'nuget')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: NuGet client images (background)
        run: |
          {
            docker build -t artifactweave-accept-dotnet10 test/acceptance/clients/dotnet-10
            docker build -t artifactweave-accept-dotnet \
              -f test/acceptance/clients/dotnet.Dockerfile test/acceptance/clients
          } > "$RUNNER_TEMP/client-images.log" 2>&1 &

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Download Go modules
        uses: ./.github/actions/go-mod-download

      - name: JFrog CLI (pinned)
        uses: ./.github/actions/jfrog-cli

      - name: NuGet acceptance features (coverage-instrumented binary)
        env:
          ARTIFACTWEAVE_REQUIRE_DOCKER: '1'
          ARTIFACTWEAVE_ACCEPT_COVERPKG: ${{ needs.impact.outputs.coverpkg }}
          ARTIFACTWEAVE_DOTNET_IMAGE: artifactweave-accept-dotnet
          ARTIFACTWEAVE_DOTNET10_IMAGE: artifactweave-accept-dotnet10
          ARTIFACTWEAVE_ACCEPT_TAGS: '@nuget&&~@gradle'
        run: |
          mkdir -p cover/accept-nuget
          ARTIFACTWEAVE_GOCOVERDIR="$PWD/cover/accept-nuget" GOWORK=off go test -timeout=15m -count=1 -run '^TestAccFeatures\z' ./test/acceptance/...

      # Each image pins a floating line tag such as sdk:10.0 by digest, so
      # only the image itself says which SDK release the scenarios ran. The
      # NuGet recipe's client label sends readers here for it (#1241): the
      # build log is printed only on failure, and go test runs without -v.
      - name: NuGet client versions
        if: ${{ !cancelled() }}
        run: |
          for image in artifactweave-accept-dotnet artifactweave-accept-dotnet10; do
            if docker image inspect "$image" >/dev/null 2>&1; then
              echo "$image: .NET SDK $(docker run --rm "$image" dotnet --version)"
            else
              echo "$image: not built"
            fi
          done

      - name: NuGet client image build log
        if: failure()
        run: cat "$RUNNER_TEMP/client-images.log"

      - name: Upload NuGet acceptance coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cover-accept-nuget
          path: cover/accept-nuget
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  # Full runs isolate the additional JVM recipe work from the core budget.
  # A narrow Maven run already selects these tags in the core job, so it
  # retains one same-run coverage artifact and does not duplicate clients.
  acceptance-jvm:
    name: 'Go acceptance (Linux, JVM client recipes)'
    needs: [impact]
    if: needs.impact.outputs.profile == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Download Go modules
        uses: ./.github/actions/go-mod-download

      - name: Pinned JVM client images
        run: |
          docker build -t artifactweave-accept-maven \
            -f test/acceptance/clients/maven.Dockerfile test/acceptance/clients
          docker build -t artifactweave-accept-sbt \
            -f test/acceptance/clients/sbt.Dockerfile test/acceptance/clients

      - name: JVM recipe features (coverage-instrumented binary)
        env:
          ARTIFACTWEAVE_REQUIRE_DOCKER: '1'
          ARTIFACTWEAVE_MAVEN_IMAGE: artifactweave-accept-maven
          ARTIFACTWEAVE_SBT_IMAGE: artifactweave-accept-sbt
          ARTIFACTWEAVE_ACCEPT_TAGS: '@jvmrecipes'
        run: |
          mkdir -p cover/accept-jvm
          ARTIFACTWEAVE_GOCOVERDIR="$PWD/cover/accept-jvm" GOWORK=off go test -timeout=15m -count=1 -run '^TestAccFeatures\z' ./test/acceptance/...

      - name: Upload JVM acceptance coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cover-accept-jvm
          path: cover/accept-jvm
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  # Decision 0015 keeps jf gradle informational. A separate job prevents
  # it from consuming the required partitions' budgets.
  acceptance-gradle:
    name: 'Go acceptance (Linux, Gradle informational)'
    needs: [impact]
    if: needs.impact.outputs.profile == 'full'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Download Go modules
        uses: ./.github/actions/go-mod-download

      - name: JFrog CLI (pinned)
        uses: ./.github/actions/jfrog-cli

      - name: Gradle features (informational)
        id: gradle
        continue-on-error: true
        timeout-minutes: 10
        env:
          ARTIFACTWEAVE_ACCEPT_TAGS: '@gradle'
        run: |
          mkdir -p cover/gradle
          ARTIFACTWEAVE_GOCOVERDIR="$PWD/cover/gradle" GOWORK=off go test -timeout=10m -count=1 -run '^TestAccFeatures\z' ./test/acceptance/...

      - name: Record Gradle result
        if: always()
        env:
          GRADLE_OUTCOME: ${{ steps.gradle.outcome }}
        run: |
          echo "Gradle informational scenario: $GRADLE_OUTCOME" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Gradle coverage when available
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cover-gradle
          path: cover/gradle
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  # The JFrog Terraform providers against the app-layer references in
  # deploy/artifactweave/terraform, installed by test/terraform/run.sh from a
  # filesystem mirror of the pinned release zips so the run never depends on
  # registry.terraform.io. run.sh starts a -cover artifactweave, mints the
  # admin access token the providers send as a Bearer token, applies each,
  # requires an empty plan and destroys; the server's coverage joins the
  # merged gate.
  terraform:
    name: 'Terraform provider conformance (pinned JFrog apply, plan, destroy)'
    needs: [impact]
    if: needs.impact.outputs.terraform_provider == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Download Go modules
        uses: ./.github/actions/go-mod-download

      # A pinned download, like jf above, verified against HashiCorp's
      # published SHA256SUMS.
      - name: Terraform (pinned)
        env:
          TF_VERSION: '1.17.1'
          TF_SHA256: '4638628058e71a55212b1c563712eac03b902128f40740f3dc8174df12135061'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/terraform.zip" \
            "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
          echo "${TF_SHA256}  $RUNNER_TEMP/terraform.zip" | sha256sum -c -
          unzip -q -d "$RUNNER_TEMP/terraform" "$RUNNER_TEMP/terraform.zip"
          "$RUNNER_TEMP/terraform/terraform" version
          echo "$RUNNER_TEMP/terraform" >> "$GITHUB_PATH"

      - name: Apply, plan and destroy the scenarios against artifactweave
        run: make terraform TERRAFORM_MODE=apply

      - name: Upload Terraform coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cover-terraform
          path: cover/terraform
          include-hidden-files: true
          retention-days: 7

  # The OCI distribution-spec conformance suite (decision 0015), the external
  # test for every registry endpoint. test/oci/run.sh builds the suite at its
  # pinned commit, starts one -cover artifactweave on SQLite and the fs blob
  # store, and runs the categories the Makefile switches on; a failed
  # specification fails the job, a skipped one never does. The server's
  # coverage joins the merged gate, and the suite's JUnit and HTML reports are
  # uploaded whatever the result.
  oci-conformance:
    name: 'OCI conformance'
    needs: [impact]
    if: needs.impact.outputs.profile == 'full'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Download Go modules
        uses: ./.github/actions/go-mod-download

      - name: Conformance suite against the coverage-instrumented binary
        run: make oci-conformance

      - name: Upload the suite's reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oci-conformance-report
          path: oci-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload OCI conformance coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cover-oci
          path: cover/oci
          include-hidden-files: true
          retention-days: 7

  # Static checks and mocked tests over every Terraform root in deploy/ and
  # test/terraform (decision 0030): fmt, validate, tflint, trivy, terraform
  # test against mocked providers, and the terraform-docs drift check. The
  # tools are pinned by version and SHA-256 in deploy/check.sh, which
  # make deploy-check runs locally too. Go is only for run.sh, which
  # validates the jfrog roots from its filesystem mirror.
  deploy-terraform:
    name: 'Terraform deployment checks (fmt, validate, tflint, trivy, mocked tests, docs)'
    needs: [impact]
    if: needs.impact.outputs.terraform_deployment == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Download Go modules
        uses: ./.github/actions/go-mod-download

      - name: Static checks and mocked tests
        env:
          # tflint --init fetches the pinned rulesets from GitHub releases;
          # the token lifts the anonymous rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: make deploy-check

  # Parity against JFrog's published OpenAPI definitions (decision 0001).
  # The definitions are proprietary, so they are cached per run under the
  # gitignored .specoracle directory and never committed; the committed
  # artefact is api/parity-baseline.json, which names only paths, fields and
  # status codes. It is a required check from P1 on: the baseline lists only
  # out-of-scope products, so any new gap or divergence in the authored specs
  # fails the gate. docs.jfrog.com is contacted only on a cache miss: the
  # first run of each ISO week, a change to tools/specoracle/main.go or a
  # bumped key. If that fetch fails, rerun the job rather than removing it
  # from the gate.
  parity:
    name: 'Spec parity (JFrog oracle)'
    needs: [impact]
    if: needs.impact.outputs.profile == 'full'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Download Go modules
        uses: ./.github/actions/go-mod-download

      # JFrog edits its reference pages without any change here, and a key
      # made only of the index list never fetched them again (#419). The ISO
      # week in the key makes the first run of each week crawl afresh, so a
      # changed page reaches the parity check within a week. The key also
      # changes with the index list in tools/specoracle, so a new API family
      # is crawled at once; bump the version to force a crawl mid-week. There
      # are no restore-keys on purpose: the loader reads every file in the
      # cache directory, so a restored older crawl would keep the pages JFrog
      # has since removed.
      - name: Oracle cache week
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Oracle cache
        id: oracle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .specoracle
          key: specoracle-${{ hashFiles('tools/specoracle/main.go') }}-v1-${{ steps.week.outputs.week }}

      - name: Fetch JFrog definitions (cache miss only)
        if: steps.oracle.outputs.cache-hit != 'true'
        run: make oracle-fetch

      - name: Spec parity against the baseline
        run: go test ./api/ -run TestAccSpecParity -v

  coverage:
    name: 'Coverage gate (≥95% total, ≥90% per package)'
    # The download pattern cover-* picks up the unit directories from every OS,
    # package TestAcc, all four required native partitions, optional Gradle,
    # the Terraform run and OCI conformance, all from this workflow revision.
    needs: [impact, unit-linux, unit-macos, unit-windows, acceptance-go, acceptance, acceptance-conan, acceptance-nuget, acceptance-jvm, acceptance-gradle, terraform, oci-conformance]
    # Gradle is informational, so a failure there must not prevent the
    # required sources from being checked or the merged gate from running.
    if: always() && needs.impact.result == 'success' && needs.impact.outputs.profile == 'full'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Required coverage sources succeeded
        env:
          UNIT_LINUX_RESULT: ${{ needs['unit-linux'].result }}
          UNIT_MACOS_RESULT: ${{ needs['unit-macos'].result }}
          UNIT_WINDOWS_RESULT: ${{ needs['unit-windows'].result }}
          GO_ACCEPTANCE_RESULT: ${{ needs['acceptance-go'].result }}
          ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
          CONAN_RESULT: ${{ needs['acceptance-conan'].result }}
          NUGET_RESULT: ${{ needs['acceptance-nuget'].result }}
          JVM_RESULT: ${{ needs['acceptance-jvm'].result }}
          TERRAFORM_RESULT: ${{ needs.terraform.result }}
          OCI_RESULT: ${{ needs['oci-conformance'].result }}
        run: |
          for result in "$UNIT_LINUX_RESULT" "$UNIT_MACOS_RESULT" "$UNIT_WINDOWS_RESULT" "$GO_ACCEPTANCE_RESULT" \
            "$ACCEPTANCE_RESULT" "$CONAN_RESULT" "$NUGET_RESULT" "$JVM_RESULT" "$TERRAFORM_RESULT" "$OCI_RESULT"; do
            [ "$result" = success ] || { echo "required coverage source: $result"; exit 1; }
          done

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Download Go modules
        uses: ./.github/actions/go-mod-download

      - name: Download every coverage directory
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cover-*
          path: cover

      - name: Merge and enforce the gate
        run: make cover

  affected-coverage:
    name: 'Affected-package coverage (≥90% changed packages)'
    needs: [impact, unit-linux, unit-macos, unit-windows, acceptance-go, acceptance, acceptance-conan, acceptance-nuget]
    if: always() && needs.impact.result == 'success' && needs.impact.outputs.profile == 'format'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Required affected sources succeeded
        env:
          OWNER: ${{ needs.impact.outputs.owner }}
          HAS_UNIT: ${{ needs.impact.outputs.has_unit }}
          HAS_ACCEPTANCE: ${{ needs.impact.outputs.has_acceptance }}
          UNIT_LINUX_RESULT: ${{ needs['unit-linux'].result }}
          UNIT_MACOS_RESULT: ${{ needs['unit-macos'].result }}
          UNIT_WINDOWS_RESULT: ${{ needs['unit-windows'].result }}
          GO_ACCEPTANCE_RESULT: ${{ needs['acceptance-go'].result }}
          ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
          CONAN_RESULT: ${{ needs['acceptance-conan'].result }}
          NUGET_RESULT: ${{ needs['acceptance-nuget'].result }}
        run: |
          for result in "$UNIT_LINUX_RESULT" "$UNIT_MACOS_RESULT" "$UNIT_WINDOWS_RESULT"; do
            if [ "$HAS_UNIT" = true ]; then
              [ "$result" = success ] || exit 1
            else
              [ "$result" = skipped ] || exit 1
            fi
          done
          if [ "$HAS_ACCEPTANCE" = true ]; then
            [ "$GO_ACCEPTANCE_RESULT" = success ] || exit 1
          else
            [ "$GO_ACCEPTANCE_RESULT" = skipped ] || exit 1
          fi
          if [ "$OWNER" = nuget ]; then
            [ "$ACCEPTANCE_RESULT" = skipped ] && [ "$NUGET_RESULT" = success ]
          else
            [ "$ACCEPTANCE_RESULT" = success ] && [ "$NUGET_RESULT" = skipped ]
          fi
          if [ "$OWNER" = conan ]; then
            [ "$CONAN_RESULT" = success ]
          else
            [ "$CONAN_RESULT" = skipped ]
          fi

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Download selected same-run coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cover-*
          path: cover

      - name: Merge and enforce changed-package floor
        env:
          CHANGED_PACKAGES: ${{ needs.impact.outputs.changed_packages }}
          OWNER: ${{ needs.impact.outputs.owner }}
          HAS_UNIT: ${{ needs.impact.outputs.has_unit }}
          HAS_ACCEPTANCE: ${{ needs.impact.outputs.has_acceptance }}
        shell: bash
        run: |
          mapfile -t sources < <(find cover -mindepth 1 -maxdepth 1 -type d -name 'cover-*' | sort)
          expected=1
          if [ "$HAS_UNIT" = true ]; then expected=$((expected + 3)); fi
          if [ "$HAS_ACCEPTANCE" = true ]; then expected=$((expected + 1)); fi
          if [ "$OWNER" = conan ]; then expected=$((expected + 1)); fi
          [ "${#sources[@]}" -eq "$expected" ] || { echo "expected $expected same-run coverage artifacts, found ${#sources[@]}"; exit 1; }
          joined=$(IFS=,; echo "${sources[*]}")
          mkdir -p cover/affected-merged
          go tool covdata merge -i="$joined" -o=cover/affected-merged
          go run ./tools/citestselection -check-coverage cover/affected-merged -packages "$CHANGED_PACKAGES"
          echo "Partial profile: changed production packages ≥90%; whole-project coverage is qualified only by full runs." >> "$GITHUB_STEP_SUMMARY"

  gate:
    name: 'Quality gate'
    if: always()
    needs: [impact, docs, unit-linux, unit-macos, unit-windows, acceptance-go, lint, vuln, build, acceptance, acceptance-conan, acceptance-nuget, acceptance-jvm, coverage, affected-coverage, parity, terraform, oci-conformance, deploy-terraform]
    runs-on: ubuntu-latest
    steps:
      - name: Required jobs match the selected profile
        env:
          PROFILE: ${{ needs.impact.outputs.profile }}
          IMPACT: ${{ needs.impact.result }}
          DOCS: ${{ needs.docs.result }}
          UNIT_LINUX: ${{ needs['unit-linux'].result }}
          UNIT_MACOS: ${{ needs['unit-macos'].result }}
          UNIT_WINDOWS: ${{ needs['unit-windows'].result }}
          HAS_UNIT: ${{ needs.impact.outputs.has_unit }}
          GO_ACCEPTANCE: ${{ needs['acceptance-go'].result }}
          HAS_ACCEPTANCE: ${{ needs.impact.outputs.has_acceptance }}
          LINT: ${{ needs.lint.result }}
          VULN: ${{ needs.vuln.result }}
          BUILD: ${{ needs.build.result }}
          ACCEPTANCE: ${{ needs.acceptance.result }}
          CONAN: ${{ needs['acceptance-conan'].result }}
          NUGET: ${{ needs['acceptance-nuget'].result }}
          JVM: ${{ needs['acceptance-jvm'].result }}
          COVERAGE: ${{ needs.coverage.result }}
          AFFECTED_COVERAGE: ${{ needs['affected-coverage'].result }}
          OWNER: ${{ needs.impact.outputs.owner }}
          PARITY: ${{ needs.parity.result }}
          TERRAFORM: ${{ needs.terraform.result }}
          PROVIDER_SELECTED: ${{ needs.impact.outputs.terraform_provider }}
          OCI: ${{ needs['oci-conformance'].result }}
          DEPLOY: ${{ needs['deploy-terraform'].result }}
          DEPLOY_SELECTED: ${{ needs.impact.outputs.terraform_deployment }}
        run: |
          [ "$IMPACT" = success ] || { echo "impact planner did not succeed"; exit 1; }
          require() { [ "$2" = "$3" ] || { echo "$1: expected $3, got $2"; exit 1; }; }
          case "$PROFILE" in
            docs)
              require docs "$DOCS" success
              ;;
            full)
              require docs "$DOCS" skipped
              require affected-coverage "$AFFECTED_COVERAGE" skipped
              for result in "$UNIT_LINUX" "$UNIT_MACOS" "$UNIT_WINDOWS" "$GO_ACCEPTANCE" "$LINT" "$VULN" "$BUILD" \
                "$ACCEPTANCE" "$CONAN" "$NUGET" "$JVM" "$COVERAGE" "$PARITY" "$TERRAFORM" "$OCI" "$DEPLOY"; do
                require full-job "$result" success
              done
              ;;
            format)
              require docs "$DOCS" skipped
              require acceptance-jvm "$JVM" skipped
              unit=skipped
              if [ "$HAS_UNIT" = true ]; then unit=success; fi
              require unit-linux "$UNIT_LINUX" "$unit"
              require unit-macos "$UNIT_MACOS" "$unit"
              require unit-windows "$UNIT_WINDOWS" "$unit"
              require lint "$LINT" success
              require affected-coverage "$AFFECTED_COVERAGE" success
              if [ "$HAS_ACCEPTANCE" = true ]; then
                require go-acceptance "$GO_ACCEPTANCE" success
              else
                require go-acceptance "$GO_ACCEPTANCE" skipped
              fi
              if [ "$OWNER" = nuget ]; then
                require acceptance "$ACCEPTANCE" skipped
                require acceptance-nuget "$NUGET" success
              else
                require acceptance "$ACCEPTANCE" success
                require acceptance-nuget "$NUGET" skipped
              fi
              if [ "$OWNER" = conan ]; then
                require acceptance-conan "$CONAN" success
              else
                require acceptance-conan "$CONAN" skipped
              fi
              for result in "$VULN" "$BUILD" "$COVERAGE" "$PARITY" "$TERRAFORM" "$OCI" "$DEPLOY"; do
                require unselected "$result" skipped
              done
              ;;
            deployment)
              require docs "$DOCS" skipped
              if [ "$PROVIDER_SELECTED" = true ]; then
                require terraform-provider "$TERRAFORM" success
              else
                require terraform-provider "$TERRAFORM" skipped
              fi
              if [ "$DEPLOY_SELECTED" = true ]; then
                require terraform-deployment "$DEPLOY" success
              else
                require terraform-deployment "$DEPLOY" skipped
              fi
              for result in "$UNIT_LINUX" "$UNIT_MACOS" "$UNIT_WINDOWS" "$GO_ACCEPTANCE" "$LINT" "$VULN" "$BUILD" \
                "$ACCEPTANCE" "$CONAN" "$NUGET" "$JVM" "$COVERAGE" "$AFFECTED_COVERAGE" "$PARITY" "$OCI"; do
                require unselected "$result" skipped
              done
              ;;
            *) echo "unknown CI profile: $PROFILE"; exit 1 ;;
          esac
          if [ "$PROFILE" = docs ]; then
            for result in "$UNIT_LINUX" "$UNIT_MACOS" "$UNIT_WINDOWS" "$GO_ACCEPTANCE" "$LINT" "$VULN" "$BUILD" \
              "$ACCEPTANCE" "$CONAN" "$NUGET" "$JVM" "$COVERAGE" "$AFFECTED_COVERAGE" "$PARITY" "$TERRAFORM" "$OCI" "$DEPLOY"; do
              require unselected "$result" skipped
            done
          fi
          echo "CI profile $PROFILE qualified" >> "$GITHUB_STEP_SUMMARY"
