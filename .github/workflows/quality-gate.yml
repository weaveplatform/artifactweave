name: go | Quality gate

# Every pull request passes vet, blocking lint, unit tests on Linux, macOS and
# Windows, govulncheck, a cross-compile of every cmd/* binary, the merged
# coverage gate (>=95% total, >=90% per package), and static checks with
# mocked tests over the deployment Terraform. The `gate` job is the
# single required status check: make it required in branch protection, and
# add jobs (acceptance against real dependencies in Docker, for example) to
# its `needs` and to the coverage job as they appear.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: 'off'
  # GitHub-hosted runners are discarded after every job, so testcontainers'
  # reaper (Ryuk) has nothing to clean up here, and starting it sometimes
  # times out ("wait for reaper ... context deadline exceeded", #148).
  # testcontainers-go v0.44.0 reads this variable in internal/config/config.go
  # and then skips connectReaper (docker.go). The emulators still terminate
  # through testcontainers.CleanupContainer at the end of each test; the one
  # PostgreSQL container per test binary (internal/sqlstore/sqltest) lives
  # until the runner is discarded. Local runs keep the reaper.
  TESTCONTAINERS_RYUK_DISABLED: 'true'

jobs:
  unit:
    name: 'Unit tests (${{ matrix.os }})'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Download Go modules
        uses: ./.github/actions/go-mod-download

      - name: Vet
        run: go vet ./...

      - name: Unit tests (race, shuffle, coverage)
        shell: bash
        run: make test

      - name: Upload unit coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cover-unit-${{ matrix.os }}
          path: cover/unit
          include-hidden-files: true
          retention-days: 7

  lint:
    name: 'Lint (blocking)'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Download Go modules
        uses: ./.github/actions/go-mod-download

      # The linter version lives in a plain file so the deps refresh job can
      # move it without the workflows permission a workflow edit would need.
      - name: Linter version
        id: lintver
        run: echo "version=$(tr -d '[:space:]' < .github/golangci-lint-version)" >> "$GITHUB_OUTPUT"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.lintver.outputs.version }}
          args: --config=.golangci.yml --new=false --fix=false

      # golangci-lint run does not report golines, so formatting is checked
      # on its own: fmt --diff prints each change it would make and exits 1.
      # The action above put the pinned binary on PATH.
      - name: Formatting
        run: make fmt-check

      # The bundled specs, generated servers, clients and 501 stubs are
      # committed; a fragment edit without `make generate` fails here.
      - name: Generated code is current
        run: make verify-generate

  vuln:
    name: 'govulncheck'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Download Go modules
        uses: ./.github/actions/go-mod-download

      - name: govulncheck
        run: make vuln

  build:
    name: 'Cross-compile'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Download Go modules
        uses: ./.github/actions/go-mod-download

      - name: Build every cmd/* binary for every release platform (CGO disabled)
        run: make build

  # Acceptance runs the real binary with the real clients (decision 0015).
  # It is Linux-only: the macOS runners have no Docker daemon and the Windows
  # runners only run Windows containers, so the container-backed scenarios
  # cannot run there. The unit matrix still covers those OSes through fakes.
  acceptance:
    name: 'Acceptance (Linux, real clients)'
    runs-on: ubuntu-latest
    # Includes setup, native clients, informational Gradle and coverage upload.
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The package client images (test/acceptance/clients), built in the
      # background while the job sets up and make accept compiles the -cover
      # binary: npm 11 and 12, Maven 3.10 and 3.9, the Python tools, and
      # .NET 10 and 11. Their scenarios wait for the images, and the log is
      # printed if the job fails.
      - name: Client images (background)
        run: |
          {
            docker build -t artifactweave-accept-node \
              -f test/acceptance/clients/node.Dockerfile test/acceptance/clients
            docker build -t artifactweave-accept-maven \
              -f test/acceptance/clients/maven.Dockerfile test/acceptance/clients
            docker build -t artifactweave-accept-npm12 \
              -f test/acceptance/clients/node-npm12.Dockerfile test/acceptance/clients
            docker build -t artifactweave-accept-maven39 test/acceptance/clients/maven-3.9
            docker build -t artifactweave-accept-python \
              -f test/acceptance/clients/python.Dockerfile test/acceptance/clients
            docker build -t artifactweave-accept-dotnet \
              -f test/acceptance/clients/dotnet.Dockerfile test/acceptance/clients
            docker build -t artifactweave-accept-dotnet11 \
              -f test/acceptance/clients/dotnet-11.Dockerfile test/acceptance/clients
          } > "$RUNNER_TEMP/client-images.log" 2>&1 &

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Download Go modules
        uses: ./.github/actions/go-mod-download

      # Maven's plugins for the Maven scenarios, which mount this directory
      # and never install their own artifacts into it. The key is the
      # fixture POMs, which pin every plugin version.
      - name: Maven plugin cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-plugins-${{ hashFiles('test/acceptance/testdata/maven/**/pom.xml') }}

      - name: JFrog CLI (pinned)
        uses: ./.github/actions/jfrog-cli

      # crane, oras and cosign for the registry features, and helm and
      # terraform for P8's, each a pinned release checked against its
      # published sha256. The runner's own docker covers docker login, push
      # and pull.
      - name: Registry clients (pinned)
        uses: ./.github/actions/registry-clients

      - name: Acceptance features (coverage-instrumented binary)
        env:
          ARTIFACTWEAVE_NODE_IMAGE: artifactweave-accept-node
          ARTIFACTWEAVE_NPM12_IMAGE: artifactweave-accept-npm12
          ARTIFACTWEAVE_MAVEN_IMAGE: artifactweave-accept-maven
          ARTIFACTWEAVE_MAVEN39_IMAGE: artifactweave-accept-maven39
          ARTIFACTWEAVE_PYTHON_IMAGE: artifactweave-accept-python
          ARTIFACTWEAVE_DOTNET_IMAGE: artifactweave-accept-dotnet
          ARTIFACTWEAVE_DOTNET11_IMAGE: artifactweave-accept-dotnet11
          # Gradle runs in the next step, which does not gate.
          ARTIFACTWEAVE_ACCEPT_TAGS: '~@gradle'
        run: make accept

      # jf gradle with the runner's Gradle is informational for M2 (decisions
      # 0015 and 0036): a failure shows on the step without failing the job.
      # Its coverage joins make accept's, from a binary built with the same
      # flags, so the build is a cache hit.
      - name: Gradle features (informational)
        continue-on-error: true
        env:
          ARTIFACTWEAVE_ACCEPT_TAGS: '@gradle'
        run: ARTIFACTWEAVE_GOCOVERDIR="$PWD/cover/accept" GOWORK=off go test -timeout=15m -count=1 ./test/acceptance/...

      - name: Client image build log
        if: failure()
        run: cat "$RUNNER_TEMP/client-images.log"

      - name: Upload acceptance coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cover-accept
          path: cover/accept
          include-hidden-files: true
          retention-days: 7

  # The JFrog Terraform providers against the app-layer references in
  # deploy/artifactweave/terraform, installed by test/terraform/run.sh from a
  # filesystem mirror of the pinned release zips so the run never depends on
  # registry.terraform.io. run.sh starts a -cover artifactweave, mints the
  # admin access token the providers send as a Bearer token, applies each,
  # requires an empty plan and destroys; the server's coverage joins the
  # merged gate.
  terraform:
    name: 'Terraform provider fixture'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Download Go modules
        uses: ./.github/actions/go-mod-download

      # A pinned download, like jf above, verified against HashiCorp's
      # published SHA256SUMS.
      - name: Terraform (pinned)
        env:
          TF_VERSION: '1.16.4'
          TF_SHA256: 'dc94af0eef1147718ad7c8daea792ed199e3e0492eec180d0adafa2a65a879df'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/terraform.zip" \
            "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
          echo "${TF_SHA256}  $RUNNER_TEMP/terraform.zip" | sha256sum -c -
          unzip -q -d "$RUNNER_TEMP/terraform" "$RUNNER_TEMP/terraform.zip"
          echo "$RUNNER_TEMP/terraform" >> "$GITHUB_PATH"

      - name: Apply, plan and destroy the scenarios against artifactweave
        run: make terraform TERRAFORM_MODE=apply

      - name: Upload Terraform coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cover-terraform
          path: cover/terraform
          include-hidden-files: true
          retention-days: 7

  # The OCI distribution-spec conformance suite (decision 0015), the external
  # test for every registry endpoint. test/oci/run.sh builds the suite at its
  # pinned commit, starts one -cover artifactweave on SQLite and the fs blob
  # store, and runs the categories the Makefile switches on; a failed
  # specification fails the job, a skipped one never does. The server's
  # coverage joins the merged gate, and the suite's JUnit and HTML reports are
  # uploaded whatever the result.
  oci-conformance:
    name: 'OCI conformance'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Download Go modules
        uses: ./.github/actions/go-mod-download

      - name: Conformance suite against the coverage-instrumented binary
        run: make oci-conformance

      - name: Upload the suite's reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oci-conformance-report
          path: oci-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload OCI conformance coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cover-oci
          path: cover/oci
          include-hidden-files: true
          retention-days: 7

  # Static checks and mocked tests over every Terraform root in deploy/ and
  # test/terraform (decision 0030): fmt, validate, tflint, trivy, terraform
  # test against mocked providers, and the terraform-docs drift check. The
  # tools are pinned by version and SHA-256 in deploy/check.sh, which
  # make deploy-check runs locally too. Go is only for run.sh, which
  # validates the jfrog roots from its filesystem mirror.
  deploy-terraform:
    name: 'Deployment Terraform (fmt, validate, tflint, trivy, tests, docs)'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Download Go modules
        uses: ./.github/actions/go-mod-download

      - name: Static checks and mocked tests
        env:
          # tflint --init fetches the pinned rulesets from GitHub releases;
          # the token lifts the anonymous rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: make deploy-check

  # Parity against JFrog's published OpenAPI definitions (decision 0001).
  # The definitions are proprietary, so they are cached per run under the
  # gitignored .specoracle directory and never committed; the committed
  # artefact is api/parity-baseline.json, which names only paths, fields and
  # status codes. It is a required check from P1 on: the baseline lists only
  # out-of-scope products, so any new gap or divergence in the authored specs
  # fails the gate. docs.jfrog.com is contacted only on a cache miss: the
  # first run of each ISO week, a change to tools/specoracle/main.go or a
  # bumped key. If that fetch fails, rerun the job rather than removing it
  # from the gate.
  parity:
    name: 'Spec parity (JFrog oracle)'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Download Go modules
        uses: ./.github/actions/go-mod-download

      # JFrog edits its reference pages without any change here, and a key
      # made only of the index list never fetched them again (#419). The ISO
      # week in the key makes the first run of each week crawl afresh, so a
      # changed page reaches the parity check within a week. The key also
      # changes with the index list in tools/specoracle, so a new API family
      # is crawled at once; bump the version to force a crawl mid-week. There
      # are no restore-keys on purpose: the loader reads every file in the
      # cache directory, so a restored older crawl would keep the pages JFrog
      # has since removed.
      - name: Oracle cache week
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Oracle cache
        id: oracle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .specoracle
          key: specoracle-${{ hashFiles('tools/specoracle/main.go') }}-v1-${{ steps.week.outputs.week }}

      - name: Fetch JFrog definitions (cache miss only)
        if: steps.oracle.outputs.cache-hit != 'true'
        run: make oracle-fetch

      - name: Spec parity against the baseline
        run: go test ./api/ -run TestSpecParity -v

  coverage:
    name: 'Coverage gate (≥95% total, ≥90% per package)'
    # The download pattern cover-* picks up the unit directories from every OS,
    # the acceptance directory, the Terraform run and the OCI conformance run,
    # so one merge enforces the gate over all.
    needs: [unit, acceptance, terraform, oci-conformance]
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Download Go modules
        uses: ./.github/actions/go-mod-download

      - name: Download every coverage directory
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cover-*
          path: cover

      - name: Merge and enforce the gate
        run: make cover

  gate:
    name: 'Quality gate'
    if: always()
    needs: [unit, lint, vuln, build, acceptance, coverage, parity, terraform, oci-conformance, deploy-terraform]
    runs-on: ubuntu-latest
    steps:
      - name: Every gate job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "a gate job did not succeed"; exit 1; }
          done
