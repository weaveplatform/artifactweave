name: go | Quality gate

# Every pull request passes vet, blocking lint, unit tests on Linux, macOS and
# Windows, govulncheck, a cross-compile of every cmd/* binary, and the merged
# coverage gate (>=95% total, >=90% per package). The `gate` job is the
# single required status check: make it required in branch protection, and
# add jobs (acceptance against real dependencies in Docker, for example) to
# its `needs` and to the coverage job as they appear.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: 'off'

jobs:
  unit:
    name: 'Unit tests (${{ matrix.os }})'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Vet
        run: go vet ./...

      - name: Unit tests (race, shuffle, coverage)
        shell: bash
        run: make test

      - name: Upload unit coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cover-unit-${{ matrix.os }}
          path: cover/unit
          include-hidden-files: true
          retention-days: 7

  lint:
    name: 'Lint (blocking)'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      # The linter version lives in a plain file so the deps refresh job can
      # move it without the workflows permission a workflow edit would need.
      - name: Linter version
        id: lintver
        run: echo "version=$(tr -d '[:space:]' < .github/golangci-lint-version)" >> "$GITHUB_OUTPUT"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.lintver.outputs.version }}
          args: --config=.golangci.yml --new=false --fix=false

      # The bundled specs, generated servers, clients and 501 stubs are
      # committed; a fragment edit without `make generate` fails here.
      - name: Generated code is current
        run: make verify-generate

  vuln:
    name: 'govulncheck'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: govulncheck
        run: make vuln

  build:
    name: 'Cross-compile'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Build every cmd/* binary for every release platform (CGO disabled)
        run: make build

  # Acceptance runs the real binary with the real clients (decision 0015).
  # It is Linux-only: the macOS runners have no Docker daemon and the Windows
  # runners only run Windows containers, so the container-backed scenarios
  # cannot run there. The unit matrix still covers those OSes through fakes.
  acceptance:
    name: 'Acceptance (Linux, real clients)'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      # A pinned jf binary rather than jfrog/setup-jfrog-cli: Dependabot only
      # maintains pins for actions already in use, and the release metadata at
      # releases.jfrog.io publishes the sha256 we verify here.
      - name: JFrog CLI (pinned)
        env:
          JF_VERSION: '2.126.0'
          JF_SHA256: 'fd2725b3a501df99b2c4fa577044d1c8efb7d8a23d6c40b1fe19231eed51929a'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/jf" \
            "https://releases.jfrog.io/artifactory/jfrog-cli/v2-jf/${JF_VERSION}/jfrog-cli-linux-amd64/jf"
          echo "${JF_SHA256}  $RUNNER_TEMP/jf" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/jf"
          echo "ARTIFACTWEAVE_JF_BIN=$RUNNER_TEMP/jf" >> "$GITHUB_ENV"

      - name: Acceptance features (coverage-instrumented binary)
        run: make accept

      - name: Upload acceptance coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cover-accept
          path: cover/accept
          include-hidden-files: true
          retention-days: 7

  # The JFrog Artifactory Terraform provider against the fixture in
  # test/terraform, installed from a filesystem mirror of the pinned release
  # zip so the run never depends on registry.terraform.io. P3 validates the
  # fixture; apply, an empty plan and destroy against a -cover binary
  # (run.sh apply) join once P4 issues the Bearer tokens the provider sends.
  terraform:
    name: 'Terraform provider fixture'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      # A pinned download, like jf above, verified against HashiCorp's
      # published SHA256SUMS.
      - name: Terraform (pinned)
        env:
          TF_VERSION: '1.16.4'
          TF_SHA256: 'dc94af0eef1147718ad7c8daea792ed199e3e0492eec180d0adafa2a65a879df'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/terraform.zip" \
            "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
          echo "${TF_SHA256}  $RUNNER_TEMP/terraform.zip" | sha256sum -c -
          unzip -q -d "$RUNNER_TEMP/terraform" "$RUNNER_TEMP/terraform.zip"
          echo "$RUNNER_TEMP/terraform" >> "$GITHUB_PATH"

      - name: Validate the fixture against the mirrored provider
        run: make terraform

  # Parity against JFrog's published OpenAPI definitions (decision 0001).
  # The definitions are proprietary, so they are cached per run under the
  # gitignored .specoracle directory and never committed; the committed
  # artefact is api/parity-baseline.json, which names only paths, fields and
  # status codes. It is a required check from P1 on: the baseline lists only
  # out-of-scope products, so any new gap or divergence in the authored specs
  # fails the gate. docs.jfrog.com is contacted only on a cache miss (a change
  # to tools/specoracle/main.go or a bumped key); if that fetch fails, rerun
  # the job rather than removing it from the gate.
  parity:
    name: 'Spec parity (JFrog oracle)'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      # The cache key changes with the index list in tools/specoracle, so a
      # new API family triggers a fresh crawl. Bump the trailing version to
      # force a re-crawl when JFrog's documentation changes.
      - name: Oracle cache
        id: oracle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .specoracle
          key: specoracle-${{ hashFiles('tools/specoracle/main.go') }}-v1

      - name: Fetch JFrog definitions (cache miss only)
        if: steps.oracle.outputs.cache-hit != 'true'
        run: make oracle-fetch

      - name: Spec parity against the baseline
        run: go test ./api/ -run TestSpecParity -v

  coverage:
    name: 'Coverage gate (≥95% total, ≥90% per package)'
    # The download pattern cover-* picks up the unit directories from every OS
    # and the acceptance directory, so one merge enforces the gate over all.
    needs: [unit, acceptance]
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Download every coverage directory
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cover-*
          path: cover

      - name: Merge and enforce the gate
        run: make cover

  gate:
    name: 'Quality gate'
    if: always()
    needs: [unit, lint, vuln, build, acceptance, coverage, parity, terraform]
    runs-on: ubuntu-latest
    steps:
      - name: Every gate job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "a gate job did not succeed"; exit 1; }
          done
