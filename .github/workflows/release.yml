# Builds, checksums, SBOMs and signs the release binaries (#507), and publishes
# the signed multi-arch container image (#510), when release-please tags a
# release.
#
# release-please owns the version, the changelog and the GitHub release itself;
# this only builds the artifacts and appends them. A failure here therefore
# leaves the release intact rather than half-made, and the job can be re-run
# without re-tagging. The tag triggers this workflow because release-please
# pushes it with the org's release-please App token: a tag pushed with the
# default GITHUB_TOKEN would trigger nothing.
name: release

on:
  push:
    tags:
      - "v*"
  # A broken config should fail on the pull request that breaks it, not on the
  # first tag after it.
  pull_request:
    paths:
      - .goreleaser.yaml
      - .github/workflows/release.yml
      - Dockerfile.release

permissions:
  contents: read

jobs:
  check:
    name: 📦 Check the release config
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # buildx builds both platforms of the image; QEMU lets the amd64 runner
      # assemble the arm64 one.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # A snapshot builds every archive, the checksums and one image per
      # platform as a release would, without a tag and without pushing. Signing
      # needs the tag-time OIDC identity and the archive SBOMs need syft, so both
      # are left to the release itself.
      - name: Check and build a snapshot
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=sign,sbom

  goreleaser:
    name: 📦 Build and sign the release archives
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      # Attaching the archives to the release.
      contents: write
      # Keyless signing: cosign exchanges this token for a short-lived
      # certificate naming this workflow, so the signature says which workflow
      # in which repository produced the artifacts.
      id-token: write
      # Pushing the image to ghcr.io/weaveplatform/artifactweave.
      packages: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser derives the version from the tag, which needs the tags
          # and the history behind them.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # goreleaser's sboms step shells out to syft, which the runner lacks;
      # without it the release fails after building the archives and attaches
      # nothing.
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      # buildx builds both platforms of the image; QEMU lets the amd64 runner
      # assemble the arm64 one.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
