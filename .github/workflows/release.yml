# Builds, checksums, SBOMs and signs the release binaries (#507), and publishes
# the signed multi-arch container image (#510), when release-please tags a
# release.
#
# release-please owns the version, the changelog and the GitHub release itself;
# this only builds the artifacts and appends them. A failure here therefore
# leaves the release intact rather than half-made, and the job can be re-run
# without re-tagging. The tag triggers this workflow because release-please
# pushes it with the org's release-please App token: a tag pushed with the
# default GITHUB_TOKEN would trigger nothing.
name: release

on:
  push:
    tags:
      - "v*"
  # A broken config should fail on the pull request that breaks it, not on the
  # first tag after it.
  pull_request:
    paths:
      - .goreleaser.yaml
      - .github/workflows/release.yml
      - Dockerfile.release

permissions:
  contents: read

jobs:
  check:
    name: 📦 Check the release config
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # buildx builds both platforms of the image; QEMU lets the amd64 runner
      # assemble the arm64 one.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # A snapshot builds every archive, the checksums and one image per
      # platform as a release would, without a tag and without pushing. Signing
      # needs the tag-time OIDC identity and the archive SBOMs need syft, so both
      # are left to the release itself.
      - name: Check and build a snapshot
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=sign,sbom

  goreleaser:
    name: 📦 Build and sign the release archives
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      # Attaching the archives to the release.
      contents: write
      # Keyless signing: cosign exchanges this token for a short-lived
      # certificate naming this workflow, so the signature says which workflow
      # in which repository produced the artifacts.
      id-token: write
      # Pushing the image to ghcr.io/weaveplatform/artifactweave.
      packages: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser derives the version from the tag, which needs the tags
          # and the history behind them.
          fetch-depth: 0

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # The tag must name the version its commit carries, and release-please
      # must already have made its release. When #1624's release was retagged
      # by hand (#1947), the new v0.4.0 tag built over a 0.3.1 commit, and the
      # v0.3.1 build, finding its release gone, had goreleaser's append mode
      # create a second one, which became Latest. The manifest check stops the
      # first; the release check stops the second when the release is gone
      # before the build starts.
      - name: Check the tag against the manifest and its release
        env:
          GOWORK: 'off'
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          go run ./tools/releaseversion -tag "$GITHUB_REF_NAME"
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null; then
            echo "::error::no GitHub release for $GITHUB_REF_NAME: release-please creates it when its pull request merges; a tag without one was not made by release-please"
            exit 1
          fi

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # goreleaser's sboms step shells out to syft, which the runner lacks;
      # without it the release fails after building the archives and attaches
      # nothing.
      - uses: anchore/sbom-action/download-syft@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4

      # buildx builds both platforms of the image; QEMU lets the amd64 runner
      # assemble the arm64 one.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
