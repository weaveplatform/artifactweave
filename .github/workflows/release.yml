# Builds, checksums, SBOMs and signs the release binaries when release-please
# tags a release (#507).
#
# release-please owns the version, the changelog and the GitHub release itself;
# this only builds the artifacts and appends them. A failure here therefore
# leaves the release intact rather than half-made, and the job can be re-run
# without re-tagging. The tag triggers this workflow because release-please
# pushes it with the org's release-please App token: a tag pushed with the
# default GITHUB_TOKEN would trigger nothing.
name: release

on:
  push:
    tags:
      - "v*"
  # A broken config should fail on the pull request that breaks it, not on the
  # first tag after it.
  pull_request:
    paths:
      - .goreleaser.yaml
      - .github/workflows/release.yml

permissions:
  contents: read

jobs:
  check:
    name: 📦 Check the release config
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # A snapshot builds every archive and the checksums as a release would,
      # without a tag. Signing needs the tag-time OIDC identity and the SBOMs
      # need syft, so both are left to the release itself.
      - name: Check and build a snapshot
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=sign,sbom

  goreleaser:
    name: 📦 Build and sign the release archives
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      # Attaching the archives to the release.
      contents: write
      # Keyless signing: cosign exchanges this token for a short-lived
      # certificate naming this workflow, so the signature says which workflow
      # in which repository produced the artifacts.
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser derives the version from the tag, which needs the tags
          # and the history behind them.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # goreleaser's sboms step shells out to syft, which the runner lacks;
      # without it the release fails after building the archives and attaches
      # nothing.
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
