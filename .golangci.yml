version: "2"

run:
  timeout: 30m
  # CI mode: Fails if go.mod needs updates, ensuring dependencies are properly declared
  modules-download-mode: readonly
  allow-parallel-runners: true
  allow-serial-runners: false
  concurrency: 2  # Set to 2 to avoid overwhelming the CI server

issues:
  # Don’t cap lint errors per linter—report everything in new code.
  max-issues-per-linter: 0

  # Don’t limit duplicates by text—if the same error crops up on multiple lines, show them all.
  max-same-issues: 0

  # Don’t dedupe by line; every instance matters.
  uniq-by-line: false

  # Only fail on new issues introduced by new PR's.
  new: true

  # Define the “base” for “new” issues as the merge-base against main.
  new-from-merge-base: main

  # Also catch anything in new or modified files, even outside the diff hunk.
  whole-files: true

  # Automatically apply any fixable issues (like gofmt/goimports).
  fix: true


linters:
  default: none
  enable:
    # Core correctness & compile checks
    - govet          # catches suspicious Go constructs
    - staticcheck    # static analyses (nil‐checks, API misuse, etc.)
    - errcheck       # ensures you never ignore an error return
    - unused         # finds dead code we no longer need
    - ineffassign    # flags assignments that have no effect
  
    # error-handling best practices
    - errorlint      # flag missing %w wraps
    - err113         # enforce correct error-handling patterns

    # Terraform‐specific safety & resource handling
    - bodyclose      # makes sure every HTTP response body is closed
    - gosec          # scans for security issues (e.g. hardcoded credentials)
    
    # Specifically important for API clients (Microsoft 365 API)
    - contextcheck   # check whether function uses a non-inherited context
    - noctx          # finds sending http request without context.Context
    - nilnil         # checks that there is no simultaneous return of nil error and invalid value
    
    # Quality & style
    - gocritic       # catches a variety of performance/style bugs
    - prealloc       # recommends when you can preallocate slices/maps
    - misspell       # finds typos in comments, docs, & variable names
    - gocyclo        # warn on high cyclomatic complexity
    - wrapcheck      # checks that errors from external packages are wrapped
    
    # API/Terraform specific
    - musttag        # enforce field tags in (un)marshaled structs
    - tagliatelle    # checks struct tags (important for JSON/XML APIs)

    # Documentation (decision 0044)
    - revive         # doc comments: exported identifiers and package comments

  # 3) Per-linter configuration
  settings:
    nakedret:
      max-func-lines: 40
    revive:
      # Only these two rules run: a rules list replaces revive's defaults.
      # The stuttering check is off because the migration renames nothing, and
      # checkPublicInterface stays off (decision 0044).
      # TestUnitLintScopeListsEveryLinter (migration/layout) pins this list.
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
        - name: package-comments
    tagliatelle:
      case:
        # The project's own JSON and YAML (application configuration,
        # internal APIs) use snake_case, matching hostweave.
        rules:
          json: snake
          yaml: snake
        # Wire-model packages mirror JFrog's JSON names (camelCase with
        # kebab-case and snake_case mixed into the same structs), which no
        # single case rule can express; decision record 0002 limits the
        # exception to these packages. golangci-lint matches pkg against the
        # package path relative to the module root: a full import path
        # matches nothing, and tagliatelle then reports every JFrog name.
        overrides:
          - pkg: migration/artifacts/api/repo
            ignore: true
          - pkg: migration/kernel/wire
            ignore: true
    wrapcheck:
      # Constructors of new errors with an HTTP status, this project's
      # errors.New. wrapcheck 2.13 (golangci-lint 2.15) also reports calls that
      # return a custom error type as error, so every return of these failed.
      # Matching by signature, not by package, keeps errors passed up from
      # other packages of the module checked.
      #
      # The SQL dialect layer's methods and functions return errors that
      # already name the operation and the dialect (Store.Wrap), or that are
      # kernel sentinels a caller tests with errors.Is. The SQL stores pass
      # them up as they are, as they did while the helpers were their own
      # package's, and wrapping each again would change error texts that
      # operators see. Without these lines wrapcheck reports 465 such returns
      # in the SQL stores alone, and one for each new call in a module's SQL
      # adapter.
      extra-ignore-sigs:
        - apierror.New(
        - format.Rejectf(
        - dialect.Store).
        - dialect.ToJSON(
        - dialect.FromJSON(
        - dialect.Keyset(
        - dialect.LoadMigrations(
        - dialect.Migrate(
        - dialect.Rollback(
        - dialect.Version(
        - dialect.Reseal(

  # 4) Issue-filtering (not disabling analysis, just silencing reports)
  exclusions:
    # skip generated files strictly matching Go’s “Code generated … DO NOT EDIT.”
    generated: strict

    # warn if any of these exclusions never match
    warn-unused: true

    # apply standard “false positive” presets; not "comments", which would
    # silence revive's documentation checks
    presets:
      - std-error-handling
      - common-false-positives
      - legacy

    # fine-grained rules to drop issues by path, linter, text, or source
    rules:
      # in test files, silence these noisy checks
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - dupl
          - gosec

      # only run “forbidigo” on tests (silence everywhere else)
      - path-except: _test\.go
        linters:
          - forbidigo

      # silence known gosec warning in this vendored code
      - path: internal/hmac/
        text: "weak cryptographic primitive"
        linters:
          - gosec

      # drop staticcheck’s SA9003 messages
      - linters:
          - staticcheck
        text: "SA9003:"

      # exclude “lll” warnings on go:generate lines
      - linters:
          - lll
        source: "^//go:generate "

      # Every linter reports on internal/ and migration/; elsewhere only revive
      # (decision 0044: widening the others would surface about 126 unrelated
      # findings). A linter added to enable must join this list, or it reports
      # everywhere; TestUnitLintScopeListsEveryLinter fails until it does.
      - path-except: ^(internal|migration)/
        linters: [govet, staticcheck, errcheck, unused, ineffassign, errorlint, err113, bodyclose, gosec,
                  contextcheck, noctx, nilnil, gocritic, prealloc, misspell, gocyclo, wrapcheck, musttag, tagliatelle]

      # Legacy roots keep their documentation debt until they move, so this
      # rule shrinks as they empty and goes at promotion. The pattern must equal
      # ledger.LegacyRegexp() (TestUnitLintLegacyRuleMatchesLedgerLegacyRoots).
      - path: ^(internal|pkg/(aql|blob|cdn|layout|repo|store|types))/
        linters: [revive]

    # Files whose issues are never reported (they are still analysed).
    # The patterns match anywhere in the path, so each is anchored: an
    # unanchored "tools/.*" would also hide migration/devtools/. warn-unused
    # flags a pattern that matches nothing, so none is kept for a directory
    # the repository does not have.
    paths:
      - ".*\\.gen\\.go$"          # oapi-codegen output: findings are fixed in the generator
      - ".*_test\\.go$"           # test code is not held to the production rules
      - "^tools/"                 # repository tooling, not part of the binary

formatters:
  # Only run the formatters you actually want to auto‐fix in CI
  enable:
    - gofumpt     # strict Go formatting (superset of gofmt)
    - goimports   # fixes imports (add/remove/sort)
    - gci         # groups & sorts import blocks
    - golines     # wraps long lines to a max length (e.g. 120 chars)

  # Per‐formatter settings (optional—only if you need to tweak defaults)
  settings:
    gci:
      # customize your import sections order: standard, external, project
      sections:
        - Standard
        - Default
        - Prefix(github.com/weaveplatform)

  # Exclude generated or special‐case files from formatting checks
  exclusions:
    warn-unused: true   # error if any of the below rules never match
    generated: strict   # only skip files with exact “// Code generated … DO NOT EDIT.”
    # Every *.gen.go file starts with that line, so the setting above already
    # skips them all; a paths entry for them would match nothing and warn on
    # every lint run.

output:
  formats:
    # 1) Text format for the Action log
    text:
      # Send lint results to stderr so the Action log shows them even when piped
      path: stderr
      # Include the linter name after each issue
      print-linter-name: true
      # Show the source lines for each issue
      print-issued-lines: true
      # Keep ANSI colors enabled for readability in the Actions console
      colors: true

    # 2) SARIF format for GitHub Code Scanning integration
    sarif:
      path: golangci-lint-report.sarif

  # Use relative paths (from the module root) in output
  path-mode: ""

  sort-order:
    - severity
    - file

  # Show summary statistics at the end of the report
  show-stats: true
