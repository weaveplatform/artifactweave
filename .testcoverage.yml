# Coverage gate: >=95% total, >=90% per package, blocking in CI.
# The profile is produced by `make cover`, which merges every cover/*
# directory (unit tests on each OS, acceptance runs) with `go tool covdata`.
profile: cover/coverage.out
threshold:
  file: 0
  package: 90
  total: 95
exclude:
  paths:
    # Binary entry points: thin shims over internal/.
    - ^cmd/
    # oapi-codegen output (decision 0002): regenerated, never hand-edited.
    - ^internal/platform/gen/
    - ^pkg/client/
    # Developer tools: thin main packages over internal/devtools/ (specoracle).
    - ^tools/
    # Contract-suite harnesses (decision 0015): their remaining branches are
    # the t.Fatal paths taken only when a backend violates the contract.
    - ^internal/platform/blob/blobtest/
    - ^internal/artifacts/core/formattest/
    # The backends that the composition root hands the format contract: the
    # same t.Fatal paths, of a store that cannot be opened.
    - ^internal/app/apptest/
    # Assertions the store contract suites share: the same t.Fatal paths.
    - ^internal/platform/testkit/storekit/
    # Per-module store contract suites (decision 0015); their remaining
    # branches are t.Fatal paths taken only when a backend breaks the contract.
    - ^internal/[a-z]+/adapters/storetest/
    # The platform's store contract suite (decision 0015), in platform/store
    # rather than an adapters directory: the same t.Fatal paths.
    - ^internal/platform/store/storetest/
    # The composite stores' contract suite (decision 0015) and their SQL
    # suites; their remaining branches are t.Fatal paths taken only when a
    # backend breaks the contract.
    - ^internal/app/storetest/
    # Module SQL harness: its remaining branches are t.Fatal paths of a
    # container or database that fails to start, migrate or clean up, and the
    # ARTIFACTWEAVE_TEST_POSTGRES_DSN branch, which CI does not set.
    - ^internal/platform/sql/sqltest/
    # Server protocol test fixture: remaining branches abort on invalid setup
    # or simulate signing failures; production server coverage remains gated.
    - ^test/server/support/registryfixture/
    # Server-assembly harness: remaining branches abort on fixture setup
    # failures; production server coverage remains gated.
    - ^test/server/support/harness/
    # Shared Agent Packages/Plugins route fixture. Its uncovered branches
    # abort on fixture setup failures or malformed test responses; the
    # production handlers remain in the per-package gate.
    - ^test/server/support/agentcommon/
    # Upstream transport test fixture: its remaining branches are t.Fatal
    # paths on invalid setup, while the transport itself
    # (internal/artifacts/adapters/upstream) stays in the per-package gate.
    - ^internal/artifacts/adapters/upstream/upstreamtest/
    # Item kit test fixture: its remaining branches are t.Fatal paths of a
    # store or blob directory that fails to seed, while the kit itself
    # (internal/artifacts/adapters/http/itemkit) stays in the per-package gate.
    - ^internal/artifacts/adapters/http/itemkit/kittest/
    # Skips container tests where Docker cannot run Linux containers; its
    # branches are the skip paths of other platforms.
    - ^pkg/containertest/
