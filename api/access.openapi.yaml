    TokenCreateRequest:
      description: An access token request. Accepted as JSON or form-encoded. Every field is optional; the defaults mint an identity token for the caller that expires after the configured default expiry (31536000 seconds, one year, until an admin changes it).
      properties:
        audience:
          default: '*@*'
          description: Optional within this object. Which services accept the token, as <service type>@<service id> patterns. Defaults to *@*, every service.
          maxLength: 255
          type: string
        description:
          description: Optional within this object. Free text stored with the token metadata.
          maxLength: 1024
          type: string
        expires_in:
          description: Optional within this object. Lifetime in seconds. Defaults to the default expiry setting (31536000 until an admin changes it). 0 means the token never expires and is allowed for admins only; anyone else is answered 403. Tokens shorter than 21600 seconds are not revocable unless force_revocable or refreshable is set.
          minimum: 0
          type: integer
        force_revocable:
          default: false
          description: Optional within this object. Makes a short-lived token revocable at the cost of a server-side record. Defaults to false.
          type: boolean
        grant_type:
          default: client_credentials
          description: Optional within this object. client_credentials mints a new token; refresh_token exchanges refresh_token for a new one. Defaults to client_credentials.
          enum:
            - client_credentials
            - refresh_token
          type: string
        include_reference_token:
          default: false
          description: Optional within this object. When true the response also carries a 64-character reference token that stands in for the JWT. Defaults to false.
          type: boolean
        project_key:
          description: Optional within this object. Scopes a token minted by a project admin to that project. An empty string is treated as absent.
          type: string
        refresh_token:
          description: Optional within this object. Required when grant_type is refresh_token; the refresh token from the original response.
          type: string
          writeOnly: true
        refreshable:
          default: false
          description: Optional within this object. When true a refresh_token is issued alongside, and the token is revocable whatever its lifetime. Defaults to false.
          type: boolean
        scope:
          default: applied-permissions/user
          description: 'Optional within this object. Space-separated scope terms. Forms: applied-permissions/user (the subject''s own permissions, the default), applied-permissions/admin, applied-permissions/groups:"g1","g2", applied-permissions/roles:<project>:<role>, artifact:<repo or *>[/<ant path>]:<actions> with actions from r,w,d,a,x,s,m or *, repo:<key>:r, project:<key>/members/users:r, project:<key>/members/groups:r, project:<key>/roles:r, and system:* scopes such as system:identities:r. applied-permissions/admin makes the token an admin token whatever its subject; only an admin may request it. Any other scope never grants more than the subject already holds.'
          maxLength: 500
          type: string
        username:
          description: Optional within this object. The subject of the new token. Defaults to the caller. Only admins may name another user; the name need not exist, which is how service tokens are minted. A token for a name that is not a stored user authenticates as a transient user, of which nothing is stored. Its permissions are what its scope gives. applied-permissions/user gives grants to the name and to the groups new users join automatically, and a groups scope gives the named groups alone. Once a user of that name exists, the token acts as that user.
          maxLength: 255
          type: string
      type: object
    TokenDetails:
      description: Metadata of one token. Never includes the token value.
      properties:
        description:
          description: Optional within this object. The description given at creation.
          type: string
        expiry:
          description: Optional within this object. Expiry as Unix seconds; absent when the token never expires.
          type: integer
        issued_at:
          description: Required within this object. Issue time as Unix seconds.
          type: integer
        issuer:
          description: Required within this object. Server-owned. The issuing service id, jfac@<service id>.
          type: string
        last_used:
          description: Optional within this object. Unix seconds of the last authenticated request with this token; absent when never used or when usage tracking is off.
          type: integer
        refreshable:
          description: Required within this object. Whether a refresh token was issued.
          type: boolean
        scope:
          description: Required within this object. The stored scope string.
          type: string
        subject:
          description: Required within this object. Server-owned. The subject in the form jfac@<service id>/users/<username>.
          type: string
        token_id:
          description: Required within this object. The token id.
          type: string
      required:
        - issued_at
        - issuer
        - refreshable
        - scope
        - subject
        - token_id
      type: object
    TokenListResponse:
      description: Token metadata visible to the caller.
      properties:
        tokens:
          description: Required within this object. One entry per token, possibly empty.
          items:
            $ref: '#/components/schemas/TokenDetails'
          type: array
      required:
        - tokens
      type: object
    TokenResponse:
      description: A freshly minted token.
      properties:
        access_token:
          description: Required within this object. The JWT; shown only in this response.
          type: string
        expires_in:
          description: Required within this object. Lifetime in seconds; 0 when the token never expires.
          type: integer
        reference_token:
          description: Optional within this object. Present only when include_reference_token was true; 64 characters starting with cmVmd.
          type: string
        refresh_token:
          description: Optional within this object. Present only when refreshable was true.
          type: string
        scope:
          description: Required within this object. The effective scope as stored.
          type: string
        token_id:
          description: Required within this object. Server-owned. The id used to read or revoke the token.
          type: string
        token_type:
          description: Required within this object. Always Bearer.
          type: string
      required:
        - access_token
        - expires_in
        - scope
        - token_id
        - token_type
      type: object
    TokenSpec:
      description: The shape of the access token an identity mapping issues.
      properties:
        audience:
          description: Optional within this object. Audience of the issued token. Omitted means every service.
          type: string
        expires_in:
          description: Optional within this object. Lifetime of the issued token in seconds.
          format: int64
          type: integer
        groups_pattern:
          description: Optional within this object. Template that builds group names from the ID token's claims. The issued token carries those groups.
          type: string
        scope:
          description: Optional within this object. Scope of the issued token, in the access token scope grammar of POST /api/v1/tokens.
          type: string
        self_revocable:
          description: Optional within this object. Whether the issued token may revoke itself.
          type: boolean
        username:
          description: Optional within this object. Username of the issued token's subject. Use username_pattern instead to derive it from claims.
          type: string
        username_pattern:
          description: Optional within this object. Template that builds the subject's username from the ID token's claims.
          type: string
      type: object
    UserCreateRequest:
      description: A new internal user.
      properties:
        admin:
          default: false
          description: Optional within this object. Grants platform admin rights. Defaults to false.
          type: boolean
        disable_ui_access:
          default: false
          description: Optional within this object. Blocks interactive UI login; API access is unaffected. Defaults to false.
          type: boolean
        email:
          description: Required within this object. The user's email address.
          format: email
          type: string
        groups:
          description: Optional within this object. Groups to join on creation; each must exist.
          items:
            description: A group name.
            type: string
          type: array
        internal_password_disabled:
          default: false
          description: Optional within this object. When true the user cannot log in with a password and must use tokens or an external identity. Defaults to false.
          type: boolean
        manage_webhook:
          default: false
          description: Optional within this object. Allows managing webhook subscriptions. Defaults to false.
          type: boolean
        password:
          description: Optional within this object. The clear-text password; required unless internal_password_disabled is true. Checked against the password policy and stored as a hash.
          format: password
          type: string
          writeOnly: true
        platform_auditor:
          default: false
          description: Optional within this object. Read-only access to audit information. Defaults to false.
          type: boolean
        policy_manager:
          description: Optional within this object. Xray policy management right. Stored and echoed; no effect.
          type: boolean
        policy_viewer:
          description: Optional within this object. Xray policy view right. Stored and echoed; no effect.
          type: boolean
        profile_updatable:
          default: true
          description: Optional within this object. Whether the user may change their own email and password. Defaults to true.
          type: boolean
        reports_manager:
          description: Optional within this object. Xray reports right. Stored and echoed; no effect.
          type: boolean
        resources_manager:
          description: Optional within this object. Allows managing repositories without being a full admin.
          type: boolean
        username:
          description: Required within this object. The login name. Stored lower-case; at most 255 characters; must not be admin or anonymous.
          type: string
        watch_manager:
          description: Optional within this object. Xray watch management right. Stored and echoed; no effect.
          type: boolean
      required:
        - email
        - username
      type: object
    UserDetails:
      description: A stored user as returned by every read. Secrets are never included.
      properties:
        admin:
          description: Required within this object. Whether the admin flag is set directly on the user.
          type: boolean
        disable_ui_access:
          description: Required within this object. Whether UI login is blocked.
          type: boolean
        effective_admin:
          description: Required within this object. Server-owned. True when the user is an admin directly or through a group with admin_privileges.
          type: boolean
        email:
          description: Required within this object. The email address.
          type: string
        groups:
          description: Required within this object. Names of the groups the user belongs to, possibly empty.
          items:
            description: A group name.
            type: string
          type: array
        internal_password_disabled:
          description: Required within this object. Whether password login is disabled.
          type: boolean
        last_logged_in:
          description: Required within this object. Server-owned. RFC 3339 time of the last successful authentication; null when the user has never logged in.
          format: date-time
          nullable: true
          type: string
        manage_webhook:
          description: Optional within this object. Webhook management right.
          type: boolean
        platform_auditor:
          description: Optional within this object. Audit read right.
          type: boolean
        policy_manager:
          description: Optional within this object. Echo of the stored flag.
          type: boolean
        policy_viewer:
          description: Optional within this object. Echo of the stored flag.
          type: boolean
        profile_updatable:
          description: Required within this object. Whether the user may edit their own profile.
          type: boolean
        realm:
          description: Required within this object. Server-owned. internal for locally stored users.
          type: string
        reports_manager:
          description: Optional within this object. Echo of the stored flag.
          type: boolean
        resources_manager:
          description: Optional within this object. Repository management right.
          type: boolean
        status:
          description: Required within this object. Server-owned lifecycle state. locked is set by the user lock policy after repeated failed logins.
          enum:
            - invited
            - enabled
            - disabled
            - locked
          type: string
        username:
          description: Required within this object. The login name.
          type: string
        watch_manager:
          description: Optional within this object. Echo of the stored flag.
          type: boolean
      required:
        - admin
        - disable_ui_access
        - effective_admin
        - email
        - groups
        - internal_password_disabled
        - last_logged_in
        - profile_updatable
        - realm
        - status
        - username
      type: object
    UserListResponse:
      description: One page of the user listing.
      properties:
        cursor:
          description: Optional within this object. Present only when more users remain; pass it back as the cursor query parameter.
          type: string
        users:
          description: Required within this object. The users in this page, possibly empty.
          items:
            description: A user summary.
            properties:
              realm:
                description: 'Required within this object. Where the user is authenticated: internal for locally stored users.'
                type: string
              status:
                description: Required within this object. The lifecycle state, one of invited, enabled, disabled, locked.
                type: string
              uri:
                description: Required within this object. Absolute URL of the user's details resource.
                type: string
              username:
                description: Required within this object. The login name.
                type: string
            required:
              - realm
              - status
              - uri
              - username
            type: object
          type: array
      required:
        - users
      type: object
    UserLockPolicyConfig:
      description: The Access user lock policy. One document over the same settings as /artifactory/api/security/userLockPolicy and /artifactory/api/security/configuration/passwordExpirationPolicy, so a change through either API reads back through both. attempts and passwordExpiryDays are enforced; the other fields are stored and returned only. Users are not unlocked after secondsToUnlock, logins are not delayed, and administrators are not exempt from password expiry.
      properties:
        adminPasswordExpirable:
          description: Optional within this object. Whether password expiry also applies to administrators. Stored and returned only. Default false.
          type: boolean
        attempts:
          description: Optional within this object. Failed logins before a user is locked, from 0 through 100. 0 turns locking off and unlocks every locked user; /artifactory/api/security/userLockPolicy then reports enabled false and keeps its previous loginAttempts. Default 0.
          maximum: 100
          minimum: 0
          type: integer
        baseLoginDelayMillis:
          description: Optional within this object. Base delay, in milliseconds, for temporary login suspension after failed logins. Stored and returned only. Default 1000.
          format: int64
          type: integer
        clientLoginSuspensionEnabled:
          description: Optional within this object. Whether Basic logins check temporary login suspension. Stored and returned only. Default true.
          type: boolean
        maxLoginDelayIncorrectAttempts:
          description: Optional within this object. Failed logins allowed before temporary login suspension starts. Stored and returned only. Default 2.
          type: integer
        maxLoginDelayMillis:
          description: Optional within this object. Upper bound, in milliseconds, on the temporary login suspension delay. Stored and returned only. Default 60000.
          format: int64
          type: integer
        passwordExpiryDays:
          description: Optional within this object. Days after which an internal user's password expires; 0 means passwords do not expire. /artifactory/api/security/configuration/passwordExpirationPolicy reads it as enabled with passwordMaxAge, and keeps its previous passwordMaxAge while this is 0. Default 0.
          minimum: 0
          type: integer
        secondsToUnlock:
          description: Optional within this object. Seconds after which a locked user may sign in again; 0 keeps the user locked until an administrator unlocks them. Stored and returned only. Default 0.
          minimum: 0
          type: integer
      type: object
    UserUpdateRequest:
