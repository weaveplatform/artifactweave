              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No valid credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller is not a platform admin.
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The body is not application/json.
        '500':
