          format: email
          type: string
        internal_password_disabled:
          description: Optional within this object. Disables or re-enables password login.
          type: boolean
        manage_webhook:
          description: Optional within this object. Webhook management right.
          type: boolean
        password:
          description: Optional within this object. A new clear-text password; required when internal_password_disabled changes to false for a user without one.
          format: password
          type: string
          writeOnly: true
        platform_auditor:
          description: Optional within this object. Audit read right.
          type: boolean
        policy_manager:
          description: Optional within this object. Stored and echoed; no effect.
          type: boolean
        policy_viewer:
          description: Optional within this object. Stored and echoed; no effect.
          type: boolean
        profile_updatable:
          description: Optional within this object. Whether the user may edit their own profile.
          type: boolean
        reports_manager:
          description: Optional within this object. Stored and echoed; no effect.
          type: boolean
        resources_manager:
          description: Optional within this object. Repository management right.
          type: boolean
        watch_manager:
          description: Optional within this object. Stored and echoed; no effect.
          type: boolean
      type: object
    VaultConfig:
