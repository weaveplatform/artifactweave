  /api/v1/environments:
    get:
      description: Returns every global environment, including the built-in DEV and PROD. Every repository belongs to exactly one environment (DEV by default). Admin only.
      operationId: getGlobalEnvironments
      responses:
        '200':
          content:
            application/json:
              schema:
                description: The environments.
                items:
                  $ref: '#/components/schemas/Environment'
                type: array
          description: The environments.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No valid credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller is not a platform admin.
      summary: List global environments
      tags:
        - environments
    post:
      description: Creates an environment and returns it with status 201. Names are case-insensitive and at most 32 characters; a name that differs from an existing one only by case answers 409. Admin only.
      operationId: createGlobalEnvironment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvironmentCreate'
        description: The environment to create.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
          description: The environment was created.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The name is empty, too long, or contains characters other than letters, digits, hyphen and underscore.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No valid credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller is not a platform admin.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An environment with this name already exists.
      summary: Create a global environment
      tags:
        - environments
  /api/v1/environments/{environmentName}:
    delete:
      description: Removes an environment. DEV and PROD cannot be deleted, nor can an environment that repositories or global roles still name; both answer 400. Admin only. Answers 204 with no body.
      operationId: deleteGlobalEnvironment
      parameters:
        - $ref: '#/components/parameters/environmentName'
      responses:
        '204':
          description: The environment was deleted.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No valid credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller is not a platform admin.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No environment with this name.
      summary: Delete a global environment
      tags:
        - environments
  /api/v1/environments/{environmentName}/rename:
    post:
      description: Renames the environment and updates every repository and role that references it. The built-in DEV and PROD cannot be renamed. Admin only. Answers 200 with the environment under its new name.
      operationId: renameGlobalEnvironment
      parameters:
        - $ref: '#/components/parameters/environmentName'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvironmentRename'
        description: The new name.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
          description: The renamed environment.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The new name is invalid, already taken, or the environment is built in.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No valid credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller is not a platform admin.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No environment with this name.
      summary: Rename a global environment
      tags:
        - environments
