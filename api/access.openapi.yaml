  /api/v2/permissions:
    get:
      description: Returns permissions as a cursor-paginated page. Without filters the page holds name and uri per permission. With user or group filters it holds only permissions that grant something to those principals, and expand=true then returns the full PermissionDetails instead of the name and uri pair. Requires a platform admin or the system:permissions:r scope.
      operationId: getPermissions
      parameters:
        - description: Optional query parameter. The cursor from the previous page; omitted starts at the first page.
          in: query
          name: cursor
          schema:
            type: string
        - description: Optional query parameter. Maximum number of permissions in the page, between 1 and 99999. Omitted uses the server default page size.
          in: query
          name: limit
          schema:
            maximum: 99999
            minimum: 1
            type: integer
        - description: Optional query parameter. Comma-separated usernames; keeps permissions that grant any action to at least one of them, directly or through their groups when include_inherited_groups is true.
          explode: false
          in: query
          name: user
          schema:
            description: Usernames.
            items:
              description: A username.
              type: string
            type: array
          style: form
        - description: Optional query parameter. Comma-separated group names; keeps permissions that grant any action to at least one of them.
          explode: false
          in: query
          name: group
          schema:
            description: Group names.
            items:
              description: A group name.
              type: string
            type: array
          style: form
        - description: Optional query parameter. When filtering by user, also match permissions granted to the user's groups. Defaults to true.
          in: query
          name: include_inherited_groups
          schema:
            default: true
            type: boolean
        - description: Optional query parameter. When true, and only together with user or group, each entry is the full permission document. Defaults to false. Without a principal filter it answers 400.
          in: query
          name: expand
          schema:
            default: false
            type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PermissionListResponse'
                  - $ref: '#/components/schemas/ExpandedPermissionsResponse'
          description: 'One page of permissions. The entry shape depends on expand: name and uri pairs, or full documents.'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: expand was requested without user or group, or limit is out of range.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No valid credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller is neither an admin nor holds system:permissions:r.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: A filtered user or group does not exist.
      summary: List permissions
      tags:
        - permissions
    post:
      description: Creates a permission in the Access v2 model and returns it with status 201. The /artifactory/api/security/permissions and /artifactory/api/v2/security/permissions endpoints are views of the same record. Every principal, repository and build target named in the body must exist, except the special targets ANY, ANY LOCAL, ANY REMOTE and ANY DISTRIBUTION. Admin only. An existing name answers 409.
      operationId: createPermission
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionCreateRequest'
        description: The permission to create.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionDetails'
          description: The permission was created.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Validation failed: missing name, an unknown action, a build resource with more than one target, or a pattern longer than 1024 characters.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No valid credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller is not a platform admin.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: A permission with this name already exists.
      summary: Create a permission
      tags:
        - permissions
