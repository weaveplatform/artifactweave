          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No credentials, or the credentials are invalid or expired.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            The caller lacks the privilege this operation needs (see the description).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No global role exists with this name.
      tags:
        - projects
      x-oracle-source: https://docs.jfrog.com/projects/reference/getprojectsforrole.md
      summary: List projects that use a global role
  /api/v2/users:
    get:
      description: Returns one record per user, newest first unless descendingOrder is false, as a cursor-paginated page. Requires a platform admin or a token carrying the system:identities:r scope. Every query parameter is a filter; filters combine with AND.
      operationId: getUserList
      parameters:
        - description: Optional query parameter. Keeps only users in the given lifecycle state. Omitted means every state.
          in: query
          name: status
          schema:
            enum:
              - invited
              - enabled
              - disabled
              - locked
            type: string
        - description: Optional query parameter. Maximum number of users in the page. Defaults to 1000; the server never returns more than the limit and sets cursor when more remain.
          in: query
          name: limit
          schema:
            default: 1000
            minimum: 1
            type: integer
        - description: Optional query parameter. Case-insensitive substring that the username must contain.
          in: query
          name: username
          schema:
            type: string
        - description: Optional query parameter. When true only users with the admin flag or an admin-granting group are returned. Omitted or false returns everyone.
          in: query
          name: onlyAdmins
          schema:
            type: boolean
        - description: Optional query parameter. The cursor value from the previous page. Omitted starts from the first page. Cursors are opaque and only valid with the same filters.
          in: query
          name: cursor
          schema:
            type: string
        - description: Optional query parameter. Keeps only users holding this role name, globally or within projectKey when that is also given.
          in: query
          name: role
          schema:
            type: string
        - description: Optional query parameter. Together with resourceName, keeps only users that have any permission on that resource. Values follow the permission resource types, for example artifact or build.
          in: query
          name: resourceType
          schema:
            type: string
        - description: Optional query parameter. The resource key paired with resourceType, for example a repository key. Ignored without resourceType.
          in: query
          name: resourceName
          schema:
            type: string
        - description: Optional query parameter. Scopes role and membership filters to one project. A project admin may only use their own project keys.
          in: query
          name: projectKey
          schema:
            type: string
        - description: Optional query parameter. Sort direction by username. Omitted sorts ascending.
          in: query
          name: descendingOrder
          schema:
            type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
          description: One page of users.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: A filter value is malformed, for example an unknown status.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No valid credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller is neither an admin nor holds system:identities:r.
      summary: List users
      tags:
        - users
    post:
      description: Creates an internal user and returns its details with status 201. The same internal user record backs the /artifactory/api/security/users endpoint. Admin only. A username that already exists answers 409.
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
        description: The user to create.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetails'
          description: The user was created. The body is the stored user without secrets.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Validation failed: missing username or email, password absent while internal_password_disabled is false, a group that does not exist, or a password rejected by the password policy.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No valid credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller is not a platform admin.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: A user with this username already exists.
      summary: Create a user
      tags:
        - users
  /api/v2/users/expire_password_for_all_users:
    post:
      description: Marks every internal user's password as expired so each user must set a new one at next login. Users with internal_password_disabled are unaffected. Admin only. Responds with a plain text confirmation.
      operationId: expirePasswordForAllUsers
      responses:
        '200':
          content:
            text/plain:
              schema:
                description: A short confirmation message.
                type: string
          description: All passwords were expired.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No valid credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller is not a platform admin.
      summary: Expire every internal password
      tags:
        - users
  /api/v2/users/unexpire_password_for_all_users:
    post:
      description: 'Reverses expire_password_for_all_users: every internal password becomes valid again without the user changing it. Admin only. Responds with a plain text confirmation.'
      operationId: unexpirePasswordForAllUsers
      responses:
        '200':
          content:
            text/plain:
              schema:
                description: A short confirmation message.
                type: string
          description: All passwords were un-expired.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No valid credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller is not a platform admin.
      summary: Clear the expired flag on every password
      tags:
        - users
  /api/v2/users/{username}:
    delete:
      description: Removes the user, its group memberships, its tokens and its entries in permission targets. The built-in admin and anonymous users cannot be deleted. Admin only. Answers 204 with no body.
      operationId: deleteUser
      parameters:
        - $ref: '#/components/parameters/username'
      responses:
        '204':
          description: The user was deleted.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No valid credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller is not a platform admin, or the user is built in.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No user with this username.
      summary: Delete a user
      tags:
        - users
    get:
      description: Returns the stored user record. Requires a platform admin or the system:identities:r scope; a user may always read their own record.
      operationId: getUserDetails
      parameters:
        - $ref: '#/components/parameters/username'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetails'
          description: The user.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The username is syntactically invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No valid credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller may not read other users.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No user with this username.
      summary: Get a user
      tags:
        - users
    patch:
      description: 'Partial update: only the fields present in the body change, omitted fields keep their stored values, and the username cannot be changed. Group membership is not updated here; use the groups sub-resource. Setting internal_password_disabled to false on a user that has no password requires a password in the same request. Admin only.'
      operationId: updateUser
      parameters:
        - $ref: '#/components/parameters/username'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
        description: The fields to change.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetails'
          description: The updated user.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation failed, for example a password that violates the policy or a request that re-enables internal passwords without supplying one.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No valid credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller is not a platform admin.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No user with this username.
      summary: Update a user
      tags:
        - users
  /api/v2/users/{username}/groups:
    patch:
      description: Applies the add list then the remove list to the user's memberships and returns the resulting full membership. Names that are already present (add) or already absent (remove) are ignored; a name in both lists ends up removed. Admin only.
      operationId: updateUserGroups
      parameters:
        - $ref: '#/components/parameters/username'
      requestBody:
        content:
          application/json:
            schema:
              description: Membership changes.
              properties:
                add:
                  description: Optional within this object. Group names to join. Every name must exist.
                  items:
                    description: A group name.
                    type: string
                  type: array
                remove:
                  description: Optional within this object. Group names to leave.
                  items:
                    description: A group name.
                    type: string
                  type: array
              type: object
        description: Group names to add and remove.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                description: The resulting membership.
                properties:
                  groups:
                    description: Required within this object. Every group the user now belongs to.
                    items:
                      description: A group name.
                      type: string
                    type: array
                required:
                  - groups
                type: object
          description: The user's complete membership after the change.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: A group in the add list does not exist.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No valid credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller is not a platform admin.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No user with this username.
      summary: Add or remove group memberships
      tags:
        - users
  /api/v2/users/{username}/password:
    put:
      description: Replaces the user's internal password. A platform admin may set any user's password; any user may set their own. The new value must satisfy the password policy and, when the policy forbids reuse, differ from the current one. Answers 204 with no body.
      operationId: changeUserPassword
      parameters:
        - $ref: '#/components/parameters/username'
      requestBody:
        content:
          application/json:
            schema:
              description: Password change.
              properties:
                password:
                  description: Required within this object. The new clear-text password. Stored as an Argon2id hash and never returned.
                  format: password
                  type: string
                  writeOnly: true
              required:
                - password
              type: object
        description: The new password.
        required: true
      responses:
        '204':
          description: The password was changed.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The password violates the policy.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No valid credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller is neither an admin nor the user.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No user with this username.
      summary: Set a user's password
      tags:
        - users
  /api/v2/users/{username}/password/expire:
    post:
      description: Marks the user's password as expired so they must change it at next login. Admin only. Answers 204 with no body.
      operationId: expireUserPassword
      parameters:
        - $ref: '#/components/parameters/username'
      responses:
        '204':
          description: The password was expired.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No valid credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller is not a platform admin.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No user with this username.
      summary: Expire a user's password
      tags:
        - users
  /api/v2/users/{username}/unlock:
    post:
      description: Clears the lock that the user lock policy applied after too many failed logins and resets the failure counter. Unlocking an unlocked user succeeds. Admin only. Answers 204 with no body.
      operationId: unlockUser
      parameters:
        - $ref: '#/components/parameters/username'
      responses:
        '204':
          description: The user is unlocked.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No valid credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller is not a platform admin.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No user with this username.
      summary: Unlock a user
      tags:
        - users
components:
  parameters:
    environmentName:
      description: Required path parameter. The environment name, matched case-insensitively.
      in: path
      name: environmentName
      required: true
      schema:
        type: string
    groupName:
      description: Required path parameter. The group name.
      in: path
      name: name
      required: true
      schema:
        type: string
    permissionName:
      description: Required path parameter. The permission name, at most 64 characters.
      in: path
      name: permissionName
      required: true
      schema:
        type: string
    projectKey:
      description: Required path parameter. The project key, 2 to 32 lower-case characters starting with a letter.
      in: path
      name: projectKey
      required: true
      schema:
        type: string
    resourceType:
      description: 'Required path parameter. Which section of the permission to address: artifact for repositories, build for build-info, release_bundle for release bundles. release_bundle sections are stored but have no effect.'
      in: path
      name: resourceType
      required: true
      schema:
        enum:
          - artifact
          - build
          - release_bundle
        type: string
    roleName:
      description: Required path parameter. The role name.
      in: path
      name: role
      required: true
      schema:
        type: string
    tokenId:
      description: Required path parameter. The token id from the create response, or me for the caller's own token.
      in: path
      name: tokenId
      required: true
      schema:
        type: string
    username:
      description: Required path parameter. The user's login name, case-insensitive.
      in: path
      name: username
      required: true
      schema:
        type: string
  schemas:
    AccessVersion:
      type: object
      additionalProperties: false
      required: [name, version]
      properties:
        name:
          type: string
          description: >-
            Required within this object. The compatibility version.
        version:
          type: string
          description: Required within this object. The same value as name.
    Actions:
      description: 'Actions granted per principal. Values are upper-case action names: READ, ANNOTATE, WRITE, DELETE, MANAGE, SCAN and, for release bundles, EXECUTE. These map one to one onto the legacy codes r, n, w, d, m, mxm and x. DELETE implies the ability to overwrite.'
      properties:
        groups:
          additionalProperties:
            description: Actions for one group.
            items:
              description: An action name.
              type: string
            type: array
          description: Optional within this object. Map from group name to its action list.
          type: object
        users:
          additionalProperties:
            description: Actions for one user.
            items:
              description: An action name.
              type: string
            type: array
          description: Optional within this object. Map from username to its action list.
          type: object
      type: object
    AwsIamRoleAssignment:
      description: Maps one user to the AWS IAM role their AWS credentials must assume. Not supported.
      properties:
        iam_role:
          description: Required within this object. ARN of the AWS IAM role the user's AWS credentials must assume.
          type: string
        username:
          description: Required within this object. User the role is mapped to.
          type: string
      required:
        - username
        - iam_role
      type: object
    CrowdConfiguration:
      description: Atlassian Crowd integration settings. Not supported.
      properties:
        allow_user_to_access_profile:
          description: Optional within this object. Whether users created through Crowd may open their own profile.
          type: boolean
        application_name:
          description: Optional within this object. Application name registered in Crowd.
          type: string
        auto_user_creation:
          description: Optional within this object. Whether a first login creates a local user.
          type: boolean
        custom_cookie_token_key:
          description: Optional within this object. Name of the single sign-on cookie when it differs from Crowd's default.
          type: string
        direct_authentication:
          description: Optional within this object. Whether passwords are checked against Crowd directly rather than through single sign-on.
          type: boolean
        enable_integration:
          description: Optional within this object. Whether users are authenticated against Crowd.
          type: boolean
        override_all_groups_upon_login:
          description: Optional within this object. Whether each login replaces the user's group memberships with those in Crowd.
          type: boolean
        password:
          description: Optional within this object. Application password registered in Crowd. Never returned.
          type: string
          writeOnly: true
        server_url:
          description: Optional within this object. Base URL of the Crowd server.
          type: string
        session_validation_interval:
          description: Optional within this object. Minutes between re-validations of a Crowd session.
          format: int64
          type: integer
        use_default_proxy:
          description: Optional within this object. Whether calls to Crowd go through the default proxy.
          type: boolean
      type: object
    Environment:
      description: A global or project environment.
      properties:
        name:
          description: Required within this object. The environment name as stored.
          type: string
      required:
        - name
      type: object
    EnvironmentCreate:
      description: A new environment.
      properties:
        name:
          description: Required within this object. At most 32 characters of letters, digits, hyphen and underscore; compared case-insensitively.
          maxLength: 32
          type: string
      required:
        - name
      type: object
    EnvironmentRename:
      description: A rename request.
      properties:
        new_name:
          description: Required within this object. The new name, with the same rules as on creation.
          maxLength: 32
          type: string
      required:
        - new_name
      type: object
    ErrorResponse:
      type: object
      description: The Access error envelope used by every /access response.
      required: [errors]
      properties:
        errors:
          type: array
          description: >-
            Required within this object. One entry per error.
          items:
            type: object
            required: [code, message]
            properties:
              code:
                type: string
                description: Required within this object. A symbolic code such as NOT_FOUND.
              message:
                type: string
                description: Required within this object. Human readable explanation.
    ExpandedPermissionsResponse:
      description: One page of the permission listing with expand=true.
      properties:
        cursor:
          description: Optional within this object. Present only when more permissions remain.
          type: string
        permissions:
          description: Required within this object. Full permission documents.
          items:
            $ref: '#/components/schemas/PermissionDetails'
          type: array
      required:
        - permissions
      type: object
    FederationTarget:
      description: 'A federation target as stored on this instance: a peer instance of this server that receives this instance''s identity changes over the peer protocol (decision 0021). Returned by every read; secrets of the trust relationship are never included.'
      properties:
        active:
          description: Optional within this object. When false the target stays registered but receives no changes until reactivated; queued changes are kept and sent on reactivation.
          type: boolean
        entities:
          description: 'Optional within this object. The identity entity types replicated to the target: any of users, groups, permissions and tokens.'
          items:
            description: One identity entity type.
            enum:
              - users
              - groups
              - permissions
              - tokens
            type: string
          type: array
        group_filters:
          allOf:
            - $ref: '#/components/schemas/PatternFilter'
          description: Optional within this object. Limits which groups, by name, are replicated. Users are replicated with only the memberships of groups that pass this filter.
        name:
          description: Optional within this object. Server-owned on update. The unique name of the target, fixed at registration and used as {serverName} in the item paths.
          type: string
        permission_filters:
          allOf:
            - $ref: '#/components/schemas/PatternFilter'
          description: Optional within this object. Limits which permissions, by name, are replicated.
        url:
          description: Optional within this object. Server-owned on update. Base URL of the peer instance, fixed at registration.
          type: string
      type: object
    FederationTargetCreate:
      description: 'Registration of a new federation target. The peer must already trust this instance: pair the two instances first with a platform-federation pairing token (POST /access/api/v1/service_trust/pairing/platform-federation on the peer), otherwise registration is rejected with 400.'
      properties:
        active:
          default: true
          description: Optional within this object. Whether replication starts immediately. Defaults to true.
          type: boolean
        entities:
          default:
            - users
            - groups
            - permissions
            - tokens
          description: 'Optional within this object. Identity entity types to replicate. Defaults to all four: users, groups, permissions and tokens.'
          items:
            description: One identity entity type.
            enum:
              - users
              - groups
              - permissions
              - tokens
            type: string
          type: array
        force_override:
          default: false
          description: Optional within this object. When true, a target with the same name is replaced instead of answering 409. Defaults to false. The replaced target's queued changes are discarded and a full broadcast is scheduled.
          type: boolean
        group_filters:
          allOf:
            - $ref: '#/components/schemas/PatternFilter'
          description: Optional within this object. Limits which groups, by name, are replicated. Omitted means all.
        name:
          description: Required within this object. Unique name for the target on this instance. Cannot be changed later.
          type: string
        permission_filters:
          allOf:
            - $ref: '#/components/schemas/PatternFilter'
          description: Optional within this object. Limits which permissions, by name, are replicated. Omitted means all.
        url:
          description: Required within this object. Base URL of the peer instance, for example https://peer.example.com. Cannot be changed later; register a new target instead.
          type: string
      required:
        - name
        - url
      type: object
    FederationTargetList:
      description: Every federation target registered on this instance.
      properties:
        targets:
          description: Optional within this object. The targets, ordered by name. Empty when none is registered.
          items:
            $ref: '#/components/schemas/FederationTarget'
          type: array
      type: object
    FederationTargetUpdate:
      description: Partial update of a federation target. Omitted fields keep their values. name and url cannot be changed; sending either answers 400.
      properties:
        active:
          description: Optional within this object. Pauses (false) or resumes (true) replication to the target.
          type: boolean
        entities:
          description: Optional within this object. Replaces the list of replicated entity types. Removing a type stops future changes of that type; entities already on the peer are not deleted.
          items:
            description: One identity entity type.
            enum:
              - users
              - groups
              - permissions
              - tokens
            type: string
          type: array
        group_filters:
          allOf:
            - $ref: '#/components/schemas/PatternFilter'
          description: Optional within this object. Replaces the group filter.
        permission_filters:
          allOf:
            - $ref: '#/components/schemas/PatternFilter'
          description: Optional within this object. Replaces the permission filter.
      type: object
    FederationValidateRequest:
      description: The peer to probe before registering it as a target.
      properties:
        url:
          description: Required within this object. Base URL of the candidate peer instance.
          type: string
      required:
        - url
      type: object
    GlobalRole:
      description: A global role as returned by reads.
      properties:
        actions:
