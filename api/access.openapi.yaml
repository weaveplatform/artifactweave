      operationId: getAllLdapGroupSettings
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/LdapGroupSettings'
                type: array
          description: Every group setting.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No valid credentials.
        '403':
          content:
            application/json:
