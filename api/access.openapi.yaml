  /api/v1/vault/configs/{vault_key}:
    delete:
      description: Removes the connection. Keypairs that name it can no longer sign until a connection with the same key is stored again. Returns 204. Requires a platform admin.
      operationId: deleteVaultConfiguration
      parameters:
        - description: Required path parameter. Key of the Vault connection to remove.
          in: path
          name: vault_key
          required: true
          schema:
            type: string
      responses:
        '204':
          description: The connection was removed.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No valid credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller is not a platform admin.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No connection has that key.
      summary: Delete a Vault connection
      tags:
        - vault
      x-oracle-source: https://docs.jfrog.com/administration/reference/deletevaultconfiguration.md
    put:
      description: Stores the connection under vault_key, replacing any connection with that key, and returns it without secrets. Vault must be reached over TLS. A body that is not application/json answers 415. Requires a platform admin.
      operationId: setVaultConfiguration
      parameters:
        - description: Required path parameter. Key under which the connection is stored; keypairs refer to it in vaultKey.
          in: path
          name: vault_key
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
