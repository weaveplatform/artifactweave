  /api/v1/cert/ca:
    get:
      description: Returns, as PEM text, the public certificate of the authority that signs the instance's internal service certificates. The server generates the authority on first start and keeps its key sealed (decision 0017). Requires a platform admin.
      operationId: getCaCertificate
      responses:
        '200':
          content:
            text/plain:
              schema:
                type: string
          description: The CA certificate in PEM form.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No valid credentials.
      summary: Get the CA certificate
      tags:
        - certificates
      x-oracle-source: https://docs.jfrog.com/administration/reference/getcacertificate.md
  /api/v1/cert/root:
    get:
      description: Returns the certificate whose key signs the instance's access tokens, so that other services can verify them. By default the body is the base64 certificate on one line; with formatted=true it is a PEM block with header, footer and line breaks. Any authenticated caller may read it.
      operationId: getRootCertificate
      parameters:
        - description: Optional query parameter. When true the certificate is returned as a PEM block with header, footer and line breaks. Omitted or false returns the base64 body on one line.
          in: query
          name: formatted
          required: false
          schema:
            default: false
            type: boolean
      responses:
        '200':
          content:
            text/plain:
              schema:
                type: string
          description: The root certificate as text.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No valid credentials.
      summary: Get the root certificate
      tags:
        - certificates
      x-oracle-source: https://docs.jfrog.com/administration/reference/getrootcertificate.md
  /api/v1/config/security/authentication/basic_authentication_enabled:
    get:
      description: Returns whether usernames and passwords are accepted over HTTP Basic. When the switch is off, only access tokens and reference tokens authenticate (decision 0005). Requires a platform admin.
      operationId: getBasicAuthenticationStatus
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  enabled:
                    description: Optional within this object. Whether usernames and passwords over HTTP Basic are accepted.
                    type: boolean
                type: object
          description: The current switch value.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No valid credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller is not a platform admin.
      summary: Get the basic authentication switch
      tags:
        - config
      x-oracle-source: https://docs.jfrog.com/administration/reference/getbasicauthenticationstatus.md
    put:
      description: Turns acceptance of usernames and passwords over HTTP Basic on or off for the whole instance, from the next request on. Returns 200 with no body. Requires a platform admin.
      operationId: setBasicAuthenticationStatus
      requestBody:
        content:
          application/json:
            schema:
              properties:
                enabled:
                  description: Required within this object. true accepts usernames and passwords over HTTP Basic; false refuses them while tokens keep working.
                  type: boolean
              required:
                - enabled
              type: object
        description: The new switch value.
        required: true
      responses:
        '200':
          description: The switch was changed.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The body or a parameter is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No valid credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller is not a platform admin.
      summary: Set the basic authentication switch
      tags:
        - config
      x-oracle-source: https://docs.jfrog.com/administration/reference/setbasicauthenticationstatus.md
  /api/v1/config/security/password_policy:
    patch:
      description: Merges the supplied fields into the password policy; omitted fields keep their current values. The policy applies when a password is set or changed, not to existing passwords. Returns 204 with no body. Requires a platform admin.
      operationId: updatePasswordPolicy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordPolicy'
        description: The fields to change.
        required: true
      responses:
        '204':
          description: The policy was updated.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The body or a parameter is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No valid credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller is not a platform admin.
      summary: Update the password policy
      tags:
        - config
      x-oracle-source: https://docs.jfrog.com/administration/reference/updatepasswordpolicy.md
    put:
      description: Replaces the whole password policy that internal users' passwords must satisfy. Every field not supplied returns to its default, so an empty object resets the policy. The policy applies when a password is set or changed, not to existing passwords. Returns 204 with no body. Requires a platform admin.
      operationId: createPasswordPolicy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordPolicy'
        description: The complete new policy.
        required: true
      responses:
        '204':
          description: The policy was replaced.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The body or a parameter is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No valid credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller is not a platform admin.
      summary: Replace the password policy
      tags:
        - config
      x-oracle-source: https://docs.jfrog.com/administration/reference/createpasswordpolicy.md
  /api/v1/config/security/user_lock_policy:
    get:
      description: Returns the user lock policy. A setting never changed reports its default. Reads the same state as GET /artifactory/api/security/userLockPolicy and GET /artifactory/api/security/configuration/passwordExpirationPolicy. Requires a platform admin.
      operationId: getAccessUserLockPolicy
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLockPolicyConfig'
          description: The current policy.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No valid credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller is not a platform admin.
      summary: Get the user lock policy
      tags:
        - config
      x-oracle-source: https://docs.jfrog.com/integrations/docs/deprecated-jfrog-apis.md
    put:
      description: Replaces the user lock policy and returns what was stored. Send every field; an omitted field is stored as 0 or false, not as its default. To change one setting, read the policy and send it back with that field changed. Setting attempts to 0 unlocks every locked user. Requires a platform admin.
      operationId: configureAccessUserLockPolicy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLockPolicyConfig'
        description: The complete new policy.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLockPolicyConfig'
          description: The policy as stored.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: attempts is outside 0 through 100, or secondsToUnlock or passwordExpiryDays is negative.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No valid credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller is not a platform admin.
      summary: Replace the user lock policy
      tags:
        - config
      x-oracle-source: https://docs.jfrog.com/integrations/docs/deprecated-jfrog-apis.md
  /api/v1/config/token/default_expiry:
    get:
      description: Returns the lifetime, in seconds, that POST /api/v1/tokens gives to tokens created without expires_in. Requires a platform admin.
      operationId: getTokenDefaultExpiry
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  default_token_expiration:
                    description: Optional within this object. Lifetime in seconds given to access tokens created without expires_in. 31536000 (one year) unless an admin changed it.
                    type: integer
                type: object
          description: The current default lifetime.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No valid credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller is not a platform admin.
      summary: Get the default token lifetime
      tags:
        - config
      x-oracle-source: https://docs.jfrog.com/administration/reference/gettokendefaultexpiry.md
    put:
      description: Changes the lifetime given to access tokens created without expires_in. Tokens already issued keep their expiry. Returns 200 with no body. Requires a platform admin.
      operationId: setTokenDefaultExpiry
      requestBody:
        content:
          application/json:
            schema:
              properties:
                default_token_expiration:
                  description: Required within this object. New default lifetime in seconds. Applies only to tokens created after the change.
                  type: integer
              required:
                - default_token_expiration
              type: object
        description: The new default lifetime.
        required: true
      responses:
        '200':
          description: The default was changed.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No valid credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller is not a platform admin.
      summary: Set the default token lifetime
      tags:
        - config
      x-oracle-source: https://docs.jfrog.com/administration/reference/settokendefaultexpiry.md
