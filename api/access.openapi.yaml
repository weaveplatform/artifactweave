        description: The connection to store.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultConfig'
          description: The connection was stored; the body omits secrets.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The body or a parameter is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No valid credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller is not a platform admin.
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The body is not application/json.
      summary: Create or replace a Vault connection
      tags:
        - vault
      x-oracle-source: https://docs.jfrog.com/administration/reference/setvaultconfiguration.md
  /api/v2/groups:
    get:
      description: Returns one record per group as a cursor-paginated page. Requires a platform admin or the system:identities:r scope. Filters combine with AND.
      operationId: getGroupList
      parameters:
        - description: Optional query parameter. Maximum number of groups in the page. Defaults to 1000; cursor is set when more remain.
          in: query
          name: limit
          schema:
            default: 1000
            minimum: 1
            type: integer
        - description: Optional query parameter. Sort direction by group name. Defaults to false, ascending.
          in: query
          name: descendingOrder
          schema:
            default: false
            type: boolean
        - description: Optional query parameter. Case-insensitive substring the group name must contain.
          in: query
          name: groupName
          schema:
            type: string
        - description: Optional query parameter. The cursor from the previous page; omitted starts at the first page.
          in: query
          name: cursor
          schema:
            type: string
        - description: Optional query parameter. Keeps only groups holding this role, globally or within projectKey.
          in: query
          name: role
          schema:
            type: string
        - description: Optional query parameter. With resourceName, keeps only groups that have a permission on that resource.
          in: query
          name: resourceType
          schema:
            type: string
        - description: Optional query parameter. The resource key paired with resourceType. Ignored without resourceType.
          in: query
          name: resourceName
          schema:
            type: string
        - description: Optional query parameter. Scopes the role filter to one project.
          in: query
          name: projectKey
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupListResponse'
          description: One page of groups.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: A filter value is malformed.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No valid credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller is neither an admin nor holds system:identities:r.
      summary: List groups
      tags:
        - groups
    post:
      description: 'Creates a group and returns its details with status 201. members and import_from_ldap_group_setting are mutually exclusive: a group either lists its members or takes them from an LDAP group setting (LDAP import is not supported and answers 400). Admin only. An existing name answers 409.'
      operationId: createGroup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCreateRequest'
        description: The group to create.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupDetails'
          description: The group was created.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Validation failed: missing name, both members and import_from_ldap_group_setting given, or a member that does not exist.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No valid credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller is not a platform admin.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: A referenced user or LDAP setting does not exist.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: A group with this name already exists.
      summary: Create a group
      tags:
        - groups
