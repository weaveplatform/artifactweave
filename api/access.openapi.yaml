  /api/v1/system/federation:
    get:
      description: Returns every Access federation target registered on this instance, active or paused. Administrators only. A target is always another instance of this server; no other kind of federation peer is supported (decision 0025).
      operationId: getAllAccessFederations
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FederationTargetList'
          description: The registered targets.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller is not an administrator.
      summary: List federation targets
      tags:
        - federation
      x-oracle-source: https://docs.jfrog.com/administration/reference/getallaccessfederations.md
    post:
      description: Registers a peer instance as a target of Access federation. From then on every create, update and delete of the selected identity entities on this instance is queued in the peer outbox and delivered to the target in order, with retries, over the peer protocol (decision 0021); changes made on the target are not sent back unless the target also registers this instance. Registration requires an existing pairing with the peer. A full broadcast runs once after registration so the target starts from this instance's current state. Administrators only.
      operationId: registerAccessFederation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FederationTargetCreate'
        description: The target to register.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FederationTarget'
          description: Target registered; the body is the stored target.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid body (for example a missing name or url, an unknown entity type) or the peer is not paired with this instance.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller is not an administrator.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: A target with this name already exists and force_override was not set.
      summary: Register a federation target
      tags:
        - federation
      x-oracle-source: https://docs.jfrog.com/administration/reference/registeraccessfederation.md
