  /api/v1/tokens:
    get:
      description: A platform admin sees every token; any other caller sees only tokens whose subject is their own user. Expired tokens and tokens that are not revocable are omitted. The token values themselves are never returned, only their metadata. A token issued with a reference token is listed like any other.
      operationId: getTokens
      parameters:
        - description: Optional query parameter. Keeps only the tokens with this scope. A token matches when its whole scope, or one of its space-separated scopes, is exactly this string, such as applied-permissions/groups:readers. A scope no token has gives an empty list.
          in: query
          name: scope
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenListResponse'
          description: The visible tokens.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No valid credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller's token does not permit listing.
      summary: List access tokens
      tags:
        - tokens
    post:
      description: With grant_type client_credentials (the default) mints a new access token for username, or for the caller when username is omitted. With grant_type refresh_token exchanges refresh_token for a new access token with the same scope and audience. The body may be JSON or form-encoded. A non-admin may only mint identity tokens for themselves (scope applied-permissions/user). Admins may mint any scope that a user already holds; scopes only narrow. A user name and password sent with Basic mint a token only while the token.allow_basic_auth setting is on, which it is not by default; an access or reference token, as Bearer or as the Basic password, always may. The response status is 200 and the body always carries token_id.
      operationId: createToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenCreateRequest'
        description: The token request.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: The new token. The access_token value is shown once.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Validation failed: unknown grant_type, a scope that does not parse, a negative expires_in, or a refresh_token that is unknown or not refreshable.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No valid credentials, or a user name and password sent with Basic while token.allow_basic_auth is off, answered with the message `Unsupported authentication method Basic`.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'The requested token details are forbidden: the caller may not mint a token with this username or scope, or a non-admin asked for expires_in 0, a token that never expires.'
      summary: Create or refresh an access token
      tags:
        - tokens
  /api/v1/tokens/revoke:
    delete:
      description: Revokes the token whose JWT or reference token is given in the body and returns its id. A token is revocable when it never expires, its lifetime is at least the revocable threshold (21600 seconds), or it was created with force_revocable or refreshable; any other token answers 404, as an unknown one does. Admin only.
      operationId: revokeTokenByValue
      requestBody:
        content:
          application/json:
            schema:
              description: Revocation request.
              properties:
                token:
                  description: Required within this object. The access token (JWT) or the 64-character reference token.
                  type: string
                  writeOnly: true
              required:
                - token
              type: object
        description: The token to revoke.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Revocation result.
                properties:
                  revoked_token_id:
                    description: Required within this object. The id of the token that was revoked.
                    type: string
                required:
                  - revoked_token_id
                type: object
          description: The token was revoked.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No valid credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller is not a platform admin.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The value does not correspond to a known, unexpired, revocable token, answered with the message `Token not found or not revocable`.
      summary: Revoke a token by its value
      tags:
        - tokens
