      x-oracle-source: https://docs.jfrog.com/administration/reference/getallldapgroupsettings.md
    post:
      description: Defines how groups are read from the LDAP connection named in enabled_ldap and mapped to local groups. Answers 201 with the stored setting. Requires a platform admin.
      operationId: createLdapGroupSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LdapGroupSettingsCreate'
        description: The group setting to add.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
