  /api/v1/service_trust/pairing/{useCase}:
    post:
      description: Issues a single-use pairing token on this instance so that another instance of this server can establish mutual trust with it over the peer protocol (decision 0021). Run it on the instance that is to be trusted, hand the token to the administrator of the other instance, who redeems it there, for example when adding this instance as a follower (POST /pfed/api/v1/jpd) or registering it as an Access federation target. Redeeming exchanges per-peer keys that are sealed at rest (decision 0017); the token itself is never stored in clear and stops working once redeemed or when it expires, 300 seconds after issue by default (configurable). Only the platform-federation use case is supported; mission-control and bridge answer 501. The peer must be another instance of this server. Administrators only.
      operationId: createPairingToken
      parameters:
        - description: Required path parameter. What the trust is for. platform-federation pairs two instances of this server for platform federation, Access federation and topology membership. mission-control and bridge are accepted and answer 501.
          in: path
          name: useCase
          required: true
          schema:
            enum:
              - mission-control
              - bridge
              - platform-federation
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                description: The pairing token document.
                properties:
                  pairing_token:
                    description: Required within this object. The opaque, single-use token to give to the other instance's administrator. Treat it as a secret until it is redeemed.
                    type: string
                required:
                  - pairing_token
                type: object
          description: Pairing token issued.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No valid credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller is not a platform admin.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unknown use case.
        '501':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The use case is mission-control or bridge, which are not implemented.
      summary: Create a pairing token
      tags:
        - tokens
