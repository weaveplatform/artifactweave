    OidcConfiguration:
      description: An external OpenID Connect identity provider whose ID tokens may be exchanged for access tokens.
      properties:
        audience:
          description: Optional within this object. When set, ID tokens must carry this value in aud.
          type: string
        azure_app_id:
          description: Optional within this object. For Azure providers, the application ID the tokens are issued for.
          type: string
        description:
          description: Optional within this object. Free text for administrators.
          type: string
        enable_permissive_configuration:
          default: false
          description: Optional within this object. Applies to the GitHub provider type only. When false, organization is mandatory and only tokens issued for that GitHub organization are accepted; when true, the organization restriction is lifted and any repository on the issuer can obtain a token that a mapping's claims allow. For the other provider types the flag is stored and returned but has no effect. Defaults to false; enabling it widens who can authenticate.
          type: boolean
        issuer_url:
          description: Optional within this object. Issuer that ID tokens must carry in iss. The provider's signing keys are discovered from this URL.
          type: string
        name:
          description: Optional within this object. Unique provider name; token exchanges refer to it as provider_name.
          type: string
        organization:
          description: Optional within this object. GitHub organization the tokens must come from, compared case-sensitively. Mandatory for the GitHub provider type unless enable_permissive_configuration is true. For GitHub Enterprise it is accepted and kept as the token issuer. Rejected for the generic and Azure types.
          type: string
        project_key:
          description: Optional within this object. Project the provider belongs to. Omitted or empty means a global provider.
          type: string
        provider_type:
          description: 'Optional within this object. Kind of identity provider, in the Access vocabulary: `Generic OpenID Connect`, `GitHub`, `GitHub Enterprise` or `Azure`. Generic covers any other OpenID Connect issuer, such as GitLab, Jenkins or Okta. The lower-case short names `generic`, `github`, `github enterprise` and `azure` are also accepted in any case; the server stores and returns the canonical form.'
          type: string
        token_issuer:
          description: Optional within this object. For GitHub providers, the organisation or enterprise that issues the tokens.
          type: string
        use_default_proxy:
          description: Optional within this object. Whether fetching the issuer's signing keys goes through the default proxy.
          type: boolean
      type: object
    OidcIdentityMapping:
      description: A rule that turns a matching ID token into an access token of a given shape.
      properties:
        claims:
          additionalProperties: true
          description: Optional within this object. Claims an ID token must carry, as an object of claim name to expected value. Every listed claim must match.
          type: object
        description:
          description: Optional within this object. Free text for administrators.
          type: string
        name:
          description: Optional within this object. Unique name of the mapping within its provider.
          type: string
        priority:
          description: 'Optional within this object. Evaluation order among a provider''s mappings: lower numbers are tried first, starting at 1, and a mapping without a priority is tried last. When the token exchange names a project_key, mappings scoped to that project are tried before global ones whatever their numbers; within each group, equal priorities go to the mapping created first. The first mapping whose claims match the presented token produces the access token, so the most restrictive mapping should carry priority 1.'
          minimum: 1
          type: integer
        token_spec:
          allOf:
            - $ref: '#/components/schemas/TokenSpec'
          description: Optional within this object. Shape of the access token issued when this mapping matches.
      type: object
    OidcIdentityMappingResponse:
      allOf:
        - $ref: '#/components/schemas/OidcIdentityMapping'
        - properties:
            project_key:
              description: Optional within this object. Project the mapping belongs to, derived from a project role in token_spec.scope. Set by the server.
              type: string
          type: object
      description: A stored identity mapping, with the project it belongs to.
      type: object
    OidcTokenExchangeRequest:
      description: An RFC 8693 token exchange request carrying a provider's ID token.
      properties:
        application_key:
          description: Optional within this object. AppTrust application key. Accepted and ignored.
          type: string
        audience:
          description: Optional within this object. The audience the caller requested the ID token for. Accepted and ignored; the provider's configured audience decides which tokens verify.
          type: string
        branch:
          description: Optional within this object. Source branch of the CI run, recorded with the issued token for auditing.
          type: string
        grant_type:
          description: Optional within this object. Must be urn:ietf:params:oauth:grant-type:token-exchange.
          type: string
        identity_mapping_name:
          description: Optional within this object. Restricts matching to the named mapping instead of trying every mapping of the provider.
          type: string
        include_reference_token:
          description: Optional within this object. Whether the response also carries a reference token for the issued token.
          type: boolean
        job_id:
          description: Optional within this object. Identifier of the CI job, recorded with the issued token for auditing.
