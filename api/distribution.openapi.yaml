            - RBV2
            - RBV2_ATW
          type: string
        status:
          description: Optional within this object. The non-final state it is stuck in.
          enum:
            - STORING_IN_PROGRESS
            - XRAY_SCAN_IN_PROGRESS
            - QUEUED
            - IN_PROGRESS
            - VALIDATE
            - CLOSE_IN_PROGRESS
            - ABORT_IN_PROGRESS
          type: string
      type: object
    SupportBundleCreateRequest:
