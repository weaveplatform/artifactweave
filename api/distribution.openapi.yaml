    ReleaseBundleV1Version:
      description: A release bundle v1 version, as create, sign, list and get return it. state and status both carry the version state.
      properties:
        archived:
          description: Optional within this object. Whether the version is archived. Always false.
          type: boolean
        artifacts:
          description: Optional within this object. The artifacts the version pins.
          items:
            description: One artifact pinned by the version.
            properties:
              checksum:
                description: Optional within this object. SHA-256 of the artifact. A receiving instance rejects content whose digest differs.
                type: string
              props:
                description: Optional within this object. Properties recorded with the artifact, including those added by the query.
                items:
                  description: One property.
                  properties:
                    key:
                      description: Optional within this object. Property key.
                      type: string
                    values:
                      description: Optional within this object. Property values.
                      items:
                        description: One value.
                        type: string
                      type: array
                  type: object
                type: array
              repo_path:
                description: Optional within this object. <repo>/<path> of the artifact on this instance; the same value as source_repo_path.
                type: string
              source_repo_path:
                description: Optional within this object. <repo>/<path> of the artifact on this instance.
                type: string
              target_repo_path:
                description: Optional within this object. <repo>/<path> the artifact is stored under on a receiving instance, after the query's mappings.
                type: string
              xray_scan_info:
                description: Optional within this object. Scan block state of the artifact; blocked is always false.
                properties:
                  blocked:
                    description: Optional within this object. Whether a scan policy blocks the artifact.
                    type: boolean
                  blocked_reason:
                    description: Optional within this object. Why it is blocked; null when it is not.
                    nullable: true
                    type: string
                type: object
            type: object
          type: array
        created:
          description: Optional within this object. When the version was created, RFC 3339.
          format: date-time
          type: string
        created_by:
          description: Optional within this object. User who created the version.
          type: string
        description:
          description: Optional within this object. Free text describing the version.
          type: string
        distributed_by:
          description: Optional within this object. User who last distributed the version, when it has been distributed.
          type: string
        name:
          description: Required within this object. Name of the bundle.
          type: string
        release_notes:
          description: Optional within this object. Release notes kept with the version.
          properties:
            content:
              description: Required within this object. The notes themselves.
              type: string
            syntax:
              default: plain_text
              description: Optional within this object. Markup of content. Defaults to plain_text.
              enum:
                - markdown
                - asciidoc
                - plain_text
              type: string
          required:
            - content
          type: object
        state:
          description: Required within this object. OPEN until the version is signed, then SIGNED; a SIGNED version is immutable and can be distributed or exported.
          enum:
            - OPEN
            - SIGNED
          type: string
        status:
          description: Optional within this object. The version state; always the same value as state.
          type: string
          x-unverified: true
        version:
          description: Required within this object. Version within the name.
          type: string
      required:
        - name
        - version
        - state
      type: object
    StuckDistribution:
      description: A distribution stuck in a non-final state.
      properties:
        bundleName:
          description: Optional within this object. Name of the release bundle.
          type: string
        bundleVersion:
          description: Optional within this object. Version of the release bundle.
          type: string
        distributionFriendlyId:
          description: Optional within this object. Short sequential id of the tracker.
          format: int64
