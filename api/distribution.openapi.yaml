# Generated by `make bundle` from api/src/distribution/; edit the fragments, not this file.
openapi: 3.0.3
info:
  title: Distribution REST API
  version: 0.1.0
  description: >-
    The release bundle distribution surface: bundles v1, distribution rules and jobs, signing keys and edge targets, served under /distribution.
servers:
  - url: /distribution
    description: The distribution service prefix on the single listener.
tags:
  - name: handwritten
    description: Marker tag. Operations with this tag are implemented by hand and excluded from generation.
paths:
  /api/release/import:
    post:
      description: Imports an archive produced by the export operation, typically on an air-gapped instance. The archive must already be in the instance's release bundle import directory. The signature is verified against this instance's trusted keys (so the signing key's public part must have been propagated or added first), every artifact checksum is verified, the artifacts are deployed to the repositories the manifest names, and the version is recorded. With `dry_run` all checks run and nothing is written.
      operationId: importReleaseBundleV1Version
      parameters:
        - description: Required query parameter. Name of the exported zip, which must already be in the instance's release bundle import directory.
          in: query
          name: file_name
          required: true
          schema:
            type: string
        - description: Optional query parameter. When true every check runs and nothing is imported. Defaults to false.
          in: query
          name: dry_run
          required: false
          schema:
            default: false
            type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Summary of the import.
                properties:
                  message:
                    description: Optional within this object. What was imported, or validated in a dry run.
                    type: string
                type: object
          description: Imported, or validated in a dry run.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The file is missing or unreadable, the signature does not verify, or a checksum does not match.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Importing needs an administrator.
      summary: Import an exported release bundle v1 archive
      tags:
        - release-bundles
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/importreleasebundlev1version.md
  /api/v1/distribution/edge_nodes:
    get:
      description: 'Lists the edges this instance can distribute to: the instances paired with it in the edge role, with the name and service id each declared at pairing.'
      operationId: getDistributionEdgeNodes
      parameters:
        - description: Optional query parameter. Maximum number of edges to return. Omitted returns all.
          in: query
          name: limit
          schema:
            type: integer
        - description: Optional query parameter. When true the list also contains this instance as the source. Defaults to false.
          in: query
          name: include_source_artifactory
          schema:
            default: false
            type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgeNodesInfo'
          description: The edge peers.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
      summary: List edge nodes
      tags:
        - distribution
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/getdistributionedgenodes.md
  /api/v1/distribution/{release_bundle_name}/{release_bundle_version}:
    post:
      description: 'Sends a signed version to the edges the distribution rules select and returns a tracker. The transfer runs asynchronously over the peer protocol: each edge receives the signed manifest and the artifacts it does not already hold, verifies the signature against its trusted keys and every checksum, and only then makes the version visible. Edges must be instances paired in the edge role. With `dry_run` the selected edges are returned and nothing is sent.'
      operationId: distributeReleaseBundleV1Version
      parameters:
        - $ref: '#/components/parameters/releaseBundleNamePath'
        - $ref: '#/components/parameters/releaseBundleVersionPath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DistributionRequest'
        description: Which edges to distribute to.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistributionResponse'
          description: 'Dry run: the edges that would be targeted.'
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistributionResponse'
          description: Distribution started; poll the tracker named by `id`.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller has no destination permission covering one of the selected edges.
      summary: Distribute a release bundle v1 version
      tags:
        - distribution
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/distributereleasebundlev1version.md
  /api/v1/distribution/{release_bundle_name}/{release_bundle_version}/abort:
    put:
      description: 'Stops the in-progress distribution of the version: transfers not yet finished are cancelled and the affected edges discard what they had partly received. Edges that already completed keep the version.'
      operationId: abortReleaseBundleV1Distribution
      parameters:
        - $ref: '#/components/parameters/releaseBundleNamePath'
        - $ref: '#/components/parameters/releaseBundleVersionPath'
      responses:
        '202':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PlatformServiceInstance'
                type: array
          description: Abort signalled; the body lists the edges told to stop.
        '204':
          description: Nothing was in progress.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller lacks the permission this operation needs. Distribution administration needs an administrator; distributing and deleting need a destination permission covering every selected edge.
      summary: Abort a release bundle v1 distribution
      tags:
        - distribution
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/abortreleasebundlev1distribution.md
  /api/v1/distribution/{release_bundle_name}/{release_bundle_version}/delete:
    post:
      description: Removes a distributed version from the edges the rules select. Each edge deletes the version and the artifacts that no other version on that edge still needs. With `on_success=delete` the version is also deleted here once every selected edge has confirmed. With `dry_run` the selected edges are returned and nothing changes.
      operationId: deleteReleaseBundleV1VersionFromDistributionEdges
      parameters:
        - $ref: '#/components/parameters/releaseBundleNamePath'
        - $ref: '#/components/parameters/releaseBundleVersionPath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteReleaseBundleRequest'
        description: Which edges to delete from.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistributionResponse'
          description: 'Dry run: the edges that would be affected.'
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistributionResponse'
          description: Deletion started; poll the tracker named by `id`.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller has no destination permission with `delete` covering one of the selected edges.
      summary: Delete a release bundle v1 version from edges
      tags:
        - distribution
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/deletereleasebundlev1versionfromdistributionedges.md
  /api/v1/dynamic/distribute:
    post:
      description: Creates a release bundle version from the spec with a generated name and version, signs it with the default GPG key and distributes it to the edges the rules select, all in one request. The rules and edge requirements are those of the ordinary distribute operation.
      operationId: distributeDynamicReleaseBundleV1
      parameters:
        - description: Optional header parameter. Passphrase protecting the signing key's private part. Needed only when the key has one; never logged or stored.
          in: header
          name: X-GPG-PASSPHRASE
          schema:
            type: string
          x-secret: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DynamicDistributionRequest'
        description: What to bundle and where to send it.
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicDistributionResponse'
          description: The version was created and signed and its distribution started.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The spec or rules are invalid, or signing failed.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller lacks the permission this operation needs. Distribution administration needs an administrator; distributing and deleting need a destination permission covering every selected edge.
      summary: Create, sign and distribute a release bundle in one call
      tags:
        - distribution
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/distributedynamicreleasebundlev1.md
  /api/v1/export/release_bundle/{release_bundle_name}/{release_bundle_version}:
    delete:
      description: Deletes the exported zip of the version from the export directory. The version itself is untouched.
      operationId: deleteExportedReleaseBundleV1File
      parameters:
        - $ref: '#/components/parameters/releaseBundleNamePath'
        - $ref: '#/components/parameters/releaseBundleVersionPath'
      responses:
        '200':
          description: Deleted, or there was no archive to delete.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
      summary: Delete an exported release bundle archive
      tags:
        - release-bundles
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/deleteexportedreleasebundlev1file.md
    post:
      description: Starts an asynchronous export of a signed version to one zip archive holding the signed manifest, its signature and every artifact, for carrying to an instance with no network path to this one. Poll the status operation; the archive is written to the instance's export directory.
      operationId: exportReleaseBundleV1Version
      parameters:
        - $ref: '#/components/parameters/releaseBundleNamePath'
        - $ref: '#/components/parameters/releaseBundleVersionPath'
        - description: Optional header parameter. Passphrase protecting the signing key's private part. Needed only when the key has one; never logged or stored.
          in: header
          name: X-GPG-PASSPHRASE
          schema:
            type: string
          x-secret: true
      responses:
        '202':
          description: Export started.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The version is not signed, or an export of it is already running.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
      summary: Export a release bundle v1 version for air-gapped transfer
      tags:
        - release-bundles
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/exportreleasebundlev1version.md
  /api/v1/export/release_bundle/{release_bundle_name}/{release_bundle_version}/status:
    get:
      description: Reports how far the export of a version has got.
      operationId: getExportedReleaseBundleV1Status
      parameters:
        - $ref: '#/components/parameters/releaseBundleNamePath'
        - $ref: '#/components/parameters/releaseBundleVersionPath'
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Export state.
                properties:
                  status:
                    description: Optional within this object. NOT_EXPORTED, IN_PROGRESS, COMPLETED or FAILED.
                    enum:
                      - IN_PROGRESS
                      - NOT_EXPORTED
                      - FAILED
                      - COMPLETED
                    type: string
                type: object
          description: The current export state.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
      summary: Get the export status of a release bundle v1 version
      tags:
        - release-bundles
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/getexportedreleasebundlev1status.md
  /api/v1/keys/pgp:
    get:
      description: Returns the alias and ASCII-armoured public part of the default GPG key, the key that signs release bundles. The private part is never returned.
      operationId: getGpgSigningKey
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GpgKey'
          description: The default key.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
      summary: Get the default GPG signing key
      tags:
        - signing-keys
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/getgpgsigningkey.md
    post:
      description: Adds a GPG key pair and makes it the default signing key. The private key is stored sealed in the instance's keypair store, the same store `/artifactory/api/security/keypair` manages, so a key added here is visible there and the reverse.
      operationId: setGpgSigningKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GpgKeyUpload'
        description: The key pair.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropagationReport'
          description: The key was stored; the report covers propagation, or says it was not requested.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The keys are not ASCII-armoured PGP keys, do not form a pair, or the alias is taken.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
      summary: Add a GPG signing key
      tags:
        - signing-keys
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/setgpgsigningkey.md
  /api/v1/keys/pgp/aliases:
    get:
      description: Lists the aliases of the configured GPG keys.
      operationId: getAllGpgKeyAliases
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/GpgKeyAlias'
                type: array
          description: One entry per key.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
      summary: List GPG key aliases
      tags:
        - signing-keys
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/getallgpgkeyaliases.md
  /api/v1/keys/pgp/propagate:
    post:
      description: Sends one key (`alias`) or every key (`all=true`) to every edge peer, which adds it to the keys it trusts for verifying signatures. Only public parts leave this instance.
      operationId: uploadAndPropagateGpgSigningKeysForDistribution
      parameters:
        - description: Optional query parameter. Alias of the one key to propagate. Ignored when all is true.
          in: query
          name: alias
          schema:
            type: string
        - description: Optional query parameter. When true every configured key is propagated. Defaults to false.
          in: query
          name: all
          schema:
            default: false
            type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropagationReport'
          description: Per-edge outcome.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
      summary: Propagate GPG keys to edges
      tags:
        - signing-keys
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/uploadandpropagategpgsigningkeysfordistribution.md
  /api/v1/keys/pgp/{alias}:
    delete:
      description: Deletes the key pair. Versions already signed with it stay valid on edges that hold its public part; new versions cannot be signed with it.
      operationId: deleteGpgKeyByAlias
      parameters:
        - description: Required path parameter. Alias of the key.
          in: path
          name: alias
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The named resource does not exist.
      summary: Delete a GPG key
      tags:
        - signing-keys
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/deletegpgkeybyalias.md
    get:
      description: Returns the alias and public part of one key.
      operationId: getGpgPublicKeyByAlias
      parameters:
        - description: Required path parameter. Alias of the key.
          in: path
          name: alias
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GpgKey'
          description: The key.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The named resource does not exist.
      summary: Get a GPG key by alias
      tags:
        - signing-keys
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/getgpgpublickeybyalias.md
    put:
      description: Changes the alias of a key; the key material is unchanged.
      operationId: updateGpgKeyAlias
      parameters:
        - description: Required path parameter. Current alias of the key.
          in: path
          name: alias
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              description: The new alias, in alias or new_alias; one must be present.
              properties:
                alias:
                  description: Optional within this object. The new alias; must not be taken.
                  type: string
                new_alias:
                  description: Optional within this object. The new alias; used when alias is absent.
                  type: string
              type: object
        description: The new alias.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GpgKey'
          description: The key under its new alias.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The named resource does not exist.
      summary: Rename a GPG key
      tags:
        - signing-keys
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/updategpgkeyalias.md
  /api/v1/maintenance/distributeByLastDays:
    post:
      description: Redistributes to one edge every release bundle version distributed in a window of days ending on `date`, for example after the edge was rebuilt. The window length runs from 1 to the configured maximum, 7 by default. Administrators only.
      operationId: distributeByLastDays
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DistributeByLastDaysRequest'
        description: The window and the edge.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistributeByLastDaysResult'
          description: The distributions started.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The date or window is invalid, or the edge is unknown.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller lacks the permission this operation needs. Distribution administration needs an administrator; distributing and deleting need a destination permission covering every selected edge.
      summary: Redistribute recent release bundles to an edge
      tags:
        - system
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/distributebylastdays.md
  /api/v1/maintenance/execute/{actionType}:
    post:
      description: Runs a maintenance action using a token from the token operation, sent as the plain-text body. UNLOCK_STUCK releases every stuck distribution so it can be retried or cleaned up; STOP_ALL force-stops every in-progress distribution, ends every non-final tracker and empties the pending work queue. `dryRun` defaults to true and reports what would change without changing it. Administrators only.
      operationId: executeMaintenanceAction
      parameters:
        - description: 'Required path parameter. The maintenance action: UNLOCK_STUCK or STOP_ALL.'
          in: path
          name: actionType
          required: true
          schema:
            enum:
              - STOP_ALL
              - UNLOCK_STUCK
            type: string
        - description: Optional query parameter. When true, the default, the action is simulated and the report shows what would change. Pass false to perform it.
          in: query
          name: dryRun
          required: false
          schema:
            default: true
            type: boolean
      requestBody:
        content:
          text/plain:
            schema:
              type: string
        description: The maintenance token from the token operation, as plain text.
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/UnlockStuckReport'
                  - $ref: '#/components/schemas/ForceStopAllReport'
          description: The action ran (or was simulated); the body reports what it affected.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The token is missing, expired, already used or for another action.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller lacks the permission this operation needs. Distribution administration needs an administrator; distributing and deleting need a destination permission covering every selected edge.
      summary: Run a maintenance action
      tags:
        - system
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/executemaintenanceaction.md
  /api/v1/maintenance/generate_token/{actionType}:
    get:
      description: Issues a single-use token for one maintenance action. The token expires after 3 minutes and must be sent as the body of the execute operation. Administrators only.
      operationId: generateMaintenanceExecutionToken
      parameters:
        - description: 'Required path parameter. The maintenance action: UNLOCK_STUCK or STOP_ALL.'
          in: path
          name: actionType
          required: true
          schema:
            enum:
              - STOP_ALL
              - UNLOCK_STUCK
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                description: A maintenance token.
                properties:
                  token:
                    description: Optional within this object. Single-use token, valid for 3 minutes, to send as the body of the execute operation.
                    type: string
                type: object
          description: The token.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request was malformed or failed validation; the body explains which.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller lacks the permission this operation needs. Distribution administration needs an administrator; distributing and deleting need a destination permission covering every selected edge.
      summary: Get a maintenance token
      tags:
        - system
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/generatemaintenanceexecutiontoken.md
  /api/v1/maintenance/stuck_distributions:
    get:
      description: Lists distributions stuck in a non-final state, for example after an edge disappeared mid-transfer. Unlock them with the UNLOCK_STUCK maintenance action. Administrators only.
      operationId: getStuckDistributions
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/StuckDistribution'
                type: array
          description: The stuck distributions.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller lacks the permission this operation needs. Distribution administration needs an administrator; distributing and deleting need a destination permission covering every selected edge.
      summary: List stuck distributions
      tags:
        - system
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/getstuckdistributions.md
  /api/v1/metrics:
    get:
      description: Returns the release bundle and distribution counters in OpenMetrics text, under `jfds_` metric names. Administrators only.
      operationId: getOpenMetricsForDistribution
      responses:
        '200':
          content:
            text/plain:
              schema:
                type: string
          description: The metrics.
        '401':
          content:
            application/json:
              schema:
