# Generated by `make bundle` from api/src/peer/; edit the fragments, not this file.
openapi: 3.0.3
info:
  title: Peer REST API
  version: '1.0'
  x-artifactweave-extension: true
  description: >-
    The protocol between paired instances, served under `/artifactweave/peer/v1`: pairing, ordered event streams with a pull mode and snapshots, content blobs, federated repository configuration and a signed liveness and version read. Every request carries `Artifactweave-Peer-Protocol`, `Date`, `Signature` and `Signature-Input`, and `Content-Digest` when it has a body: an HTTP Message Signature (RFC 9421) made with the sender's Ed25519 key (RFC 8032) over `@method`, `@target-uri`, `date` and, with a body, `content-digest`, whose `keyid` is the sender's instance id and whose `nonce` is never reused. A request whose key is unknown, whose `created` or `Date` is more than five minutes from the receiver's clock, or whose nonce the receiver has seen within that window answers 401. Every answer to a verified request carries the same headers, signed the same way with the answering instance's key, so the caller verifies it before acting on it. The protocol version is `<major>.<minor>`; this document describes 1.0. A request with another major version answers 400. Minor versions only add operations, fields and event types, and every receiver ignores fields and event types it does not know. Errors use the flat envelope ErrorResponse, a symbolic code with a message.
servers:
  - url: /artifactweave/peer/v1
    description: The peer service prefix on the single listener.
tags:
  - name: handwritten
    description: Marker tag. Operations with this tag are implemented by hand and excluded from generation.
  - name: pairing
    description: Redeeming a pairing token and cancelling a trust.
  - name: streams
    description: Ordered event delivery, by push or by pull, and snapshots for a full sync.
  - name: blobs
    description: Content that events and snapshot entries reference, fetched by SHA-256.
  - name: repositories
    description: Federated repository configuration sent to every member.
  - name: status
    description: The signed liveness and version read behind a peer's status.
paths:
  /blobs/{sha256}:
    get:
      description: >-
        Returns content this instance holds, for a peer applying an event or a snapshot entry that refers to it. Only content that a stream the caller holds a use case for refers to is served.
      operationId: getBlob
      parameters:
        - name: sha256
          in: path
          required: true
          description: Required path parameter. SHA-256 of the content, 64 lowercase hexadecimal digits.
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
        - $ref: '#/components/parameters/PeerProtocol'
        - $ref: '#/components/parameters/PeerDate'
        - $ref: '#/components/parameters/PeerSignature'
        - $ref: '#/components/parameters/PeerSignatureInput'
      responses:
        '200':
          description: >-
            The content, whose SHA-256 is the requested one; the signed answer's `Content-Digest` covers it and `Content-Length` gives its size.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: sha256 is not 64 lowercase hexadecimal digits, or the protocol major version is not this instance's.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/PeerUnauthorized'
        '404':
          description: >-
            This instance does not hold the content, or no stream the caller holds a use case for refers to it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/PeerInternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      summary: Fetch a blob
      tags:
        - blobs
      x-idempotency: safe
      x-cost: ordinary
  /pair:
    post:
      description: >-
        Redeems a pairing token's nonce. The request is signed with the key in public_key, which the receiver has not seen before, so the signature proves the caller holds that key. The receiver records the caller as a peer holding the token's use case and answers with its own identity. A repeat of a redeem that succeeded, from the same instance with the same key, answers 200 with the same body until the token expires. Not implemented; answers 501.
      operationId: redeemPairing
      parameters:
        - $ref: '#/components/parameters/PeerProtocol'
        - $ref: '#/components/parameters/PeerDate'
        - $ref: '#/components/parameters/PeerSignature'
        - $ref: '#/components/parameters/PeerSignatureInput'
        - $ref: '#/components/parameters/PeerContentDigest'
      requestBody:
        description: The redeeming instance's identity and the token's nonce.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairRequest'
      responses:
        '200':
          description: The caller is recorded as a peer for the token's use case; the body is this instance's identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairResponse'
        '400':
          description: >-
            The body is malformed, public_key is not 32 bytes of base64, or the protocol major version is not this instance's.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: >-
            The signature is missing, does not verify with public_key, or its `keyid` is not instance_id; or its time or nonce is refused as for any peer request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >-
            The nonce is unknown or expired, or was redeemed by another instance or with another key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/PeerInternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      summary: Redeem a pairing token
      tags:
        - pairing
      x-idempotency: natural
      x-idempotency-natural:
        - body:/nonce
      x-cost: ordinary
    delete:
      description: >-
        Tells this instance that the calling peer cancelled their trust for use_case. This instance drops the use case from its record of the caller; a peer left with no use case is removed with its stream cursors. Not implemented; answers 501.
      operationId: cancelPairing
      parameters:
        - $ref: '#/components/parameters/PeerProtocol'
        - $ref: '#/components/parameters/PeerDate'
        - $ref: '#/components/parameters/PeerSignature'
        - $ref: '#/components/parameters/PeerSignatureInput'
        - name: use_case
          in: query
          required: true
          description: >-
            Required query parameter. The use case to drop, `federated-repo/*` or `federated-repo/r`, percent-encoded.
          schema:
            $ref: '#/components/schemas/UseCase'
      responses:
        '204':
          description: The use case is dropped, or the caller did not hold it.
        '400':
          description: use_case names no use case, or the protocol major version is not this instance's.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/PeerUnauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/PeerInternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      summary: Cancel a trust
      tags:
        - pairing
      x-idempotency: natural
      x-idempotency-natural:
        - query:use_case
        - header:Signature-Input
      x-cost: ordinary
  /repositories/{repoKey}:
    put:
      description: >-
        Creates or updates this instance's copy of a federated repository the caller is a member of. The configuration is validated against this instance's own peers before it is stored, and nothing is stored when it is refused. Not implemented; answers 501.
      operationId: putRepositoryConfiguration
      parameters:
        - name: repoKey
          in: path
          required: true
          description: Required path parameter. The repository key on this instance, as this instance's member URL names it.
          schema:
            type: string
        - $ref: '#/components/parameters/PeerProtocol'
        - $ref: '#/components/parameters/PeerDate'
        - $ref: '#/components/parameters/PeerSignature'
        - $ref: '#/components/parameters/PeerSignatureInput'
        - $ref: '#/components/parameters/PeerContentDigest'
      requestBody:
        description: The configuration.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepositoryConfiguration'
      responses:
        '204':
          description: This instance's copy is created or updated.
        '400':
          description: >-
            The body is malformed, the configuration is not valid here (including a member whose base URL is no peer of this instance), or the protocol major version is not this instance's; details lists the refused fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/PeerUnauthorized'
        '403':
          description: >-
            The caller holds no federated repository use case with this instance, or this instance issued it only `federated-repo/r`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A repository with this key exists here and is not a federated repository of the same package type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/PeerInternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      summary: Send a federated repository's configuration
      tags:
        - repositories
      x-idempotency: natural
      x-idempotency-natural:
        - path:repoKey
      x-cost: ordinary
  /status:
    get:
      description: >-
        Answers a signed liveness and version read. A peer that answers is online for the use cases it lists; a peer whose answer does not verify is unauthorized. Not implemented; answers 501.
      operationId: getPeerStatus
      parameters:
        - $ref: '#/components/parameters/PeerProtocol'
        - $ref: '#/components/parameters/PeerDate'
        - $ref: '#/components/parameters/PeerSignature'
        - $ref: '#/components/parameters/PeerSignatureInput'
      responses:
        '200':
          description: This instance's identity, version and clock.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeerStatus'
        '400':
          description: The protocol major version is not this instance's.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/PeerUnauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/PeerInternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      summary: Read a peer's liveness and version
      tags:
        - status
      x-idempotency: safe
      x-cost: ordinary
  /streams/{stream}/events:
    post:
      description: >-
        Pushes a batch of the sender's events. This instance applies them strictly in sequence and records the highest applied sequence from the origin in the same transaction as each applied change, so a batch that is retried after it was applied changes nothing. A content event whose blob this instance does not hold is applied after the blob is fetched from the origin; when the fetch fails, the event is still applied, the content is recorded as a failed binary and fetched again with back-off, and the item appears once it arrives, unless a later event has deleted or replaced it. While this instance resynchronises the stream from the caller from a snapshot, it applies the caller's events on it only through that full sync and answers a batch 503 with Retry-After; a batch that starts past the expected sequence answers 409 and makes this instance ask the caller whether the events in between are pruned, starting a full sync when they are.
      operationId: pushEvents
      parameters:
        - $ref: '#/components/parameters/Stream'
        - $ref: '#/components/parameters/PeerProtocol'
        - $ref: '#/components/parameters/PeerDate'
        - $ref: '#/components/parameters/PeerSignature'
        - $ref: '#/components/parameters/PeerSignatureInput'
        - $ref: '#/components/parameters/PeerContentDigest'
      requestBody:
        description: The batch.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventBatch'
      responses:
        '200':
          description: The batch is applied; the body gives the highest applied sequence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAck'
        '400':
          description: >-
            The body is malformed, its sequences are not consecutive, or the protocol major version is not this instance's.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/PeerUnauthorized'
        '403':
          description: >-
            This instance accepts no events from the caller on this stream: the caller does not hold the stream's use case, this instance issued it only `federated-repo/r`, or origin is not the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: This instance does not exchange the stream with the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            from_seq is not the sequence this instance expects next, including a batch already applied; expected_seq gives it, and the sender resumes from there.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/PeerInternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      summary: Push events
      tags:
        - streams
      x-idempotency: natural
      x-idempotency-natural:
        - path:stream
        - body:/origin
        - body:/from_seq
      x-cost: ordinary
    get:
      description: >-
        Reads this instance's events on the stream after a position, for a peer that cannot be pushed to. The after value also acknowledges: this instance records it as the caller's acknowledged position on the stream, which never moves backwards.
      operationId: pullEvents
      parameters:
        - $ref: '#/components/parameters/Stream'
        - $ref: '#/components/parameters/PeerProtocol'
        - $ref: '#/components/parameters/PeerDate'
        - $ref: '#/components/parameters/PeerSignature'
        - $ref: '#/components/parameters/PeerSignatureInput'
        - name: after
          in: query
          required: false
          description: >-
            Optional query parameter. The highest sequence the caller has applied from this instance on the stream; the answer starts at the next one. 0 when absent.
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: The events after the position.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '400':
          description: after or limit is out of range, or the protocol major version is not this instance's.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/PeerUnauthorized'
        '403':
          description: >-
            This instance sends the caller no events on this stream: the caller does not hold the stream's use case, or the caller issued this instance only `federated-repo/r`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: This instance does not exchange the stream with the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: >-
            Events after the position have been pruned; the caller needs a full sync from GET /streams/{stream}/snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/PeerInternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      summary: Pull events
      tags:
        - streams
      x-idempotency: natural
      x-idempotency-natural:
        - path:stream
        - header:Signature-Input
      x-cost: ordinary
      x-pagination: cursor
      x-pagination-parameters:
        position: after
        size: limit
      x-pagination-next: body:/next_after
  /streams/{stream}/snapshot:
    get:
      description: >-
        Lists the current state of every item on this instance's stream, tombstones included, as of one stated sequence, for a peer that has fallen behind the outbox retention window or was asked to resync. The first request, without a cursor, takes the snapshot, replacing the caller's earlier one of the stream; the following pages continue it and stay as they were at its sequence while the stream moves on. Taking a snapshot also stops this instance pushing the stream to the caller until the caller reads the events after the snapshot's sequence with GET /streams/{stream}/events, which acknowledges them. A snapshot not read for an hour is dropped.
      operationId: getSnapshot
      parameters:
        - $ref: '#/components/parameters/Stream'
        - $ref: '#/components/parameters/PeerProtocol'
        - $ref: '#/components/parameters/PeerDate'
        - $ref: '#/components/parameters/PeerSignature'
        - $ref: '#/components/parameters/PeerSignatureInput'
        - name: cursor
          in: query
          required: false
          description: >-
            Optional query parameter. The opaque next_cursor of the previous page; absent to take a new snapshot. A cursor continues only the snapshot, stream and caller it was issued for.
          schema:
            type: string
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: One page of the snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotPage'
        '400':
          description: >-
            The cursor is malformed or belongs to another stream or caller, limit is out of range, or the protocol major version is not this instance's.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/PeerUnauthorized'
        '403':
          description: >-
            This instance sends the caller no events on this stream: the caller does not hold the stream's use case, or the caller issued this instance only `federated-repo/r`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >-
            This instance does not exchange the stream with the caller, or takes no snapshots of the stream's kind.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: The snapshot the cursor continues is no longer available; take a new one without a cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/PeerInternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      summary: Read a stream snapshot
      tags:
        - streams
      x-idempotency: safe
      x-cost: ordinary
      x-pagination: cursor
      x-pagination-parameters:
        position: cursor
        size: limit
      x-pagination-next: body:/next_cursor
components:
  headers:
    LinkNext:
      description: >-
        The next page, as `<target>; rel="next"` (RFC 8288): the path and query the client sent, every parameter kept and only the position changed. Sent only while more items remain, so its absence marks the last page. Declared only by the operations that send it.
      x-artifactweave-extension: true
      schema:
        type: string
    RateLimit:
      description: >-
        The caller's remaining allowance under the policy admission evaluated, in RateLimit draft-11 syntax, for example `"api";r=5999;t=42`: the policy, the requests left and the seconds until its window resets. Also sent on every other response after admission, whatever its status, and on every response under the `recovery` policy, though no other response declares it. Not sent on health probes, on a refusal reached before any allowance was evaluated, or on an authentication 401 or a restriction 403.
      x-artifactweave-extension: true
      schema:
        type: string
    RateLimitPolicy:
      description: >-
        The policy admission evaluated, in RateLimit draft-11 syntax, for example `"api";q=6000;w=60`: the policy name (`api`, `expensive`, `authentication` or `recovery`), its quota and its window in seconds. Sent wherever `RateLimit` is.
      x-artifactweave-extension: true
      schema:
        type: string
    RetryAfter:
      description: >-
        Seconds to wait before retrying, at least 1: the rest of the blocked window for a rate refusal, otherwise 1. Also sent on an operation's own 503 that reports a transient condition; a 503 that reports configuration or a size bound carries none.
      required: true
      x-artifactweave-extension: true
      schema:
        type: integer
        minimum: 1
  parameters:
    IdempotencyKey:
      description: >-
        Optional header parameter. A quoted ASCII key (1-128 letters, digits, dot, underscore, colon or hyphen), for example "8e03978e-40d5-43e8-bc93-6894a57f9324". For 24 hours, a retry with the same key, credential, canonical resource and identical body bytes does not repeat the operation's effect: it answers the original success status, with the body built from the committed result after the current credential and permissions are checked again. Reuse with different bytes, or with a changed parameter that alters the effect, returns 422. A resource deleted since answers 404, one moved out of the request's scope 409. Only a success is kept, so a retry after a failure runs the operation again. Concurrent requests wait up to 30 seconds; 503 with Retry-After means retry the same key within its retention window. An operation that does not declare this parameter answers a key with 400.
      in: header
      name: Idempotency-Key
      x-artifactweave-extension: true
      schema:
        type: string
        minLength: 3
        maxLength: 130
    PageLimit:
      description: >-
        Optional query parameter. The most items one answer holds, 1 to 1000; 100 when absent. A value outside that range answers 400.
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    PeerContentDigest:
      description: >-
        Required header parameter. The SHA-256 digest of the request body (RFC 9530), for example `sha-256=:<base64>:`, covered by the signature. A digest that does not match the body answers 401.
      in: header
      name: Content-Digest
      required: true
      schema:
        type: string
    PeerDate:
      description: >-
        Required header parameter. The time the sender signed the request, as an HTTP date (RFC 9110, section 5.6.7), covered by the signature. More than five minutes from the receiver's clock answers 401.
      in: header
      name: Date
      required: true
      schema:
        type: string
    PeerProtocol:
      description: >-
        Required header parameter. The protocol version the sender speaks, as `<major>.<minor>`, for example `1.0`. A major version other than 1 answers 400 and is recorded on the sender's peer record. The answer carries the receiver's version in the same header.
      in: header
      name: Artifactweave-Peer-Protocol
      required: true
      schema:
        type: string
        pattern: '^[0-9]+\.[0-9]+$'
    PeerSignature:
      description: >-
        Required header parameter. The Ed25519 signature (RFC 9421) named in `Signature-Input`, for example `sig1=:<base64>:`. One that does not verify with the key recorded for its `keyid` answers 401.
      in: header
      name: Signature
      required: true
      schema:
        type: string
    PeerSignatureInput:
      description: >-
        Required header parameter. The signature's covered components and parameters (RFC 9421), for example `sig1=("@method" "@target-uri" "date" "content-digest");created=1700000000;keyid="jfrt@<uuid>";alg="ed25519";nonce="<random>"`. `keyid` is the sender's instance id; `content-digest` is covered exactly when the request has a body. A `nonce` the receiver has accepted within the last five minutes answers 401.
      in: header
      name: Signature-Input
      required: true
      schema:
        type: string
    Stream:
      description: >-
        Required path parameter. The stream's name on the instance whose outbox it is: `repo:<repoKey>` for a federated repository, `access` for Access Federation, `distribution:<trackerId>:<instanceId>` for one distribution job. A stream this instance does not exchange with the caller answers 404.
      in: path
      name: stream
      required: true
      schema:
        type: string
  responses:
    PeerInternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PeerUnauthorized:
      description: >-
        The signature is missing or does not verify, its key belongs to no paired peer, its time is more than five minutes from this instance's clock, its nonce was already used, or `Content-Digest` does not match the body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: >-
        A dependency of the request is briefly unavailable: admission or restriction storage, or, for a retry with an `Idempotency-Key`, the first request still running when the retry's wait budget ran out. Wait for `Retry-After` before retrying. `RateLimit` and `RateLimit-Policy` are present when the answer follows admission, as a keyed retry's does.
      x-artifactweave-extension: true
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: >-
        A request limit refused the request: a rate allowance or a concurrency permit. Wait for `Retry-After` before retrying. `RateLimit` and `RateLimit-Policy` report the allowance; they are absent when the process's concurrency permits refused the request before any allowance was evaluated.
      x-artifactweave-extension: true
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    BlobReference:
      type: object
      description: The content an event or a snapshot entry refers to, fetched with GET /blobs/{sha256}.
      required: [sha256, size]
      properties:
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Required within this object. SHA-256 of the content, 64 lowercase hexadecimal digits.
        size:
          type: integer
          format: int64
          minimum: 0
          description: Required within this object. Size of the content in bytes.
    ErrorResponse:
      type: object
      description: >-
        The flat error envelope of every peer answer other than a success. Version 1.0; a later minor version may add fields, which callers ignore.
      required: [code, message]
      properties:
        code:
          type: string
          description: >-
            Required within this object. A symbolic code naming the status, such as BAD_REQUEST, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, GONE or NOT_IMPLEMENTED.
        message:
          type: string
          description: Required within this object. Human readable explanation.
        details:
          type: array
          description: Optional within this object. Field-level details, one string each, when a request is invalid.
          items:
            type: string
            description: One detail.
        expected_seq:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Optional within this object. Present only on the 409 of an event batch: the sequence the next batch on that stream must start at, one more than the highest sequence applied from the origin. The sender resumes from it.
    Event:
      type: object
      description: >-
        One outbox entry. Version 1.0; a later minor version may add fields, which the receiver ignores.
      required: [seq, hlc, type]
      properties:
        seq:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Required within this object. The entry's sequence on the stream, assigned when the change committed on the origin. Sequences in one batch or page are consecutive.
        hlc:
          type: string
          pattern: '^[0-9a-f]{16}\.[0-9a-f]{8}$'
          description: >-
            Required within this object. The change's hybrid logical clock time: 16 lowercase hexadecimal digits of Unix milliseconds, a dot and 8 of logical counter. For the same item the later time wins and the higher origin instance id breaks a tie.
        type:
          type: string
          description: >-
            Required within this object. The event type, which names the payload's form. A receiver skips a type it does not subscribe to, and the skipped event still counts as applied.
        payload:
          type: object
          additionalProperties: true
          description: Optional within this object. The change itself, in the form the event type defines.
          # The payload is carried as the origin wrote it: decoding it into a
          # map would turn an integer beyond 2^53 into a float and change it.
          x-go-type: json.RawMessage
        blob:
          allOf:
            - $ref: '#/components/schemas/BlobReference'
          description: >-
            Optional within this object. Present on content events: the content the change refers to. A receiver that does not hold it fetches it with GET /blobs/{sha256} from the origin before applying the event; a failed fetch is recorded and retried, and the stream moves on.
    EventAck:
      type: object
      description: >-
        What the receiver holds after a batch. Version 1.0; a later minor version may add fields, which the sender ignores.
      required: [origin, stream, applied_seq]
      properties:
        origin:
          type: string
          description: Required within this object. The batch's origin.
        stream:
          type: string
          description: Required within this object. The stream the batch was pushed to.
        applied_seq:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Required within this object. The highest sequence from origin on the stream that this instance has applied and committed. The sender stores it as this peer's acknowledged position and sends from the next sequence.
    EventBatch:
      type: object
      description: >-
        Events pushed from the sender's outbox. Version 1.0; a later minor version may add fields, which the receiver ignores.
      required: [origin, from_seq, events]
      properties:
        origin:
          type: string
          description: >-
            Required within this object. The `jfrt@<uuid>` id of the instance whose outbox holds the events. It is the calling instance.
        from_seq:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Required within this object. The sequence of the first event. It must be the sequence this instance expects next from origin on the stream: one more than the highest applied, or 1 on a stream it has not applied from.
        events:
          type: array
          minItems: 1
          maxItems: 1000
          description: >-
            Required within this object. The events, in sequence from from_seq without a gap, at most 1000.
          items:
            $ref: '#/components/schemas/Event'
    EventPage:
      type: object
      description: >-
        Events read from this instance's outbox by a peer that pulls. Version 1.0; a later minor version may add fields, which the caller ignores.
      required: [origin, stream, events]
      properties:
        origin:
          type: string
          description: Required within this object. This instance's `jfrt@<uuid>` id, the origin of every event.
        stream:
          type: string
          description: Required within this object. The stream read.
        events:
          type: array
          description: >-
            Required within this object. The events after the requested position, in sequence, at most limit; empty when the caller is up to date.
          items:
            $ref: '#/components/schemas/Event'
        next_after:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Optional within this object. Present only when more events remain: the after value of the next request, the last event's seq.
    PairRequest:
      type: object
      description: >-
        The redeeming instance's identity, sent to the instance that issued the pairing token. Version 1.0; a later minor version may add fields, which the receiver ignores.
      required: [nonce, instance_id, base_url, public_key, protocol_version]
      properties:
        nonce:
          type: string
          description: >-
            Required within this object. The nonce the pairing token carries, exactly as the token encodes it. It names the use case the token was issued for and is redeemed once, within 300 seconds of issue.
        instance_id:
          type: string
          description: >-
            Required within this object. The redeeming instance's id, the `jfrt@<uuid>` value its `/artifactory/api/system/service_id` serves. It is the `keyid` of this request's signature and of every later request the redeeming instance signs.
        base_url:
          type: string
          description: >-
            Required within this object. The redeeming instance's base URL without `/artifactory`, for example `https://eu.example.com`. The issuing instance sends its own peer requests under `<base_url>/artifactweave/peer/v1`.
        public_key:
          type: string
          description: >-
            Required within this object. The redeeming instance's Ed25519 public key (RFC 8032), the 32 key bytes in padded standard base64 (RFC 4648, section 4). This request's signature verifies with it, and every later request from this instance must.
        protocol_version:
          type: string
          pattern: '^[0-9]+\.[0-9]+$'
          description: >-
            Required within this object. The protocol version the redeeming instance speaks, as `<major>.<minor>`. A major version other than the issuer's answers 400.
    PairResponse:
      type: object
      description: >-
        The issuing instance's identity, which the redeeming instance checks against the key fingerprint the token carries before it records the issuer. Version 1.0; a later minor version may add fields, which the caller ignores.
      required: [instance_id, base_url, public_key, protocol_version, use_case]
      properties:
        instance_id:
          type: string
          description: Required within this object. The issuing instance's `jfrt@<uuid>` id, the `keyid` of its signatures.
        base_url:
          type: string
          description: >-
            Required within this object. The issuing instance's base URL without `/artifactory`, the one the pairing token carries.
        public_key:
          type: string
          description: >-
            Required within this object. The issuing instance's Ed25519 public key, the 32 key bytes in padded standard base64. Its SHA-256 matches the fingerprint the pairing token carries.
        protocol_version:
          type: string
          pattern: '^[0-9]+\.[0-9]+$'
          description: Required within this object. The protocol version the issuing instance speaks, as `<major>.<minor>`.
        use_case:
          allOf:
            - $ref: '#/components/schemas/UseCase'
          description: Required within this object. The use case the token was issued for, which both instances now hold.
    PeerStatus:
      type: object
      description: >-
        This instance as the calling peer sees it. Version 1.0; a later minor version may add fields, which the caller ignores.
      required: [instance_id, protocol_version, version, time, use_cases]
      properties:
        instance_id:
          type: string
          description: Required within this object. This instance's `jfrt@<uuid>` id.
        protocol_version:
          type: string
          pattern: '^[0-9]+\.[0-9]+$'
          description: Required within this object. The protocol version this instance speaks, as `<major>.<minor>`.
        version:
          type: string
          description: Required within this object. This instance's release version.
        time:
          type: string
          format: date-time
          description: >-
            Required within this object. RFC 3339 time on this instance's clock when it answered, for the caller to measure clock skew.
        use_cases:
          type: array
          description: Required within this object. The use cases this instance holds with the caller.
          items:
            $ref: '#/components/schemas/UseCase'
    RepositoryConfiguration:
      type: object
      description: >-
        A federated repository's configuration, sent to each member when the repository is created, when its members change and on a configuration sync. Version 1.0; a later minor version may add fields, which the receiver ignores.
      required: [stream, configuration]
      properties:
        stream:
          type: string
          description: >-
            Required within this object. The sender's stream for the repository, `repo:<repoKey>` with the sender's key, on which the repository's events arrive.
        configuration:
          type: object
          additionalProperties: true
          description: >-
            Required within this object. The repository in the form `GET /artifactory/api/repositories/{repoKey}` answers, with `rclass` `federated` and `members` listing every member, this instance's included. Its `key` is the key in the path.
    SnapshotEntry:
      type: object
      description: >-
        The current state of one item on the stream. Version 1.0; a later minor version may add fields, which the receiver ignores.
      required: [key, hlc, origin, deleted]
      properties:
        key:
          type: string
          description: >-
            Required within this object. The item's identity on the stream; on a repository stream, its path from the repository root.
        hlc:
          type: string
          pattern: '^[0-9a-f]{16}\.[0-9a-f]{8}$'
          description: >-
            Required within this object. The hybrid logical clock time of the change that produced this state, in the form Event.hlc takes.
        origin:
          type: string
          description: Required within this object. The `jfrt@<uuid>` id of the instance that made that change.
        deleted:
          type: boolean
          description: >-
            Required within this object. True for a tombstone: the item was deleted, and a change with an earlier time must not restore it. Tombstones are kept for the outbox retention window.
        payload:
          type: object
          additionalProperties: true
          description: >-
            Optional within this object. The item's state in the stream kind's form; on a repository stream, its properties and its created and modified times. Absent on a tombstone.
          # Carried as the origin wrote it, as Event.payload is.
          x-go-type: json.RawMessage
        blob:
          allOf:
            - $ref: '#/components/schemas/BlobReference'
          description: Optional within this object. The item's content, absent on a tombstone and on a folder.
    SnapshotPage:
      type: object
      description: >-
        One page of a snapshot of a stream's current state. Version 1.0; a later minor version may add fields, which the caller ignores.
      required: [origin, stream, sequence, entries]
      properties:
        origin:
          type: string
          description: Required within this object. This instance's `jfrt@<uuid>` id.
        stream:
          type: string
          description: Required within this object. The stream the snapshot covers.
        sequence:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Required within this object. The stream sequence the snapshot was taken at, the same on every page of one snapshot. Having applied the snapshot, the caller resumes the stream after this sequence.
        entries:
          type: array
          description: Required within this object. Items in the order of key, at most limit.
          items:
            $ref: '#/components/schemas/SnapshotEntry'
        next_cursor:
          type: string
          description: >-
            Optional within this object. Present only when more entries remain: the cursor of the next request.
    UseCase:
      type: string
      description: >-
        A use case a pair of instances holds: `federated-repo/*` for two-way federated repository trust and `federated-repo/r` for receiving-only trust, where the issuing instance sends events to the redeeming instance and accepts none from it. Later minor versions add use cases.
      enum:
        - federated-repo/*
        - federated-repo/r
