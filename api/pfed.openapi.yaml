components:
  headers:
    LinkNext:
      description: >-
        The next page, as `<target>; rel="next"` (RFC 8288): the path and query the client sent, every parameter kept and only the position changed. Sent only while more items remain, so its absence marks the last page. Declared only by the operations that send it.
      x-artifactweave-extension: true
      schema:
        type: string
    RateLimit:
      description: >-
        The caller's remaining allowance under the policy admission evaluated, in RateLimit draft-11 syntax, for example `"api";r=5999;t=42`: the policy, the requests left and the seconds until its window resets. Also sent on every other response after admission, whatever its status, and on every response under the `recovery` policy, though no other response declares it. Not sent on health probes, on a refusal reached before any allowance was evaluated, or on an authentication 401 or a restriction 403.
      x-artifactweave-extension: true
      schema:
        type: string
    RateLimitPolicy:
      description: >-
        The policy admission evaluated, in RateLimit draft-11 syntax, for example `"api";q=6000;w=60`: the policy name (`api`, `expensive`, `authentication` or `recovery`), its quota and its window in seconds. Sent wherever `RateLimit` is.
      x-artifactweave-extension: true
      schema:
        type: string
    RetryAfter:
      description: >-
        Seconds to wait before retrying, at least 1: the rest of the blocked window for a rate refusal, otherwise 1. Also sent on an operation's own 503 that reports a transient condition; a 503 that reports configuration or a size bound carries none.
      required: true
      x-artifactweave-extension: true
      schema:
        type: integer
        minimum: 1
  parameters:
    FederationId:
      description: Required path parameter. Id of the federation, as returned at creation.
      in: path
      name: id
      required: true
      schema:
        type: string
    IdempotencyKey:
      description: >-
        Optional header parameter. A quoted ASCII key (1-128 letters, digits, dot, underscore, colon or hyphen), for example "8e03978e-40d5-43e8-bc93-6894a57f9324". For 24 hours, retries with the same credential, canonical resource and identical body bytes return 204 without appending again. Reuse with different bytes returns 422. Replays remain bound to the original run and require current permission. Concurrent requests wait up to 30 seconds; 503 with Retry-After means retry the same key within its retention window.
      in: header
      name: Idempotency-Key
      x-artifactweave-extension: true
      schema:
        type: string
        minLength: 3
        maxLength: 130
    JpdId:
      description: Required path parameter. Id of the follower JPD, as given when it was added.
      in: path
      name: id
      required: true
      schema:
        type: string
  responses:
    ServiceUnavailable:
      description: >-
        A dependency of the request is briefly unavailable: admission or restriction storage, or, for a retry with an `Idempotency-Key`, the first request still running when the retry's wait budget ran out. Wait for `Retry-After` before retrying. `RateLimit` and `RateLimit-Policy` are present when the answer follows admission, as a keyed retry's does.
      x-artifactweave-extension: true
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: >-
        A request limit refused the request: a rate allowance or a concurrency permit. Wait for `Retry-After` before retrying. `RateLimit` and `RateLimit-Policy` report the allowance; they are absent when the process's concurrency permits refused the request before any allowance was evaluated.
      x-artifactweave-extension: true
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ConnectionGroup:
      description: The follower instances a federation sends to.
      properties:
        target_jpd_ids:
          description: Required within this object. Ids of follower JPDs, each previously added with POST /pfed/api/v1/jpd. Duplicates are rejected.
          items:
            description: A follower JPD id.
            type: string
          type: array
      required:
        - target_jpd_ids
      type: object
    CreateFederationRequest:
      description: A new platform federation on this (controller) instance. Only name, description and the follower ids are free choices; the connection group key and the entity list are fixed by the protocol.
      properties:
        connection_groups:
          additionalProperties:
            $ref: '#/components/schemas/ConnectionGroup'
          description: Required within this object. Must contain exactly one key, source-jpd, mapping to the connection group that lists the followers. Any other key answers 400.
          type: object
        description:
          description: Optional within this object. Free text describing what the federation is for.
          type: string
        entities:
          description: Required within this object. The entity types to federate. Must list all four types of the EntityConfig type enum, each once. The federation and its membership are recorded, but these types carry no data to synchronise. Identity replication between peers is configured through /access/api/v1/system/federation instead.
          items:
            $ref: '#/components/schemas/EntityConfig'
          type: array
        name:
          description: Required within this object. Unique name of the federation on this instance.
          type: string
      required:
        - name
        - connection_groups
        - entities
      type: object
    CreateJpdRequest:
      description: A follower instance to add to this controller. Obtain pairing_token on the follower with POST /access/api/v1/service_trust/pairing/platform-federation; the token is used once to establish mutual trust and is not stored.
      properties:
        id:
          description: Required within this object. Label for the follower, unique on this controller; referenced from connection groups.
          type: string
        pairing_token:
          description: Required within this object. Write-only. The pairing token issued by the follower for the platform-federation use case. Rejected with 400 when expired, already used or issued for another use case.
          type: string
          writeOnly: true
        url:
          description: Required within this object. Base URL of the follower instance.
          type: string
      required:
        - id
        - url
        - pairing_token
      type: object
    EntityConfig:
      description: One entity type a federation covers.
      properties:
        type:
          description: Required within this object. Entity type identifier in <service>.<entityType> form. These types are recorded but carry no data to synchronise. Identity replication between peers is configured through /access/api/v1/system/federation instead.
          enum:
            - catalog.customLabels
            - xray.curationCondition
            - xray.curationPkgType
            - xray.curationPolicy
          type: string
      required:
        - type
      type: object
    ErrorResponse:
      type: object
      description: The flat error envelope used by /pfed.
      required: [code, message]
      properties:
        code:
          type: integer
          description: Required within this object. The HTTP status code of the response, for example 404.
        message:
          type: string
          description: Required within this object. Human readable explanation.
    FederationDetails:
      description: A stored platform federation.
      properties:
        connection_groups:
          additionalProperties:
            $ref: '#/components/schemas/ConnectionGroup'
          description: Optional within this object. The connection groups keyed by group name; always the single source-jpd group.
          type: object
        description:
          description: Optional within this object. The federation description, empty when none was given.
          type: string
        entities:
          description: Optional within this object. The federated entity types.
          items:
            $ref: '#/components/schemas/EntityConfig'
          type: array
        id:
          description: Optional within this object. Server-owned. Identifier assigned at creation and used in /federations/{id}.
          type: string
        name:
          description: Optional within this object. The federation name.
          type: string
      type: object
    FederationSummary:
      description: A federation as listed.
      properties:
        id:
          description: Optional within this object. Server-owned. The federation id.
          type: string
        name:
          description: Optional within this object. The federation name.
          type: string
      type: object
    JpdResponse:
      description: A follower instance as listed.
      properties:
        id:
          description: Optional within this object. The follower id.
          type: string
        url:
          description: Optional within this object. The follower's base URL.
          type: string
      type: object
    JpdUrlResponse:
      description: A single follower instance.
      properties:
        url:
          description: Optional within this object. The follower's base URL.
          type: string
      type: object
    UpdateJpdRequest:
      description: Replacement URL and a fresh pairing token for an existing follower, used to move a follower or rotate trust. Both fields are required even when only one changes.
      properties:
        pairing_token:
          description: Required within this object. Write-only. A new platform-federation pairing token from the follower; the previous trust keys are replaced once it is accepted.
          type: string
          writeOnly: true
        url:
          description: Required within this object. The follower's base URL.
          type: string
      required:
        - url
        - pairing_token
      type: object
