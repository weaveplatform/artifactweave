# Shared schemas: the error envelope and the system documents.
components:
  schemas:
    AccessVersion:
      type: object
      additionalProperties: false
      required: [name, version]
      properties:
        name:
          type: string
          description: >-
            Required within this object. The compatibility version.
        version:
          type: string
          description: Required within this object. The same value as name.
    ErrorResponse:
      type: object
      description: The Access error envelope used by every /access response.
      required: [errors]
      properties:
        errors:
          type: array
          description: >-
            Required within this object. One entry per error.
          items:
            type: object
            required: [code, message]
            properties:
              code:
                type: string
                description: Required within this object. A symbolic code such as NOT_FOUND.
              message:
                type: string
                description: Required within this object. Human readable explanation.
    ServiceTrustMessage:
      type: object
      description: >-
        The body of a service trust error answer: a single message, as every service trust endpoint answers, not
        the Access error envelope.
      required: [message]
      properties:
        message:
          type: string
          description: >-
            Required within this object. What went wrong, naming the operation first, for example "Error creating
            pairing token." followed by the reason, or "Unknown use case".
