openapi: 3.0.3
info:
  title: artifactweave Access-compatible REST API
  version: 0.1.0
  description: >-
    The identity, token and project surface served under /access. Paths and shapes
    mirror the documented JFrog Access API (docs/research/05 and 07). Authored by
    the artifactweave project; cites JFrog's documentation and copies nothing from it.
servers:
  - url: /access
    description: The Access service prefix on the single artifactweave listener.
tags:
  - name: system
    description: Health and version endpoints that need no authentication.
  - name: handwritten
    description: Marker tag. Operations with this tag are implemented by hand and excluded from generation.
