      - logout_url
      - certificate
      - service_provider_name
      type: object
    ScimGroupListResponse:
      description: A SCIM 2.0 list response of groups (RFC 7644). Not supported by artifactweave.
      properties:
        Resources:
          description: Optional within this object. Groups on this page.
          items:
            properties:
              description:
                description: Optional within this object. Description of the group.
                type: string
              displayName:
                description: Optional within this object. Name of the group.
                type: string
              id:
                description: Optional within this object. SCIM identifier of the group, equal to its name.
                type: string
              members:
                description: Optional within this object. Members of the group as SCIM member references.
                items:
                  type: object
                type: array
              meta:
                description: Optional within this object. SCIM resource metadata.
                nullable: true
                properties:
                  resourceType:
                    description: Optional within this object. SCIM resource type name.
                    type: string
                type: object
              schemas:
                description: Optional within this object. SCIM schema URNs of the resource.
                items:
                  type: string
                type: array
            type: object
          type: array
        itemsPerPage:
          description: Optional within this object. Number of groups on this page.
          type: integer
        schemas:
          description: Optional within this object. SCIM schema URNs of the list response.
          items:
            type: string
          type: array
        startIndex:
          description: Optional within this object. One-based index of the first group on this page.
          type: integer
        totalResults:
          description: Optional within this object. Number of groups that match the filter.
          type: integer
      type: object
    ScimResource:
      additionalProperties: true
      description: A SCIM 2.0 resource or patch document (RFC 7643, RFC 7644), free-form. Not supported by artifactweave.
      type: object
    ScimResourceTypeListResponse:
      description: A SCIM 2.0 list response of resource types. Not supported by artifactweave.
      properties:
        Resources:
          description: Optional within this object. The resource types the endpoint supports, User and Group.
          items:
            type: object
          type: array
        itemsPerPage:
          description: Optional within this object. Number of resource types on this page.
          type: integer
        schemas:
          description: Optional within this object. SCIM schema URNs of the list response.
          items:
            type: string
          type: array
        startIndex:
          description: Optional within this object. One-based index of the first resource type on this page.
          type: integer
        totalResults:
          description: Optional within this object. Number of resource types.
          type: integer
      type: object
    ScimUserListResponse:
      description: A SCIM 2.0 list response of users. Not supported by artifactweave.
      properties:
        Resources:
          description: Optional within this object. Users on this page.
          items:
            properties:
              active:
                description: Optional within this object. Whether the user is enabled.
                type: boolean
              emails:
                description: Optional within this object. Email addresses of the user.
                items:
                  properties:
                    primary:
                      description: Optional within this object. Whether this is the primary address.
                      type: boolean
                    value:
                      description: Optional within this object. The email address.
                      type: string
                  type: object
                type: array
              groups:
                description: Optional within this object. Groups the user belongs to.
                items:
                  properties:
                    value:
                      description: Optional within this object. Name of the group.
                      type: string
                  type: object
                type: array
              id:
                description: Optional within this object. SCIM identifier of the user, equal to the username.
                type: string
              meta:
                description: Optional within this object. SCIM resource metadata.
                properties:
                  resourceType:
                    description: Optional within this object. SCIM resource type name.
                    type: string
                type: object
              schemas:
                description: Optional within this object. SCIM schema URNs of the resource.
                items:
                  type: string
                type: array
              userName:
                description: Optional within this object. Username.
                type: string
            type: object
          type: array
        itemsPerPage:
          description: Optional within this object. Number of users on this page.
          type: integer
        schemas:
          description: Optional within this object. SCIM schema URNs of the list response.
          items:
            type: string
          type: array
        startIndex:
          description: Optional within this object. One-based index of the first user on this page.
          type: integer
        totalResults:
          description: Optional within this object. Number of users that match the filter.
          type: integer
      type: object
    TokenSpec:
      description: The shape of the access token an identity mapping issues.
      properties:
        audience:
          description: Optional within this object. Audience of the issued token. Omitted means every service.
          type: string
        expires_in:
          description: Optional within this object. Lifetime of the issued token in seconds.
          format: int64
          type: integer
        groups_pattern:
          description: Optional within this object. Template that builds group names from the ID token's claims.
            The issued token carries those groups.
          type: string
        scope:
          description: Optional within this object. Scope of the issued token, in the access token scope grammar
            of POST /api/v1/tokens.
          type: string
        self_revocable:
          description: Optional within this object. Whether the issued token may revoke itself.
          type: boolean
        username:
          description: Optional within this object. Username of the issued token's subject. Use username_pattern
            instead to derive it from claims.
          type: string
        username_pattern:
          description: Optional within this object. Template that builds the subject's username from the ID token's
            claims.
          type: string
      type: object
    VaultConfig:
      description: A stored HashiCorp Vault connection. Secrets are never returned.
      properties:
        config:
          allOf:
          - $ref: '#/components/schemas/HashicorpVaultConfig'
          description: Required within this object. Connection settings. Secrets inside are never returned.
        key:
          description: Required within this object. Unique key of the connection, as used in the path and in a keypair's
            vaultKey.
          type: string
        type:
          description: Required within this object. Secret manager kind. Only HashicorpVault exists.
          enum:
          - HashicorpVault
          type: string
      required:
      - key
      - type
      - config
      type: object
    VaultConfigRequest:
      description: A Vault connection to store or test.
      properties:
        config:
          allOf:
          - $ref: '#/components/schemas/HashicorpVaultConfig'
          description: Required within this object. Connection settings.
        key:
          description: Optional within this object. Key of the connection. When present it must equal the vault_key
            path parameter.
          type: string
        type:
          description: Required within this object. Secret manager kind. Only HashicorpVault exists.
          enum:
          - HashicorpVault
          type: string
      required:
      - type
      - config
      type: object
