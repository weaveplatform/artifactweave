          description: The token was issued.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is malformed or no identity mapping matches.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The subject token does not verify against the provider.
      summary: Exchange an ID token for an access token
      tags:
