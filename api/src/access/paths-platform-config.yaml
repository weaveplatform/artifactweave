# Access platform configuration: CA and root certificates, the basic-auth switch,
# password policy and default token lifetime, OIDC providers, identity mappings and
# the token exchange, LDAP connections and group settings (implemented with the
# descriptor and LDAP phase), and HashiCorp Vault connections. SAML, SCIM, Crowd,
# HTTP SSO, cloud log shipping, AWS IAM roles and Access backup files are kept for
# parity and answer 501 (decision 0019, research 10). Facts come from the oracle
# (administration-jfrog-platform-rest-apis and administration-jfrog-platform-aws-iam-api
# families); the prose is ours.
components:
  schemas:
    AwsIamRoleAssignment:
      description: Maps one user to the AWS IAM role their AWS credentials must assume. Not supported by artifactweave.
      properties:
        iam_role:
          description: Required within this object. ARN of the AWS IAM role the user's AWS credentials must assume.
          type: string
        username:
          description: Required within this object. User the role is mapped to.
          type: string
      required:
      - username
      - iam_role
      type: object
    CrowdConfiguration:
      description: Atlassian Crowd integration settings. Not supported by artifactweave (decision 0019).
      properties:
        allow_user_to_access_profile:
          description: Optional within this object. Whether users created through Crowd may open their own profile.
          type: boolean
        application_name:
          description: Optional within this object. Application name registered in Crowd.
          type: string
        auto_user_creation:
          description: Optional within this object. Whether a first login creates a local user.
          type: boolean
        custom_cookie_token_key:
          description: Optional within this object. Name of the single sign-on cookie when it differs from Crowd's
            default.
          type: string
        direct_authentication:
          description: Optional within this object. Whether passwords are checked against Crowd directly rather
            than through single sign-on.
          type: boolean
        enable_integration:
          description: Optional within this object. Whether users are authenticated against Crowd.
          type: boolean
        override_all_groups_upon_login:
          description: Optional within this object. Whether each login replaces the user's group memberships with
            those in Crowd.
          type: boolean
        password:
          description: Optional within this object. Application password registered in Crowd. Never returned.
          type: string
          writeOnly: true
        server_url:
          description: Optional within this object. Base URL of the Crowd server.
          type: string
        session_validation_interval:
          description: Optional within this object. Minutes between re-validations of a Crowd session.
          format: int64
          type: integer
        use_default_proxy:
          description: Optional within this object. Whether calls to Crowd go through the default proxy.
          type: boolean
      type: object
    GroupMappingStrategy:
      description: Default attribute names and filter for one LDAP group mapping strategy, a starting point for
        a group setting.
      properties:
        description:
          description: Optional within this object. Default attribute copied into a group's description.
          type: string
        filter:
          description: Optional within this object. Default filter that selects group entries.
          type: string
        groupKeyMember:
          description: Optional within this object. Default attribute that links groups and members for the strategy.
          type: string
        groupNameAttribute:
          description: Optional within this object. Default attribute that holds a group's name.
          type: string
      type: object
    HashicorpVaultAgentAuth:
      description: Vault authentication delegated to a Vault agent that runs beside the server.
      properties:
        type:
          description: Required within this object. Always Agent.
          enum:
          - Agent
          type: string
      required:
      - type
      type: object
    HashicorpVaultAppRoleAuth:
      description: Vault AppRole authentication.
      properties:
        roleId:
          description: Optional within this object. AppRole role ID.
          type: string
        secretId:
          description: Optional within this object. AppRole secret ID. Never returned.
          type: string
          writeOnly: true
        type:
          description: Required within this object. Always AppRole.
          enum:
          - AppRole
          type: string
      required:
      - type
      type: object
    HashicorpVaultCertificateAuth:
      description: Vault TLS certificate authentication.
      properties:
        clientCertificate:
          description: Optional within this object. PEM client certificate presented to Vault.
          type: string
        clientPrivateKey:
          description: Optional within this object. PEM private key of clientCertificate. Never returned.
          type: string
          writeOnly: true
        type:
          description: Required within this object. Always Certificate.
          enum:
          - Certificate
          type: string
      required:
      - type
      type: object
    HashicorpVaultConfig:
      description: How the server reaches HashiCorp Vault and which secret engines it reads.
      properties:
        auth:
          description: 'Optional within this object. How the server authenticates to Vault, selected by type: AppRole,
            Certificate or Agent.'
          discriminator:
            mapping:
              Agent: '#/components/schemas/HashicorpVaultAgentAuth'
              AppRole: '#/components/schemas/HashicorpVaultAppRoleAuth'
              Certificate: '#/components/schemas/HashicorpVaultCertificateAuth'
            propertyName: type
          oneOf:
          - $ref: '#/components/schemas/HashicorpVaultAppRoleAuth'
          - $ref: '#/components/schemas/HashicorpVaultCertificateAuth'
          - $ref: '#/components/schemas/HashicorpVaultAgentAuth'
        mounts:
          description: Optional within this object. Secret engine mounts that keys are read from.
          items:
            $ref: '#/components/schemas/HashicorpVaultMount'
          type: array
        url:
          description: Optional within this object. Vault server URL. Vault must be served over TLS, so the scheme
            is https.
          format: uri
          type: string
      type: object
    HashicorpVaultMount:
      description: One Vault secret engine mount.
      properties:
        path:
          description: Optional within this object. Mount path in Vault.
          type: string
        type:
          description: 'Optional within this object. Secret engine version: KV1 or KV2.'
          enum:
          - KV1
          - KV2
          type: string
      type: object
    HttpSsoConfiguration:
      description: HTTP single sign-on through an authenticating reverse proxy. Not supported by artifactweave (decision
        0019).
      properties:
        allow_user_to_access_profile:
          description: Optional within this object. Whether proxied users may open their own profile.
          type: boolean
        auto_create_user:
          description: Optional within this object. Whether a first request from an unknown proxied user creates
            a local user.
          type: boolean
        http_sso_proxied:
          description: Optional within this object. Whether an authenticating reverse proxy passes the username
            in a request variable.
          type: boolean
        remote_user_request_variable:
          description: Optional within this object. Header or request variable that carries the authenticated username.
          type: string
        sync_ldap_groups:
          description: Optional within this object. Whether group memberships are read from LDAP for proxied users.
          type: boolean
      type: object
    LdapGroup:
      description: One group found by an LDAP group search.
      properties:
        description:
          description: Optional within this object. Description read through the setting's description_attribute.
          type: string
        group_dn:
          description: Optional within this object. Distinguished name of the group entry.
          type: string
        group_name:
          description: Optional within this object. Name of the group in LDAP, used as the local group name.
          type: string
        required_update:
          description: 'Optional within this object. Sync state of the LDAP group against the groups this instance
            already holds. DOES_NOT_EXIST: no group of this name exists yet, so import creates it; this is the value
            an import request normally carries. REQUIRES_UPDATE: a group of this name exists but its DN in LDAP
            has changed, so import refreshes it. IN_ARTIFACTORY: the group exists and matches LDAP, so import leaves
            it alone. Search fills it in; import reads it to choose between creating and updating.'
          enum:
          - DOES_NOT_EXIST
          - REQUIRES_UPDATE
          - IN_ARTIFACTORY
          type: string
      type: object
    LdapGroupSettings:
      description: How groups are read from an LDAP connection and mapped to local groups.
      properties:
        description_attribute:
          description: Optional within this object. Attribute copied into the local group's description.
          type: string
        enabled_ldap:
          description: Optional within this object. Key of the LDAP connection the groups are read from.
          type: string
        filter:
          description: Optional within this object. LDAP filter that selects group entries, for example (objectClass=groupOfNames).
          type: string
        force_attribute_search:
          description: Optional within this object. Whether memberships are read from user attributes even when
            the strategy would not do so.
          type: boolean
        group_base_dn:
          description: Optional within this object. DN under which groups are searched, relative to the connection's
            base DN.
          type: string
        group_member_attribute:
          description: Optional within this object. Attribute that lists a group's members, for example uniqueMember.
          type: string
        group_name_attribute:
          description: Optional within this object. Attribute that holds a group's name, for example cn.
          type: string
        name:
          description: Optional within this object. Unique name of the group setting.
          type: string
        strategy:
          description: 'Optional within this object. How memberships are resolved: STATIC (groups list their members),
            DYNAMIC (users list their groups) or HIERARCHY (the user''s DN encodes the groups).'
          type: string
        sub_tree:
          description: Optional within this object. Whether the group search descends into sub-trees of group_base_dn.
          type: boolean
      type: object
    LdapGroupSettingsCreate:
      description: A new LDAP group setting. Same fields as LdapGroupSettings; name and enabled_ldap are required.
      properties:
        description_attribute:
          description: Optional within this object. Attribute copied into the local group's description.
          type: string
        enabled_ldap:
          description: Required within this object. Key of the LDAP connection the groups are read from.
          type: string
        filter:
          description: Optional within this object. LDAP filter that selects group entries, for example (objectClass=groupOfNames).
          type: string
        force_attribute_search:
          description: Optional within this object. Whether memberships are read from user attributes even when
            the strategy would not do so.
          type: boolean
        group_base_dn:
          description: Optional within this object. DN under which groups are searched, relative to the connection's
            base DN.
          type: string
        group_member_attribute:
          description: Optional within this object. Attribute that lists a group's members, for example uniqueMember.
          type: string
        group_name_attribute:
          description: Optional within this object. Attribute that holds a group's name, for example cn.
          type: string
        name:
          description: Required within this object. Unique name of the group setting.
          type: string
        strategy:
          description: 'Optional within this object. How memberships are resolved: STATIC (groups list their members),
            DYNAMIC (users list their groups) or HIERARCHY (the user''s DN encodes the groups).'
          type: string
        sub_tree:
          description: Optional within this object. Whether the group search descends into sub-trees of group_base_dn.
          type: boolean
      required:
      - name
      - enabled_ldap
      type: object
    LdapImport:
      description: Which LDAP groups to import and through which group setting.
      properties:
        import_groups:
          description: Optional within this object. Groups to create or update, as returned by the search operation.
          items:
            $ref: '#/components/schemas/LdapGroup'
          type: array
        ldap_group_settings:
          allOf:
          - $ref: '#/components/schemas/LdapGroupSettings'
          description: Optional within this object. Group setting the groups are read through.
      type: object
    LdapSearchPattern:
      description: How a user's LDAP entry is searched for when user_dn_pattern is not enough.
      properties:
        manager_dn:
          description: Optional within this object. DN of the account the server binds as to run searches.
          type: string
        manager_password:
          description: Optional within this object. Password of manager_dn. Stored sealed (decision 0017) and never
            returned.
          type: string
          writeOnly: true
        search_base:
          description: Optional within this object. DN under which the search starts, relative to the connection's
            base DN. Empty searches from the base DN.
          type: string
        search_filter:
          description: Optional within this object. LDAP filter that selects the user's entry, with {0} standing
            for the username, for example (uid={0}).
          type: string
        search_sub_tree:
          description: Optional within this object. Whether the search descends into sub-trees of search_base.
          type: boolean
      type: object
    LdapSettings:
      description: One LDAP server connection used to authenticate users. manager_password is never returned.
      properties:
        allow_user_to_access_profile:
          description: Optional within this object. Whether users created through this connection may open their
            own profile.
          type: boolean
        auto_create_user:
          description: Optional within this object. Whether a first successful login creates a local user.
          type: boolean
        email_attribute:
          description: Optional within this object. Attribute that holds the user's email address, for example mail.
          type: string
        enabled:
          description: Optional within this object. Whether logins are checked against this server.
          type: boolean
        key:
          description: Optional within this object. Unique name of the connection.
          type: string
        ldap_poisoning_protection:
          description: Optional within this object. Whether attributes returned by the server are checked to defend
            against LDAP response poisoning.
          type: boolean
        ldap_url:
          description: Optional within this object. Server URL including the base DN, for example ldap://ldap.example.com:389/dc=example,dc=com.
          type: string
        paging_support_enabled:
          description: Optional within this object. Whether searches request paged results, for servers that cap
            result size.
          type: boolean
        search:
          allOf:
          - $ref: '#/components/schemas/LdapSearchPattern'
          description: Optional within this object. How to find a user's entry when user_dn_pattern is not set or
            does not match.
        user_dn_pattern:
          description: Optional within this object. Pattern that builds a user's DN from the username, with {0}
            standing for the username, for example uid={0},ou=people.
          type: string
      type: object
    LdapSettingsCreate:
      description: A new LDAP connection. Same fields as LdapSettings; key and ldap_url are required.
      properties:
        allow_user_to_access_profile:
          description: Optional within this object. Whether users created through this connection may open their
            own profile.
          type: boolean
        auto_create_user:
          description: Optional within this object. Whether a first successful login creates a local user.
          type: boolean
        email_attribute:
          description: Optional within this object. Attribute that holds the user's email address, for example mail.
          type: string
        enabled:
          default: true
          description: Optional within this object. Whether logins are checked against this server. Defaults to
            true.
          type: boolean
        key:
          description: Required within this object. Unique name of the connection.
          type: string
        ldap_poisoning_protection:
          description: Optional within this object. Whether attributes returned by the server are checked to defend
            against LDAP response poisoning.
          type: boolean
        ldap_url:
          description: Required within this object. Server URL including the base DN, for example ldap://ldap.example.com:389/dc=example,dc=com.
          type: string
        paging_support_enabled:
          description: Optional within this object. Whether searches request paged results, for servers that cap
            result size.
          type: boolean
        search:
          allOf:
          - $ref: '#/components/schemas/LdapSearchPattern'
          description: Optional within this object. How to find a user's entry when user_dn_pattern is not set or
            does not match.
        user_dn_pattern:
          description: Optional within this object. Pattern that builds a user's DN from the username, with {0}
            standing for the username, for example uid={0},ou=people.
          type: string
      required:
      - key
      - ldap_url
      type: object
    OidcConfiguration:
      description: An external OpenID Connect identity provider whose ID tokens may be exchanged for access tokens.
      properties:
        audience:
          description: Optional within this object. When set, ID tokens must carry this value in aud.
          type: string
        azure_app_id:
          description: Optional within this object. For Azure providers, the application ID the tokens are issued
            for.
          type: string
        description:
          description: Optional within this object. Free text for administrators.
          type: string
        enable_permissive_configuration:
          default: false
          description: Optional within this object. Applies to the GitHub provider type only. When false, organization
            is mandatory and only tokens issued for that GitHub organization are accepted; when true, the organization
            restriction is lifted and any repository on the issuer can obtain a token that a mapping's claims allow.
            For the other provider types the flag is stored and returned but has no effect. Defaults to false; enabling
            it widens who can authenticate.
          type: boolean
        issuer_url:
          description: Optional within this object. Issuer that ID tokens must carry in iss. The provider's signing
            keys are discovered from this URL.
          type: string
        name:
          description: Optional within this object. Unique provider name; token exchanges refer to it as provider_name.
          type: string
        organization:
          description: Optional within this object. GitHub organization the tokens must come from, compared case-sensitively.
            Mandatory for the GitHub provider type unless enable_permissive_configuration is true. For GitHub Enterprise
            it is accepted and kept as the token issuer. Rejected for the generic and Azure types.
          type: string
        project_key:
          description: Optional within this object. Project the provider belongs to. Omitted or empty means a global
            provider.
          type: string
        provider_type:
          description: 'Optional within this object. Kind of identity provider, in the Access vocabulary: `Generic
            OpenID Connect`, `GitHub`, `GitHub Enterprise` or `Azure`. Generic covers any other OpenID Connect issuer,
            such as GitLab, Jenkins or Okta. The jfrog/platform Terraform provider sends exactly these values, mapping
            its own `generic` and `GitHubEnterprise` onto them. artifactweave also accepts the lower-case short
            names older JFrog examples use (`generic`, `github`, `github enterprise`, `azure`, any case) and stores
            and returns the canonical form.'
          type: string
        token_issuer:
          description: Optional within this object. For GitHub providers, the organisation or enterprise that issues
            the tokens.
          type: string
        use_default_proxy:
          description: Optional within this object. Whether fetching the issuer's signing keys goes through the
            default proxy.
          type: boolean
      type: object
    OidcIdentityMapping:
      description: A rule that turns a matching ID token into an access token of a given shape.
      properties:
        claims:
          additionalProperties: true
          description: Optional within this object. Claims an ID token must carry, as an object of claim name to
            expected value. Every listed claim must match.
          type: object
        description:
          description: Optional within this object. Free text for administrators.
          type: string
        name:
          description: Optional within this object. Unique name of the mapping within its provider.
          type: string
        priority:
          description: 'Optional within this object. Evaluation order among a provider''s mappings: lower numbers
            are tried first, starting at 1, and a mapping without a priority is tried last. When the token exchange
            names a project_key, mappings scoped to that project are tried before global ones whatever their numbers;
            within each group, equal priorities go to the mapping created first. The first mapping whose claims
            match the presented token produces the access token, so the most restrictive mapping should carry priority
            1.'
          minimum: 1
          type: integer
        token_spec:
          allOf:
          - $ref: '#/components/schemas/TokenSpec'
          description: Optional within this object. Shape of the access token issued when this mapping matches.
      type: object
    OidcIdentityMappingResponse:
      allOf:
      - $ref: '#/components/schemas/OidcIdentityMapping'
      - properties:
          project_key:
            description: Optional within this object. Project the mapping belongs to, derived from a project role
              in token_spec.scope. Set by the server.
            type: string
        type: object
      description: A stored identity mapping, with the project it belongs to.
      type: object
    OidcTokenExchangeRequest:
      description: An RFC 8693 token exchange request carrying a provider's ID token.
      properties:
        application_key:
          description: Optional within this object. AppTrust application key. Accepted and ignored, because AppTrust
            is out of scope.
          type: string
        branch:
          description: Optional within this object. Source branch of the CI run, recorded with the issued token
            for auditing.
          type: string
        grant_type:
          description: Optional within this object. Must be urn:ietf:params:oauth:grant-type:token-exchange.
          type: string
        identity_mapping_name:
          description: Optional within this object. Restricts matching to the named mapping instead of trying every
            mapping of the provider.
          type: string
        include_reference_token:
          description: Optional within this object. Whether the response also carries a reference token for the
            issued token.
          type: boolean
        job_id:
          description: Optional within this object. Identifier of the CI job, recorded with the issued token for
            auditing.
          type: string
        project_key:
          description: Optional within this object. Project the issued token is scoped to when the matching mapping
            is project-scoped.
          type: string
        provider_name:
          description: Optional within this object. Registered provider that issued subject_token.
          type: string
        provider_type:
          description: Optional within this object. Kind of provider, as in its configuration. The stored configuration
            takes precedence.
          type: string
        repo:
          description: Optional within this object. Source repository of the CI run, recorded with the issued token
            for auditing.
          type: string
        revision:
          description: Optional within this object. Source revision of the CI run, recorded with the issued token
            for auditing.
          type: string
        run_id:
          description: Optional within this object. Identifier of the CI run, recorded with the issued token for
            auditing.
          type: string
        subject_token:
          description: Optional within this object. The ID token issued by the provider. It is this request's credential
            and is never stored.
          type: string
          writeOnly: true
        subject_token_type:
          description: Optional within this object. Must be urn:ietf:params:oauth:token-type:id_token.
          type: string
      type: object
    OidcTokenExchangeResult:
      description: The access token issued by a successful exchange.
      properties:
        access_token:
          description: Optional within this object. The issued access token.
          type: string
        expires_in:
          description: Optional within this object. Lifetime of the issued token in seconds.
          type: integer
        issued_token_type:
          description: Optional within this object. RFC 8693 type of the issued token, the access token URN.
          type: string
        reference_token:
          description: Optional within this object. Reference token for the issued token. Present only when include_reference_token
            was true.
          type: string
        token_type:
          description: Optional within this object. Always Bearer.
          type: string
        username:
          description: Optional within this object. Username the mapping produced for the token's subject.
          type: string
      type: object
    PasswordPolicy:
      description: Complexity rules for internal users' passwords. On PATCH an omitted field keeps its current value;
        on PUT it returns to its default.
      properties:
        digit:
          description: Optional within this object. Minimum number of digits. 0 means no requirement.
          type: integer
        length:
          description: Optional within this object. Minimum password length in characters.
          type: integer
        lowercase:
          description: Optional within this object. Minimum number of lower-case letters. 0 means no requirement.
          type: integer
        not_match_old:
          description: Optional within this object. Whether a new password must differ from the user's current one.
          type: boolean
        special_char:
          description: Optional within this object. Minimum number of characters that are neither letters nor digits.
            0 means no requirement.
          type: integer
        uppercase:
          description: Optional within this object. Minimum number of upper-case letters. 0 means no requirement.
          type: integer
      type: object
    SamlGeneralSettings:
      description: The instance-wide SAML switch. Not supported by artifactweave (decision 0019).
      properties:
        certificateIsPresent:
          description: Optional within this object. Whether a service provider certificate is installed. Set by
            the server.
          readOnly: true
          type: boolean
        enable:
          description: Optional within this object. Whether SAML login is enabled at all.
          type: boolean
      type: object
    SamlSetting:
      description: One SAML identity provider. Not supported by artifactweave (decision 0019).
      properties:
        allow_user_to_access_profile:
          description: Optional within this object. Whether users created through SAML may open their own profile.
          type: boolean
        auto_redirect:
          description: Optional within this object. Whether the login page sends users straight to the identity
            provider.
          type: boolean
        auto_user_creation:
          description: Optional within this object. Whether a first login creates a local user.
          type: boolean
        certificate:
          description: Optional within this object. PEM certificate of the identity provider, used to verify assertion
            signatures.
          type: string
        email_attribute:
          description: Optional within this object. Assertion attribute that holds the user's email address.
          type: string
        enable_integration:
          description: Optional within this object. Whether login through this identity provider is enabled.
          type: boolean
        group_attribute:
          description: Optional within this object. Assertion attribute that lists the user's groups.
          type: string
        ldap_group_settings:
          description: Optional within this object. Names of LDAP group settings whose groups are resolved for users
            who log in through SAML.
          items:
            type: string
          type: array
        login_url:
          description: Optional within this object. Identity provider URL that login redirects to.
          type: string
        logout_url:
          description: Optional within this object. Identity provider URL that logout redirects to.
          type: string
        name:
          description: Optional within this object. Unique name of the setting.
          type: string
        name_id_attribute:
          description: Optional within this object. Assertion attribute used as the username instead of the NameID.
          type: string
        service_provider_name:
          description: Optional within this object. Entity ID this server presents to the identity provider.
          type: string
        sync_groups:
          description: Optional within this object. Whether group memberships are taken from the assertion on each
            login.
          type: boolean
        use_encrypted_assertion:
          description: Optional within this object. Whether assertions must be encrypted.
          type: boolean
        verify_audience_restriction:
          description: Optional within this object. Whether an assertion's audience must name this service provider.
          type: boolean
      type: object
    SamlSettingCreate:
      description: A new SAML identity provider. Not supported by artifactweave (decision 0019).
      properties:
        allow_user_to_access_profile:
          description: Optional within this object. Whether users created through SAML may open their own profile.
          type: boolean
        auto_redirect:
          description: Optional within this object. Whether the login page sends users straight to the identity
            provider.
          type: boolean
        auto_user_creation:
          description: Optional within this object. Whether a first login creates a local user.
          type: boolean
        certificate:
          description: Required within this object. PEM certificate of the identity provider, used to verify assertion
            signatures.
          type: string
        email_attribute:
          description: Optional within this object. Assertion attribute that holds the user's email address.
          type: string
        enable_integration:
          description: Optional within this object. Whether login through this identity provider is enabled.
          type: boolean
        group_attribute:
          description: Optional within this object. Assertion attribute that lists the user's groups.
          type: string
        ldap_group_settings:
          description: Optional within this object. Names of LDAP group settings whose groups are resolved for users
            who log in through SAML.
          items:
            type: string
          type: array
        login_url:
          description: Required within this object. Identity provider URL that login redirects to.
          type: string
        logout_url:
          description: Required within this object. Identity provider URL that logout redirects to.
          type: string
        name:
          description: Required within this object. Unique name of the setting.
          type: string
        name_id_attribute:
