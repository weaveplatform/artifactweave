        an ID token signed by a registered provider; the server verifies its signature, issuer and audience, tries
        the provider''s identity mappings in priority order, and issues an access token shaped by the token_spec
        of the first mapping whose claims all match. Needs no authentication: the subject token is the credential.
        Answers 400 when the request is malformed or no mapping matches, and 401 when the subject token does not
        verify. The jfrog/artifactory provider''s oidc_provider_name setting and the JFrog CLI use this operation.'
