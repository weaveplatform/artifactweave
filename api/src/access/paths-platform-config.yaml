          type: boolean
        use_encrypted_assertion:
          description: Optional within this object. Whether assertions must be encrypted.
          type: boolean
        verify_audience_restriction:
          description: Optional within this object. Whether an assertion's audience must name this service provider.
          type: boolean
      required:
