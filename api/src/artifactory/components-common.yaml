# Shared schemas: the error envelope and the system documents.
components:
  schemas:
    SystemVersion:
      type: object
      additionalProperties: false
      required: [version, revision, addons]
      properties:
        version:
          type: string
          description: >-
            Required within this object. The compatibility version, in major.minor.patch
            form. Configured by compat.artifactory_version; defaults to 7.155.0.
        revision:
          type: string
          description: >-
            Required within this object. The server's build identifier (git describe
            output), distinct from the compatibility version in version.
        addons:
          type: array
          description: >-
            Required within this object. Always empty.
          items:
            type: string
            description: Optional within this object. An add-on name.
        license:
          type: string
          x-unverified: true
          description: >-
            Optional within this object. Always the server's product name.
    License:
      type: object
      additionalProperties: false
      required: [type, validThrough, licensedTo]
      properties:
        type:
          type: string
          description: >-
            Required within this object. Always the server's product name; there is no
            licence tier.
        validThrough:
          type: string
          description: Required within this object. Always the literal never.
        licensedTo:
          type: string
          description: Required within this object. Always the server's product name.
    Probe:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          description: Required within this object. OK when the probe passes.
    ErrorResponse:
      type: object
      description: The error envelope used by every /artifactory response.
      required: [errors]
      properties:
        errors:
          type: array
          description: >-
            Required within this object. One entry per error.
          items:
            type: object
            required: [status, message]
            properties:
              status:
                type: integer
                description: Required within this object. The HTTP status code repeated in the body.
              message:
                type: string
                description: Required within this object. Human readable explanation.
