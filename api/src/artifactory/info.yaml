openapi: 3.0.3
info:
  title: Artifact repository REST API
  version: 0.1.0
  description: >-
    The management surface served under /artifactory. Operations marked x-handwritten
    are served by hand-written handlers and are excluded from code generation
    (decision 0002).
servers:
  - url: /artifactory
    description: The /artifactory prefix on the server's single listener.
tags:
  - name: system
    description: Health, version and telemetry endpoints that need no authentication.
  - name: handwritten
    description: Marker tag. Operations with this tag are implemented by hand and excluded from generation.
