        documented lock snapshot field for field; Artifactory serves it from 7.161, above the compatibility version
        artifactweave reports, and artifactweave serves it regardless.
      operationId: getNodeLocks
      parameters:
      - $ref: '#/components/parameters/LockCategory'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeLocks'
          description: The leases held by the answering process.
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The lease table could not be read; the body carries the Artifactory error envelope.
      summary: List locks held by this process
      tags:
      - system
      x-oracle-source: https://docs.jfrog.com/administration/reference/getnodelocks.md
