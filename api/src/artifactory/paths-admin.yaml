  /api/system/locks:
    get:
      description: Returns a snapshot of the leases artifactweave holds in its database, so an operator can find
        a stuck scheduler job, cleanup run or replication without querying the database directly. In v1 the report
        covers the single running process; the response keeps Artifactory's multi-node shape. The snapshot is best
        effort, not transactional. Requires an administrator. The response shape matches Artifactory's documented
        lock snapshot field for field; Artifactory serves it from 7.161, above the compatibility version artifactweave
        reports, and artifactweave serves it regardless.
      operationId: getClusterLocks
      parameters:
      - $ref: '#/components/parameters/LockCategory'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterLocksResponse'
          description: The lock snapshot.
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The lease table could not be read, for example because the database is unreachable; the body
            carries the Artifactory error envelope.
      summary: List held locks
      tags:
      - system
      x-oracle-source: https://docs.jfrog.com/administration/reference/getclusterlocks.md
  /api/system/locks/local:
    get:
      description: Same as the lock snapshot but limited to the process that answers, without asking any other process.
