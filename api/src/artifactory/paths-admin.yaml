components:
  parameters:
    LockCategory:
      description: Optional query parameter. Restricts the report to locks of one category, for example the scheduler
        or the blob garbage collector. Omitted means every category. An unknown category returns an empty lock list
        rather than an error.
      in: query
      name: category
      required: false
      schema:
        description: Lock category name, compared case-sensitively.
        minLength: 1
        type: string
  responses:
    AdminBadRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: The request was malformed or failed validation; the body carries the error envelope naming the
        problem.
    AdminForbidden:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: The caller is authenticated but is not an administrator; the body carries the error envelope.
    AdminInternalServerError:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: The server failed while processing the request; the body carries the error envelope.
    AdminLegacyBadRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminLegacyErrorResponse'
      description: The request was malformed; the body carries the error envelope with the single-message error
        field.
    AdminLegacyForbidden:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminLegacyErrorResponse'
      description: The caller is not an administrator; the body carries the error envelope with the
        single-message error field.
    AdminLegacyInternalServerError:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminLegacyErrorResponse'
      description: The server failed while processing the request; the body carries the error envelope with the
        single-message error field.
    AdminLegacyUnauthorized:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminLegacyErrorResponse'
      description: Credentials were missing or rejected; the body carries the error envelope with the
        single-message error field.
    AdminNotFound:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: The target does not exist; the body carries the error envelope.
    AdminNotImplemented:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: The operation is not implemented; the body carries the error envelope with status 501 and a
        message naming the operation.
    AdminUnauthorized:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: Credentials were missing or rejected; the body carries the error envelope.
  schemas:
    AdminLegacyErrorResponse:
      description: 'The error body of the import and export operations: the error envelope plus a single-message
        error field. Not returned; every import and export call answers 501 in the standard envelope.'
      properties:
        error:
          description: Optional within this object. Single-string form of the error message, sent alongside or instead
            of errors.
          type: string
        errors:
          description: Optional within this object. One entry per error.
          items:
            description: One error.
            properties:
              message:
                description: Optional within this object. Human-readable explanation.
                type: string
              status:
                description: Optional within this object. The HTTP status code repeated in the body.
                type: integer
            type: object
          type: array
      type: object
    ClusterLocksResponse:
      description: A snapshot of the leases the server currently holds in its database lease table, grouped by
        process. The report always has exactly one node.
      properties:
        meta:
          allOf:
          - $ref: '#/components/schemas/LocksResponseMeta'
          description: Required within this object. When and where the snapshot was taken.
        nodes:
          description: Required within this object. One entry per process that was asked for its locks. Always one
            entry.
          items:
            $ref: '#/components/schemas/NodeLocks'
          type: array
        summary:
          allOf:
          - $ref: '#/components/schemas/LocksResponseSummary'
          description: Required within this object. Totals across every reported process.
        warnings:
          description: Optional within this object. Conditions that make the snapshot partial. Omitted or empty
            when the report is complete, which is always the case for a single process.
          items:
            $ref: '#/components/schemas/LocksResponseWarning'
          type: array
      required:
      - meta
      - summary
      - nodes
      type: object
    CurationInterfaceSettings:
      description: Curation settings. The operations that carry this body answer 501.
      properties:
        allowDownloadWhenUnavailable:
          description: Optional within this object. Whether downloads proceed when the curation service cannot
            be reached. Ignored.
          type: boolean
      type: object
    ExportSettings:
      description: Options of a full system export. The operations that take this body answer 501.
      properties:
        bypassFiltering:
          description: Optional within this object. Export files without applying content filters.
          type: boolean
        createArchive:
          description: Optional within this object. Write a single zip archive instead of a directory tree.
          type: boolean
        excludeContent:
          description: Optional within this object. Export configuration and metadata without binaries.
          type: boolean
        exportPath:
          description: Required within this object. Server-side directory the export would be written to.
          type: string
        failIfEmpty:
          description: Optional within this object. Fail when there is nothing to export.
          type: boolean
        failOnError:
          description: Optional within this object. Stop at the first error instead of continuing.
          type: boolean
        includeMetadata:
          description: Optional within this object. Include item properties and statistics.
          type: boolean
        incremental:
          description: Optional within this object. Write only what changed since the previous export to the same
            path.
          type: boolean
        m2:
          description: Optional within this object. Also write Maven 2 compatible metadata files.
          type: boolean
        verbose:
          description: Optional within this object. Log every exported item.
          type: boolean
      required:
      - exportPath
      type: object
    ImportSettings:
      description: Options of a full system import. The operations that take this body answer 501.
      properties:
        failIfEmpty:
          description: Optional within this object. Fail when the source holds nothing to import.
          type: boolean
        failOnError:
          description: Optional within this object. Stop at the first error instead of continuing.
          type: boolean
        importPath:
          description: Required within this object. Server-side directory or archive to import from.
          type: string
        includeMetadata:
          description: Optional within this object. Import item properties and statistics as well as binaries.
          type: boolean
        verbose:
          description: Optional within this object. Log every imported item.
          type: boolean
      required:
      - importPath
      type: object
    LockEntry:
      description: One lease held by the reporting process.
      properties:
        category:
          description: Required within this object. The subsystem that took the lease, for example scheduler, gc
            or replication.
          minLength: 1
          type: string
        key:
          description: Required within this object. What the lease protects within its category, for example a cleanup
            policy key or a repository key.
          minLength: 1
          type: string
        lockedSinceEpochMs:
          description: Required within this object. When the lease was acquired, in milliseconds since the Unix
            epoch. Same instant as lockedSinceIso.
          format: int64
          type: integer
        lockedSinceIso:
          description: Required within this object. When the lease was acquired, as an RFC 3339 UTC timestamp. Same
            instant as lockedSinceEpochMs.
          format: date-time
          type: string
        threadId:
          description: Required within this object. A stable numeric identifier of the task holding the lease.
          format: int64
          type: integer
        threadName:
          description: Optional within this object. Human-readable name of the holding task, such as the cleanup
            policy run it belongs to. Null when the task has no name.
          nullable: true
          type: string
      required:
      - category
      - key
      - lockedSinceEpochMs
      - lockedSinceIso
      - threadId
      type: object
    LocksFanOutMeta:
      description: How the report was gathered across processes.
      properties:
        enabled:
          description: Required within this object. Whether the responding process asked other processes for their
            locks. Always false; the server runs one process.
          type: boolean
        responded:
          description: Required within this object. How many other processes answered. Always 0.
          type: integer
        unreachable:
          description: Required within this object. How many other processes did not answer. Always 0.
          type: integer
      required:
      - enabled
      - responded
      - unreachable
      type: object
    LocksResponseMeta:
      description: When and where the snapshot was taken.
      properties:
        fanOut:
          allOf:
          - $ref: '#/components/schemas/LocksFanOutMeta'
          description: Required within this object. How the report was gathered across processes.
        queriedAt:
          description: Required within this object. When the snapshot was taken, as an RFC 3339 UTC timestamp.
          format: date-time
          type: string
        queriedByNodeId:
          description: Required within this object. Identifier of the process that answered, the same value as the
            service id reported by the system endpoints.
          minLength: 1
          type: string
      required:
      - queriedAt
      - queriedByNodeId
      - fanOut
      type: object
    LocksResponseSummary:
      description: Totals across every reported process.
      properties:
        nodesOk:
          description: Required within this object. Processes that reported their locks. Always 1.
          type: integer
        nodesUnreachable:
          description: Required within this object. Processes that did not answer. Always 0.
          type: integer
        totalHeldLocks:
          description: Required within this object. Number of leases held across all reported processes.
          type: integer
      required:
      - totalHeldLocks
      - nodesOk
      - nodesUnreachable
      type: object
    LocksResponseWarning:
      description: A condition that makes the snapshot partial.
      properties:
        code:
          description: Required within this object. Machine-readable reason. The only defined value reports
            that cross-node collection was skipped; it is never emitted.
          enum:
          - HA_AUTH_FAN_OUT_SKIPPED
          type: string
        message:
          description: Required within this object. Human-readable explanation of the warning.
          type: string
      required:
      - code
      - message
      type: object
    LoggerLevel:
      description: 'A log level name. The server maps these onto its own levels: trace and debug enable debug
        output, info is the default, warn and error raise the threshold, and fatal is treated as error.'
      enum:
      - trace
      - debug
      - info
      - warn
      - error
      - fatal
      type: string
    LoggerLevelsRequest:
      description: A temporary override of log levels for named loggers. The override lives only in memory and is
        never written to configuration.
      properties:
        classes:
          additionalProperties:
            $ref: '#/components/schemas/LoggerLevel'
          description: Required within this object. Map from logger name to the level it should log at while the
            override lasts. Logger names are the dotted package or component names the server logs under, such
            as `artifactweave.remote`. At most 100 entries; a larger map is rejected with 400. Names that match no logger are accepted and
            have no effect.
          maxProperties: 100
          type: object
        timer:
          description: Required within this object. How long the override lasts, in seconds. When it expires every
            listed logger returns to the level it had before the request. Must be positive.
          minimum: 1
          type: integer
      required:
      - classes
      - timer
      type: object
    NodeLocks:
      description: The leases one process holds.
      properties:
        locks:
          description: Required within this object. The leases the process holds, oldest first. Empty when the process
            holds none or did not answer.
          items:
            $ref: '#/components/schemas/LockEntry'
          type: array
        nodeId:
          description: Required within this object. Identifier of the process.
          minLength: 1
          type: string
        status:
          description: Required within this object. ok when the process reported, unreachable when it did not answer;
            an unreachable process may still hold leases that are not listed.
          enum:
          - ok
          - unreachable
          type: string
      required:
      - nodeId
      - status
      - locks
      type: object
paths:
  /api/artifactexport/repository:
    post:
      description: Not implemented; answers 501.
      operationId: exportRepositoryWithMetadata
      requestBody:
        content:
          application/json:
            schema:
              description: A repository export request.
              properties:
                action:
                  description: Required within this object. Always repository.
                  enum:
                  - repository
                  type: string
                excludeMetadata:
                  default: false
                  description: Optional within this object. Export binaries without properties and statistics.
                  type: boolean
                m2:
                  description: Optional within this object. Also write Maven 2 compatible metadata files.
                  type: boolean
                path:
                  description: Required within this object. Server-side directory to export to.
                  type: string
                repository:
                  description: Required within this object. Key of the repository to export.
                  type: string
                verbose:
                  description: Optional within this object. Log every exported item.
                  type: boolean
              required:
              - action
              - path
              - repository
              type: object
        description: What to export and where.
        required: true
      responses:
        '200':
          content:
            text/plain:
              schema:
                description: Plain-text progress. Not returned.
                type: string
          description: Not returned.
        '400':
          $ref: '#/components/responses/AdminLegacyBadRequest'
        '401':
          $ref: '#/components/responses/AdminLegacyUnauthorized'
        '403':
          $ref: '#/components/responses/AdminLegacyForbidden'
        '500':
          $ref: '#/components/responses/AdminLegacyInternalServerError'
        '501':
          $ref: '#/components/responses/AdminNotImplemented'
