  /api/v1/service_trust/pairing/{usecase}:
    delete:
      description: Removes the trust relationship with one peer for the use case and deletes its stored keys. Federations
        that use the peer stop syncing with it. With `force=true` the local trust is removed even when the peer
        cannot be told. Administrators only.
      operationId: unregisterPairingToken
      parameters:
      - description: 'Required path parameter. The trust use case: `federated-repo/*` for two-way federated repository
          trust or `federated-repo/r` for receive-only trust. The value contains a slash, so the route is hand-written.
          Any other value, including JFrog''s `artifactory-cold` use cases (cold storage here is a blob tier, not
          a peer, decision 0024), answers 404.'
        in: path
        name: usecase
        required: true
        schema:
          description: Use case path.
          type: string
      - description: Optional query parameter. When true, remove the local trust even if the peer is unreachable.
          Defaults to false.
        in: query
        name: force
        schema:
          default: false
          description: Remove without the peer.
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              description: Which peer to unpair.
              properties:
                base_url:
                  description: Required within this object. Base URL of the peer to unpair.
                  type: string
              required:
              - base_url
              type: object
        description: Which peer to unpair.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Trust was removed.
                properties:
                  message:
                    description: Optional within this object. Confirmation.
                    type: string
                type: object
          description: Trust was removed.
        '400':
          $ref: '#/components/responses/AdminBadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The use case is not supported or no trust with that peer exists.
        '500':
          $ref: '#/components/responses/AdminInternalServerError'
      summary: Remove trust with a peer
      tags:
      - federation
      - handwritten
      x-handwritten: true
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/unregisterpairingtoken.md
    post:
      description: 'Creates a one-time pairing token for establishing trust with another artifactweave instance
        (decision 0021). The token is a signed JWT whose subject is the administrator who requested it; it can be
        redeemed once and expires 300 seconds after creation, matching Artifactory''s pairing tokens. An administrator
        hands it to the peer, which redeems it with the exchange operation; the two instances then hold each other''s
        keys and authenticate every sync call in both directions. Peers must be artifactweave instances: JFrog Artifactory
        cannot pair. Administrators only.'
      operationId: generatePairingToken
      parameters:
      - description: 'Required path parameter. The trust use case: `federated-repo/*` for two-way federated repository
          trust or `federated-repo/r` for receive-only trust. The value contains a slash, so the route is hand-written.
          Any other value, including JFrog''s `artifactory-cold` use cases (cold storage here is a blob tier, not
          a peer, decision 0024), answers 404.'
        in: path
        name: usecase
        required: true
        schema:
          description: Use case path.
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                description: The pairing token.
                properties:
                  pairing_token:
                    description: Required within this object. The signed one-time token. It becomes invalid once
                      exchanged or 300 seconds after creation, whichever comes first.
                    type: string
                required:
                - pairing_token
                type: object
          description: The pairing token.
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The use case is not supported.
        '500':
          $ref: '#/components/responses/AdminInternalServerError'
      summary: Generate a pairing token
      tags:
      - federation
      - handwritten
      x-handwritten: true
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/generatepairingtoken.md
    put:
      description: Redeems a pairing token generated on the peer, completing trust between the two instances for
        the use case. Run it on the instance that did not generate the token, with the same use case. Administrators
        only.
      operationId: exchangePairingToken
      parameters:
      - description: 'Required path parameter. The trust use case: `federated-repo/*` for two-way federated repository
          trust or `federated-repo/r` for receive-only trust. The value contains a slash, so the route is hand-written.
          Any other value, including JFrog''s `artifactory-cold` use cases (cold storage here is a blob tier, not
          a peer, decision 0024), answers 404.'
        in: path
        name: usecase
        required: true
        schema:
          description: Use case path.
          type: string
      requestBody:
        content:
          application/json:
            schema:
              description: The token generated on the peer.
              properties:
                pairing_token:
                  description: Required within this object. The token generated on the peer.
                  type: string
              required:
              - pairing_token
              type: object
        description: The token generated on the peer.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Trust was established.
                properties:
                  message:
                    description: Optional within this object. Confirmation.
                    type: string
                type: object
          description: Trust was established.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The token is malformed, expired, already used or was issued for another use case.
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The use case is not supported.
        '500':
          $ref: '#/components/responses/AdminInternalServerError'
      summary: Exchange a pairing token
      tags:
      - federation
      - handwritten
      x-handwritten: true
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/exchangepairingtoken.md
