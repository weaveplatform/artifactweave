  /api/system/debug/loggers:
    delete:
      description: Ends a temporary logger override set with POST before its timer expires and returns every affected
        logger to the level it had before. Calling it when no override is active succeeds and changes nothing. Requires
        an administrator.
      operationId: deleteLoggerDebugLevels
      responses:
        '200':
          content:
            application/json:
              schema:
                description: A short confirmation message.
                type: string
          description: The override, if any, was removed.
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '500':
          $ref: '#/components/responses/AdminInternalServerError'
      summary: Clear temporary logger levels
      tags:
      - system
      x-oracle-source: https://docs.jfrog.com/administration/reference/deleteloggerdebuglevels.md
    post:
      description: 'Raises or lowers the log level of named loggers for a limited time, without changing configuration
        or restarting, so an operator can collect detailed logs while reproducing a problem. When the timer expires
        the previous levels return. Only one override is active at a time: a POST while one is active is rejected
        with 400, so send DELETE first to change it. Requires an administrator.'
      operationId: setLoggerDebugLevels
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoggerLevelsRequest'
        description: The loggers to override, their levels and how long the override lasts.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                description: A short confirmation message.
                type: string
          description: The override is active.
        '400':
          $ref: '#/components/responses/AdminBadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '500':
          $ref: '#/components/responses/AdminInternalServerError'
      summary: Set temporary logger levels
      tags:
      - system
      x-oracle-source: https://docs.jfrog.com/administration/reference/setloggerdebuglevels.md
  /api/system/debug/loggers/{className}:
    get:
      description: Returns the level a named logger currently logs at, including any active temporary override.
        A name that matches no logger returns the root level rather than 404. Requires an administrator.
      operationId: getLoggerDebugLevel
      parameters:
      - description: Required path parameter. Dotted logger name, for example `artifactweave.remote`. A single path segment; dots are not separators.
        in: path
        name: className
        required: true
        schema:
          description: Logger name.
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggerLevel'
          description: The logger's effective level as a JSON string.
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '500':
          $ref: '#/components/responses/AdminInternalServerError'
      summary: Get a logger's level
      tags:
      - system
      x-oracle-source: https://docs.jfrog.com/administration/reference/getloggerdebuglevel.md
  /api/system/locks:
    get:
      description: Returns a snapshot of the leases the server holds in its database, so an operator can find a stuck
        scheduler job, cleanup run or replication without querying the database directly. The report covers the single
        running process in the multi-node shape. The snapshot is best effort, not transactional. Requires an
        administrator.
      operationId: getClusterLocks
      parameters:
      - $ref: '#/components/parameters/LockCategory'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterLocksResponse'
          description: The lock snapshot.
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The lease table could not be read, for example because the database is unreachable; the body
            carries the error envelope.
      summary: List held locks
      tags:
      - system
      x-oracle-source: https://docs.jfrog.com/administration/reference/getclusterlocks.md
  /api/system/locks/local:
    get:
      description: Same as the lock snapshot but limited to the process that answers, without asking any other process.
        The two operations report the same leases. Requires an administrator.
      operationId: getNodeLocks
      parameters:
      - $ref: '#/components/parameters/LockCategory'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeLocks'
          description: The leases held by the answering process.
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The lease table could not be read; the body carries the error envelope.
      summary: List locks held by this process
