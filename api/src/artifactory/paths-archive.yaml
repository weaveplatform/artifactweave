        in: query
        name: projectKey
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveRestorePackagesRequest'
        description: What to restore and where.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveRestoreStarted'
          description: The restore run started.
        '400':
          $ref: '#/components/responses/ArchiveBadRequest'
        '401':
          $ref: '#/components/responses/ArchiveUnauthorized'
        '403':
          $ref: '#/components/responses/ArchiveForbidden'
        '500':
          $ref: '#/components/responses/ArchiveInternalServerError'
      summary: Restore archived package versions
      tags:
      - archive
      x-oracle-source: https://docs.jfrog.com/administration/reference/restorearchivedpackages.md
  /api/retention/archive/executions:
    get:
      description: Returns archive executions that started within a time window, optionally for one policy. Platform
        administrators only.
      operationId: getArchivePolicyStatus
      parameters:
      - description: Optional query parameter. Start of the window in epoch milliseconds.
        in: query
        name: from
        schema:
          type: string
      - description: Optional query parameter. End of the window in epoch milliseconds.
        in: query
        name: to
        schema:
          type: string
      - description: Optional query parameter. Return only executions of policies whose key contains this text.
        in: query
        name: searchStr
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ArchiveExecutionStatus'
