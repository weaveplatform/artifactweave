        '401':
          $ref: '#/components/responses/ColdStorageUnauthorized'
        '403':
          $ref: '#/components/responses/ColdStorageForbidden'
        '500':
          $ref: '#/components/responses/ColdStorageInternalServerError'
      summary: List archive executions
      tags:
      - archive
      x-oracle-source: https://docs.jfrog.com/administration/reference/getarchivepolicystatus.md
  /api/retention/archive/policies:
    get:
      description: Returns every cold storage archive policy with its run state. Platform administrators only. In
        Artifactory this API needs an Enterprise licence and a separate cold instance; artifactweave serves it on
        every install against its cold tier.
      operationId: getAllArchivePolicies
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ArchivePolicyResponse'
                type: array
          description: The policies, ordered by key.
        '401':
          $ref: '#/components/responses/ColdStorageUnauthorized'
        '403':
          $ref: '#/components/responses/ColdStorageForbidden'
        '500':
          $ref: '#/components/responses/ColdStorageInternalServerError'
      summary: List cold storage archive policies
      tags:
      - archive
      x-oracle-source: https://docs.jfrog.com/administration/reference/getallarchivepolicies.md
  /api/retention/archive/policies/convertToAql:
    post:
      description: Turns a search criteria form into the AQL items query artifactweave would run for it, so a form-based
        policy can be inspected or rewritten as an aqlQuery policy. The request is text/plain carrying the form's
        JSON and the response is a JSON string. A form with an unknown key or an invalid pattern is rejected with
        400. Platform administrators only.
      operationId: convertSearchCriteriaToAql
      requestBody:
        content:
          text/plain:
            schema:
              description: JSON text of an ArchiveSearchCriteriaForm.
              type: string
        description: The search criteria form (the same document as searchCriteriaForm, ArchiveSearchCriteriaForm)
          serialised as JSON and sent as text/plain, as JFrog's definition specifies.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
          description: The AQL items query, returned as a JSON string.
        '401':
          $ref: '#/components/responses/ColdStorageUnauthorized'
        '403':
          $ref: '#/components/responses/ColdStorageForbidden'
        '500':
          $ref: '#/components/responses/ColdStorageInternalServerError'
      summary: Convert a search criteria form to AQL
      tags:
      - archive
      x-oracle-source: https://docs.jfrog.com/administration/reference/convertsearchcriteriatoaql.md
  /api/retention/archive/policies/preview:
    post:
      description: Estimates how many items, and how many bytes, a policy would archive if it ran now, without saving
        or running it. Platform administrators only.
      operationId: previewArchivePolicyByModel
      requestBody:
        content:
          application/json:
            schema:
              description: A policy definition evaluated without saving it.
              properties:
                aqlQuery:
                  description: Optional within this object. AQL items query selecting the artifacts to archive.
                    Use either this or searchCriteriaForm; not valid with packageRetention.
                  type: string
                cronExp:
                  description: Optional within this object. Quartz cron expression for scheduled runs (decision
                    0010).
                  type: string
                description:
                  description: Optional within this object. Free text shown with the policy.
                  type: string
                durationInMinutes:
                  description: Optional within this object. Longest a run may take before it is stopped. Artifacts
                    already moved stay archived.
                  format: int64
