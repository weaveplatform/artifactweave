  /api/docker/{repo-key}/v2/promote:
    post:
      description: Promotes a Docker or OCI image from a local or federated repository to another local or federated
        repository of the same package type, either one tag or every tag of the image, optionally under a new image
        name or tag. The image is moved unless copy is true. Each tag folder is copied with its blobs linked rather
        than copied as bytes, and a multi-architecture tag takes its platform manifests with it. Helm charts in helmoci
        repositories are promoted the same way. The JFrog CLI's rt docker-promote calls it and checks only for 200.
        Needs Read on the source, and Delete there too for a move; Deploy on the target, and Delete there too when
        the target tag already exists (decision 0031). A move by a caller without Delete on the source answers 403
        before anything is copied. Artifactory 7.111.4 and later copies the image instead and answers 206, partial
        success; rt docker-promote fails on either status, and the 403 is a deviation registered by #378.
      operationId: promoteDockerImage
      parameters:
      - description: Required path parameter. Key of the local or federated Docker, OCI or Helm OCI repository
          that holds the image.
        in: path
        name: repo-key
        required: true
        schema:
          description: Repository key.
          minLength: 1
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DockerPromotionRequest'
        description: The image to promote and its destination.
        required: true
      responses:
        '200':
          content:
            text/plain:
              schema:
                description: A short confirmation for people; clients do not parse it.
                type: string
          description: The image was promoted.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The body was unreadable or lacked targetRepo or dockerRepository, or the source and target
            are not local or federated repositories of one package type. Errors use the Artifactory envelope, not the
            registry's, as for every JFrog REST operation under the Docker API path (decision 0031).
        '401':
          $ref: '#/components/responses/ArtifactoryBuildsApiUnauthorized'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller lacks Read on the source, Deploy on the target, or the Delete that a move or an
            overwritten target tag needs. Nothing is copied; Artifactory answers 206 to a move without Delete on the
            source, after copying.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The source repository, the target repository, the image or the tag does not exist.
      tags:
      - builds
      x-oracle-source: https://docs.jfrog.com/integrations/reference/promotedockerimage.md
