  /api/build/retention/{buildName}:
    post:
      description: Discards the runs of a build that the settings do not keep, with their documents and, when asked,
        their artifacts. Needs delete permission on the build.
      operationId: controlBuildRetention
      parameters:
      - description: Required path parameter. Name of the build. A name containing / arrives with the slash escaped
          as %2F, as the JFrog CLI sends it, and is matched as a single path segment.
        in: path
        name: buildName
        required: true
        schema:
          description: Build name.
          minLength: 1
          type: string
      - description: Optional query parameter. When true, the request is checked, then answers at once and the
          runs are discarded in the background. JFrog documents true as the default, but Artifactory discards before
          answering when the parameter is absent, and so does artifactweave; the JFrog CLI always sends it.
        in: query
        name: async
        schema:
          default: false
          description: Whether to discard in the background.
          type: boolean
      - description: Optional query parameter. Key of the project that owns the build. Omitted or default means
          builds outside any project, stored in the artifactory-build-info repository; a project key selects that
          project's <project>-build-info repository. The JFrog CLI sends it; JFrog does not document it.
        in: query
        name: project
        schema:
          description: Project key.
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildRetentionRequest'
        description: The retention settings.
        required: true
      responses:
        '200':
          description: Documented by JFrog for this operation; artifactweave answers 204 instead (deviation DV-031).
        '204':
          description: Discarded, or with async checked and discarding in the background. artifactweave answers 204,
            the only status the JFrog CLI accepts (decision 0014).
        '400':
          $ref: '#/components/responses/ArtifactoryBuildsApiBadRequest'
        '401':
          $ref: '#/components/responses/ArtifactoryBuildsApiUnauthorized'
        '403':
          $ref: '#/components/responses/ArtifactoryBuildsApiForbidden'
        '404':
          $ref: '#/components/responses/ArtifactoryBuildsApiNotFound'
      tags:
      - builds
      x-oracle-source: https://docs.jfrog.com/integrations/reference/controlbuildretention.md
