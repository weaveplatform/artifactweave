      - description: Optional query parameter. 1 deletes every run of the build; 0, the default, deletes only buildNumbers.
        in: query
        name: deleteAll
        schema:
          default: 0
          description: 0 or 1.
          enum:
          - 0
          - 1
          type: integer
      responses:
        '200':
          content:
            text/plain:
              schema:
                description: Plain-text confirmation.
