# The Builds API (build-info publish, read, append, promotion, retention, rename, deletion) and Docker
# image promotion, which JFrog documents in the same family.
# Structure from JFrog's documented definitions (x-oracle-source); prose is ours.
components:
  responses:
    ArtifactoryBuildsApiBadRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: The request was malformed, for example an unreadable build-info document, a missing required
        field, or a module that lists one file twice.
    ArtifactoryBuildsApiForbidden:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: 'The caller lacks the build permission the operation needs: read to view a build, deploy to upload
        or promote, deploy and delete to rename or overwrite, delete to discard or delete.'
    ArtifactoryBuildsApiNotFound:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: No build, run or project with the given name or number exists.
    ArtifactoryBuildsApiUnauthorized:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: Credentials were missing or rejected.
  schemas:
    AffectedIssue:
      description: An issue in the tracker that the build relates to.
      properties:
        aggregated:
          description: Optional within this object. Whether the issue was collected from an earlier build rather
            than this one.
          type: boolean
        key:
          description: Optional within this object. Issue key in the tracker, for example PROJ-123.
          type: string
        summary:
          description: Optional within this object. Issue title.
          type: string
        url:
          description: Optional within this object. Link to the issue.
          type: string
      type: object
    Agent:
      description: The CI server or tool that ran the build.
      properties:
        name:
          description: Optional within this object. Name of the CI server or tool, for example GitHub Actions or
            Jenkins.
          type: string
        version:
          description: Optional within this object. Version of that CI server or tool.
          type: string
      type: object
    AllBuildsResponse:
      description: Every build name the caller may read.
      properties:
        builds:
          description: Optional within this object. One entry per build name.
          items:
            $ref: '#/components/schemas/BuildSummary'
          type: array
        uri:
          description: Optional within this object. Absolute URL of /api/build.
          type: string
      type: object
    Artifact:
      description: One artifact a module produced. The upload does not check that the file exists; promotion and
        the build artifacts search find it later by its checksums and its build.name and build.number properties.
      properties:
        md5:
          description: Optional within this object. MD5 of the file, 32 lowercase hexadecimal characters. Used to
            find the stored file; the upload does not check it.
          type: string
        name:
          description: Optional within this object. File name, without the path.
          type: string
        originalDeploymentRepo:
          description: Optional within this object. Key of the repository the file was first deployed to.
          type: string
        path:
          description: Optional within this object. Repository-relative path of the file, including its name, without
            the repository key.
          type: string
        sha1:
          description: Optional within this object. SHA-1 of the file, 40 lowercase hexadecimal characters. Used to
            find the stored file; the upload does not check it.
          type: string
        sha256:
          description: Optional within this object. SHA-256 of the file, 64 lowercase hexadecimal characters.
          type: string
        type:
          description: Optional within this object. File type, usually the extension, for example jar or tgz.
          type: string
      type: object
    BuildAgent:
      description: The build tool that produced the build's modules.
      properties:
        name:
          description: Optional within this object. Name of the build tool, for example Maven, Gradle or Generic.
          type: string
        version:
          description: Optional within this object. Version of that build tool.
          type: string
      type: object
    BuildArtifact:
      description: One artifact of a build run, located in the repository that holds it.
      properties:
        name:
          description: Optional within this object. File name.
          type: string
        path:
          description: Optional within this object. Folder of the file inside the repository, without the name;
            . for the repository root.
          type: string
        repo:
          description: Optional within this object. Key of the repository holding the file.
          type: string
      type: object
    BuildInfo:
      description: 'A build-info document: one run of a build, with its modules, artifacts and dependencies. artifactweave
        stores the document as a JSON item in the build-info repository, at <name>/<number>-<started epoch milliseconds>.json
        (decision 0014).'
      properties:
        agent:
          allOf:
          - $ref: '#/components/schemas/Agent'
          description: Optional within this object. The CI server or tool that ran the build.
        artifactoryPluginVersion:
          description: Optional within this object. Version of the client or plugin that sent the document.
          type: string
        artifactoryPrincipal:
          description: Optional within this object. User that deployed the build's artifacts.
          type: string
        buildAgent:
          allOf:
          - $ref: '#/components/schemas/BuildAgent'
          description: Optional within this object. The build tool that produced the modules.
        buildRetention:
          allOf:
          - $ref: '#/components/schemas/BuildRetention'
          description: Optional within this object. Retention settings to apply to the build name after upload.
        durationMillis:
          description: Optional within this object. Duration of the run in milliseconds.
          format: int64
          type: integer
        issues:
          allOf:
          - $ref: '#/components/schemas/Issues'
          description: Optional within this object. Issue-tracker information collected for the run.
        licenseControl:
          allOf:
          - $ref: '#/components/schemas/LicenseControl'
          description: Optional within this object. License-check settings, stored and not acted on.
        modules:
          description: Optional within this object. Modules of the build.
          items:
            $ref: '#/components/schemas/BuildModule'
          type: array
        name:
          description: Optional within this object. Build name. Together with number and started it identifies the
            run.
          type: string
        number:
          description: Optional within this object. Build number. Several runs may share it.
          type: string
        properties:
          additionalProperties: true
          description: Optional within this object. Free-form string properties of the run, for example environment
            variables the client chose to record.
          type: object
        started:
          description: Optional within this object. When the run started, in the layout yyyy-MM-dd'T'HH:mm:ss.SSSZ,
            for example 2026-10-15T09:30:00.000+0000 (Go layout 2006-01-02T15:04:05.000-0700), the layout the JFrog
            CLI writes.
          type: string
        type:
          description: Optional within this object. Legacy build type.
          enum:
          - MAVEN
          - GRADLE
          - ANT
          - IVY
          - GENERIC
          type: string
        url:
          description: Optional within this object. Link to the run on the CI server.
          type: string
        vcs:
          description: Optional within this object. Version-control state the build was made from, one entry per
            repository.
          items:
            $ref: '#/components/schemas/VcsInfo'
          type: array
        version:
          description: Optional within this object. Schema version of the document. The JFrog CLI does not send
            it.
          type: string
      type: object
    BuildInfoResponse:
      description: One run's build-info document.
      properties:
        buildInfo:
          allOf:
          - $ref: '#/components/schemas/BuildInfo'
          description: Optional within this object. The stored build-info document.
        uri:
          description: Optional within this object. Absolute URL of the run.
          type: string
      type: object
    BuildModule:
      description: 'One module of a build: a unit the build tool produced, with its artifacts and dependencies.'
      properties:
        artifacts:
          description: Optional within this object. Artifacts the module produced.
          items:
            $ref: '#/components/schemas/Artifact'
          type: array
        dependencies:
          description: Optional within this object. Dependencies the module consumed.
          items:
            $ref: '#/components/schemas/Dependency'
          type: array
        id:
          description: Optional within this object. Module id in the build tool's notation. A module of type build
            names another build as <name>/<number>; clients follow such modules when searching a build's artifacts.
          type: string
        properties:
          additionalProperties: true
          description: Optional within this object. Free-form string properties of the module.
          type: object
        type:
          description: Optional within this object. Module type, for example generic, maven, gradle, docker, npm,
            go, python or build.
          type: string
      type: object
    BuildNumber:
      description: One run of a build.
      properties:
        started:
          description: Optional within this object. When the run started, in the layout yyyy-MM-dd'T'HH:mm:ss.SSSZ,
            for example 2026-10-15T09:30:00.000+0000 (Go layout 2006-01-02T15:04:05.000-0700), the layout the JFrog
            CLI writes.
          type: string
        uri:
          description: Optional within this object. Path of the run relative to the build, a slash followed by the
            build number.
          type: string
      type: object
    BuildPromotionRequest:
      description: Changes a build run's status and optionally moves or copies its files. JFrog's definition marks
        ciUser, timestamp, copy, artifacts, dependencies and failFast required, but the JFrog CLI omits all but
        failFast and Artifactory applies defaults, so artifactweave requires none of them.
      properties:
        artifacts:
          description: Optional within this object. Whether the run's artifacts are moved or copied. Defaults to
            true.
          type: boolean
        ciUser:
          description: Optional within this object. User of the CI server that requested the promotion, recorded
            with the status change. Omitted records the authenticated user.
          type: string
        comment:
          description: Optional within this object. Free-text comment recorded with the status change.
          type: string
        copy:
          description: Optional within this object. When true, files are copied to targetRepo; when false they are
            moved. Defaults to false.
          type: boolean
        dependencies:
          description: Optional within this object. Whether the run's dependencies are moved or copied. Defaults
            to false.
          type: boolean
        dryRun:
          description: Optional within this object. When true, reports what would happen without changing anything.
            Defaults to false.
          type: boolean
        failFast:
          description: Optional within this object. When true, the first error or warning aborts the promotion,
            which then changes nothing and answers 400; when false it continues, reports every error and answers 200.
            Defaults to true; the JFrog CLI always sends it.
          type: boolean
        properties:
          additionalProperties: true
          description: Optional within this object. Properties set on every promoted file, as a map from key to
            an array of values or a single value; each replaces the key's values. They are set on the files where
            they land, or where they are when no targetRepo is given.
          type: object
        scopes:
          description: Optional within this object. Dependency scopes to include; omitted means every scope. Scopes
            add to each other.
          items:
            description: Scope name.
            type: string
          type: array
        sourceRepo:
          description: Optional within this object. Only artifacts found in this repository are moved or copied.
            Omitted means any repository. Dependencies are found in any repository either way, as in Artifactory.
          type: string
        status:
          description: Optional within this object. New status recorded for the run, for example staged or released.
            Omitted records no promotion, as in Artifactory; files are still moved or copied and properties set.
          type: string
        targetRepo:
          description: Optional within this object. Repository the files are moved or copied to, each to the path
            it had. Omitted means no files move; only the status and properties change. May name a virtual repository,
            which deploys to its default deployment repository.
          type: string
        timestamp:
          description: Optional within this object. When the promotion was requested, in the layout yyyy-MM-dd'T'HH:mm:ss.SSSZ,
            for example 2026-10-15T09:30:00.000+0000 (Go layout 2006-01-02T15:04:05.000-0700), the layout the JFrog
            CLI writes. Omitted records the time the request arrived.
          type: string
      type: object
    BuildPromotionResponse:
      description: The promotion report.
      properties:
        messages:
          description: Optional within this object. One message per notable event. A promotion with no messages
            succeeded completely.
          items:
            $ref: '#/components/schemas/PromotionMessage'
          type: array
      type: object
    BuildRetention:
      description: Retention settings recorded with the build at upload. The upload that carries them applies them
        like a retention request for the build name, as far as the uploader may delete runs; later uploads without
        them discard nothing.
      properties:
        buildNumbersNotToBeDiscarded:
          description: Optional within this object. Build numbers kept whatever the other settings say.
          items:
            description: Build number.
            type: string
          type: array
        count:
          description: Optional within this object. Number of most recent runs to keep. Omitted, 0 or negative keeps
            every run.
          type: integer
        deleteBuildArtifacts:
          description: Optional within this object. Whether discarding a run also deletes its artifacts. Defaults
            to false.
          type: boolean
        minimumBuildDate:
          description: Optional within this object. Runs started before this time, in Unix epoch milliseconds, are
            discarded; a timestamp string is accepted too. Omitted keeps runs of any age.
          format: int64
          type: integer
      type: object
    BuildRetentionRequest:
      description: Which runs of a build to keep. The request discards the others once, as it is processed; it
        sets no lasting policy. A protected build number keeps its runs but they still count towards count.
      properties:
        buildNumbersNotToBeDiscarded:
          description: Optional within this object. Build numbers kept whatever the other settings say.
          items:
            description: Build number.
            type: string
          type: array
        count:
          description: Optional within this object. Number of most recent runs to keep. JFrog documents an integer;
            the JFrog CLI sends a JSON string such as "10", and artifactweave accepts either. 0 is refused, as
            Artifactory refuses it; omitted or negative keeps every run.
          x-go-type: json.Number
        deleteBuildArtifacts:
          description: Optional within this object. Whether discarding a run also deletes its artifacts. Defaults
            to false.
          type: boolean
        minimumBuildDate:
          description: Optional within this object. Runs started before this time are discarded, in the layout yyyy-MM-dd'T'HH:mm:ss.SSSZ,
            for example 2026-10-15T09:30:00.000+0000 (Go layout 2006-01-02T15:04:05.000-0700), the layout the JFrog
            CLI writes; Unix epoch milliseconds are accepted too. Omitted keeps runs of any age.
          type: string
          x-go-type: json.RawMessage
      type: object
    BuildRunsResponse:
      description: The runs of one build.
      properties:
        buildsNumbers:
          description: Optional within this object. One entry per run. A build number appears once per run, so it
            may repeat.
          items:
            $ref: '#/components/schemas/BuildNumber'
          type: array
        uri:
          description: Optional within this object. Absolute URL of the build.
          type: string
      type: object
    BuildSummary:
      description: One build name in the list of all builds.
      properties:
        lastStarted:
          description: Optional within this object. Started timestamp of the build's most recent run, in the layout
            yyyy-MM-dd'T'HH:mm:ss.SSSZ, for example 2026-10-15T09:30:00.000+0000 (Go layout 2006-01-02T15:04:05.000-0700),
            the layout the JFrog CLI writes.
          type: string
        uri:
          description: Optional within this object. Path of the build relative to /api/build, a slash followed by
            the build name.
          type: string
      type: object
    DeleteBuildsRequest:
      description: Selects runs of one build to delete.
      properties:
        buildName:
          description: Required within this object. Name of the build.
          type: string
        buildNumbers:
          description: Optional within this object. Build numbers to delete. A number deletes one run for each time
            it is listed, the earliest-started first, which is how the JFrog CLI replaces a number's runs with
            --overwrite. Ignored when deleteAll is true.
          items:
            description: Build number.
            type: string
          type: array
        deleteAll:
          description: Optional within this object. When true, every run of the build is deleted. Defaults to false.
          type: boolean
        deleteArtifacts:
          description: Optional within this object. Whether the deleted runs' artifacts are deleted too. Defaults
            to false.
          type: boolean
        project:
          description: Optional within this object. Key of the project that owns the build. Omitted means builds
            outside any project.
          type: string
      required:
      - buildName
      type: object
    Dependency:
      description: One dependency a module consumed.
      properties:
        id:
          description: Optional within this object. Identifier of the dependency in its package type's notation,
            for example group:artifact:version.
          type: string
        md5:
          description: Optional within this object. MD5 of the dependency, 32 lowercase hexadecimal characters.
          type: string
        requestedBy:
          description: Optional within this object. Chains of module or dependency ids that pulled this dependency
            in, outermost last.
          items:
            description: One chain of requesting ids.
            items:
              description: Id of a module or dependency.
              type: string
            type: array
          type: array
        scopes:
          description: Optional within this object. Scopes the dependency was used in, for example compile or test.
            Promotion can filter on them.
          items:
            description: Scope name.
            type: string
          type: array
        sha1:
          description: Optional within this object. SHA-1 of the dependency, 40 lowercase hexadecimal characters.
          type: string
        sha256:
          description: Optional within this object. SHA-256 of the dependency, 64 lowercase hexadecimal characters.
          type: string
        type:
          description: Optional within this object. File type, usually the extension.
          type: string
      type: object
    DockerPromotionRequest:
      description: Which image to promote, where to, and whether it moves or is copied. The JFrog CLI sends every
        field, with an empty string for each optional name or tag it was not given, so an empty string means the
        same as an omitted field.
      properties:
        copy:
          description: Optional within this object. When true the image is copied and the source keeps it; when
            false it is moved and leaves the source. Defaults to false.
          type: boolean
        dockerRepository:
          description: Required within this object. Name of the image in the source repository, including any namespace
            segments, for example library/nginx.
          type: string
        tag:
          description: Optional within this object. Tag to promote. Omitted or empty promotes every tag of the image.
          type: string
        targetDockerRepository:
          description: Optional within this object. Name the image takes in the target repository. Omitted or empty
            keeps dockerRepository.
          type: string
        targetRepo:
          description: Required within this object. Key of the local or federated repository the image is promoted
            to. It must have the source repository's package type.
          type: string
        targetTag:
          description: Optional within this object. Tag the image takes in the target repository. Omitted or empty
            keeps tag.
          type: string
      required:
      - targetRepo
      - dockerRepository
      type: object
    Issues:
      description: Issue-tracker information collected for the build.
      properties:
        affectedIssues:
          description: Optional within this object. Issues the build relates to.
          items:
            $ref: '#/components/schemas/AffectedIssue'
          type: array
        aggregateBuildIssues:
          description: Optional within this object. Whether issues from earlier builds were aggregated into this
            one.
          type: boolean
        aggregationBuildStatus:
          description: Optional within this object. Status of the earlier build that aggregation stops at, for example
            Released.
          type: string
        tracker:
          allOf:
          - $ref: '#/components/schemas/Tracker'
          description: Optional within this object. The tracker the issues come from.
      type: object
    LicenseControl:
      description: License-check settings recorded with the build. artifactweave stores them and does not act on
        them.
      properties:
        autoDiscover:
          description: Optional within this object. Whether licenses were discovered automatically.
          type: boolean
        includePublishedArtifacts:
          description: Optional within this object. Whether the build's own artifacts were included in license checks.
          type: boolean
        licenseViolationsRecipientsList:
          description: Optional within this object. Space-separated addresses notified about violations.
          type: string
        runChecks:
          description: Optional within this object. Whether license checks were requested.
          type: boolean
        scopesList:
          description: Optional within this object. Space-separated dependency scopes the checks covered.
          type: string
      type: object
    PromotionMessage:
      description: One line of a promotion report.
      properties:
        level:
          description: Optional within this object. Severity of the message. JFrog documents the levels in lower
            case; Artifactory sends its status levels' names, in upper case, and so does artifactweave.
          enum:
          - ERROR
          - WARNING
          - INFO
          type: string
        message:
          description: Optional within this object. What happened to one file or to the run.
          type: string
      type: object
    Tracker:
      description: The issue tracker the build's issues come from.
      properties:
        name:
          description: Optional within this object. Name of the issue tracker, for example JIRA.
          type: string
        version:
          description: Optional within this object. Version of the issue tracker.
          type: string
      type: object
    VcsInfo:
      description: Version-control state the build was made from.
      properties:
        branch:
          description: Optional within this object. Branch name.
          type: string
        message:
          description: Optional within this object. Commit message of the revision.
          type: string
        revision:
          description: Optional within this object. Revision or commit id.
          type: string
        url:
          description: Optional within this object. Repository URL.
          type: string
      type: object
paths:
  /api/build:
    get:
      description: Lists every build name the caller may read, with the start time of each build's most recent run.
      operationId: getAllBuilds
      parameters:
      - description: Optional query parameter. Key of the project that owns the build. Omitted or default means
          builds outside any project, stored in the artifactory-build-info repository; a project key selects that
          project's <project>-build-info repository.
        in: query
        name: project
        schema:
          description: Project key.
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllBuildsResponse'
          description: The build names.
        '401':
          $ref: '#/components/responses/ArtifactoryBuildsApiUnauthorized'
        '403':
          $ref: '#/components/responses/ArtifactoryBuildsApiForbidden'
      tags:
      - builds
      x-oracle-source: https://docs.jfrog.com/integrations/reference/getallbuilds.md
    put:
      description: Stores one run's build-info document. The artifacts in modules[].artifacts are not checked
        against stored files. Promotion and the build artifacts search later find each one as an item holding its
        checksums and carrying build.name and build.number equal to the document's name and number, and
        Artifactory's Builds UI needs the same to link it. Uploading a run that already exists overwrites it and
        needs delete permission as well as deploy. The JFrog CLI sends the vendor media type; application/json is accepted too.
      operationId: uploadBuild
      parameters:
      - description: Optional query parameter. Key of the project that owns the build. Omitted or default means
          builds outside any project, stored in the artifactory-build-info repository; a project key selects that
          project's <project>-build-info repository.
        in: query
        name: project
        schema:
          description: Project key.
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildInfo'
          application/vnd.org.jfrog.artifactory+json:
            schema:
              $ref: '#/components/schemas/BuildInfo'
        description: The build-info document.
        required: true
      responses:
        '200':
          description: Stored.
          headers:
            X-Checksum-Sha256:
              description: SHA-256 of the stored build-info document, which the JFrog CLI reports in its detailed
                summary.
              schema:
                description: 64 lowercase hexadecimal characters.
                type: string
        '400':
          $ref: '#/components/responses/ArtifactoryBuildsApiBadRequest'
        '401':
          $ref: '#/components/responses/ArtifactoryBuildsApiUnauthorized'
        '403':
          $ref: '#/components/responses/ArtifactoryBuildsApiForbidden'
      tags:
      - builds
      x-oracle-source: https://docs.jfrog.com/integrations/reference/uploadbuild.md
  /api/build/append/{buildName}/{buildNumber}:
    post:
      description: Adds modules to an existing run and stores the extended document. Needs deploy and delete permission
        on the build.
      operationId: appendBuild
      parameters:
      - description: Required path parameter. Name of the build. A name containing / arrives with the slash escaped
          as %2F, as the JFrog CLI sends it, and is matched as a single path segment.
        in: path
        name: buildName
        required: true
        schema:
          description: Build name.
          minLength: 1
          type: string
      - description: Required path parameter. Build number, a free-form string chosen by the CI system. Several
          runs may share one number; they differ in their started timestamp. A / arrives escaped as %2F.
        in: path
        name: buildNumber
        required: true
        schema:
          description: Build number.
          minLength: 1
          type: string
      - description: Optional query parameter. Selects one run of the build number by its started timestamp, in
          the layout yyyy-MM-dd'T'HH:mm:ss.SSSZ, for example 2026-10-15T09:30:00.000+0000 (Go layout 2006-01-02T15:04:05.000-0700),
          the layout the JFrog CLI writes. Omitted selects the most recent run with that number.
        in: query
        name: started
        schema:
          description: Started timestamp of the run.
          type: string
      - description: Optional query parameter. Key of the build-info repository holding the run. Omitted derives
          it from project.
        in: query
        name: buildRepo
        schema:
          description: Repository key.
          type: string
      - description: Optional query parameter. Key of the project that owns the build. Omitted or default means
          builds outside any project, stored in the artifactory-build-info repository; a project key selects that
          project's <project>-build-info repository.
        in: query
        name: project
        schema:
          description: Project key.
          type: string
      requestBody:
        content:
          application/json:
            schema:
              description: Modules to add to the run.
              items:
                $ref: '#/components/schemas/BuildModule'
              type: array
        description: Modules to append.
        required: true
      responses:
        '204':
          description: Appended.
        '400':
          $ref: '#/components/responses/ArtifactoryBuildsApiBadRequest'
        '401':
          $ref: '#/components/responses/ArtifactoryBuildsApiUnauthorized'
        '403':
          $ref: '#/components/responses/ArtifactoryBuildsApiForbidden'
        '404':
          $ref: '#/components/responses/ArtifactoryBuildsApiNotFound'
      tags:
      - builds
      x-oracle-source: https://docs.jfrog.com/integrations/reference/appendbuild.md
  /api/build/delete:
    post:
