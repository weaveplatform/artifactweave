  /api/build/promote/{buildName}/{buildNumber}:
    post:
      description: Records a status change for the latest run of a build number and optionally moves or copies
        its artifacts and dependencies to a target repository, setting properties on them. Needs deploy permission
        on the build; each file needs the repository permissions its move or copy needs, and a file that lacks
        them is reported rather than refused. The JFrog CLI sends the vendor media type.
      operationId: promoteBuild
      parameters:
      - description: Required path parameter. Name of the build. A name containing / arrives with the slash escaped
          as %2F, as the JFrog CLI sends it, and is matched as a single path segment.
        in: path
        name: buildName
        required: true
        schema:
          description: Build name.
          minLength: 1
          type: string
      - description: Required path parameter. Build number, a free-form string chosen by the CI system. Several
          runs may share one number; they differ in their started timestamp. A / arrives escaped as %2F.
        in: path
        name: buildNumber
        required: true
        schema:
          description: Build number.
          minLength: 1
          type: string
      - description: Optional query parameter. Key of the project that owns the build. Omitted or default means
          builds outside any project, stored in the artifactory-build-info repository; a project key selects that
          project's <project>-build-info repository.
        in: query
        name: project
        schema:
          description: Project key.
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildPromotionRequest'
          application/vnd.org.jfrog.artifactory.build.PromotionRequest+json:
            schema:
              $ref: '#/components/schemas/BuildPromotionRequest'
        description: What to promote and where.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildPromotionResponse'
          description: The promotion report.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildPromotionResponse'
          description: The request was malformed, or a fail-fast promotion met an error or a warning and changed
            nothing. The report says why.
        '401':
          $ref: '#/components/responses/ArtifactoryBuildsApiUnauthorized'
        '403':
          $ref: '#/components/responses/ArtifactoryBuildsApiForbidden'
        '404':
          $ref: '#/components/responses/ArtifactoryBuildsApiNotFound'
      tags:
      - builds
      x-oracle-source: https://docs.jfrog.com/integrations/reference/promotebuild.md
