  /api/federation/status/connectionStates/{repoKey}:
    get:
      description: Shows, for each member of one federated repository, whether events are flowing and how far behind
        delivery is. The cheapest status operation, suited to routine monitoring.
      operationId: getFederationConnectionDetails
      parameters:
      - description: Required path parameter. Key of the federated repository.
        in: path
        name: repoKey
        required: true
        schema:
          description: Repository key.
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Connection state of each member.
                properties:
                  memberConnections:
                    description: Optional within this object. One entry per member.
                    items:
                      description: One member connection.
                      properties:
                        disabled:
                          description: Optional within this object. True when sync to this member is turned off.
                          type: boolean
                        lagInMs:
                          description: Optional within this object. Age of the oldest undelivered event, in milliseconds.
                          format: int64
                          type: integer
                        localPlatformUrl:
                          description: Optional within this object. Base URL of this instance.
                          type: string
                        localRepoKey:
                          description: Optional within this object. Repository key on this instance.
                          type: string
                        queuedEvents:
                          description: Optional within this object. Events waiting for delivery.
                          format: int64
                          type: integer
                        remotePlatformUrl:
                          description: Optional within this object. Base URL of the member instance.
                          type: string
                        remoteRepoKey:
                          description: Optional within this object. Repository key on the member.
                          type: string
                        status:
                          description: 'Optional within this object. Dashboard state of the connection from the
                            local member to the remote one. HEALTHY: events flow promptly. DELAYED: HEALTHY with
                            lag above the threshold. ERROR: any underlying error state (generic, inactive target,
                            out of sync). PENDING_FS: waiting for a full sync. FULL_SYNC_RUNNING: a full sync is
                            preparing or running. DISABLED: the member is disabled. UNSUPPORTED: the remote member
                            cannot report status. READONLY: the member is receiving-only. N/A: the state cannot
                            be determined because a side is unreachable.'
                          enum:
                          - HEALTHY
                          - DELAYED
                          - ERROR
                          - PENDING_FS
                          - FULL_SYNC_RUNNING
                          - DISABLED
                          - UNSUPPORTED
                          - READONLY
                          - N/A
                          type: string
                        supported:
                          description: Optional within this object. False when the remote member cannot report federation
                            status; the connection then shows N/A or UNSUPPORTED. It is false when the peer speaks
                            a protocol major version this instance does not (decision 0021).
                          type: boolean
                      type: object
                    type: array
                type: object
          description: Connection state per member.
