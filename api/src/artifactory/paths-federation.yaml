          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not returned.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The server failed while handling the request.
