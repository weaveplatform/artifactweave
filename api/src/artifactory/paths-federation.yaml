paths:
  /api/federation/binaries/failures/delete:
    delete:
      description: 'Deletes binary transfer tasks of a federated repository that exhausted their retries: all of
        them, or only the task for one SHA-1. Use it once the missing content has been dealt with another way, for
        example re-deployed.'
      operationId: deleteFailedBinaryTasks
      parameters:
      - description: Required query parameter. Key of the federated repository.
        in: query
        name: repoKey
        required: true
        schema:
          description: Repository key.
          type: string
      - description: Optional query parameter. Delete only the task for this SHA-1. Omitted deletes every failed
          task of the repository.
        in: query
        name: sha1
        schema:
          description: SHA-1 hex digest.
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Deletion count.
                properties:
                  deletedTasks:
                    description: Optional within this object. Number of tasks deleted.
                    type: integer
                type: object
          description: The tasks were deleted.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request was malformed or a value is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller lacks the permission this operation needs.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The server failed while handling the request.
      summary: Delete failed binary transfer tasks
      tags:
      - federation
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/deletefailedbinarytasks.md
  /api/federation/binaries/failures/list:
    get:
      description: Lists binary transfer tasks of a federated repository that failed because the content could not
        be fetched from the originating member within the attempt limit (10 by default). Metadata for these items
        arrived; their content did not.
      operationId: getListOfFailedBinaryTasks
      parameters:
      - description: Required query parameter. Key of the federated repository.
        in: query
        name: repoKey
        required: true
        schema:
          description: Repository key.
          type: string
      - description: Optional query parameter. Page size. Defaults to 1000.
        in: query
        name: limit
        schema:
          default: 1000
          description: Page size.
          type: integer
      - description: Optional query parameter. Page number, starting at 1.
        in: query
        name: page
        schema:
          description: Page number.
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Failed tasks.
                items:
                  description: One failed task.
                  properties:
                    creationTime:
                      description: Optional within this object. Time the task was created, in epoch milliseconds.
                      format: int64
                      type: integer
                    failuresCount:
                      description: Optional within this object. Attempts made so far.
                      type: integer
                    repoKey:
                      description: Optional within this object. Federated repository the task belongs to.
                      type: string
                    sha1:
                      description: Optional within this object. SHA-1 of the content that could not be fetched.
                      type: string
                  type: object
                type: array
          description: The failed tasks on this page.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request was malformed or a value is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller lacks the permission this operation needs.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The server failed while handling the request.
      summary: List failed binary transfer tasks
      tags:
      - federation
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/getlistoffailedbinarytasks.md
  /api/federation/binaries/failures/replay:
    put:
      description: Queues failed binary transfer tasks again, all of a repository's or only the one for a SHA-1,
        with their attempt count reset.
      operationId: replayFailedBinaryTasks
      parameters:
      - description: Required query parameter. Key of the federated repository.
        in: query
        name: repoKey
        required: true
        schema:
          description: Repository key.
          type: string
      - description: Optional query parameter. Replay only the task for this SHA-1. Omitted replays every failed
          task of the repository.
        in: query
        name: sha1
        schema:
          description: SHA-1 hex digest.
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Replay count.
                properties:
                  replayTasks:
                    description: Optional within this object. Number of tasks queued again.
                    type: integer
                type: object
          description: The tasks were queued again.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request was malformed or a value is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller lacks the permission this operation needs.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The server failed while handling the request.
      summary: Replay failed binary transfer tasks
      tags:
      - federation
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/replayfailedbinarytasks.md
  /api/federation/configSync/{repoKey}:
    post:
      description: Sends this member's shared configuration of a federated repository to every other member, repairing
        drift left by a network failure. Only shared settings travel; each member keeps its own repository key and
        local-only settings (decision 0022).
      operationId: synchronizeFederatedMemberConfiguration
      parameters:
      - description: Required path parameter. Key of the federated repository.
        in: path
        name: repoKey
        required: true
        schema:
          description: Repository key.
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Result; its fields are not specified.
                type: object
          description: The configuration was sent to every reachable member.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request was malformed or a value is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller lacks the permission this operation needs.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The server failed while handling the request.
      summary: Push federated repository configuration to members
      tags:
      - federation
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/synchronizefederatedmemberconfiguration.md
  /api/federation/convertToLocal:
    post:
      description: Converts federated repositories back to local repositories, keeping their content and metadata.
        Allowed only for a repository whose federation has no other active members; remove the other members first.
      operationId: convertFederatedRepositoryToLocal
      requestBody:
        content:
          application/json:
            schema:
              description: Keys of the federated repositories to convert.
              items:
                description: One repository key.
                type: string
              type: array
        description: Keys of the federated repositories to convert.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                description: A confirmation message, or a map of repositories that could not be converted when some
                  of the list failed.
                oneOf:
                - description: Confirmation message when every repository was converted.
                  type: string
                - description: Per-repository failures when only part of the list was converted.
                  properties:
                    failedConversionRepositories:
                      additionalProperties:
                        description: Why one repository could not be converted.
                        type: string
                      description: Optional within this object. Map from repository key to the reason it could not
                        be converted.
                      type: object
                  type: object
          description: Every listed repository was converted.
        '400':
          content:
            application/json:
              schema:
                description: At least one repository could not be converted; the body names each and the reason.
                properties:
                  failedConversionRepositories:
                    additionalProperties:
                      description: Why one repository could not be converted.
                      type: string
                    description: Optional within this object. Map from repository key to the reason it could not
                      be converted.
                    type: object
                type: object
          description: At least one repository could not be converted; the body names each and the reason.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller lacks the permission this operation needs.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: A listed repository does not exist.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The server failed while handling the request.
      summary: Convert federated repositories to local
      tags:
      - federation
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/convertfederatedrepositorytolocal.md
  /api/federation/forceFullSync/{repoKey}:
    post:
      description: Starts a full synchronization of a federated repository, interrupting one already in progress.
        Use it when a full sync appears stuck.
      operationId: federatedRepositoryForceFullSync
      parameters:
      - description: Required path parameter. Key of the federated repository.
        in: path
        name: repoKey
        required: true
        schema:
          description: Repository key.
          type: string
      - description: Optional query parameter. Base URL of one member to synchronize with. Omitted means every other
          member.
        in: query
        name: mirror
        schema:
          description: Member base URL.
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                description: What was started.
                properties:
                  message:
                    description: Optional within this object. Summary of what was started.
                    type: string
                  resultPaths:
                    description: Optional within this object. Paths of report files the run writes, when any.
                    items:
                      description: One report path.
                      type: string
                    type: array
                type: object
          description: The full sync was started.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request was malformed or a value is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller lacks the permission this operation needs.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The server failed while handling the request.
      summary: Force a full sync of a federated repository
      tags:
      - federation
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/federatedrepositoryforcefullsync.md
  /api/federation/fullSync/{repoKey}:
    post:
      description: 'Runs a full synchronization: members compare their item sets by path and checksum and each side
        sends what the other lacks. Where both sides changed an item, the change with the later event time wins
        and the originating instance id breaks ties (decision 0022). With `isDry=true` nothing is transferred and
        the comparison writes a report of the differences.'
      operationId: federatedRepositoryFullSync
      parameters:
      - description: Required path parameter. Key of the federated repository.
        in: path
        name: repoKey
        required: true
        schema:
          description: Repository key.
          type: string
      - description: Optional query parameter. Base URL of one member to synchronize with. Omitted means every other
          member.
        in: query
        name: mirror
        schema:
          description: Member base URL.
          type: string
      - description: Optional query parameter. When true, compare only and write a report. Defaults to false.
        in: query
        name: isDry
        schema:
          default: false
          description: Compare only.
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                description: What was started.
                properties:
                  message:
                    description: Optional within this object. Summary of what was started.
                    type: string
                  resultPaths:
                    description: Optional within this object. Paths of report files the run writes, when any.
                    items:
                      description: One report path.
                      type: string
                    type: array
                type: object
          description: The full sync, or the comparison, was started.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request was malformed or a value is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller lacks the permission this operation needs.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The server failed while handling the request.
      summary: Run a full sync of a federated repository
      tags:
      - federation
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/federatedrepositoryfullsync.md
  /api/federation/inconsistentRepos:
    get:
      description: Lists federated repositories whose shared configuration differs from at least one member's. Repair
        them with the configuration sync operation.
      operationId: getListOfInconsistentFederatedRepositories
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Repositories whose configuration differs from a member's.
                items:
                  description: One repository.
                  type: string
                type: array
          description: The repositories with drift.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller lacks the permission this operation needs.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The server failed while handling the request.
      summary: List federated repositories with configuration drift
      tags:
      - federation
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/getlistofinconsistentfederatedrepositories.md
  /api/federation/migrate/{repoKey}:
    post:
      description: Converts a local repository into a federated repository with this instance as its only member,
        keeping content and metadata. Add members afterwards by updating the repository's `members`. Inside a project,
        every member of a federation must carry the same project key.
      operationId: convertLocalRepositoryToFederated
      parameters:
      - description: Required path parameter. Key of the local repository to convert.
        in: path
        name: repoKey
        required: true
        schema:
          description: Repository key.
          type: string
      responses:
        '200':
          content:
            text/plain:
              schema:
                description: Confirmation message.
                type: string
          description: The repository was converted; the body is a short confirmation.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request was malformed or a value is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller lacks the permission this operation needs.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The server failed while handling the request.
      summary: Convert a local repository to federated
      tags:
      - federation
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/convertlocalrepositorytofederated.md
  /api/federation/prioritization/{repoKey}:
    put:
      description: Gives a federated repository's outgoing event queue priority over standard queues when the outbox
        is busy. At most 10 repositories can be high priority at once.
      operationId: prioritizeFederatedRepository
      parameters:
      - description: Required path parameter. Key of the federated repository.
        in: path
        name: repoKey
        required: true
        schema:
          description: Repository key.
          type: string
      - description: Required query parameter. `high` or `standard`.
        in: query
        name: priorityLevel
        required: true
        schema:
          description: Priority level.
          enum:
          - high
          - standard
          type: string
      responses:
        '200':
          content:
            text/plain:
              schema:
                description: Confirmation message.
                type: string
          description: The priority was set; the body is a short confirmation.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The value is unknown or 10 repositories are already high priority.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller lacks the permission this operation needs.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The named resource does not exist.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The server failed while handling the request.
      summary: Set federated repository sync priority
      tags:
      - federation
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/prioritizefederatedrepository.md
  /api/federation/propagateCreatedTime:
    put:
      description: 'Instance-wide switch: when enabled, full sync gives each received item its original creation
        time instead of the time of transfer.'
      operationId: propagateCreationTimeMetadataDuringFullSync
      parameters:
      - description: Required query parameter. True to keep original creation times.
        in: query
        name: enabled
        required: true
        schema:
          description: Keep creation times.
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Result; its fields are not specified.
                type: object
          description: The setting was changed.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request was malformed or a value is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller lacks the permission this operation needs.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The server failed while handling the request.
      summary: Set whether full sync keeps creation times
      tags:
      - federation
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/propagatecreationtimemetadataduringfullsync.md
  /api/federation/reconnect:
    post:
      description: 'Re-establishes the link between the repository service and the federation sync worker, which
        runs inside the server process. The call restarts that worker: it re-reads the peer keys, re-opens the outbound
        queues and returns once the worker is running. Administrators only.'
      operationId: reconnectToFederationClient
      responses:
        '200':
          content:
            text/plain:
              schema:
                description: Confirmation message.
                type: string
          description: The sync worker is running again; the body is a short plain-text confirmation.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller lacks the permission this operation needs.
        '424':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The sync worker could not be started, for example because the peer keys could not be unsealed.
            The body names the cause.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The server failed while handling the request.
      summary: Reconnect the federation sync worker
      tags:
      - federation
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/reconnecttofederationclient.md
  /api/federation/recovery:
    post:
      description: Clears the error state of outgoing event queues that exhausted their retries, so delivery to
        members resumes without waiting for the auto-healing job (every 20 seconds by default). Applies to one
        repository, or to every federated repository when repoKey is omitted. A member whose missing events were
        already purged stays out of sync and needs a full sync.
      operationId: federationRecovery
      parameters:
      - description: Optional query parameter. Key of the federated repository to recover. Omitted means every federated
          repository.
        in: query
        name: repoKey
        schema:
          description: Repository key.
          type: string
      - description: 'Optional query parameter. When true, recovery runs even for queues that are not exhausted:
          every outgoing queue in scope has its error counters cleared and is retried at once. Defaults to false.'
        in: query
        name: force
        schema:
          default: false
          description: Reset all queues.
          type: boolean
        x-unverified: true
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Confirmation message.
                type: string
          description: Recovery was performed; the body is a short confirmation.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request was malformed or a value is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller lacks the permission this operation needs.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The server failed while handling the request.
      summary: Recover exhausted federation queues
      tags:
      - federation
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/federationrecovery.md
  /api/federation/removeMember:
    post:
      description: Removes a member, identified by its base URL, from every federation on this instance. The removed
        instance keeps its copies; it stops receiving events.
      operationId: removeFederationMember
      requestBody:
        content:
          text/plain:
            schema:
              description: Base URL of the member to remove.
              type: string
        description: Base URL of the member to remove.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Confirmation message.
                type: string
          description: The member was removed; the body is a short confirmation.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request was malformed or a value is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller lacks the permission this operation needs.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The server failed while handling the request.
      summary: Remove a member from every federation
      tags:
      - federation
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/removefederationmember.md
  /api/federation/state:
    get:
      deprecated: true
      description: Lists every federated repository on this instance with its members and sync state.
      operationId: getFederationSyncState
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Sync state per federated repository.
                items:
                  description: One federated repository.
                  properties:
                    key:
                      description: Optional within this object. Repository key on this instance.
                      type: string
                    members:
                      description: Optional within this object. The other members.
                      items:
                        description: One member.
                        properties:
                          remoteKey:
                            description: Optional within this object. Repository key on the member.
                            type: string
                          remoteUrl:
                            description: Optional within this object. Base URL of the member instance.
                            type: string
                        type: object
                      type: array
                    status:
                      description: Optional within this object. `SYNCING` in normal operation, `FULL_SYNC_RUNNING`
                        during a full sync, `OUT_OF_SYNC` when events are failing, `DISABLED` when federation is
                        turned off for the repository.
                      enum:
                      - SYNCING
                      - FULL_SYNC_RUNNING
                      - DISABLED
                      - OUT_OF_SYNC
                      type: string
                  type: object
