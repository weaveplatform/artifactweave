  /api/deb/{repoKey}/snapshot:
    post:
      description: Captures signed Debian metadata for one distribution from a local, remote,
        virtual or federated repository in a local Debian target. Package files remain in
        the source repository. The snapshot client root is
        /artifactory/api/deb/{targetRepo}/snapshots/{tag}.
      operationId: createDebianSnapshot
      parameters:
      - description: Required path parameter. Key of the repository to act on. The repository's package
          type must match this operation's ecosystem; a mismatch is rejected with 400.
        in: path
        name: repoKey
        required: true
        schema:
          description: Key of the repository to act on. The repository's package type must match this
            operation's ecosystem; a mismatch is rejected with 400.
          type: string
      - description: Optional query parameter. 1 queues persistent work and returns at once;
          0 or omitted waits for snapshot metadata to be written.
        in: query
        name: async
        schema:
          description: 1 queues the work, 0 waits for it.
          enum:
          - 0
          - 1
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              description: Debian snapshot request body.
              properties:
                distribution:
                  description: Required within this object. Debian distribution the snapshot is taken
                    for.
                  type: string
                tag:
                  description: Required within this object. Name given to the snapshot.
                  type: string
                targetRepo:
                  description: Required within this object. Repository that receives the snapshot.
                  type: string
              required:
              - tag
              - targetRepo
              - distribution
              type: object
        description: Snapshot request.
        required: true
      responses:
        '200':
