        is the JAR's own embedded POM for its coordinates (META-INF/maven/<groupId>/<artifactId>/pom.xml)
        when it has one, otherwise a default POM with the coordinates from the repository layout and the
        packaging the JAR's extension names. The POM is checked and indexed as a deployed POM is, so one
        whose coordinates differ from its path answers 409 unless the repository suppresses the check.
