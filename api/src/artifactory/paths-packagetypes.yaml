  /api/npm/{repoKey}/reindex:
    post:
      description: Rebuilds the package index of a local npm repository from the tarballs it holds and their
        properties. Each tarball on its canonical path is read again for its package.json, and its npm.disttag
        and npm.deprecated properties give the dist-tags and deprecations; packuments and version manifests
        are then served from the rebuilt index. Package metadata is derived from the index, so a reindex
        rewrites index entries and never files. Tarballs off their canonical path, or without a readable
        package.json, stay unindexed until the strict-layout conversion moves them. The rebuild is queued on
        the persistent work queue and runs in the background; the 200 says it was queued, not that it
        finished. Needs the Manage permission on the repository. Only npm local repositories are reindexed;
        any other repository, npm remote and virtual ones included, is rejected with 400.
      operationId: calculateNpmRepositoryMetadata
      parameters:
      - description: Required path parameter. Key of the repository to act on. The repository's package
          type must match this operation's ecosystem; a mismatch is rejected with 400.
        in: path
        name: repoKey
        required: true
        schema:
