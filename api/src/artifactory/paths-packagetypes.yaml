    post:
      description: 'Starts converting a local npm repository to strict layout. Every npm local repository here
        already behaves as one with "Enforce strict layout" on (decision 0034), so the conversion only moves
        tarballs: each .tgz that is stored but not indexed because it sits off its canonical path is moved to
        the canonical path its package.json gives, and indexed there. A tarball whose canonical path is already
        taken is skipped and left where it is, as is one without a readable package.json. The conversion is
        queued on the persistent work queue under the repository''s key and runs in the background: asking
        again while one is pending joins it, and running it again after it finished changes nothing. Needs
        the Manage permission on the repository. Only npm local repositories convert; any other repository
        is rejected with 400. JFrog documents the path and the permission but not the response body; artifactweave
        answers 202 with none.'
