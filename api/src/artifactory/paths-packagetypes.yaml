            operation's ecosystem; a mismatch is rejected with 400.
          type: string
      responses:
        '200':
          content:
            text/plain:
              schema:
                description: Plain-text acknowledgement that the npm index rebuild was queued.
                type: string
          description: The npm index rebuild was queued.
        '400':
