  /api/npm/auth:
    get:
      description: 'Returns .npmrc lines that authenticate npm to this server as the caller. A caller that
        sent its user name and password with Basic gets `_auth = <base64 of user:encrypted password>`, where
        the encrypted password is the value `GET /api/security/encryptedPassword` returns; the password
        itself is never returned. A caller that sent an access or reference token gets that same token back:
        as `_auth = <base64 of user:token>` when it sent the token as a Basic password, and as `_authToken =
        <token>` when it sent it as a Bearer token or in `X-JFrog-Art-Api`. No other line is sent. Needs an
        authenticated caller. Errors use the `{"errors":[{"status","message"}]}` envelope.'
      operationId: getNpmAuth
      responses:
        '200':
          content:
            text/plain:
              schema:
                description: .npmrc lines, one key = value setting per line.
                type: string
          description: The .npmrc lines for the caller.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected; the body carries the error envelope.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The server failed while processing the request; the body carries the error envelope.
      tags:
      - specific
      x-unverified: true
  /api/npm/{repoKey}/auth/{scope}:
    get:
      description: 'Returns .npmrc lines that point an npm scope at one npm repository and authenticate the
        caller to it. The first line is `@<scope>:registry=<registry URL>`, where the registry URL is
        `<base>/artifactory/api/npm/<repoKey>/`. The credential lines follow, each keyed to that URL without
        its scheme (`//<host>/artifactory/api/npm/<repoKey>/:`), so npm sends them to this registry only. A
        caller that sent Basic credentials gets `_password=<base64>` and `username=<user>`, where the base64
        is of its encrypted password, the value `GET /api/security/encryptedPassword` returns, or of the token
        it sent as its password; the password itself is never returned. A caller that sent a token as a
        Bearer token or in `X-JFrog-Art-Api` gets `_authToken=<token>` with that same token. Any npm
        repository can be named, local, remote or virtual. Needs an authenticated caller. Errors use the
        `{"errors":[{"status","message"}]}` envelope. Because this operation owns GET
        <registry>/auth/<scope>, a package named auth cannot have its version manifests read through the
        registry; its packument and tarballs are unaffected.'
      operationId: getNpmScopeAuth
      parameters:
      - description: Required path parameter. Key of the repository to act on. The repository's package
          type must match this operation's ecosystem; a mismatch is rejected with 400.
        in: path
        name: repoKey
        required: true
        schema:
          description: Key of the repository to act on. The repository's package type must match this
            operation's ecosystem; a mismatch is rejected with 400.
          type: string
      - description: Required path parameter. The npm scope the lines configure, without its leading @; one
          sent with it is read without it. It must be a scope npm accepts, made of letters, digits and
          `-_.!~*'()`; any other value is rejected with 400.
        in: path
        name: scope
        required: true
        schema:
          description: The npm scope, without its leading @; one sent with it is read without it. It must be
            a scope npm accepts, made of letters, digits and `-_.!~*'()`.
          minLength: 1
          type: string
      responses:
        '200':
          content:
            text/plain:
              schema:
                description: .npmrc lines, one setting per line, the first mapping the scope to the registry.
                type: string
          description: The .npmrc lines for the scope and the caller.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The repository is not an npm repository, or the scope is not one npm accepts; the body
            carries the error envelope.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected; the body carries the error envelope.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No repository has that key; the body carries the error envelope.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The server failed while processing the request; the body carries the error envelope.
      tags:
      - specific
      x-unverified: true
  /api/npm/{repoKey}/reindex:
    post:
      description: Rebuilds the package index of a local npm repository from the tarballs it holds and their
        properties. Each tarball on its canonical path is read again for its package.json, and its npm.disttag
        and npm.deprecated properties give the dist-tags and deprecations, latest among them; a package none
        of whose tarballs carries latest gets it on the version that ranks highest, a release above every
        pre-release and then the higher SemVer, written as that tarball's npm.disttag=latest. Packuments and
        version manifests are then served from the rebuilt index. Package metadata is derived from the index,
        so a reindex rewrites index entries and properties, never files. Tarballs off their canonical path,
        or without a readable package.json, stay unindexed until the strict-layout conversion moves them.
        The rebuild is queued on the persistent work queue under the repository's key and runs in the
        background; the 200, whose text is "Recalculating index for npm repository <repoKey> scheduled to
        run", says it was queued, not that it finished. Needs the Manage permission on the repository. Only
        npm local repositories are reindexed; any other repository, npm remote and virtual ones included, is
        rejected with 400.
      operationId: calculateNpmRepositoryMetadata
      parameters:
      - description: Required path parameter. Key of the repository to act on. The repository's package
          type must match this operation's ecosystem; a mismatch is rejected with 400.
        in: path
        name: repoKey
        required: true
        schema:
          description: Key of the repository to act on. The repository's package type must match this
            operation's ecosystem; a mismatch is rejected with 400.
          type: string
      responses:
        '200':
          content:
            text/plain:
              schema:
                description: 'Plain-text acknowledgement that the npm index rebuild was queued: "Recalculating
                  index for npm repository <repoKey> scheduled to run".'
                type: string
          description: The npm index rebuild was queued.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The repository is not an npm local repository; the body carries the error envelope.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected; the body carries the error envelope.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller lacks the permission this operation needs; the body carries the error
            envelope.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No repository has that key; the body carries the error envelope.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
