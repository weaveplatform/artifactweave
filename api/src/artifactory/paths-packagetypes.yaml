        files. Tarballs off their canonical path, or without a readable package.json, stay unindexed until
        the strict-layout conversion moves them. The rebuild is queued on the persistent work queue and runs
        in the background; the 200 says it was queued, not that it finished. Needs the Manage permission on
        the repository. Only npm local repositories are reindexed; any other repository, npm remote and virtual
        ones included, is rejected with 400.
