    post:
      description: 'Regenerates maven-metadata.xml for a folder of a local Maven, Gradle, Ivy or SBT
        repository: artifact-level metadata (versions, latest, release), snapshot-level metadata (timestamped
        builds) and plugin-level metadata. The package index of the files under the folder is rebuilt from
        the stored files first. Recurses into subfolders unless noneRecursive is true. The calculation is
        queued and the call answers once it is; a later read of the metadata waits for it. Needs Manage,
        Delete, Deploy, Annotate and Read on the folder. A missing path or a repository that is not local
        answers 404, and a repository of another package type 400. Metadata is rewritten automatically on
        deploy and delete, so this is a repair operation.'
