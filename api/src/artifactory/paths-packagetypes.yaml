          description: Key of the repository to act on. The repository's package type must match this
            operation's ecosystem; a mismatch is rejected with 400.
          type: string
      responses:
        '202':
          description: The conversion was queued.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The repository is not an npm local repository; the body carries the Artifactory error
            envelope.
        '401':
          content:
            application/json:
