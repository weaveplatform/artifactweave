  /api/npm/{repoKey}/auth/{scope}:
    get:
      description: Returns .npmrc lines that point an npm scope at one npm repository and authenticate the
        caller to it. The first line maps @<scope> to the repository's registry URL,
        <base>/artifactory/api/npm/<repoKey>/. The credential lines are those of the unscoped operation (_auth
        for Basic credentials, _authToken for a Bearer token), each prefixed with that registry URL without
        its scheme, so npm sends them to this registry only. Any npm repository can be named, local, remote or
        virtual. Needs an authenticated caller. Because this operation owns GET <registry>/auth/<scope>, a
        package named auth cannot have its version manifests read through the registry; its packument and
        tarballs are unaffected.
