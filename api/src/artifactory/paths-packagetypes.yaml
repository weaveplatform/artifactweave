    post:
      description: Rebuilds APKINDEX.tar.gz from the repository's stored Alpine packages. The work is queued and runs asynchronously. Supported for local and one-node federated repositories.
      operationId: calculateAlpineRepositoryMetadata
      parameters:
      - description: Required path parameter. Key of the repository to act on. The repository's package
          type must match this operation's ecosystem; a mismatch is rejected with 400.
        in: path
        name: repoKey
        required: true
        schema:
          description: Key of the repository to act on. The repository's package type must match this
            operation's ecosystem; a mismatch is rejected with 400.
          type: string
      responses:
        '200':
          content:
            text/plain:
              schema:
                description: Plain-text acknowledgement of the queued reindex.
                type: string
          description: The reindex was scheduled.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected; the body carries the error envelope.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller lacks the permission this operation needs; the body carries the error
            envelope.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The server failed while processing the request; the body carries the error envelope.
      tags:
      - specific
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/calculatealpinerepositorymetadata.md
      x-tier: implemented
