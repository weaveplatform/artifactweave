  /api/v1/migrations/npm/repositories/{repoKey}/migrate:
    post:
      description: 'Starts converting a local npm repository to strict layout. Every npm local repository here
        already behaves as one with "Enforce strict layout" on, so the conversion only moves tarballs: each
        .tgz that is stored but not indexed because it sits off its canonical path is moved to the canonical
        path its package.json gives, with its properties, and indexed there. A tarball without a readable
        package.json is left where it is, and so is one whose canonical path already holds the same content,
        which needs no move. A tarball whose canonical path holds anything else, or whose move the
        repository refuses, as its release and snapshot handling may, is left where it is too, and the
        conversion fails naming it, after moving every other tarball; the queue retries a failed conversion
        and parks it once its retries run out, for resume to queue again. The conversion is queued on the
        persistent work queue under the repository''s key and runs in the background: asking again while one
        is pending joins it, and running it again after it finished changes nothing. Needs the Manage
        permission on the repository. Only npm local repositories convert; any other repository is rejected
        with 400. Answers 202 with no body.'
      operationId: migrateNpmRepositoryToStrictLayout
      parameters:
      - description: Required path parameter. Key of the repository to act on. The repository's package
          type must match this operation's ecosystem; a mismatch is rejected with 400.
        in: path
        name: repoKey
        required: true
        schema:
          description: Key of the repository to act on. The repository's package type must match this
            operation's ecosystem; a mismatch is rejected with 400.
          type: string
      responses:
        '202':
          description: The conversion was queued.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The repository is not an npm local repository; the body carries the error envelope.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected; the body carries the error envelope.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller lacks the permission this operation needs; the body carries the error
            envelope.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No repository has that key; the body carries the error envelope.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The server failed while processing the request; the body carries the error envelope.
      tags:
      - specific
      x-unverified: true
  /api/v1/migrations/npm/repositories/{repoKey}/resume:
    post:
      description: Resumes a strict-layout conversion of a local npm repository that failed. The conversion,
        parked on the persistent work queue once its retries ran out, is queued again with a fresh set of
        attempts and carries on with the tarballs still off their canonical paths. A conversion cannot be
        cancelled, so a failed conversion is the only one to resume, and a repository without one is rejected
        with 400. Needs the Manage permission on the repository. Only npm local repositories convert; any
        other repository is rejected with 400. Answers 202 with no body.
      operationId: resumeNpmRepositoryMigration
      parameters:
