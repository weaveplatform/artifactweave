  /api/system/replications/block:
    post:
      description: Pauses replication for the whole instance. push and pull default to true; passing false for one
        leaves that direction unchanged. The pause flags fence worker admission; configuration does not execute a run. Administrators only.
      operationId: blockSystemReplication
      parameters:
      - description: Optional query parameter. true (default) blocks push replications; false leaves the current push setting unchanged.
        in: query
        name: push
        required: false
        schema:
          default: 'true'
          description: true or false as a string.
          type: string
      - description: Optional query parameter. true (default) blocks pull replications; false leaves the current pull setting unchanged.
        in: query
