    PackageTypeFederated:
      description: Package types a federated repository may serve. Every type is allowed except terraformbackend,
        vcs, p2, hex, aieditorextensions and jetbrainsplugins.
      enum:
      - alpine
      - cargo
      - composer
      - bower
      - chef
      - cocoapods
      - conan
      - conda
      - cran
      - debian
      - docker
      - helm
      - helmoci
      - huggingfaceml
      - gems
      - gitlfs
      - go
      - gradle
      - ivy
      - maven
      - npm
      - nuget
