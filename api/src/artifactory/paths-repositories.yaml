      parameters:
      - description: Required query parameter. Repository keys to return, comma-separated or repeated. At most 100.
        in: query
        name: names
        required: true
        schema:
          description: The parameter value.
          items:
            description: One value.
            type: string
          type: array
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  $ref: '#/components/schemas/RepositoryConfiguration'
                description: Configurations keyed by repository key.
                type: object
          description: Configurations keyed by repository key.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No names were given or more than the limit.
        '401':
          content:
            application/json:
              schema:
