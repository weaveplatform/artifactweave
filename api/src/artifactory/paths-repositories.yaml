  /api/v2/repositories/batch:
    delete:
      description: 'Deletes each listed repository independently and reports per key. The HTTP status summarises
        the batch: 200 all removed (a missing key still counts as removed), 207 mixed, and 403, 409, 424 or 500
        when every repository failed for that reason, with the statusMessage `Repositories batch removal failed`.
        Before any delete the whole batch is refused with the fail-fast shape: 400 when the list is empty, and
        otherwise at the first key that is blank, `auto-trashcan` or `jfrog-support-bundles` (400) or
        `artifactory-build-info` (403). Admin only.'
      operationId: deleteRepositories
      requestBody:
        content:
          application/json:
            schema:
              description: Keys of the repositories to delete. At least one, each non-empty.
              items:
                description: A repository key.
                minLength: 1
                type: string
              minItems: 1
              type: array
        description: Keys of the repositories to delete. At least one, each non-empty.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoBulkRemovalReport'
          description: Every repository was removed.
        '207':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoBulkRemovalReport'
          description: Some repositories were removed and some were not.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoBulkRemovalFailFastReport'
          description: The list is empty, or its first refused key is blank, `auto-trashcan` or
            `jfrog-support-bundles`; nothing was deleted.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The credentials were rejected.
        '403':
          content:
            application/json:
              schema:
                description: Either the fail-fast or the per-repository report.
                oneOf:
                - $ref: '#/components/schemas/RepoBulkRemovalFailFastReport'
                - $ref: '#/components/schemas/RepoBulkRemovalReport'
          description: The caller is not an admin, or the first refused key is `artifactory-build-info`
            (fail-fast shape; nothing was deleted), or every delete was forbidden (per-repository shape).
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoBulkRemovalReport'
          description: Every delete conflicted with a running import or a hook veto.
        '424':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoBulkRemovalReport'
          description: Every delete failed detaching federated members.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoBulkRemovalReport'
          description: Every delete failed unexpectedly.
      summary: Delete several repositories
      tags:
      - repositories
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/deleterepositories.md
