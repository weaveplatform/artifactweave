components:
  parameters:
    repoKey:
      description: Required path parameter. The repository key.
      in: path
      name: repoKey
      required: true
      schema:
        description: The repository key.
        type: string
  schemas:
    ArtifactDeleteFailure:
      description: One artifact that could not be deleted while removing a repository.
      properties:
        message:
          description: Required within this object. Why the artifact could not be deleted.
          type: string
        status:
          description: Required within this object. HTTP style status code describing the failure.
          type: integer
      required:
      - message
      - status
      type: object
    BatchRepositoryConfigurationArray:
      description: 'Request body of the batch create and update operations: one configuration per repository, mixed
        classes and package types allowed.'
      items:
        $ref: '#/components/schemas/RepositoryConfiguration'
      type: array
    ChecksumPolicyType:
      description: How a client-supplied checksum that disagrees with the uploaded bytes is handled. client-checksums
        rejects, server-generated-checksums accepts and records both values.
      enum:
      - client-checksums
      - server-generated-checksums
      type: string
    FederatedRepositoryConfiguration:
      description: 'Configuration of a federated repository: a local repository whose content and metadata are kept in
        sync with copies on other instances of this server (decision 0022). Members are instances of this server that
        trust each other through pairing (decision 0021). Deploys, deletes, moves, copies and property changes on any
        member are sent to the others as ordered events; where two members change the same item, the change with the
        later event time wins and the originating instance id breaks ties. A full sync repairs members that missed
        events.'
      properties:
        archiveBrowsingEnabled:
          description: Optional within this object. When true the contents of zip, tar and similar archives may be
            browsed and fetched through the archive entry URL. Defaults to false. Archive entries are served inline.
          type: boolean
        blackedOut:
          description: Optional within this object. When true the repository refuses every download and deploy.
            Defaults to false.
          type: boolean
        blockPushingSchema1:
          description: Optional within this object. When true pushes of Docker schema 1 manifests are rejected. Defaults
            to false; schema 1 manifests are rejected regardless of this setting. Rendered as a JSON boolean on
            federated repositories; the server also accepts the strings "true" and "false" on input.
          type: boolean
        calculateYumMetadata:
          description: Optional within this object. When true RPM metadata is regenerated automatically on deploy.
            Defaults to false. Stored only; not implemented for RPM.
          type: boolean
        cargoAnonymousAccess:
          description: Optional within this object. When true anonymous Cargo clients may download and search crates
            in a cargo repository. Stored only; Cargo is not served.
          type: boolean
        cargoInternalIndex:
          description: Optional within this object. When true a cargo repository serves a sparse index instead of a
            git index. Stored only; Cargo is not served.
          type: boolean
        cdnRedirect:
          description: Optional within this object. Setting for CDN-backed downloads. Stored only; downloads are never
            redirected to a CDN. Defaults to false. Rendered as a JSON boolean on federated repositories; the server
            also accepts the strings "true" and "false" on input.
          type: boolean
        checksumPolicyType:
          allOf:
          - $ref: '#/components/schemas/ChecksumPolicyType'
          description: Optional within this object. How a client-supplied checksum that disagrees with the uploaded
            bytes is handled. client-checksums rejects, server-generated-checksums accepts and records both values.
        ddebSupported:
          description: Optional within this object. When true a debian repository also indexes debug symbol packages
            (.ddeb). Stored only.
          type: boolean
        debianTrivialLayout:
          description: Optional within this object. When true the Debian repository uses the trivial (flat) layout.
            Stored only.
          type: boolean
        description:
          description: Optional within this object. Free text shown in listings. Not interpreted by the server.
            Reads carry it, as an empty string when unset.
          type: string
        disableProxy:
          description: Optional within this object. When true the platform default proxy is not used even if one
            is configured. Defaults to false.
          type: boolean
        dockerApiVersion:
          description: Optional within this object. Docker registry API version served. Only V2 is accepted.
          enum:
          - V2
          type: string
        dockerTagRetention:
          description: Optional within this object. Number of unique tags to keep per Docker image when maxUniqueTags
            is applied. Defaults to 1.
          type: integer
        downloadRedirect:
          description: Optional within this object. When true downloads answer with a redirect to a pre-signed object
            store URL instead of streaming the bytes, on any blob store that can sign (s3, gcs, azure or a mirror of
            them); a store that cannot sign streams. Defaults to false. Rendered as a JSON boolean on federated
            repositories; the server also accepts the strings "true" and "false" on input.
          type: boolean
        enableConanSupport:
          description: Optional within this object. Conan support flag of a conan repository. Stored only; Conan is not
            served.
          type: boolean
        enableFileListsIndexing:
          description: Optional within this object. Whether Debian file lists are indexed. Stored only. Rendered as a
            JSON boolean on federated repositories; the server also accepts the strings "true" and "false" on input.
          type: boolean
        encryptStates:
          description: Optional within this object. Whether Terraform backend state files are encrypted at rest.
            Defaults to true. The terraformbackend package type is not supported and the field is stored only.
          type: boolean
        environments:
          description: Optional within this object. Environments the repository belongs to, for example DEV or PROD.
            Mandatory when projectKey is set; a repository may belong to several environments. An administrator's read
            lists none as an empty array rather than leaving the field out.
          items:
            description: Optional within this object. An environment name.
            type: string
          type: array
        excludesPattern:
          description: Optional within this object. Comma-separated Ant-style patterns; matching paths are rejected
            on deploy and hidden on read. Defaults to the empty string, which excludes nothing.
          type: string
        forceConanAuthentication:
          description: Optional within this object. When true anonymous Conan requests receive 401. Stored only; Conan
            is not served.
          type: boolean
        forceMetadataNameVersion:
          description: Optional within this object. When true a Helm chart file name must match the name and version
            inside Chart.yaml or the upload is rejected. Defaults to false.
          type: boolean
        forceNonDuplicateChart:
          description: Optional within this object. When true uploading a Helm chart whose name and version already
            exist is rejected with 403. Defaults to false.
          type: boolean
        forceNugetAuthentication:
          description: Optional within this object. When true anonymous NuGet requests receive 401 instead of an
            anonymous 200. Defaults to false.
          type: boolean
        forceP2Authentication:
          description: Optional within this object. When true anonymous P2 requests receive 401. Stored only; P2 is not
            served.
          type: boolean
        handleReleases:
          description: Optional within this object. Whether Maven release artifacts may be deployed. Defaults to
            true.
          type: boolean
        handleSnapshots:
          description: Optional within this object. Whether Maven snapshot artifacts may be deployed. Defaults to
            true.
          type: boolean
        includesPattern:
          description: Optional within this object. Comma-separated Ant-style patterns; only paths matching at least
            one are stored or served. Defaults to **/* which matches everything; an empty string also means everything.
          type: string
        key:
          description: 'Required within this object. The repository key, unique without regard to case. At most 64
            characters, 58 on a remote repository and 63 on a local or federated repository of package type `docker`,
            `oci` or `helmoci`. It contains no white space and none of `! @ # $ % ^ & * ( ) + = { } [ ] : ; < > , / ?
            ~ | \ "` or a backtick. It is not one of `.`, `..`, `&`, `jfrog-usage-logs`, `jfrog-billing-logs`,
            `jfrog-logs`, `artifactory-build-info`, `artifactory-pipe-info`, `auto-trashcan`, `jfrog-support-bundle`,
            `_intransit`, `artifactory-edge-uploads` or `release-bundles` in any case, does not start with
            `jfrog-system-reserved` or `jfrog-artifactory-system` in any case, and does not end in `-cache`, the
            suffix that names a remote repository''s cache. A `docker`, `oci` or `helmoci` key has no upper case
            letters and no underscore. On create the key in the URL path wins over the body; after creation it is
            immutable. Repositories created inside a project are prefixed with the project key followed by a hyphen.'
          type: string
        maxUniqueSnapshots:
          description: Optional within this object. Maximum unique snapshot versions kept per Maven artifact; older
            ones are deleted five minutes after a deploy. 0 (the default) keeps everything and the effective minimum
            is 2.
          type: integer
        maxUniqueTags:
          description: Optional within this object. Maximum tags kept per Docker image; older tags are deleted when
            a push exceeds it. 0 (the default) keeps everything.
          type: integer
        members:
          description: Optional within this object. The federation members, including this instance. Each must be an
            instance of this server paired with this one for the `federated-repo/*` or `federated-repo/r` use case; an
            unpaired member is rejected with 400. Adding a member starts a full sync to it; removing one stops sync
            without deleting its copy. Every member must share the repository's package type and, inside a project, its
            project key.
          items:
            description: One federation member.
            properties:
              enabled:
                description: Optional within this object. Whether sync with this member is on. Rendered as a JSON
                  boolean; the server also accepts the strings "true" and "false" on input. Defaults to true. Turning
                  it off queues no events for the member until it is turned on again, after which a full sync catches
                  it up.
                type: boolean
              url:
                description: Required within this object. Full URL of the member repository on its instance, `<base
                  URL>/artifactory/<repo key>`. The repository key may differ between members.
                type: string
            required:
            - url
            type: object
          type: array
        notes:
          description: Optional within this object. Free text for operators. Not interpreted by the server.
            Reads carry it, as an empty string when unset; a read by anyone but an administrator always shows
            an empty string.
          type: string
        optionalIndexCompressionFormats:
          description: Optional within this object. Additional compression formats generated for Debian index files, for
            example bz2 or lzma. Stored only.
          items:
            description: Optional within this object. A compression format name.
            type: string
          type: array
        packageType:
          allOf:
          - $ref: '#/components/schemas/PackageTypeFederated'
          description: Optional within this object. Package types a federated repository may serve. Every type is
            allowed except terraformbackend, vcs, p2, hex, aieditorextensions and jetbrainsplugins. Defaults to
            generic. A type without a package handler is stored and echoed only.
        primaryKeyPairRef:
          description: Optional within this object. Name of the key pair used to sign metadata for formats that
            need it (Debian, RPM, Alpine, Terraform providers). Must name an existing key pair.
          type: string
        priorityResolution:
          description: Optional within this object. When true a virtual repository resolves this member before members
            without the flag. Defaults to false. Rendered as a JSON boolean on federated repositories; the server
            also accepts the strings "true" and "false" on input.
          type: boolean
        projectKey:
          description: Optional within this object. Key of the project that owns the repository. In a project, missing
            environments become DEV (decision 0013). The repository key is not checked for the project prefix. Changing
            it moves the repository between projects.
          type: string
        propertySets:
          description: Optional within this object. Names of property sets whose predefined properties are offered
            for items in this repository. Each name must exist in the property sets configuration. An
            administrator's read lists none as an empty array rather than leaving the field out.
          items:
            description: Optional within this object. A property set name.
            type: string
          type: array
        proxy:
          description: Optional within this object. Name of a configured proxy used for outbound connections. Must
            exist in the proxies configuration. Only meaningful on remote and federated repositories.
          type: string
        rclass:
          description: Required within this object. The repository class. It selects which of the class-specific
            fields apply and how the string-typed booleans are rendered on read. Always federated for this schema.
          enum:
          - federated
          type: string
        repoLayoutRef:
          description: Optional within this object. Name of the repository layout that parses paths into org, module,
            revision and classifier tokens, used by version search and snapshot cleanup. When omitted on create it
            defaults to sbt-default for sbt, ivy-default for ivy and maven-2-default for every other package type.
          type: string
        secondaryKeyPairRef:
          description: Optional within this object. Name of a second signing key pair, used while rotating the primary.
            Must name an existing key pair.
          type: string
        signedUrlTtl:
          description: Optional within this object. Read only. Lifetime in minutes of signed download URLs issued for
            this repository. The configured value cannot be changed through this API.
          readOnly: true
          type: integer
        snapshotVersionBehavior:
          description: 'Optional within this object. Naming of deployed Maven snapshots: unique (the default) rewrites
            the file name with a timestamp and build number, non-unique keeps the literal -SNAPSHOT name and overwrites,
            deployer keeps whatever the client sent.'
          enum:
          - unique
          - non-unique
          - deployer
          type: string
        suppressPomConsistencyChecks:
          description: Optional within this object. When true a POM whose coordinates disagree with its deploy path
            is accepted instead of rejected. Defaults to false.
          type: boolean
        terraformType:
          description: Optional within this object. Whether a Terraform repository serves MODULE or PROVIDER registry
            endpoints. Local and federated repositories only. The server accepts module and provider in any letter
            case and echoes upper case.
          enum:
          - MODULE
          - PROVIDER
          type: string
        xrayDataTtl:
          description: Optional within this object. Read only. Days that Xray retains scan data. Returned only; it has
            no effect.
          readOnly: true
          type: integer
        xrayIndex:
          description: Optional within this object. Whether Xray should index this repository. The flag is stored and
            echoed, but no scan runs. Defaults to false.
          type: boolean
        yumGroupFileNames:
          description: Optional within this object. Comma-separated names of the XML files that define an rpm
            repository's package groups. Stored only.
          type: string
        yumRootDepth:
          description: Optional within this object. Folder depth below which RPM metadata is calculated. Stored only.
          type: integer
      required:
      - key
      - rclass
      type: object
      x-go-type: repo.Config
      x-go-type-import:
        path: github.com/weaveplatform/artifactweave/pkg/repo
    LocalRepositoryConfiguration:
      description: 'Configuration of a local repository: the server stores uploads and generates the format''s metadata
