        name: g
        schema:
          description: Group id.
          type: string
      - description: Optional query parameter. Module name (Maven artifact id). At least one of g and a is required.
        in: query
        name: a
        schema:
          description: Module name.
          type: string
      - description: Optional query parameter. A version pattern with * or ? wildcards, matched against every
          version; or a module version such as 1.0-SNAPSHOT, whose latest integration version is returned.
        in: query
        name: v
        schema:
          description: Version pattern or module version.
          type: string
      - description: Optional query parameter. 1 asks for the upstream of remote repositories too; artifactweave
          answers it as 0 (default), from local repositories and caches, until remote repositories proxy.
