  /api/search/latestVersion:
    get:
      description: Returns the latest version of a module as plain text, using the repository layout to extract
        versions and the Mercury ordering Artifactory uses to compare them; integration versions are given by file
        version, such as 1.0-20260101.120000-1. Without v the latest release is returned. A v with * or ?
        returns the latest version of either kind that matches it; any other v, such as 1.0-SNAPSHOT, returns the
        latest integration version of that module version. Local repositories, remote caches and virtual
        repositories' members are consulted; remote=1 is accepted and answered from them too, until remote
        repositories proxy their upstream. The response is the bare version string, not JSON. Returns 404 with
        Artifactory's message when the module has no versions, no release, or no matching version. Anonymous
        callers may search when anonymous access is enabled.
