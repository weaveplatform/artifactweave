components:
  parameters:
    DockerImageName:
      description: Required path parameter. The image name inside the Docker repository, including any namespace
        segments.
      in: path
      name: imageName
      required: true
      schema:
        description: Image name as the Docker client sends it, for example library/nginx.
        minLength: 1
        type: string
    DockerRepoKey:
      description: Required path parameter. Key of the Docker, OCI or Helm OCI repository to list, matched without
        regard to case because Docker clients send references in lower case only.
      in: path
      name: repo-key
      required: true
      schema:
        description: Repository key.
        minLength: 1
        type: string
    Repos:
      description: 'Optional query parameter. Comma-separated repository keys that limit the search. Omitted means
        every repository the caller may read. Which classes are searched depends on the operation: most searches
        cover local repositories and remote caches, and only those that say so include virtual repositories.'
      in: query
      name: repos
      schema:
        description: Comma-separated repository keys.
        type: string
    XResultDetail:
      description: Optional header parameter. Widens each result from a bare uri to the file info document (info),
        the item properties (properties), or both (info, properties). Omitted returns only uri.
      in: header
      name: X-Result-Detail
      required: false
      schema:
        description: One of info, properties, or info, properties.
        enum:
        - info
        - properties
        - info, properties
        type: string
  responses:
    ArtifactorySearchesApiBadRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: The query was malformed, for example a missing required parameter, an AQL body over the size
        limit, or a pattern containing **.
    ArtifactorySearchesApiForbidden:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: The caller is authenticated but lacks read permission on the repositories searched, or is anonymous
        on a search that requires a named user.
    ArtifactorySearchesApiInternalServerError:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: The search failed inside the server. The envelope carries the reason.
    ArtifactorySearchesApiNotFound:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: The repository, image or path named in the request does not exist or is not visible to the caller.
    ArtifactorySearchesApiUnauthorized:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: Credentials were missing or rejected on a search that does not allow anonymous access.
  schemas:
    AqlRange:
      description: Describes which slice of the full result set the results array holds. Positions are zero-based
        and end_pos is exclusive.
      properties:
        end_pos:
          description: Optional within this object. Index one past the last returned result.
          type: integer
        limit:
          description: Optional within this object. The limit the query asked for, present only when .limit() was
            used.
          type: integer
        notification:
          description: Optional within this object. Present only when the server trimmed the result set at its hard
            limit; the text says so.
          type: string
        start_pos:
          description: Optional within this object. Index of the first returned result; equals the offset the query
            asked for.
          type: integer
        total:
          description: Optional within this object. Number of results in this response, not the number of matches
            overall.
          type: integer
      type: object
    ArchiveSearchResult:
      description: Result of the archive entry search, which Artifactory removed in 7.90.5. Kept for parity with
        JFrog's definition; artifactweave never returns it, because the search always answers 501.
      properties:
        results:
          description: Optional within this object. One entry per archive member name that matched.
          items:
            description: A matching archive member and the archives that contain it.
            properties:
              archiveUris:
                description: Optional within this object. File info URIs of the archives that contain the entry.
                items:
                  description: A file info URI under /api/storage.
                  format: uri
                  type: string
                type: array
              entry:
                description: Optional within this object. Path of the member inside the archive.
                type: string
            type: object
          type: array
      type: object
    ArtifactorySearchesApiBuildArtifactsRequest:
      description: Selects the build run whose artifacts should be listed, and narrows them.
      properties:
        buildName:
          description: Required within this object. Name of the build as published with jf rt build-publish.
          minLength: 1
          type: string
        buildNumber:
          description: Optional within this object. Build number, or LATEST for the most recently started run of
            the build. A number with several runs selects its most recently started run. Give either buildNumber or
            buildStatus, not both.
          type: string
        buildStatus:
          description: Optional within this object. Selects the most recently started run whose latest promotion
            has exactly this status, for example Released. Give either buildNumber or buildStatus, not both.
          type: string
        mappings:
          description: Optional within this object. Regular expressions, any of which a file's path must match to be
            returned. Omitted or empty returns every artifact of the build.
          items:
            description: One pattern to filter by.
            properties:
              input:
                description: Optional within this object. Go regular expression (RE2) that must match the whole path
                  of the file relative to its repository, for example (.+)-sources.jar. An empty input is ignored;
                  an invalid one is a 400.
                type: string
            type: object
          type: array
        repos:
          description: Optional within this object. Repository keys to look in. A remote key stands for its cache
            and a virtual key for its members. Omitted searches every readable repository.
          items:
            description: A repository key.
            type: string
          type: array
      required:
      - buildName
      type: object
    BadChecksumSearchResult:
      description: Items whose checksum declared by the uploading client differs from, or is missing against, the
        checksum the server computed from the content.
      properties:
        results:
          description: Optional within this object. At most 10,000 entries; the server stops counting at that cap.
          items:
            description: One item with a disputed checksum.
            properties:
              clientMd5:
                description: Optional within this object. The checksum the client declared on upload, or an empty
                  string when none was sent. Despite the name the field carries the checksum of the type requested.
                type: string
              serverMd5:
                description: Optional within this object. The checksum the server computed from the stored content.
                type: string
              uri:
                description: Optional within this object. File info URI of the item under /api/storage.
                type: string
            type: object
          type: array
      type: object
    BuildArtifactsSearchResult:
      description: Download URIs of the artifacts a build produced.
      properties:
        results:
          description: Optional within this object. One entry per artifact.
          items:
            description: One build artifact.
            properties:
              downloadUri:
                description: Optional within this object. Absolute URL from which the artifact can be downloaded,
                  rendered through the base URL resolver.
                format: uri
                type: string
            type: object
          type: array
      type: object
    BuildDependencySearchResult:
      description: Builds that list the given artifact among their dependencies.
      properties:
        results:
          description: Optional within this object. One entry per build run.
          items:
            description: One build run.
            properties:
              uri:
                description: Optional within this object. URI of the build run under /api/build.
                type: string
            type: object
          type: array
      type: object
    CreationSearchResult:
      description: Items created inside the requested time window.
      properties:
        results:
          description: Optional within this object. One entry per item.
          items:
            description: One created item.
            properties:
              created:
                description: Optional within this object. Creation time in ISO 8601 with milliseconds and offset.
                format: date-time
                type: string
              uri:
                description: Optional within this object. File info URI of the item under /api/storage.
                type: string
            type: object
          type: array
      type: object
    DatesSearchResult:
      description: Items with at least one of the requested date fields inside the window. Only the fields named
        in dateFields are present on each entry.
      properties:
        results:
          description: Optional within this object. One entry per item.
          items:
            description: One item and the date fields that were requested.
            properties:
              created:
                description: Optional within this object. Creation time, present when dateFields includes created.
                format: date-time
                type: string
              lastDownloaded:
                description: Optional within this object. Last download time, present when dateFields includes lastDownloaded.
                  Note the storage API's stats view returns the same instant as epoch milliseconds.
                format: date-time
                type: string
              lastModified:
                description: Optional within this object. Last modification time, present when dateFields includes
                  lastModified.
                format: date-time
                type: string
              uri:
                description: Optional within this object. File info URI of the item under /api/storage.
                type: string
            type: object
          type: array
      type: object
    ErrorDetail:
      description: One entry of the Artifactory error envelope.
      properties:
        message:
          description: Required within this object. Human-readable reason.
          minLength: 1
          type: string
        status:
          description: Optional within this object. The HTTP status repeated inside the body.
          type: integer
      required:
      - message
      type: object
    GavcSearchResult:
      description: Items matching the Maven coordinates. With specific=false each entry carries uri; with specific=true
        the entry carries downloadUri, ext, version and classifier instead.
      properties:
        results:
          description: Optional within this object. One entry per matching item.
          items:
            description: One matching item in either the default or the specific shape.
            properties:
              classifier:
                description: Optional within this object. Maven classifier taken from the layout, present only with
                  specific=true.
                type: string
              downloadUri:
                description: Optional within this object. Absolute download URL, present only with specific=true.
                format: uri
                type: string
              ext:
                description: Optional within this object. File extension taken from the layout, present only with
                  specific=true.
                type: string
              uri:
                description: Optional within this object. File info URI under /api/storage, present only with specific=false.
                type: string
              version:
                description: Optional within this object. Version taken from the layout, present only with specific=true.
                type: string
            type: object
          type: array
      type: object
    LatestVersionByPropertiesResult:
      description: The highest version found among items carrying a lowercase version property, and the items that
        carry it.
      properties:
        artifacts:
          description: Optional within this object. The files that carry the winning version when listFiles=1;
            empty otherwise.
          items:
            description: One file at the latest version.
            properties:
              uri:
                description: Optional within this object. Absolute download URL of the file.
                format: uri
                type: string
            type: object
          type: array
        version:
          description: Optional within this object. The winning version string, compared with Maven version ordering.
          type: string
      type: object
    LicenseSearchResult:
      description: Items tagged with licence information. artifactweave stores licence tags as ordinary properties
        and this search reads them; automatic discovery is not supported.
      properties:
        results:
          description: Optional within this object. One entry per item and licence.
          items:
            description: One item with its licence status.
            properties:
              found:
                description: Optional within this object. Licence name discovered by automatic detection. Always
                  empty in artifactweave because autofind is not implemented.
                type: string
              license:
                description: Optional within this object. Licence name stored on the item.
                type: string
              status:
                description: 'Optional within this object. Approval status of the licence: approved, unapproved,
                  neutral or unknown.'
                enum:
                - approved
                - unapproved
                - neutral
                - unknown
                type: string
              uri:
                description: Optional within this object. File info URI of the item under /api/storage.
                type: string
            type: object
          type: array
      type: object
    PatternSearchResult:
      description: Files matching an Ant path pattern inside one repository.
      properties:
        files:
          description: Optional within this object. Paths relative to the repository root, in the order found.
          items:
            description: A repository-relative file path.
            type: string
          type: array
        repositoryUri:
          description: Optional within this object. Absolute storage URI of the repository that was searched.
          format: uri
          type: string
        sourcePattern:
          description: Optional within this object. The pattern as received, including the repository key prefix.
          type: string
      type: object
    UriSearchResult:
      description: 'The common search result: a list of file info URIs. With X-Result-Detail each entry also carries
        the file info fields and, when requested, a properties map.'
      properties:
        results:
          description: Optional within this object. One entry per matching item; empty when nothing matched.
          items:
            description: One matching item.
            properties:
              uri:
                description: Optional within this object. File info URI of the item under /api/storage, rendered
                  through the base URL resolver.
                type: string
            type: object
          type: array
      type: object
    UsageSearchResult:
      description: Items that have not been downloaded since the given instant.
      properties:
        results:
          description: Optional within this object. One entry per item.
          items:
            description: One unused item.
            properties:
              lastDownloaded:
                description: Optional within this object. Last download time in ISO 8601, or absent when the item
                  was never downloaded.
                format: date-time
                type: string
              uri:
                description: Optional within this object. File info URI of the item under /api/storage.
                type: string
            type: object
          type: array
      type: object
    VersionSearchResult:
      description: Versions found for the given Maven group and artifact, ordered newest first.
      properties:
        results:
          description: Optional within this object. One entry per distinct version.
          items:
            description: One version.
            properties:
              integration:
                description: Optional within this object. True for integration (snapshot) versions, false for releases.
                type: boolean
              version:
                description: Optional within this object. The version string as the layout extracted it.
                type: string
            type: object
          type: array
      type: object
paths:
  /api/docker/{repo-key}/v2/_catalog:
    get:
      description: Lists the image names of one Docker, OCI or Helm OCI repository, in the shape of the registry _catalog
        extension. An image is a folder holding at least one manifest. Names are sorted case-insensitively with ties
        broken by byte order, and paginated with n and last as the tags list is, so clients can reuse their registry
        pagination code. Needs Read; images the caller cannot read are left out (decision 0031). This operation lists
        one repository with bare image names; the registry-wide /v2/_catalog lists every repository the caller can read,
        each name prefixed with its repository key as <repo>/<image> (decision 0003). Errors are registry errors with
        OCI codes. Remote and virtual repositories are refused until upstream fetching and member resolution exist.
      operationId: listDockerRepositories
      parameters:
      - $ref: '#/components/parameters/DockerRepoKey'
      - description: Optional query parameter. Maximum number of names to return. Omitted returns every name. When
          more names follow, the response carries a Link header to the next page.
        in: query
        name: n
        schema:
          description: Page size, a positive integer.
          type: integer
      - description: Optional query parameter. The last image name of the previous page; the response starts after
          it.
        in: query
        name: last
        schema:
          description: An image name.
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                description: The registry catalogue document.
                properties:
                  repositories:
                    description: Optional within this object. Image names in the repository, sorted.
                    items:
                      description: An image name, for example library/nginx.
                      type: string
                    type: array
                type: object
          headers:
            Link:
              description: Present only when more results follow. Names the next page with rel="next", carrying the
                same n and, as last, the final entry of this page, in the form the OCI distribution specification gives.
              schema:
                description: An RFC 8288 link to the next page, for example <...?n=50&last=v1.2>; rel="next".
                type: string
          description: The image names, possibly a page of them.
        '400':
          $ref: '#/components/responses/ArtifactorySearchesApiBadRequest'
        '401':
          $ref: '#/components/responses/ArtifactorySearchesApiUnauthorized'
        '403':
          $ref: '#/components/responses/ArtifactorySearchesApiForbidden'
        '404':
          $ref: '#/components/responses/ArtifactorySearchesApiNotFound'
        '405':
          description: The repository is a remote or virtual repository, which the registry does not serve yet; the
            body is a registry error with the code UNSUPPORTED.
        '500':
          $ref: '#/components/responses/ArtifactorySearchesApiInternalServerError'
      tags:
      - searches
      - handwritten
      x-handwritten: true
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/listdockerrepositories.md
  /api/docker/{repo-key}/v2/parentManifests:
    post:
      description: Finds the multi-platform manifest lists that reference a given image manifest, so a caller can
        learn which fat tags would change if the platform image were deleted. Only indexes in the same repository are
        found. Needs Read on the image (decision 0031). Errors use the Artifactory envelope, as for every JFrog REST operation
        under the Docker API path.
      operationId: findParentManifestLists
      parameters:
      - $ref: '#/components/parameters/DockerRepoKey'
      requestBody:
        content:
          application/json:
            schema:
              description: Identifies one image manifest by name and tag.
              properties:
                dockerRepository:
                  description: Required within this object. Image name inside the repository.
                  type: string
                tag:
                  description: Required within this object. Tag of the platform-specific manifest.
                  type: string
              required:
              - dockerRepository
              - tag
              type: object
        description: The platform-specific image to look up.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Parent manifest lists of the queried image.
                properties:
                  parentManifestLists:
                    description: Optional within this object. One entry per manifest list that references the image.
                    items:
                      description: One referencing manifest list.
                      properties:
                        digest:
                          description: Optional within this object. Digest of the manifest list, as sha256:hex.
                          type: string
                        dockerRepository:
                          description: Optional within this object. Image name the manifest list belongs to.
                          type: string
                        tags:
                          description: Optional within this object. Tags that currently point at the manifest list.
                          items:
                            description: A tag name.
                            type: string
                          type: array
                      type: object
                    type: array
                type: object
          description: The manifest lists that include the manifest; empty when none does.
        '400':
          $ref: '#/components/responses/ArtifactorySearchesApiBadRequest'
        '401':
          $ref: '#/components/responses/ArtifactorySearchesApiUnauthorized'
        '403':
          $ref: '#/components/responses/ArtifactorySearchesApiForbidden'
        '404':
          $ref: '#/components/responses/ArtifactorySearchesApiNotFound'
        '500':
          $ref: '#/components/responses/ArtifactorySearchesApiInternalServerError'
      tags:
      - searches
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/findparentmanifestlists.md
  /api/docker/{repo-key}/v2/{imageName}/tags/list:
    get:
      description: Lists the tags of one image in the shape of the registry tags endpoint. The tags are the image's
        tag folders that hold a manifest; digest folders are not tags, which matches the digest-named entries Artifactory
        leaves out from 7.90.1. Tags are sorted case-insensitively, as the OCI distribution specification requires, with
        ties broken by byte order. n limits the page and last continues after the given tag; when more tags follow, the
        response carries a Link header to the next page, as the registry does. An image with stored manifests but no tags
        answers an empty list, and an unknown image answers 404. Needs Read on the image (decision 0031). Errors are registry
        errors with OCI codes. Remote and virtual repositories are refused until upstream fetching and member resolution
        exist.
      operationId: listDockerTags
      parameters:
      - $ref: '#/components/parameters/DockerRepoKey'
      - $ref: '#/components/parameters/DockerImageName'
      - description: Optional query parameter. Maximum number of tags to return. Omitted returns every tag. When
          more tags follow, the response carries a Link header to the next page.
        in: query
        name: n
        schema:
          description: Page size, a positive integer.
          type: integer
      - description: Optional query parameter. The last tag of the previous page; the response starts after it.
        in: query
        name: last
        schema:
          description: A tag name.
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                description: The registry tags document.
                properties:
                  name:
                    description: Optional within this object. The image name that was queried.
                    type: string
                  tags:
                    description: Optional within this object. Tag names, sorted.
                    items:
                      description: A tag name.
                      type: string
                    type: array
                type: object
          headers:
            Link:
              description: Present only when more results follow. Names the next page with rel="next", carrying the
                same n and, as last, the final entry of this page, in the form the OCI distribution specification gives.
              schema:
                description: An RFC 8288 link to the next page, for example <...?n=50&last=v1.2>; rel="next".
                type: string
          description: The tags, possibly a page of them.
        '400':
          $ref: '#/components/responses/ArtifactorySearchesApiBadRequest'
        '401':
          $ref: '#/components/responses/ArtifactorySearchesApiUnauthorized'
        '403':
          $ref: '#/components/responses/ArtifactorySearchesApiForbidden'
        '404':
          $ref: '#/components/responses/ArtifactorySearchesApiNotFound'
        '405':
          description: The repository is a remote or virtual repository, which the registry does not serve yet; the
            body is a registry error with the code UNSUPPORTED.
        '500':
          $ref: '#/components/responses/ArtifactorySearchesApiInternalServerError'
      tags:
      - searches
      - handwritten
      x-handwritten: true
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/listdockertags.md
  /api/search/aql:
    post:
      description: 'Runs an Artifactory Query Language query. The body is the query text, not JSON, and is limited
        to 6,000 characters; longer bodies are rejected with 400. A query has the form domain.find(criteria).include(fields).sort({"$asc"|"$desc":[fields]}).offset(n).limit(n),
        and may add .transitive() (accepted and ignored) and .distinct(bool) (default true). The JFrog CLI emits
        the suffixes in the order include, sort, offset, transitive, limit. Domains are items, properties, builds,
        build.promotions and the dotted secondary domains reachable from them; the archive.entries domain is not
        supported. Criteria are JSON objects: {"field":value} means $eq; {"field":{"$op":value}} with $eq, $ne,
        $gt, $gte, $lt, $lte, $match, $nmatch, $before and $last; $and and $or combine them and siblings are an
        implicit $and; {"@key":value} and {"@*":value} address properties; {"$msp":[...]} matches on a single property.
        Wildcards * and ? apply only with $match and $nmatch and are matched case-sensitively. sort, offset and
        limit are refused unless include names only fields of the primary domain, and sort only on fields in the
        output. An empty query is rejected with 400. An authenticated user is required, and anonymous callers are
        refused with 403; a user without admin rights may query the items domain, must include repo, path and
        name, and receives only rows they may read that the include and exclude patterns of the repository accept.
        With a token scoped build:<repository>/<path>:r such a user may also query builds and build.promotions;
        a builds query must include name, number and repo, and returns only the runs they may read. For
        such a user, a scan-factor header above 1 (by default the configured non-admin scan factor) multiplies the rows
        a limited query reads before that filtering, so the limit can still be met. Every query returns at most
        the configured result cap (500,000 by default), its own limit included, and a trimmed result says
        so in range.notification. The response is indented unless compact=true is in the query string; a stream
        header is accepted and changes nothing. The actions items.delete(criteria).dryRun("true"|"false") and
        properties.update(criteria).keys(key,...).newValue(value).dryRun(...) change what their criteria select
        and answer in the same shape, listing the rows they change, or would change on a dry run. An action without
        dryRun is a dry run, and takes no include, sort, offset or limit. properties.update names item fields as
        item.<field> and replaces the values of the keys an item already has. A user without admin rights changes
        only rows they may read and also delete, or annotate; other rows are left out.'
      operationId: searchAql
      requestBody:
        content:
          text/plain:
            schema:
              description: Query text, at most 6,000 characters.
              type: string
        description: The AQL query as plain text.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                description: AQL result document.
                properties:
                  range:
                    allOf:
                    - $ref: '#/components/schemas/AqlRange'
                    description: Optional within this object. Describes which slice of the full result set the results
                      array holds. Positions are zero-based and end_pos is exclusive.
                  results:
                    description: Optional within this object. One object per matching record. Items carry repo,
                      path (. for the root, no leading slash), name, type, size, created, created_by, modified,
                      modified_by and updated by default; include widens or narrows the fields and may add a properties
                      array or a stats object. Builds carry build.<field> and promotions build.promotion.<field>,
                      every field by default.
                    items:
                      description: One record of the queried domain with the included fields.
                      type: object
                    type: array
                type: object
          description: The matching records and the range they cover.
        '400':
          $ref: '#/components/responses/ArtifactorySearchesApiBadRequest'
        '401':
          $ref: '#/components/responses/ArtifactorySearchesApiUnauthorized'
        '403':
          $ref: '#/components/responses/ArtifactorySearchesApiForbidden'
        '500':
          $ref: '#/components/responses/ArtifactorySearchesApiInternalServerError'
      tags:
      - handwritten
      - searches
      x-handwritten: true
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/searchaql.md
  /api/search/archive:
    get:
      description: Search for entries inside archives by member name. Artifactory removed Archive Search in 7.90.5.
        artifactweave keeps the operation for parity with JFrog's definition and always answers 501; use AQL
        instead.
      operationId: searchArchive
      parameters:
      - description: Optional query parameter. Member name or fragment to look for inside archives; * and ? wildcards
          are allowed.
        in: query
        name: name
        schema:
          description: Archive member name pattern.
          type: string
      - $ref: '#/components/parameters/Repos'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveSearchResult'
