components:
  responses:
    SecurityBadRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: The request body or parameters are invalid.
    SecurityForbidden:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: The caller is authenticated but lacks the admin role or the Manage permission the operation requires.
    SecurityInternalServerError:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: The server failed while serving the request.
    SecurityNotFound:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: The named resource does not exist.
    SecurityUnauthorized:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: No credentials were supplied or they were rejected.
  schemas:
    ApiKeyResponse:
      description: The API key of the calling user. The server never issues API keys.
      properties:
        apiKey:
          description: Optional within this object. The key value, which starts with AKCp8 and is at least 73 characters
            long. Never populated.
          type: string
      type: object
    CertificateInfo:
      description: A client certificate that remote repositories may present to upstreams through clientTlsCertificate.
      properties:
        certificateAlias:
          description: Optional within this object. Alias used as the identifier and referenced by repositories.
          type: string
        fingerPrint:
          description: Optional within this object. SHA-256 fingerprint. The key is spelled fingerPrint, with a capital
            P.
          type: string
        issuedBy:
          description: Optional within this object. Issuer of the certificate.
          type: string
        issuedOn:
          description: Optional within this object. Not-before time.
          format: date-time
          type: string
        issuedTo:
          description: Optional within this object. Subject of the certificate.
          type: string
        validUntil:
          description: Optional within this object. Not-after time.
          format: date-time
          type: string
      type: object
    GroupConfiguration:
      description: The legacy group document. The Access v2 group is the same record with snake_case names.
      properties:
        adminPrivileges:
          description: Optional within this object. Members act as admins. Defaults to false.
          type: boolean
        autoJoin:
          description: Optional within this object. New users join automatically. Defaults to false. The seeded
            readers group has it set.
          type: boolean
        description:
          description: Optional within this object. Free-text description.
          type: string
        name:
          description: Optional within this object. Group name, the identifier. Must equal the path parameter on
            PUT and POST.
          type: string
        policyManager:
          description: Optional within this object. Xray role flag, stored without effect.
          type: boolean
        realm:
          description: Optional within this object. Server-owned realm, internal for local groups. Ignored on write.
          type: string
        realmAttributes:
          description: Optional within this object. Server-owned realm detail for external groups; empty for local
            groups.
          type: string
        reportsManager:
          description: Optional within this object. Xray role flag, stored without effect.
          type: boolean
        userNames:
          description: Optional within this object. Member user names. Returned only when the read passes includeUsers=true.
            On PUT it replaces the membership and the response is 201.
          items:
            description: A user name.
            type: string
          type: array
        watchManager:
          description: Optional within this object. Xray role flag, stored without effect.
          type: boolean
      type: object
    GroupListItem:
      description: One entry of the legacy group listing.
      properties:
        name:
          description: Optional within this object. Group name.
          type: string
        uri:
          description: Optional within this object. Absolute URL of the group's detail operation.
          format: uri
          type: string
      type: object
    KeyPairInput:
      description: A signing key pair used for Debian, Alpine, RPM, Helm provenance and Terraform provider signing.
        Private material is write-only and stored as a sealed column (decision 0017).
      properties:
        alias:
          description: Required within this object. Alias embedded in the public key material and shown to package
            clients; not an identifier.
          type: string
        pairName:
          description: Required within this object. Unique name of the pair; it is the identifier in every other
            key-pair operation and in a repository's primaryKeyPairRef and secondaryKeyPairRef fields.
          type: string
        pairType:
          description: Required within this object. RSA for Alpine signing; GPG for Debian, RPM and Opkg metadata,
            Helm provenance and Terraform provider registries.
          enum:
          - RSA
          - GPG
          type: string
        passphrase:
          description: Optional within this object. Passphrase protecting privateKey, if any. Stored sealed and
            never returned.
          type: string
          writeOnly: true
        privateKey:
          description: Required within this object. PEM or ASCII-armored private key. Accepted on create, update
            and verify, never returned.
          type: string
          writeOnly: true
        publicKey:
          description: Required within this object. PEM or ASCII-armored public key. This is the only key material
            a read returns.
          type: string
        vaultKey:
          description: Optional within this object. Name of an external vault key to use instead of privateKey.
            Accepted but not used; a pair that sets it without privateKey is rejected with 400.
          type: string
        vaultPublicKey:
          description: Optional within this object. Location of the public key in an external vault when vaultKey
            is used. Accepted and ignored.
          properties:
            key:
              description: Optional within this object. Field name inside the vault entry.
              type: string
            path:
              description: Optional within this object. Vault path holding the key.
              type: string
          type: object
      required:
      - pairName
      - pairType
      - alias
      - privateKey
      - publicKey
      type: object
    KeyPairSummary:
      description: The readable projection of a key pair. Reads never include private material or the passphrase.
      properties:
        alias:
          description: Optional within this object. Alias embedded in the key.
          type: string
        pairName:
          description: Optional within this object. Pair name, the identifier.
          type: string
        pairType:
          description: Optional within this object. RSA or GPG.
          type: string
        publicKey:
          description: Optional within this object. The public key material.
          type: string
      type: object
    LegacyTokenDetails:
      description: One token in the legacy listing.
      properties:
        expiry:
          description: Optional within this object. Expiry as Unix seconds; absent for non-expiring tokens.
          type: integer
        issued_at:
          description: Optional within this object. Issue time as Unix seconds.
          type: integer
        issuer:
          description: Optional within this object. Issuing service id, for example jfrt@ followed by the service
            id.
          type: string
        refreshable:
          description: Optional within this object. Whether a refresh token was issued.
          type: boolean
        subject:
          description: Optional within this object. Subject in the form jfac@<id>/users/<name>.
          type: string
        token_id:
          description: Optional within this object. Identifier used to revoke the token.
          type: string
      type: object
    LegacyTokenList:
      description: The legacy token listing.
      properties:
        tokens:
          description: Optional within this object. Tokens visible to the caller; admins see all.
          items:
            $ref: '#/components/schemas/LegacyTokenDetails'
          type: array
      type: object
    LegacyTokenResponse:
      description: The legacy token create or refresh response. The same token is also visible through /access/api/v1/tokens.
      properties:
        access_token:
          description: Optional within this object. The JWT access token.
          type: string
        expires_in:
          description: Optional within this object. Lifetime in seconds; 0 means the token never expires.
          type: integer
        refresh_token:
          description: Optional within this object. Present only when refreshable was true.
          type: string
        scope:
          description: Optional within this object. The granted scope string.
          type: string
        token_type:
          description: Optional within this object. Always Bearer.
          type: string
      type: object
    PasswordChangeRequest:
      description: A password change for a user named in the body, proven by the current password.
      properties:
        newPassword1:
          description: Required within this object. The new password. Must satisfy the password policy.
          type: string
        newPassword2:
          description: Required within this object. The new password again; must equal newPassword1.
          type: string
        oldPassword:
          description: Required within this object. The user's current password, also when an administrator
            changes another user's password. An expired current password is accepted.
          type: string
        userName:
          description: Required within this object. The user whose password changes.
          type: string
      required:
      - userName
      - oldPassword
      - newPassword1
      - newPassword2
      type: object
    PasswordExpirationPolicy:
      description: Platform-wide password expiry. Responses carry enabled as a JSON boolean and passwordMaxAge as
        a JSON integer; requests may send either as a quoted string.
      properties:
        enabled:
          description: Optional within this object. Whether internal passwords expire. Defaults to false. Accepted
            as true or "true".
          type: boolean
        notifyByEmail:
          description: Optional within this object. Whether users are emailed before expiry. Defaults to true and
            has no effect until a mail server is configured.
          type: boolean
        passwordMaxAge:
          description: Optional within this object. Days a password stays valid once enabled. Defaults to 60. Accepted
            as a number or a numeric string.
          type: integer
      type: object
    PermissionTarget:
      description: 'A version 1 permission target: repository targets plus include and exclude patterns and per-principal
        action codes. Virtual repositories cannot be targets. Every target is stored in the Access v2 shape and
        converted on the wire (decision 0006).'
      properties:
        excludesPattern:
          description: Optional within this object. Comma-separated Ant patterns excluded from the target. Defaults
            to the empty string.
          type: string
        includesPattern:
          description: Optional within this object. Comma-separated Ant patterns of paths the target covers. Defaults
            to "**" (everything).
          type: string
        name:
          description: Optional within this object. Target name. The path parameter wins when both are present;
            a mismatch is a 400.
          type: string
        principals:
          description: Optional within this object. The grants. Omitted or empty means the target grants nothing
            until Access v2 or a later PUT populates it.
          properties:
            groups:
              additionalProperties:
                description: Action codes granted to one group.
                items:
                  description: One action code; see users.
                  enum:
                  - m
                  - d
                  - w
                  - n
                  - r
                  - mxm
                  - x
                  type: string
                type: array
              description: Optional within this object. Map from group name to the action codes granted to its members.
              type: object
            users:
              additionalProperties:
                description: Action codes granted to one user.
                items:
                  description: 'One action code: r read, w deploy, n annotate, d delete, m manage, mxm manage Xray
                    metadata, x distribute.'
                  enum:
                  - m
                  - d
                  - w
                  - n
                  - r
                  - mxm
                  - x
                  type: string
                type: array
              description: Optional within this object. Map from user name to the action codes granted to that user.
              type: object
          type: object
        repositories:
          description: Required within this object. Repository keys the target applies to. The literals ANY, ANY
            LOCAL and ANY REMOTE expand to every repository of that class, including remote caches. A virtual key
            is rejected with 400.
          items:
            description: A repository key or one of the ANY literals.
            type: string
          type: array
      required:
      - repositories
      type: object
    PermissionTargetListItem:
      description: One entry of a permission target listing.
      properties:
        name:
          description: Optional within this object. Target name.
          type: string
        uri:
          description: Optional within this object. Absolute URL of the target's detail operation, built from the
            resolved base URL.
          format: uri
          type: string
      type: object
    PermissionTargetV2:
      description: A version 2 permission target with separate sections for repositories, builds and release bundles.
        Keys mix kebab-case and camelCase.
      properties:
        build:
          allOf:
          - $ref: '#/components/schemas/PermissionTargetV2Section'
          description: Optional within this object. Grants on build-info. Its repositories list is fixed to `artifactory-build-info`;
            an omitted or empty list stands for it, and any other value is a 400. A PUT that omits this section
            deletes it.
        name:
          description: Optional within this object. Target name, at most 64 characters. The path parameter wins;
            a mismatch is a 400.
          type: string
        releaseBundle:
          allOf:
          - $ref: '#/components/schemas/PermissionTargetV2Section'
          description: Optional within this object. Grants on release bundles. An omitted or empty repositories list
            is stored as `release-bundles`. Stored without effect; release bundles are not served. A PUT that omits
            it deletes it.
        repo:
          allOf:
          - $ref: '#/components/schemas/PermissionTargetV2Section'
          description: 'Optional within this object. One section of a version 2 target: targets, patterns and grants.'
      type: object
    PermissionTargetV2Section:
      description: 'One section of a version 2 target: targets, patterns and grants.'
      properties:
        actions:
          description: Optional within this object. The grants, by user and by group.
          properties:
            groups:
              additionalProperties:
                description: Action names granted to one group.
                items:
                  description: One action name; see users.
                  enum:
                  - read
                  - write
                  - annotate
                  - delete
                  - manage
                  - managedXrayMeta
                  - distribute
                  type: string
                type: array
              description: Optional within this object. Map from group name to granted action names.
              type: object
            users:
              additionalProperties:
                description: Action names granted to one user.
                items:
                  description: One action name. managedXrayMeta and distribute are accepted and stored but have
                    no effect.
                  enum:
                  - read
                  - write
                  - annotate
                  - delete
                  - manage
                  - managedXrayMeta
                  - distribute
                  type: string
                type: array
              description: Optional within this object. Map from user name to granted action names.
              type: object
          type: object
        exclude-patterns:
          description: Optional within this object. Ant patterns excluded from the section. Defaults to [""], which
            excludes nothing.
          items:
            description: One Ant exclude pattern.
            type: string
          type: array
        include-patterns:
          description: Optional within this object. Ant patterns, each at most 1024 characters, of paths the section
            covers. Defaults to ["**"].
          items:
            description: One Ant include pattern.
            type: string
          type: array
        repositories:
          description: Optional within this object. Repository keys or the literals ANY, ANY LOCAL and ANY REMOTE.
            Required in practice for the repo section; an empty list grants nothing.
          items:
            description: A repository key or one of the ANY literals.
            type: string
          type: array
      type: object
    SecurityInfoMessage:
      description: A confirmation message returned by several mutating operations.
      properties:
        info:
          description: Optional within this object. Human-readable confirmation of what changed, as free text without
            a fixed format.
          type: string
      type: object
    SecurityStatusMessage:
      description: A status code plus message pair.
      properties:
        message:
          description: Optional within this object. Human-readable detail.
          type: string
        status:
          description: Optional within this object. Outcome word such as success; mirrors the HTTP status rather
            than adding information.
          type: string
      type: object
    TrustedKey:
      description: A stored trusted public key.
      properties:
        alias:
          description: Optional within this object. The alias given on upload.
          type: string
        fingerprint:
          description: Optional within this object. Fingerprint derived from the key.
          type: string
        issued_by:
          description: Optional within this object. Key owner read from the key.
          type: string
        issued_on:
          description: Optional within this object. Key creation time read from the key.
          format: date-time
          type: string
        key:
          description: Optional within this object. The ASCII-armored public key.
          type: string
        kid:
          description: Optional within this object. Server-assigned key identifier used to delete the key.
          type: string
        valid_until:
          description: Optional within this object. Key expiry read from the key; absent when it never expires.
          format: date-time
          type: string
      type: object
    TrustedKeyInput:
      description: A public GPG key trusted for verifying signed release bundles.
      properties:
        alias:
          description: Required within this object. Human-readable alias; must be unique.
          type: string
        public_key:
          description: Required within this object. ASCII-armored public key.
          type: string
      required:
      - alias
      - public_key
      type: object
    TrustedKeyList:
      description: The trusted key listing.
      properties:
        keys:
          description: Optional within this object. Every stored trusted key.
          items:
            $ref: '#/components/schemas/TrustedKey'
          type: array
      type: object
    UserConfiguration:
      description: The legacy user document. On PUT the fields name, email and password are required; on POST only
        the supplied fields change. Reads never return password. The Access v2 user is the same record with snake_case
        names and lower-case status values.
      properties:
        admin:
          description: Optional within this object. Grants every permission. Defaults to false. The seeded admin
            user cannot be demoted while it is the last admin.
          type: boolean
        disableUIAccess:
          description: Optional within this object. Stored without effect; no UI is served. Defaults to false.
          type: boolean
        email:
          description: Optional within this object. Email address. Required on PUT.
          type: string
        groups:
          description: Optional within this object. Group names the user belongs to. On PUT the list replaces the
            membership; unknown groups are a 400.
          items:
            description: A group name.
            type: string
          type: array
        internalPasswordDisabled:
          description: Optional within this object. When true the user authenticates only through tokens or an external
            realm and password is not required. Defaults to false.
          type: boolean
        lastLoggedIn:
          description: Optional within this object. Server-owned time of the last successful authentication in ISO-8601
            with milliseconds. Absent until the user has logged in.
          format: date-time
          type: string
        mfaStatus:
          description: Optional within this object. Server-owned multi-factor state. Always NONE.
          enum:
          - NONE
          - ENABLED
          - DISABLED
          type: string
        name:
          description: Optional within this object. User name, the identifier. Must equal the path parameter on
            PUT and POST.
          type: string
        password:
          description: Optional within this object. Clear-text password, hashed with Argon2id on receipt and never
            returned. Required on PUT unless internalPasswordDisabled is true.
          type: string
          writeOnly: true
        policyManager:
          description: Optional within this object. Xray role flag, stored and echoed but without effect.
          type: boolean
        policyViewer:
          description: Optional within this object. Xray role flag, stored and echoed but without effect.
          type: boolean
        profileUpdatable:
          description: Optional within this object. Whether the user may change their own profile and password.
            Defaults to true.
          type: boolean
        realm:
          description: Optional within this object. Server-owned authentication realm, internal for local users.
            Ignored on write.
          type: string
        reportsManager:
          description: Optional within this object. Xray role flag, stored and echoed but without effect.
          type: boolean
        status:
          description: Optional within this object. Server-owned account state in the upper-case legacy spelling;
            Access v2 reports the same state in lower case.
          enum:
          - ENABLED
          - DISABLED
          - LOCKED
          type: string
        watchManager:
          description: Optional within this object. Xray role flag, stored and echoed but without effect.
          type: boolean
      type: object
    UserListItem:
      description: One entry of the legacy user listing.
      properties:
        name:
          description: Optional within this object. User name.
          type: string
        realm:
          description: Optional within this object. Authentication realm, internal for local users.
          type: string
        uri:
          description: Optional within this object. Absolute URL of the user's detail operation.
          format: uri
          type: string
      type: object
    UserLockPolicy:
      description: Account lockout after failed logins.
      properties:
        enabled:
          description: Optional within this object. Whether accounts lock. Defaults to false.
          type: boolean
        loginAttempts:
          description: Optional within this object. Failed attempts before the account locks. Defaults to 5; must
            be at least 1 when enabled.
          type: integer
      type: object
paths:
  /api/gpg/key/private:
    put:
      description: Stores the instance-wide GPG private key used to sign Debian and Alpine metadata. Admin only.
        The key is sealed at rest and never returned.
      operationId: setGpgPrivateKey
      requestBody:
        content:
          text/plain:
            schema:
              description: ASCII-armored private key block.
              type: string
        description: The ASCII-armored private key.
        required: true
      responses:
        '200':
          content:
            text/plain:
              schema:
                description: Confirmation text.
                type: string
          description: The key was stored.
        '400':
          $ref: '#/components/responses/SecurityBadRequest'
        '401':
          $ref: '#/components/responses/SecurityUnauthorized'
        '403':
          $ref: '#/components/responses/SecurityForbidden'
        '500':
          $ref: '#/components/responses/SecurityInternalServerError'
      summary: Set the GPG private key
      tags:
      - security
      x-oracle-source: https://docs.jfrog.com/administration/reference/setgpgprivatekey.md
  /api/gpg/key/public:
    get:
      description: Returns the instance-wide GPG public key so package clients can verify signed metadata. Readable
        by any authenticated user; 404 until a key is set.
      operationId: getGpgPublicKey
      responses:
        '200':
          content:
            text/plain:
              schema:
                description: ASCII-armored public key block.
                type: string
          description: The public key.
        '401':
          $ref: '#/components/responses/SecurityUnauthorized'
        '403':
          $ref: '#/components/responses/SecurityForbidden'
        '404':
          $ref: '#/components/responses/SecurityNotFound'
        '500':
          $ref: '#/components/responses/SecurityInternalServerError'
      summary: Get the GPG public key
      tags:
      - security
      x-oracle-source: https://docs.jfrog.com/administration/reference/getgpgpublickey.md
    put:
      description: Stores the instance-wide GPG public key that matches the private key. Admin only.
      operationId: setGpgPublicKey
      requestBody:
        content:
          text/plain:
            schema:
              description: ASCII-armored public key block.
              type: string
        description: The ASCII-armored public key.
        required: true
      responses:
        '200':
          content:
            text/plain:
              schema:
                description: Confirmation text.
                type: string
          description: The key was stored.
        '400':
          $ref: '#/components/responses/SecurityBadRequest'
        '401':
          $ref: '#/components/responses/SecurityUnauthorized'
        '403':
          $ref: '#/components/responses/SecurityForbidden'
        '500':
          $ref: '#/components/responses/SecurityInternalServerError'
      summary: Set the GPG public key
      tags:
      - security
      x-oracle-source: https://docs.jfrog.com/administration/reference/setgpgpublickey.md
  /api/gpg/passphrase:
    put:
      description: Stores the passphrase protecting the GPG private key. Admin only. The value travels in a header
        rather than the body and is sealed at rest.
      operationId: setGpgPassPhrase
      parameters:
      - description: Required header parameter. The passphrase for the stored private key.
        in: header
        name: X-GPG-PASSPHRASE
        required: true
        schema:
          description: Passphrase text.
          type: string
      responses:
        '200':
          content:
            text/plain:
              schema:
                description: Confirmation text.
                type: string
          description: The passphrase was stored.
        '400':
          $ref: '#/components/responses/SecurityBadRequest'
        '401':
          $ref: '#/components/responses/SecurityUnauthorized'
        '403':
          $ref: '#/components/responses/SecurityForbidden'
        '500':
          $ref: '#/components/responses/SecurityInternalServerError'
      summary: Set the GPG passphrase
      tags:
      - security
      x-oracle-source: https://docs.jfrog.com/administration/reference/setgpgpassphrase.md
  /api/security/apiKey:
    delete:
      deprecated: true
      description: Revokes the caller's key, or every key when deleteAll=1 and the caller is an admin. There are
        no keys to revoke, so the operation always answers 200 with an informational message.
      operationId: revokeApiKey
      parameters:
      - description: Optional query parameter. 1 revokes every user's key and requires the admin role; 0 or absent
          revokes only the caller's key.
        in: query
        name: deleteAll
        required: false
        schema:
          description: 0 or 1.
          enum:
          - 0
          - 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityInfoMessage'
          description: Nothing was revoked because no keys exist.
        '401':
          $ref: '#/components/responses/SecurityUnauthorized'
        '403':
          $ref: '#/components/responses/SecurityForbidden'
        '500':
          $ref: '#/components/responses/SecurityInternalServerError'
      summary: Revoke the caller's API key
      tags:
      - security
      x-oracle-source: https://docs.jfrog.com/administration/reference/revokeapikey.md
      x-tier: shim
    get:
      deprecated: true
      description: Returns the caller's API key. No keys are ever issued, so the operation always answers 404, the
        response for a user without a key.
      operationId: getApiKey
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyResponse'
          description: Not returned.
        '401':
          $ref: '#/components/responses/SecurityUnauthorized'
        '403':
          $ref: '#/components/responses/SecurityForbidden'
        '404':
          $ref: '#/components/responses/SecurityNotFound'
        '500':
          $ref: '#/components/responses/SecurityInternalServerError'
      summary: Get the caller's API key (always absent)
      tags:
      - security
      x-oracle-source: https://docs.jfrog.com/administration/reference/getapikey.md
      x-tier: shim
    post:
      deprecated: true
      description: Legacy API-key creation, which is disabled. Always answers 400 with the message "API key creation
        is disabled". Use an access token or a reference token from /access/api/v1/tokens instead.
      operationId: createApiKey
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyResponse'
          description: Not returned.
        '400':
          $ref: '#/components/responses/SecurityBadRequest'
        '401':
          $ref: '#/components/responses/SecurityUnauthorized'
        '403':
