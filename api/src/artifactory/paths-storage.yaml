          `<key>-cache` and a virtual repository resolves through its members.
        in: path
        name: repoKey
        required: true
        schema:
          description: Key of the repository. A remote repository's cache is addressed as `<key>-cache` and a virtual
            repository resolves through its members.
          minLength: 1
