        `downloadRedirect` or `cdnRedirect`, a GET of a file at least `download.redirect.min_size` long answers 302
        to a signed URL on the CDN in front of the blob store, if it has one, or on the object store itself
        (`downloadRedirect` only), carrying the file name and media type as response overrides. HEAD and conditional
        requests are always answered here. A path ending in `.md5`, `.sha1`, `.sha256` or `.sha512` beside a file
        answers that checksum of the file as plain text: under `client-checksums` the one the client sent, and 404
        while it has sent none (every deploy records the SHA-256); under `server-generated-checksums`, for
        `maven-metadata.xml` and in a remote cache, the computed one.'
