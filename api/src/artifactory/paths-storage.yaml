        both `[folderItegRev]` and `[fileItegRev]`; elsewhere the path is looked up as written. Supports
        `Range` requests with 206 and exposes `X-Checksum-Md5`, `X-Checksum-Sha1` and `X-Checksum-Sha256` headers.
