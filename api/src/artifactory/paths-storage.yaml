    get:
      description: 'Streams the content of a file. Resolution follows the repository class: local serves stored
        content, remote serves the cache or fetches from upstream, virtual walks its members in order. Matrix parameters
        `;key=value` on the path restrict resolution to items carrying those properties. The version tokens `[RELEASE]`,
