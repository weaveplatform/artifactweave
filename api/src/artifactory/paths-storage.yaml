components:
  schemas:
    ArchiveMapping:
      description: One input-to-output path rewrite applied while building a build artifacts archive.
      properties:
        input:
          description: Optional within this object. Regular expression matched against each artifact's repository
            path. Artifacts that do not match any mapping keep their path.
          type: string
        output:
          description: Optional within this object. Replacement path inside the archive; capture groups from `input`
            are referenced as `$1`, `$2` and so on. Omitted means the matched artifacts keep their original path.
          type: string
      type: object
    ArtifactoryArtifactsStorageApiBuildArtifactsRequest:
      description: Selects the artifacts of one build run and the archive format to pack them in. Not implemented;
        the operation answers 501.
      properties:
        archiveType:
          description: 'Required within this object. Archive container to produce: `zip`, `tar`, `tar.gz` or `tgz`
            (`tgz` is `tar.gz` with a different extension).'
          enum:
          - tar
          - zip
          - tar.gz
          - tgz
          type: string
        buildName:
          description: Required within this object. Name of the published build whose artifacts are archived.
          minLength: 1
          type: string
        buildNumber:
          description: Required within this object. Build number within that build name. Must be a published run,
            not `LATEST`.
          minLength: 1
          type: string
        buildStatus:
          description: Optional within this object. Restricts the lookup to the latest run whose promotion status
            equals this value. Omitted means the exact `buildNumber` is used.
          type: string
        mappings:
          description: Optional within this object. Path rewrites applied in order; the first matching mapping wins.
            Omitted means artifacts keep their repository paths inside the archive.
          items:
            $ref: '#/components/schemas/ArchiveMapping'
          type: array
        repos:
          description: Optional within this object. Repository keys to search for the build's artifacts. Omitted
            means every repository the caller can read.
          items:
            description: One repository key.
            type: string
          type: array
      required:
      - buildName
      - buildNumber
      - archiveType
      type: object
    BackgroundTask:
      description: One scheduled or running server task such as garbage collection, a cleanup policy run or a replication.
      properties:
        description:
          description: Optional within this object. Human readable summary of what the task does, for operators.
          type: string
        id:
          description: Optional within this object. Server-assigned task identifier, unique for the lifetime of
            the process.
          type: string
        nodeId:
          description: Optional within this object. Identifier of the node executing the task, which is the configured
            node id of this instance.
          type: string
        started:
          description: Optional within this object. RFC 3339 time the current execution started. Absent while the
            task is only scheduled.
          format: date-time
          type: string
        state:
          description: 'Optional within this object. Lifecycle state: `scheduled` (waiting for its trigger), `running`,
            `stopped` (completed or stopped by an operator) or `cancelled`.'
          enum:
          - scheduled
          - running
          - stopped
          - cancelled
          type: string
        type:
          description: Optional within this object. Fully qualified task type name. Treat the value as opaque.
          type: string
      type: object
    BackgroundTasks:
      description: Response envelope of the background tasks listing.
      properties:
        tasks:
          description: Optional within this object. Every task known to the scheduler, scheduled or running. Empty
            when nothing is registered.
          items:
            $ref: '#/components/schemas/BackgroundTask'
          type: array
      type: object
    BinariesSummary:
      description: Totals over the content-addressed blob store and the items that reference it. Every value is
        a human-formatted string, such as `3.48 GB` or `125,726`.
      properties:
        artifactsCount:
          description: Optional within this object. Number of file items, those in the trash can included, formatted
            with thousands separators.
          type: string
        artifactsSize:
          description: Optional within this object. Total size of all items, those in the trash can included, as if
            nothing were deduplicated, formatted as `usedSpace` is.
          type: string
        binariesCount:
          description: Optional within this object. Number of distinct stored blobs, formatted with thousands separators.
          type: string
        binariesSize:
          description: Optional within this object. Total size of distinct blobs, formatted as `usedSpace` is.
          type: string
        itemsCount:
          description: Optional within this object. Number of items, files and folders together and those in the
            trash can included, formatted with thousands separators.
          type: string
        optimization:
          description: Optional within this object. `binariesSize` as a percentage of `artifactsSize`, with up to
            two decimals, such as `5.82%`, or `N/A` while there are no artifacts.
          type: string
      type: object
    Checksums:
      description: Hex digests of a file's content. `checksums` holds what the server computed; `originalChecksums`
        holds what the client declared at deploy time or sent as checksum files, so a mismatch between the two is
        visible to the bad-checksum search. The SHA-256 is always recorded, as the computed one when the client declared
        none. A checksum deploy records every checksum of the content it reuses. A file the server writes
        itself, such as a build-info document or an image manifest, records all of its computed checksums.
      properties:
        md5:
          description: Optional within this object. Lowercase hex MD5 digest, 32 characters.
          type: string
        sha1:
          description: Optional within this object. Lowercase hex SHA-1 digest, 40 characters.
          type: string
        sha256:
          description: Optional within this object. Lowercase hex SHA-256 digest, 64 characters. This is the blob
            store key.
          type: string
      type: object
    CopyOrMoveMessage:
      description: One diagnostic line produced while copying or moving a tree.
      properties:
        level:
          description: 'Optional within this object. Severity of the message: `INFO` for progress, `WARNING` for
            items skipped, `ERROR` for items that failed.'
          enum:
          - INFO
          - WARNING
          - ERROR
          type: string
        message:
          description: Optional within this object. Human readable text naming the item concerned.
          type: string
      type: object
    CopyOrMoveResult:
      description: Outcome of a copy or move. The HTTP status is 200 even when individual items failed; callers
        must inspect the message levels.
      properties:
        messages:
          description: Optional within this object. Diagnostics in processing order. A dry run reports what would
            happen with the same levels.
          items:
            $ref: '#/components/schemas/CopyOrMoveMessage'
          type: array
      type: object
    CreateSignedUrlRequest:
      description: Request for a time-limited download URL for one artifact. Not implemented; the operation answers
        501.
      properties:
        expiry:
          description: Optional within this object. Absolute expiry as Unix epoch milliseconds. Mutually exclusive
            with `valid_for_secs`.
          format: int64
          type: integer
        repo_path:
          description: Required within this object. `<repoKey>/<path>` of the artifact to sign.
          minLength: 1
          type: string
        valid_for_secs:
          description: Optional within this object. Lifetime of the URL in seconds from now. Mutually exclusive
            with `expiry`; omitted means the server default.
          format: int32
          type: integer
      required:
      - repo_path
      type: object
    DistributeArtifactRequest:
      description: Bintray distribution request. Not implemented; the operation answers 501.
      properties:
        async:
          default: false
          description: Optional within this object. Whether to return before distribution completes. Default false.
          type: boolean
        dryRun:
          default: false
          description: Optional within this object. Whether to validate without distributing. Default false.
          type: boolean
        gpgPassphrase:
          description: Optional within this object. Passphrase for signing on the target.
          type: string
        overrideExistingFiles:
          default: false
          description: Optional within this object. Whether existing files on the target may be replaced. Default
            false.
          type: boolean
        packagesRepoPaths:
          description: Required within this object. `<repoKey>/<path>` entries to distribute.
          items:
            description: One `<repoKey>/<path>` entry.
            type: string
          type: array
        publish:
          default: true
          description: Optional within this object. Whether to publish after upload. Default true.
          type: boolean
        targetRepo:
          description: Required within this object. Distribution repository key.
          type: string
      required:
      - targetRepo
      - packagesRepoPaths
      type: object
    FileInfo:
      description: Metadata of one file item as returned by the storage API without a mode query parameter. Timestamps
        are RFC 3339 with millisecond precision and a zone offset.
      properties:
        checksums:
          allOf:
          - $ref: '#/components/schemas/Checksums'
          description: Optional within this object. Hex digests of a file's content. `checksums` holds what the
            server computed; `originalChecksums` holds what the client declared at deploy time or sent as checksum
            files, so a mismatch between the two is visible to the bad-checksum search. The SHA-256 is always
            recorded, as the computed one when the client declared none. A checksum deploy records every checksum of
            the content it reuses. A file the server writes itself, such as a build-info document or an image
            manifest, records all of its computed checksums.
        created:
          description: Optional within this object. RFC 3339 time the item was first stored. For large uploads this
            can be later than `lastModified`.
          format: date-time
          type: string
        createdBy:
          description: Optional within this object. Username that created the item, or `anonymous`.
          type: string
        downloadUri:
          description: Optional within this object. Absolute URL that downloads the content, `<base>/artifactory/<repo>/<path>`.
          type: string
        lastModified:
          description: Optional within this object. RFC 3339 time the content was last replaced.
          format: date-time
          type: string
        lastUpdated:
          description: Optional within this object. RFC 3339 time the item record, including properties, last changed.
          format: date-time
          type: string
        mimeType:
          description: Optional within this object. Media type detected from the file name at deploy time.
          type: string
        modifiedBy:
          description: Optional within this object. Username that last replaced the content.
          type: string
        originalChecksums:
          allOf:
          - $ref: '#/components/schemas/Checksums'
          description: Optional within this object. Hex digests of a file's content. `checksums` holds what the
            server computed; `originalChecksums` holds what the client declared at deploy time or sent as checksum
            files, so a mismatch between the two is visible to the bad-checksum search. The SHA-256 is always
            recorded, as the computed one when the client declared none. A checksum deploy records every checksum of
            the content it reuses. A file the server writes itself, such as a build-info document or an image
            manifest, records all of its computed checksums.
        path:
          description: Optional within this object. Item path relative to the repository root, always with a leading
            `/`. AQL reports the same item without the slash and with `.` for the root.
          type: string
        remoteUrl:
          description: Optional within this object. Upstream URL the content was fetched from. Present only for
            items cached from a remote repository.
          type: string
        repo:
          description: Optional within this object. Repository key the item lives in. Cached remote content reports
            the `<key>-cache` alias.
          type: string
        size:
          description: Optional within this object. Content length in bytes rendered as a decimal string, not a
            number.
          type: string
        uri:
          description: Optional within this object. Absolute URL of this storage API resource, built from the resolved
            base URL (decision 0002).
          type: string
      type: object
    FileList:
      description: Recursive or shallow listing of a folder produced by the `list` mode of the storage API.
      properties:
        created:
          description: Optional within this object. RFC 3339 time the listing was generated, not the folder's creation
            time.
          format: date-time
          type: string
        files:
          description: Optional within this object. Entries in depth-first path order. Folders below the listed
            folder appear only when `listFolders=1`; `includeRootPath=1` adds the listed folder itself first.
          items:
            $ref: '#/components/schemas/FileListItem'
          type: array
        uri:
          description: Optional within this object. Absolute storage API URL of the listed folder.
          type: string
      type: object
    FileListItem:
      description: One entry of a file listing.
      properties:
        folder:
          description: Optional within this object. True for a folder entry, false for a file.
          type: boolean
        lastModified:
          description: Optional within this object. RFC 3339 time the content was last replaced.
          format: date-time
          type: string
        mdTimestamps:
          description: Optional within this object. When the entry's metadata was last written. Present only when
            `mdTimestamps=1` and the entry has properties.
          properties:
            properties:
              description: Optional within this object. RFC 3339 time the entry's properties last changed. A write
                that leaves them as they were does not move it.
              format: date-time
              type: string
          type: object
        sha1:
          description: Optional within this object. Lowercase hex SHA-1 of a file; absent for folders.
          type: string
        sha2:
          description: Optional within this object. Lowercase hex SHA-256 of a file; absent for folders.
          type: string
        size:
          description: Optional within this object. Content length in bytes; folders report `-1`.
          format: int64
          type: integer
        uri:
          description: Optional within this object. Path relative to the listed folder with a leading `/`. The
            entry `includeRootPath=1` adds for the listed folder itself is `/`.
          type: string
      type: object
    FileStatistics:
      description: Download statistics of one file, returned by the `stats` mode.
      properties:
        downloadCount:
          description: Optional within this object. Number of completed downloads since the item was created. Downloads
            with `skipUpdateStats=true` are not counted.
          format: int64
          type: integer
        lastDownloaded:
          description: Optional within this object. Time of the last download as Unix epoch milliseconds. This is
            the only place the storage API uses an epoch number rather than RFC 3339; it is 0 when never downloaded.
          format: int64
          type: integer
        lastDownloadedBy:
          description: Optional within this object. Username of the last download, or `anonymous`.
          type: string
        uri:
          description: Optional within this object. Absolute storage API URL of the file.
          type: string
      type: object
    FileStoreSummary:
      description: The blob store and the capacity of its volume. Space values are human-formatted strings with
        a unit, sent only when `storageDirectory` names a local directory whose volume can be measured.
      properties:
        freeSpace:
          description: Optional within this object. Free space on the volume, with the percentage in parentheses.
          type: string
        storageDirectory:
          description: Optional within this object. Root directory for the local disk store, the directory of the
            first local disk member of a blob mirror, or `Filesystem storage is not used` for object storage and
            for a blob mirror with no local disk member.
          type: string
        storageType:
          description: 'Optional within this object. The binary provider template that names the blob store: `file-system`
            for the local disk store, `s3-storage-v3-direct`, `google-storage-v2-direct` or `azure-blob-storage-v2-direct`
            for object storage, and `user-chain` for a blob mirror.'
          type: string
        totalSpace:
          description: Optional within this object. Total capacity of the volume.
          type: string
        usedSpace:
          description: Optional within this object. Space used on the volume, with the percentage in parentheses.
          type: string
      type: object
    FolderChild:
      description: One direct child of a folder.
      properties:
        folder:
          description: Optional within this object. True when the child is itself a folder.
          type: boolean
        uri:
          description: Optional within this object. Child name with a leading `/`, relative to the folder.
          type: string
      type: object
    FolderInfo:
      description: Metadata of one folder item, returned instead of `FileInfo` when the path names a folder.
      properties:
        children:
          description: Optional within this object. Direct children only, sorted by name. Empty for an empty folder.
          items:
            $ref: '#/components/schemas/FolderChild'
          type: array
        created:
          description: Optional within this object. RFC 3339 time the folder was created.
          format: date-time
          type: string
        createdBy:
          description: Optional within this object. Username that created the folder, or `anonymous`.
          type: string
        lastModified:
          description: Optional within this object. RFC 3339 time the folder's own record last changed; children
            do not bubble up.
          format: date-time
          type: string
        lastUpdated:
          description: Optional within this object. RFC 3339 time the folder record, including properties, last
            changed.
          format: date-time
          type: string
        modifiedBy:
          description: Optional within this object. Username of that change.
          type: string
        path:
          description: Optional within this object. Folder path relative to the repository root with a leading `/`;
            the root itself is `/`.
          type: string
        repo:
          description: Optional within this object. Repository key the folder lives in.
          type: string
        uri:
          description: Optional within this object. Absolute storage API URL of the folder.
          type: string
      type: object
    ItemCreated:
      description: Body returned with 201 after a deploy. It is `FileInfo` without the modification fields because
        the item was just created.
      properties:
        checksums:
          allOf:
          - $ref: '#/components/schemas/Checksums'
          description: Optional within this object. Hex digests of a file's content. `checksums` holds what the
            server computed; `originalChecksums` holds what the client declared at deploy time or sent as checksum
            files, so a mismatch between the two is visible to the bad-checksum search. The SHA-256 is always
            recorded, as the computed one when the client declared none. A checksum deploy records every checksum of
            the content it reuses. A file the server writes itself, such as a build-info document or an image
            manifest, records all of its computed checksums.
        created:
          description: Optional within this object. RFC 3339 creation time.
          format: date-time
          type: string
        createdBy:
          description: Optional within this object. Username that deployed the item.
          type: string
        downloadUri:
          description: Optional within this object. Absolute download URL of the new item.
          type: string
        mimeType:
          description: Optional within this object. Media type detected from the file name.
          type: string
        originalChecksums:
          allOf:
          - $ref: '#/components/schemas/Checksums'
          description: Optional within this object. Hex digests of a file's content. `checksums` holds what the
            server computed; `originalChecksums` holds what the client declared at deploy time or sent as checksum
            files, so a mismatch between the two is visible to the bad-checksum search. The SHA-256 is always
            recorded, as the computed one when the client declared none. A checksum deploy records every checksum of
            the content it reuses. A file the server writes itself, such as a build-info document or an image
            manifest, records all of its computed checksums.
        path:
          description: Optional within this object. Item path relative to the repository root with a leading `/`.
            A folder's ends in `/`.
          type: string
        repo:
          description: Optional within this object. Repository key the item was stored in. A deploy to a virtual
            repository reports its default deployment repository.
          type: string
        size:
          description: Optional within this object. Content length in bytes as a decimal string.
          type: string
        uri:
          description: Optional within this object. Absolute download URL of the new item, the same as `downloadUri`
            for a file. A folder's ends in `/`.
          type: string
      type: object
    ItemLastModified:
      description: 'Result of the `lastModified` mode: the newest modification time under a path.'
      properties:
        lastModified:
          description: Optional within this object. RFC 3339 modification time of that item.
          format: date-time
          type: string
        uri:
          description: Optional within this object. Absolute storage API URL of the newest item found, which for
            a folder is the descendant that was modified last.
          type: string
      type: object
    ItemPermissions:
      description: Effective permissions on an item, returned by the `permissions` mode. Only an admin can request
        it.
      properties:
        principals:
          description: Optional within this object. Users and groups that hold any permission on the item, with
            the legacy permission codes they hold.
          properties:
            groups:
              additionalProperties:
                description: Permission codes held by one group.
                items:
                  description: One permission code.
                  type: string
                type: array
              description: Optional within this object. Map from group name to the permission codes the group holds,
                using the same codes as `users`.
              type: object
            users:
              additionalProperties:
                description: Permission codes held by one user.
                items:
                  description: One permission code.
                  type: string
                type: array
              description: 'Optional within this object. Map from username to the legacy permission codes that user
                holds on the item: `r` read, `n` annotate, `w` deploy, `d` delete, `m` manage.'
              type: object
          type: object
        uri:
          description: Optional within this object. Absolute storage API URL of the item.
          type: string
      type: object
    ItemProperties:
      description: Properties attached to an item, returned by the `properties` mode. The response is 404 when the
        item has no properties at all.
      properties:
        properties:
          additionalProperties:
            description: Values of one property key, in insertion order.
            items:
              description: One value.
              type: string
            type: array
          description: Optional within this object. Map from property key to its values. A value is always an array,
            even for single-valued properties.
          type: object
        uri:
          description: Optional within this object. Absolute storage API URL of the item.
          type: string
      type: object
    PudDirectoryInfo:
      description: Progress of the prune process within one blob store directory.
      properties:
        binariesCleaned:
          description: Optional within this object. Unreferenced blobs deleted from this directory. In a dry run,
            the number that would be deleted.
          format: int64
          type: integer
        binariesProcessed:
          description: Optional within this object. Blobs examined in this directory so far.
          format: int64
          type: integer
        bytesCleaned:
          description: Optional within this object. Bytes freed, or that would be freed in a dry run.
          format: int64
          type: integer
        name:
          description: Optional within this object. Directory name being handled, which for the content-addressed
            store is the two-character digest prefix.
          type: string
        status:
          description: 'Optional within this object. State of this directory: `running`, `stopped`, `finished` or
            `error`.'
          enum:
          - running
          - stopped
          - finished
          - error
          type: string
        timing:
          allOf:
          - $ref: '#/components/schemas/PudTiming'
          description: 'Optional within this object. Timing of a prune run or of one of its directories. Each time
            is given twice: formatted for people and as Unix epoch milliseconds for programs.'
      type: object
    PudProcessResponse:
      description: Acknowledgement of a prune start or stop, or the reason a request was refused with 412.
      properties:
        info:
          description: Optional within this object. Human readable status line.
          type: string
      type: object
    PudProcessStatus:
      description: Current state of the prune unreferenced data process. The process runs blob garbage collection,
        so the figures are the GC run's figures.
      properties:
        dryRun:
          description: Optional within this object. True when the run only reports what it would delete.
          type: boolean
        error:
          description: Optional within this object. Message of the failure that moved the run to `error`. Absent
            otherwise.
          type: string
        lastHandledDirectory:
          allOf:
          - $ref: '#/components/schemas/PudDirectoryInfo'
          description: Optional within this object. Progress of the prune process within one blob store directory.
        progress:
          description: Optional within this object. Percentage of directories handled, formatted as `nn%`.
          type: string
        report:
          allOf:
          - $ref: '#/components/schemas/PudReport'
          description: Optional within this object. Totals of a prune run.
        status:
          description: 'Optional within this object. Overall state: `running`, `stopped` (by an operator), `finished`
            or `error`.'
          enum:
          - running
          - stopped
          - finished
          - error
          type: string
        timing:
          allOf:
          - $ref: '#/components/schemas/PudTiming'
          description: 'Optional within this object. Timing of a prune run or of one of its directories. Each time
            is given twice: formatted for people and as Unix epoch milliseconds for programs.'
      type: object
    PudReport:
      description: Totals of a prune run.
      properties:
        totalBinariesCleaned:
          description: Optional within this object. Blobs deleted, or that would be deleted in a dry run.
          format: int64
          type: integer
        totalBinariesProcessed:
          description: Optional within this object. Blobs examined.
          format: int64
          type: integer
        totalBytesCleaned:
          description: Optional within this object. Bytes freed, or that would be freed in a dry run.
          format: int64
          type: integer
      type: object
    PudTiming:
      description: 'Timing of a prune run or of one of its directories. Each time is given twice: formatted for
        people and as Unix epoch milliseconds for programs.'
      properties:
        duration:
          description: Optional within this object. Human readable elapsed time.
          type: string
        durationMillis:
          description: Optional within this object. Elapsed time in milliseconds.
          format: int64
          type: integer
        lastUpdated:
          description: Optional within this object. Human readable time of the last progress update.
          type: string
        lastUpdatedMillis:
          description: Optional within this object. Last progress update as Unix epoch milliseconds.
          format: int64
          type: integer
        startedAt:
          description: Optional within this object. Human readable start time.
          type: string
        startedAtMillis:
          description: Optional within this object. Start time as Unix epoch milliseconds.
          format: int64
          type: integer
      type: object
    RepositorySummary:
      description: Per-repository row of the storage summary. The trash can has a row of its own, `auto-trashcan`.
        The list ends with a synthetic row whose `repoKey` is `TOTAL`, which sums every other row and has no `packageType`,
        `projectKey` or `percentage`.
      properties:
        filesCount:
          description: Optional within this object. Number of file items.
          type: integer
        foldersCount:
          description: Optional within this object. Number of folder items.
          type: integer
        itemsCount:
          description: Optional within this object. Files plus folders.
          type: integer
        packageType:
          description: Optional within this object. Display name of the repository's package type, such as `Generic`,
            `Maven`, `npm` or `RPM`, or `NA` on the `auto-trashcan` row.
          type: string
        percentage:
          description: Optional within this object. Share of `usedSpace` in the total, with up to two decimals, such
            as `2.08%`, or `N/A` while nothing is stored.
          type: string
        projectKey:
          description: Optional within this object. Key of the project the repository belongs to, or `default` for
            a repository in no project and for the `auto-trashcan` row.
          type: string
        repoKey:
          description: Optional within this object. Repository key, `auto-trashcan` for the trash can, or `TOTAL`
            for the summary row. Caches of remote repositories appear under their `<key>-cache` alias.
          type: string
        repoType:
          description: Optional within this object. `LOCAL`, `CACHE`, `VIRTUAL` or `FEDERATED`, or `NA` on the
            `auto-trashcan` and total rows.
          type: string
        usedSpace:
          description: Optional within this object. Sum of file sizes before deduplication, in whole bytes below
            1 KB, such as `678 bytes`, and otherwise with two decimals, thousands separators and a binary unit up
            to TB, such as `1,004.64 KB` or `10.00 MB`.
          type: string
        usedSpaceInBytes:
          description: Optional within this object. `usedSpace` as a number of bytes.
          format: int64
          type: integer
      type: object
    RubyGemVersion:
      description: One version of a RubyGem as the rubygems.org versions API describes it. Not implemented; the
        operation answers 501.
      properties:
        authors:
          description: Optional within this object. Comma-separated author names from the gemspec.
          type: string
        built_at:
          description: Optional within this object. RFC 3339 time the gem was built.
          format: date-time
          type: string
        created_at:
          description: Optional within this object. RFC 3339 time the version was pushed.
          format: date-time
          type: string
        description:
          description: Optional within this object. Longer description from the gemspec.
          type: string
        downloads_count:
          description: Optional within this object. Downloads of this version as counted by the serving registry.
          type: integer
        licenses:
          description: Optional within this object. License identifiers from the gemspec.
          items:
            description: One license identifier.
            type: string
          type: array
        metadata:
          additionalProperties: true
          description: Optional within this object. Free-form gemspec metadata map.
          type: object
        number:
          description: Optional within this object. Gem version string.
          type: string
        platform:
          description: Optional within this object. Target platform, `ruby` for pure Ruby gems.
          type: string
        prerelease:
          description: Optional within this object. True for a pre-release version.
          type: boolean
        requirements:
          description: Optional within this object. External requirements declared by the gemspec.
          items:
            description: One requirement line.
            type: string
          type: array
        ruby_version:
          description: Optional within this object. Required Ruby version constraint.
          type: string
        sha:
          description: Optional within this object. Hex SHA-256 of the gem file.
          type: string
        summary:
          description: Optional within this object. One-line gem summary from the gemspec.
          type: string
      type: object
    Sha256ChecksumRequest:
      description: Names the item whose `sha256` property should be computed. SHA-256 is recorded on every deploy,
        so the call only re-attaches the property.
      properties:
        path:
          description: Required within this object. Item path without a leading `/`. A folder path applies the operation
            to every file below it.
          minLength: 1
          type: string
        repoKey:
          description: Required within this object. Repository key of the item.
          minLength: 1
          type: string
      required:
      - repoKey
      - path
      type: object
    StartPudProcessRequest:
      description: Tuning for a prune run. Every field is optional; an empty body starts a full, non-dry run.
      properties:
        binaryOlderThanDays:
          default: 1
          description: Optional within this object. Only blobs written at least this many days ago are candidates.
            Default 1, which protects uploads that are still being referenced.
          format: int32
          type: integer
        dryRun:
          default: false
          description: Optional within this object. Report instead of delete. Default false.
          type: boolean
        startFromBinary:
          default: 0
          description: Optional within this object. Zero-based offset within the first directory, to resume an interrupted
            run. Default 0.
          format: int32
          type: integer
        startFromDirectory:
          description: Optional within this object. Directory name to resume from. Omitted means the first directory.
          type: string
      type: object
    StorageSummaryInfo:
      description: Snapshot of storage usage. The figures are computed on every request, so they never lag writes.
      properties:
        binariesSummary:
          allOf:
          - $ref: '#/components/schemas/BinariesSummary'
          description: Optional within this object. Totals over the content-addressed blob store and the items that
            reference it. Every value is a human-formatted string, such as `3.48 GB` or `125,726`.
        # The server writes blobMirrors from wire.StorageSummaryMirrors, embedded beside the generated type
        # (summaryWithMirrors in internal/server/storageinfo.go). A second field named blobMirrors at the same depth
        # would make encoding/json drop both, so the generated field is json:"-" and typed as the wire type.
        blobMirrors:
          description: Optional within this object. Sent only when a blob tier is a mirror (decision 0028). One entry
            per mirrored tier.
          items:
            description: One mirrored blob tier.
            properties:
              members:
                description: Required within this object. The tier's configured member stores.
                items:
                  description: One member store.
                  properties:
                    available:
                      description: Required within this object. False while the member's circuit breaker is open, when
                        reads skip it and writes treat it as down.
                      type: boolean
                    averageLatencyMs:
                      description: Required within this object. The member's observed average latency, in milliseconds.
                      format: int64
                      type: integer
                    backend:
                      description: Optional within this object. The member's backend, `fs`, `s3`, `gcs` or `azure`.
                      type: string
                    name:
                      description: Required within this object. The member's name under `blob.stores`.
                      type: string
                    replicas:
                      additionalProperties:
                        description: The member's replica records in one state.
                        properties:
                          bytes:
                            description: Required within this object. Total size of those replicas, in bytes.
                            format: int64
                            type: integer
                          count:
                            description: Required within this object. Number of replica records in the state.
                            format: int64
                            type: integer
                          size:
                            description: Required within this object. `bytes` human-formatted with a unit, as the
                              rest of the summary is.
                            type: string
                        required:
                        - count
                        - bytes
                        - size
                        type: object
                      description: Required within this object. Replica records keyed by state. All four states,
                        `present`, `pending`, `deleting` and `failed`, are always present.
                      type: object
                    soleCopies:
                      description: Required within this object. Blobs whose only present copy is on this member. A
                        drained member is safe to remove once this is 0.
                      format: int64
                      type: integer
                    writeEnabled:
                      description: Required within this object. False while the member is drained, when it takes no
                        new copies and reads continue.
                      type: boolean
                    zone:
                      description: Optional within this object. The member's zone. Omitted when none is set.
                      type: string
                  required:
                  - name
                  - writeEnabled
                  - available
                  - averageLatencyMs
                  - replicas
                  - soleCopies
                  type: object
                type: array
              redundancy:
                description: Required within this object. Copies kept of each blob.
                type: integer
              removedMembers:
                description: Required within this object. Members no longer configured that still have replica records.
                  The mirror no longer reads from them, so their sole copies are out of reach until they are configured
                  again. Empty when there are none.
                items:
                  description: One removed member.
                  properties:
                    name:
                      description: Required within this object. The removed member's name.
                      type: string
                    replicas:
                      additionalProperties:
                        description: The removed member's replica records in one state.
                        properties:
                          bytes:
                            description: Required within this object. Total size of those replicas, in bytes.
                            format: int64
                            type: integer
                          count:
                            description: Required within this object. Number of replica records in the state.
                            format: int64
                            type: integer
                          size:
                            description: Required within this object. `bytes` human-formatted with a unit, as the
                              rest of the summary is.
                            type: string
                        required:
                        - count
                        - bytes
                        - size
                        type: object
                      description: Required within this object. Replica records keyed by state, as on a member.
                      type: object
                    soleCopies:
                      description: Required within this object. Blobs whose only present copy is on this removed member.
                      format: int64
                      type: integer
                  required:
                  - name
                  - replicas
                  - soleCopies
                  type: object
                type: array
              tier:
                description: Required within this object. The mirrored tier, `blob` or `cold_blob`.
                type: string
              underReplicatedBlobs:
                description: Required within this object. Blobs with fewer present copies than `redundancy`, not counting
                  blobs being deleted.
                format: int64
                type: integer
              writeQuorum:
                description: Required within this object. Copies that must be stored before an upload succeeds.
                type: integer
              zone:
                description: Optional within this object. This instance's zone, which reads and writes prefer. Omitted
                  when none is set.
                type: string
            required:
            - tier
            - redundancy
            - writeQuorum
            - underReplicatedBlobs
            - members
            - removedMembers
            type: object
          type: array
          x-go-json-ignore: true
          x-go-type: '[]wire.BlobMirror'
          x-go-type-import:
            path: github.com/weaveplatform/artifactweave/pkg/types/wire
        fileStoreSummary:
          allOf:
          - $ref: '#/components/schemas/FileStoreSummary'
          description: Optional within this object. The blob store and the capacity of its volume. Space values are
            human-formatted strings with a unit, sent only for a local disk store whose volume can be measured.
        repositoriesSummaryList:
          description: Optional within this object. One row per repository and one for the trash can, sorted by key,
            then the `TOTAL` row.
          items:
            $ref: '#/components/schemas/RepositorySummary'
          type: array
      type: object
    UploadsConfig:
      description: Whether the server accepts multipart uploads.
      properties:
        supported:
          description: Optional within this object. True when the server can stage parts, which it can whenever a
            blob store is configured.
          type: boolean
      type: object
    MultipartUploadToken:
      description: A multipart upload's token, which authorises its other calls.
      properties:
        token:
          description: Optional within this object. The upload token, sent as a Bearer token.
          type: string
      type: object
    MultipartUploadPartUrl:
      description: Where to PUT one part.
      properties:
        url:
          description: Optional within this object. Absolute URL for the part, signed for that upload and part.
          type: string
      type: object
    MultipartUploadStatus:
      description: State of a multipart upload's assembly.
      properties:
        status:
          description: Optional within this object. `PARTS`, `PROCESSING`, `FINISHED`, `RETRYABLE_ERROR`,
            `NON_RETRYABLE_ERROR` or `ABORTED`.
          type: string
        error:
          description: Optional within this object. Why the assembly failed.
          type: string
        progress:
          description: Optional within this object. Share of the parts assembled, in percent.
          type: integer
        checksumToken:
          description: Optional within this object. Token for the checksum deploy that follows a finished upload,
            sent as `X-Checksum-Deploy-Token`. It holds for the caller that made the upload and its content only.
          type: string
      type: object
    UpdatePropertiesRequest:
      description: Partial update of an item's properties, a file's download statistics, or both. Keys not mentioned
        are left as they are. At least one of `props` and `stats` must be present.
      properties:
        props:
          additionalProperties:
            description: A single string sets one value, an array of strings sets several, and null removes the
              key.
            nullable: true
            oneOf:
            - description: A single value.
              type: string
            - description: Several values.
              items:
                description: One value.
                type: string
              type: array
          description: Optional within this object. Map from property key to the new value. A string sets a single
            value, an array sets multiple values, and `null` removes the key. An empty map changes nothing.
          type: object
        stats:
          allOf:
          - $ref: '#/components/schemas/UpdateStatsRequest'
          description: Optional within this object. Download statistics merged into the file's own. A folder has
            none, so sending this for a folder is refused with 400.
      type: object
    UpdateStatsRequest:
      additionalProperties: false
      description: Download statistics merged into a file's own. A field left out keeps its value and `null` clears
        it. Times are Unix milliseconds, where 0 means never. Any other field is refused with 400.
      properties:
        downloadCount:
          description: Optional within this object. Downloads counted, 0 or more.
          format: int64
          minimum: 0
          nullable: true
          type: integer
        lastDownloaded:
          description: Optional within this object. Time of the last download, in Unix milliseconds.
          format: int64
          minimum: 0
          nullable: true
          type: integer
        lastDownloadedBy:
          description: Optional within this object. User who made the last download.
          nullable: true
          type: string
        remoteDownloadCount:
          description: Optional within this object. Downloads counted on other instances that serve this file
            through a remote repository, 0 or more.
          format: int64
          minimum: 0
          nullable: true
          type: integer
        remoteLastDownloaded:
          description: Optional within this object. Time of the last such remote download, in Unix milliseconds.
          format: int64
          minimum: 0
          nullable: true
          type: integer
        remoteLastDownloadedBy:
          description: Optional within this object. User who made the last such remote download.
          nullable: true
          type: string
      type: object
paths:
  /api/archive/buildArtifacts:
    post:
      description: Not implemented; answers 501. It would pack the artifacts of one build run into a single archive.
      operationId: retrieveBuildArtifactsArchive
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactoryArtifactsStorageApiBuildArtifactsRequest'
          application/vnd.org.jfrog.artifactory.build.BuildArtifactsRequest+json:
            schema:
              $ref: '#/components/schemas/ArtifactoryArtifactsStorageApiBuildArtifactsRequest'
        description: Which build and which archive format.
        required: true
      responses:
        '200':
          content:
            application/x-gzip:
              schema:
                description: Gzip-compressed tar archive bytes.
                format: binary
                type: string
            application/x-tar:
              schema:
                description: Tar archive bytes.
                format: binary
                type: string
            application/zip:
              schema:
                description: Zip archive bytes.
                format: binary
                type: string
          description: The archive in the requested format.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is malformed.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No credentials or invalid credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller lacks the permission the operation needs.
      summary: Build artifacts archive
      tags:
      - storage
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/retrievebuildartifactsarchive.md
  /api/archive/download/{repoKey}/{path}:
    get:
      description: Streams a folder, or a whole repository when `path` is empty, as one archive. Only local repositories
        and remote caches can be archived, and the folder download setting must be enabled in the system configuration
        or the request is refused with 403.
      operationId: retrieveFolderOrRepositoryArchive
      parameters:
      - description: Required path parameter. Key of the repository. A remote repository's cache is addressed as
          `<key>-cache` and a virtual repository resolves through its members.
        in: path
        name: repoKey
        required: true
        schema:
          description: Key of the repository. A remote repository's cache is addressed as `<key>-cache` and a virtual
            repository resolves through its members.
          minLength: 1
          type: string
      - description: Required path parameter. Folder path relative to the repository root, or empty to archive the
          whole repository.
        in: path
        name: path
        required: true
        schema:
          description: Folder path relative to the repository root, or empty to archive the whole repository.
          minLength: 1
          type: string
      - description: 'Required query parameter. Archive container to produce: `zip`, `tar`, `tar.gz` or `tgz`.'
        in: query
        name: archiveType
        required: true
        schema:
          description: 'Archive container to produce: `zip`, `tar`, `tar.gz` or `tgz`.'
          enum:
          - zip
          - tar
          - tar.gz
          - tgz
          type: string
      - description: Optional query parameter. When true, the `.md5`, `.sha1` and `.sha256` sidecar files are added
          next to each artifact in the archive. Default false.
        in: query
        name: includeChecksumFiles
        required: false
        schema:
          description: When true, the `.md5`, `.sha1` and `.sha256` sidecar files are added next to each artifact
            in the archive. Default false.
          type: boolean
      responses:
        '200':
          content:
            application/x-gzip:
              schema:
                description: Gzip-compressed tar archive bytes.
                format: binary
                type: string
            application/x-tar:
              schema:
                description: Tar archive bytes.
                format: binary
                type: string
            application/zip:
              schema:
                description: Zip archive bytes.
                format: binary
                type: string
          description: The archive in the requested format.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is malformed.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No credentials or invalid credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller lacks read permission, or folder download is disabled.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The repository or item does not exist, or the caller may not know that it does.
      summary: Download a folder as an archive
      tags:
      - storage
      - handwritten
      x-handwritten: true
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/retrievefolderorrepositoryarchive.md
  /api/checksum/sha256:
    post:
      description: Recomputes the SHA-256 of an item and stores it as the `sha256` property, recursively for a folder.
        Admin only.
      operationId: setItemSha256Checksum
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Sha256ChecksumRequest'
        description: The item or folder to process.
        required: true
      responses:
        '200':
          description: The property was attached.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is malformed.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No credentials or invalid credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller lacks the permission the operation needs.
      summary: Attach the sha256 property
      tags:
      - storage
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/setitemsha256checksum.md
  /api/copy/{srcRepoKey}/{srcFilePath}:
    post:
      description: Copies a file or a folder subtree to another path, in the same or another repository. Works on
        local repositories, federated repositories and remote caches as the source; the target must be local. Properties
        are copied with the items. Returns 200 with per-item messages even when some items failed; `failFast=1`
        stops at the first failure.
      operationId: copyItem
      parameters:
      - description: Required path parameter. Key of the repository holding the source item.
        in: path
        name: srcRepoKey
        required: true
        schema:
          description: Key of the repository holding the source item.
          minLength: 1
          type: string
      - description: Required path parameter. Path of the source file or folder relative to the repository root.
          A folder copies or moves its whole subtree.
        in: path
        name: srcFilePath
        required: true
        schema:
          description: Path of the source file or folder relative to the repository root. A folder copies or moves
            its whole subtree.
          minLength: 1
          type: string
      - description: Required query parameter. Target as `/<repoKey>/<path>` with the leading `/`. A folder target
          receives the source under its own name.
        in: query
        name: to
        required: true
        schema:
          description: Target as `/<repoKey>/<path>` with the leading `/`. A folder target receives the source under
            its own name.
          type: string
      - description: Optional query parameter. `1` reports what would happen without changing anything. Default
          0.
        in: query
        name: dry
        required: false
        schema:
          default: 0
          description: '`1` reports what would happen without changing anything. Default 0.'
          enum:
          - 0
          - 1
          type: integer
      - description: Optional query parameter. `1` copies the path verbatim; `0` translates each file's path
          between the source and target repository layouts when they differ. A file whose translated path would
          drop a value the source layout reads in its path, so that another file could translate to the same
          path, is reported as an error and not copied; a path the source layout does not read is kept. Default 1.
        in: query
        name: suppressLayouts
        required: false
        schema:
          default: 1
          description: '`1` copies the path verbatim; `0` translates each file''s path between the source and target
            repository layouts when they differ. A file whose translated path would drop a value the source layout
            reads in its path, so that another file could translate to the same path, is reported as an error and
            not copied; a path the source layout does not read is kept. Default 1.'
          enum:
          - 0
          - 1
          type: integer
      - description: Optional query parameter. `1` stops at the first item that fails; `0` continues and reports
          every failure in the messages. Default 0.
        in: query
        name: failFast
        required: false
        schema:
          description: '`1` stops at the first item that fails; `0` continues and reports every failure in the messages.
            Default 0.'
          enum:
          - 0
          - 1
          type: integer
      responses:
        '200':
          content:
            application/vnd.org.jfrog.artifactory.storage.CopyOrMoveResult+json:
              schema:
                $ref: '#/components/schemas/CopyOrMoveResult'
          description: The copy finished; inspect the message levels for per-item failures.
        '400':
          content:
            application/vnd.org.jfrog.artifactory.storage.CopyOrMoveResult+json:
              schema:
                $ref: '#/components/schemas/CopyOrMoveResult'
          description: The source or target path is invalid, or the source does not exist; the messages explain
            which.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No credentials or invalid credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller lacks the permission the operation needs.
      summary: Copy an item
      tags:
      - storage
      - handwritten
      x-handwritten: true
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/copyitem.md
  /api/distribute:
    post:
      deprecated: true
      description: Not implemented; answers 501. It would distribute artifacts to a Bintray repository.
      operationId: distributeArtifact
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DistributeArtifactRequest'
        description: The Bintray distribution request.
        required: true
      responses:
        '200':
          description: The distribution was accepted.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is malformed.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No credentials or invalid credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller lacks the permission the operation needs.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The repository or item does not exist, or the caller may not know that it does.
      summary: Distribute to Bintray
      tags:
      - storage
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/distributeartifact.md
  /api/download/{repoKey}/{filePath}:
    get:
      description: Downloads a file while emitting progress marks so clients with short timeouts stay connected
        during a slow remote fetch. With `content=none` only the marks are sent; with `content=progress` the marks
        precede the content. Resolution and statistics behave as for the plain download.
      operationId: artifactSyncDownload
      parameters:
      - description: Required path parameter. Key of the repository. A remote repository's cache is addressed as
          `<key>-cache` and a virtual repository resolves through its members.
        in: path
        name: repoKey
        required: true
        schema:
          description: Key of the repository. A remote repository's cache is addressed as `<key>-cache` and a virtual
            repository resolves through its members.
          minLength: 1
          type: string
      - description: Required path parameter. Path of the file relative to the repository root, without a leading
          `/`. May contain `/`. Matrix parameters `;key=value` appended to the last segment carry properties.
        in: path
        name: filePath
        required: true
        schema:
          description: Path of the file relative to the repository root, without a leading `/`. May contain `/`.
            Matrix parameters `;key=value` appended to the last segment carry properties.
          minLength: 1
          type: string
      - description: Optional query parameter. `none` streams progress marks instead of the content; `progress`
          streams marks followed by the content. Omitted streams the content only.
        in: query
        name: content
        required: false
        schema:
          description: '`none` streams progress marks instead of the content; `progress` streams marks followed
            by the content. Omitted streams the content only.'
          enum:
          - none
          - progress
          type: string
      - description: Optional query parameter. Number of kilobytes between progress marks. Default 1024.
        in: query
        name: mark
        required: false
        schema:
          default: 1024
          description: Number of kilobytes between progress marks. Default 1024.
          type: integer
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                description: Raw file bytes.
                format: binary
                type: string
            text/plain:
              schema:
                description: Progress marks, one character per `mark` kilobytes, when `content=none`.
                type: string
          description: The content, the progress marks, or both, as selected by `content`.
        '400':
          content:
            text/html:
              schema:
                description: An HTML error page.
                type: string
          description: The parameters are invalid; the body is an HTML error page.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No credentials or invalid credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller lacks the permission the operation needs.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The repository or item does not exist, or the caller may not know that it does.
      summary: Download with progress marks
      tags:
      - storage
