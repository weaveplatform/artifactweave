  /api/system/verifyconnection:
    post:
      description: Performs a GET against the given endpoint from the server, using the global proxy settings and
        the optional credentials, and reports whether the connection succeeded. Used before creating remote repositories.
        Only a 200 from the endpoint counts as success; any other status, a connection failure or a timeout is
        reported as 400 with the reason. Admin only.
      operationId: verifyConnection
      requestBody:
        content:
          application/json:
            schema:
              description: Connection details to test.
              properties:
                endpoint:
                  description: Required within this object. The absolute http or https URL to probe.
                  type: string
                password:
                  description: Optional within this object. Basic authentication password or token; required when
                    username is set. Never stored or logged.
                  type: string
                username:
                  description: Optional within this object. Basic authentication user name sent to the endpoint.
                    Ignored when empty.
                  type: string
              required:
              - endpoint
              type: object
        description: The endpoint and optional credentials.
        required: true
      responses:
        '200':
          content:
            text/plain:
              schema:
                description: A confirmation line including the HTTP status received.
                type: string
          description: The endpoint answered successfully.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The endpoint could not be reached or rejected the request.
        '401':
          description: Rejected credentials.
        '403':
          description: Caller is not an administrator.
      summary: Verify an outbound connection
      tags:
      - system
  /api/system/version:
    get:
      description: Reports the compatibility version in version, the server build in revision, and the installed
        add-ons. Any authenticated caller may read it. A request without credentials reads it as the anonymous user
        while anonymous access is enabled, and is refused with 401 while it is disabled.
      operationId: getSystemVersion
      parameters:
      - description: Optional header parameter. Clients that send the vendor media type `application/vnd.org.jfrog.artifactory.system.Version+json`
          receive it back as the response content type; any other value yields application/json.
        in: header
        name: Accept
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemVersion'
            application/vnd.org.jfrog.artifactory.system.Version+json:
              schema:
                $ref: '#/components/schemas/SystemVersion'
          description: The compatibility version.
        '401':
          description: The request carried no credentials while anonymous access is disabled, or its credentials
            were rejected.
      summary: Compatibility version
