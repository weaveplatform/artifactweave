        parse only the version field and gate features on it; the JFrog CLI reads it before uploads to decide on
        multipart. The real artifactweave build is in revision.
      operationId: getSystemVersion
      parameters:
      - description: Optional header parameter. Clients that send the vendor media type application/vnd.org.jfrog.artifactory.system.Version+json
          receive it back as the response content type; any other value yields application/json.
