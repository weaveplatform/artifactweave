components:
  parameters:
    BundleId:
      description: Required path parameter. The identifier returned when the bundle was created.
      in: path
      name: bundleId
      required: true
      schema:
        minLength: 1
        type: string
  schemas:
    LicenseBatchResult:
      description: The per-key or per-hash outcome of a licence batch operation.
      properties:
        messages:
          additionalProperties:
            description: The outcome for one key or hash.
            type: string
          description: Optional within this object. One entry per licence key or hash, mapping it to its outcome
            message.
          type: object
        status:
          description: Optional within this object. The overall HTTP-style status, 200 when every entry succeeded.
          type: integer
      type: object
    LicenseKey:
      description: A single licence key, as one entry of a batch install.
      properties:
        licenseKey:
          description: Optional within this object. The licence key text; ignored.
          type: string
      type: object
    NodeLicense:
      description: The licence of one node. This instance reports itself as the only node.
      properties:
        expired:
          description: Optional within this object. Whether the licence has expired; always false.
          type: boolean
        licenseHash:
          description: Optional within this object. The hash that identifies the licence in delete requests.
          type: string
        licensedTo:
          description: Optional within this object. The licensee name.
          type: string
        nodeId:
          description: Optional within this object. The node identifier, which is the configured service id.
          type: string
        nodeUrl:
          description: Optional within this object. The node's base URL as resolved by the base URL resolver.
          type: string
        type:
          description: Optional within this object. The licence type; a fixed value naming this server.
          type: string
        validThrough:
          description: Optional within this object. Expiry as a display string; always the literal never.
          type: string
      type: object
    ReverseProxyConfig:
      description: Reverse proxy settings, stored as the reverseProxies section of the descriptor. Both sslPort
        and httpsPort are accepted and returned.
      properties:
        artifactoryAppContext:
          description: Optional within this object. The context path under which the proxy reaches the registry.
            The server always serves under `artifactory`; the value is stored as sent.
          type: string
        artifactoryPort:
          description: Optional within this object. The listener port the proxy forwards to. When omitted, the server
            fills it from its own listen address.
          type: integer
        artifactoryServerName:
          description: Optional within this object. The host the proxy forwards to, usually localhost.
          type: string
        dockerReverseProxyMethod:
          description: Optional within this object. How Docker clients address repositories. REPOPATHPREFIX is the
            native method; SUBDOMAIN enables host matching; PORTPERREPO is accepted but not served; DIRECT is treated
            like REPOPATHPREFIX.
          enum:
          - SUBDOMAIN
          - REPOPATHPREFIX
          - PORTPERREPO
          - DIRECT
          type: string
        httpPort:
          description: Optional within this object. The plain HTTP listener port.
          type: integer
        httpsPort:
          description: Optional within this object. The TLS listener port. Alias of sslPort.
          type: integer
        key:
          description: Optional within this object. The configuration name. Stored as sent; defaults to nginx.
          type: string
        publicAppContext:
          description: Optional within this object. The context path clients use. Must match artifactoryAppContext
            unless the proxy rewrites paths.
          type: string
        serverName:
          description: Optional within this object. The public host name the proxy answers for.
          type: string
        serverNameExpression:
          description: Optional within this object. A wildcard host expression for the Docker subdomain method,
            for example *.example.com.
          type: string
        sslCertificate:
          description: Optional within this object. Path to the TLS certificate on the proxy host.
          type: string
        sslKey:
          description: Optional within this object. Path to the TLS private key on the proxy host.
          type: string
        sslPort:
          description: Optional within this object. The TLS listener port. Alias of httpsPort; the response carries
            both.
          type: integer
        useHttp:
          description: Optional within this object. Whether the proxy listens on plain HTTP.
          type: boolean
        useHttps:
          description: Optional within this object. Whether the proxy listens on TLS.
          type: boolean
        webServerType:
          description: Optional within this object. The proxy software. Only NGINX renders a snippet.
          enum:
          - NGINX
          - APACHE
          type: string
      type: object
    StatusMessage:
      description: A status code with one message, used by the licence operations.
      properties:
        message:
          description: Optional within this object. A human readable outcome.
          type: string
        status:
          description: Optional within this object. The HTTP-style status of the operation, 200 on success.
          type: integer
      type: object
    SupportBundleConfig:
      description: What a support bundle should contain. Support bundles are not implemented.
      properties:
        description:
          description: Optional within this object. Free text about why the bundle was made.
          type: string
        name:
          description: Optional within this object. A display name for the bundle.
          type: string
        parameters:
          allOf:
          - $ref: '#/components/schemas/SupportBundleParameters'
          description: Optional within this object. Which collectors a support bundle runs. Support bundles are
            not implemented.
      type: object
    SupportBundleCreated:
      description: The identifier of a created bundle. Not returned.
      properties:
        artifactory:
          description: Optional within this object. Where the bundle was written.
          properties:
            bundle_url:
              description: Optional within this object. Download URL of the bundle.
              type: string
            service_id:
              description: Optional within this object. The service that produced it.
              type: string
          type: object
        id:
          description: Optional within this object. The bundle identifier.
          type: string
      type: object
    SupportBundleList:
      description: A page of bundles. Not returned.
      properties:
        bundles:
          description: Optional within this object. The bundles.
          items:
            description: One bundle summary.
            properties:
              created:
                description: Optional within this object. Creation time.
                format: date-time
                type: string
              description:
                description: Optional within this object. Free text, null when none was given.
                nullable: true
                type: string
              id:
                description: Optional within this object. The bundle identifier.
                type: string
              name:
                description: Optional within this object. The display name.
                type: string
              status:
                description: Optional within this object. Collection state.
                type: string
            type: object
          type: array
        count:
          description: Optional within this object. Number of bundles listed.
          type: integer
      type: object
    SupportBundleMetadata:
      description: Metadata of one bundle. Not returned.
      properties:
        artifactory:
          description: Optional within this object. Where the bundle was written.
          properties:
            bundle_url:
              description: Optional within this object. Download URL of the bundle.
              type: string
            service_id:
              description: Optional within this object. The service that produced it.
              type: string
          type: object
        created:
          description: Optional within this object. Creation time.
          format: date-time
          type: string
        description:
          description: Optional within this object. Free text.
          type: string
        id:
          description: Optional within this object. The bundle identifier.
          type: string
        name:
          description: Optional within this object. The display name.
          type: string
        parameters:
          allOf:
          - $ref: '#/components/schemas/SupportBundleParameters'
          description: Optional within this object. Which collectors a support bundle runs. Support bundles are
            not implemented.
        status:
          description: Optional within this object. Collection state, for example success.
          type: string
      type: object
    SupportBundleParameters:
      description: Which collectors a support bundle runs. Support bundles are not implemented.
      properties:
        collectSlowQueriesFromDatabase:
          default: false
          description: Optional within this object. Include slow database queries.
          type: boolean
        configuration:
          default: true
          description: Optional within this object. Include configuration files.
          type: boolean
        logs:
          description: Optional within this object. Which logs to include.
          properties:
            end_date:
              description: Optional within this object. Latest log date, ISO 8601 date.
              type: string
            include:
              default: true
              description: Optional within this object. Include log files at all.
              type: boolean
            start_date:
              description: Optional within this object. Earliest log date, ISO 8601 date.
              type: string
          type: object
        system:
          default: true
          description: Optional within this object. Include system information.
          type: boolean
        thread_dump:
          description: Optional within this object. Thread dump collection.
          properties:
            count:
              default: 1
              description: Optional within this object. Number of dumps to take.
              type: integer
            interval:
              default: 0
              description: Optional within this object. Seconds between dumps.
              type: integer
          type: object
      type: object
paths:
  /api/metadata_server/reindex:
    post:
      description: Not implemented; answers 501. The package index is maintained on every write and by the per-ecosystem
        reindex operations.
      operationId: reindexMetadataServer
      parameters:
      - description: Optional query parameter. Run in the background. Ignored.
        in: query
        name: async
        required: false
        schema:
          default: true
          type: boolean
      - description: Optional query parameter. Drop the index before rebuilding. Ignored.
        in: query
        name: delete_first
        required: false
        schema:
          default: false
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              description: The paths to reindex.
              properties:
                paths:
                  description: Required within this object. Repository paths of the form repo/path.
                  items:
                    description: One repository path.
                    type: string
                  type: array
              required:
              - paths
              type: object
        description: The repository paths to reindex.
        required: true
      responses:
        '200':
          description: Not returned.
        '202':
          description: Not returned.
        '400':
          description: The paths array is missing.
        '401':
          description: Rejected credentials.
        '403':
          description: Caller is not an administrator.
      summary: Reindex the metadata service
      tags:
      - system
      x-tier: stub
  /api/system:
    get:
      description: 'A plain text dump of runtime facts: build version and revision, Go runtime, operating system,
        uptime, configured database driver and blob backend, and the compatibility version. The format is free text.
        Admin only.'
      operationId: getSystemInfo
      responses:
        '200':
          content:
            text/plain:
              schema:
                description: Free-text key and value lines.
                type: string
          description: The report.
        '401':
          description: Rejected credentials.
        '403':
          description: Caller is not an administrator.
      summary: System information
      tags:
      - system
  /api/system/configuration:
    get:
      description: Not implemented; answers 501.
      operationId: getSystemConfiguration
      responses:
        '200':
          content:
            application/xml:
              schema:
                description: The XML descriptor document.
                type: string
          description: Not returned.
        '401':
          description: Rejected credentials.
        '403':
          description: Not returned.
      summary: Read the configuration descriptor
      tags:
      - system
      - handwritten
      x-handwritten: true
      x-tier: stub
    patch:
      description: 'The configuration-as-code entry point (decision 0009). The body is a YAML document in the descriptor
        format with any of the top-level sections `localRepositories`, `remoteRepositories`, `virtualRepositories`,
        `proxies`, `propertySets` and `repoLayouts`, each a map keyed by entity name. Any other top-level section
        answers 400 naming it, and nothing is applied. Named entities that do not exist are created, existing ones
        are updated field by field, omitted keys are untouched, and an entity whose value is null is deleted. In a
        repository entry, null clears a string field; null on `type`, on a block or on a field that does not hold
        a string answers 400. Repository entries use the YAML spellings (`type`, `repoLayout`, `remoteRepoLayout`,
        `primaryKeyPairDescriptor`, `xray.enabled`, `downloadRedirect.enabled`, `cocoaPods.cocoaPodsSpecsRepoUrl`,
        `p2.urls` and the `helm`, `nuget`, `vcs`, `externalDependencies`, `bower`, `composer`, `pypi` and
        `virtualCacheConfig` blocks, with `type: terraformbe` for `terraformbackend`) or the field names of the
        JSON repositories API, and are validated with the same rules as that API. `cocoaPods.specRepoProvider` is
        accepted and not stored. Values of the form `${ENV_VAR}` are resolved from the server environment and
        never written back. An empty document is rejected with 400. The whole patch is applied in one transaction.
        Admin only.'
      operationId: patchSystemConfiguration
      requestBody:
        content:
          application/yaml:
            schema:
              description: A YAML document in the descriptor format.
              type: string
        description: The YAML patch.
        required: true
      responses:
        '200':
          content:
            text/plain:
              schema:
                description: The line `<n> changes to config merged successfully`, with no trailing newline. n
                  counts the values in the document, each scalar, null and list element in every nested mapping,
                  whether or not it changes what is stored, so applying the same patch again gives the same n.
                type: string
          description: The patch was applied.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The document is empty, is not valid YAML, names a top-level section that is not applied,
            contains an unknown repository field, sets a repository field that is not a string to null, or fails
            repository validation; the body names the first error.
        '401':
          description: Rejected credentials.
        '403':
          description: Caller is not an administrator.
      summary: Apply a YAML configuration patch
      tags:
      - system
      - handwritten
      x-handwritten: true
    post:
      description: Not implemented; answers 501. The YAML PATCH form covers every managed section.
      operationId: saveSystemConfiguration
      requestBody:
        content:
          application/xml:
            schema:
              description: The XML descriptor document.
              type: string
        description: The complete XML descriptor.
        required: true
      responses:
        '200':
          description: Not returned.
        '400':
          description: The document is not well-formed XML.
        '401':
          description: Rejected credentials.
        '403':
          description: Caller is not an administrator.
      summary: Replace the configuration descriptor
      tags:
      - system
      - handwritten
      x-handwritten: true
      x-tier: stub
  /api/system/configuration/baseUrl:
    put:
      description: 'Sets the urlBase section of the descriptor: the scheme, host and optional path prefix that embedded
        links use when no `X-JFrog-Override-Base-Url` or `X-Forwarded-*` header is present (decision 0002). Sending
        an empty body clears it, after which links derive from the request. Admin only.'
      operationId: updateCustomUrlBase
      requestBody:
        content:
          text/plain:
            schema:
              description: An absolute http or https URL without a trailing slash.
              type: string
        description: The URL as plain text, for example https://artifacts.example.com.
        required: true
      responses:
        '200':
          content:
            text/plain:
              schema:
                description: A confirmation line echoing the stored value.
                type: string
          description: The base URL was stored.
        '400':
          description: The body is not an absolute http or https URL.
        '401':
          description: Rejected credentials.
        '403':
          description: Caller is not an administrator.
      summary: Set the public base URL
      tags:
      - system
      - handwritten
      x-handwritten: true
  /api/system/configuration/reverseProxy/nginx:
    get:
      description: 'Renders an nginx server block from the stored reverse proxy configuration: the server name,
        the HTTP and HTTPS listeners that are enabled, the certificate paths, the location blocks for every service
        prefix and, for the Docker repository-path method, the /v2 location. Only the NGINX web server type is rendered;
        APACHE answers 400. Admin only.'
      operationId: getReverseProxySnippet
      responses:
        '200':
          content:
            text/plain:
              schema:
                description: An nginx configuration fragment.
                type: string
          description: The snippet.
        '400':
          description: No reverse proxy configuration is stored or its type is not NGINX.
        '401':
          description: Rejected credentials.
        '403':
          description: Caller is not an administrator.
      summary: Generate an nginx snippet
      tags:
      - system
  /api/system/configuration/webServer:
    get:
      description: Returns the reverse proxy settings. Without stored settings, the response describes this server.
        dockerReverseProxyMethod is SUBDOMAIN when docker.subdomain_match is on and REPOPATHPREFIX otherwise, serverName
        is the base URL's host and, with subdomains, serverNameExpression is its wildcard. Stored settings return both
        sslPort and httpsPort with the same value. Admin only.
      operationId: getReverseProxyConfiguration
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReverseProxyConfig'
          description: The configuration.
        '401':
          description: Rejected credentials.
        '403':
          description: Caller is not an administrator.
        '404':
          description: No reverse proxy configuration has been stored yet.
      summary: Read the reverse proxy configuration
      tags:
      - system
    post:
      description: Creates or replaces the single reverse proxy configuration. The document is stored as the reverseProxies
        section of the descriptor and drives the nginx snippet and the Docker access method. Either sslPort or httpsPort
        may be sent; when both are present they must agree. Admin only.
      operationId: updateReverseProxyConfiguration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReverseProxyConfig'
        description: The configuration to store.
        required: true
      responses:
        '200':
          description: Stored.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: A required field is missing, an enum value is unknown, or sslPort and httpsPort disagree.
        '401':
          description: Rejected credentials.
        '403':
          description: Caller is not an administrator.
      summary: Store the reverse proxy configuration
      tags:
      - system
  /api/system/license:
    get:
      description: Returns the licence details of this server, which has no licence tiers. Admin only.
      operationId: getSystemLicense
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/License'
          description: Licence details.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not returned.
        '401':
          description: Rejected credentials.
        '403':
          description: Caller is not an administrator.
      summary: Licence information
      tags:
      - system
    post:
      description: Accepts a licence key. The server has no licences; it validates that the body is a JSON object,
        stores nothing and answers 200. Admin only.
      operationId: installLicense
      requestBody:
        content:
          application/json:
            schema:
              description: A single licence key.
              properties:
                licenseKey:
                  description: Optional within this object. The licence key text. Ignored; an empty or missing key
                    is still accepted.
                  type: string
              type: object
        description: The licence key to install.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessage'
          description: The key was accepted.
        '400':
          description: The body is not a JSON object.
        '401':
          description: Rejected credentials.
        '403':
          description: Caller is not an administrator.
      summary: Install a licence key
      tags:
      - system
  /api/system/licenses:
    delete:
      description: Removes the licences whose hashes are listed. The server holds none, so it answers 200 with a
        per-hash message saying so. Admin only.
      operationId: deleteHALicense
      parameters:
      - description: Required query parameter. Comma-separated licence hashes as returned in the list. Unknown hashes
          are reported in messages rather than rejected.
        in: query
        name: licenseHash
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseBatchResult'
          description: Per-hash outcome.
        '400':
          description: The licenseHash parameter is missing or empty.
        '401':
          description: Rejected credentials.
        '403':
          description: Caller is not an administrator.
      summary: Remove node licences
      tags:
      - system
    get:
      description: Lists one licence per node. This instance is a single process and returns a one-element list
        describing itself. Admin or a token scoped system:info/licenses:r.
      operationId: getHALicenseInfo
      responses:
        '200':
          content:
            application/json:
              schema:
                description: The licences of every node in the cluster.
                items:
                  $ref: '#/components/schemas/NodeLicense'
                type: array
          description: One entry per node.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not returned.
        '401':
          description: Rejected credentials.
        '403':
          description: Caller lacks the admin role or the licences scope.
      summary: List node licences
      tags:
      - system
    post:
      description: Accepts one licence key object, or an array of them, and reports a status per key. Nothing is stored,
        and every key is reported as installed. Admin only.
      operationId: installHALicenses
      requestBody:
        content:
          application/json:
            schema:
              description: One licence key object, or an array with one object per key.
              oneOf:
              - $ref: '#/components/schemas/LicenseKey'
              - description: One entry per licence key.
                items:
                  $ref: '#/components/schemas/LicenseKey'
                type: array
        description: The keys to install, as one key object or an array of them.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseBatchResult'
          description: Per-key outcome.
        '400':
          description: The body is neither a licence key object nor an array of them.
        '401':
          description: Rejected credentials.
        '403':
          description: Caller is not an administrator.
      summary: Install node licences
      tags:
      - system
  /api/system/migration/sha2/start:
    post:
      description: Not implemented; answers 501. The server records SHA-256 for every binary on write.
      operationId: startSha256Migration
      requestBody:
        content:
          application/json:
            schema:
              description: Migration tuning parameters, all optional.
              properties:
                batchThreshold:
                  default: 10
                  description: Optional within this object. Rows per batch. Ignored.
                  type: integer
                forceRunOnNodeId:
                  description: Optional within this object. Cluster node to run on. Ignored.
                  type: string
                queryLimit:
                  default: 100
                  description: Optional within this object. Rows per query. Ignored.
                  type: integer
                sleepIntervalMillis:
                  default: 5000
                  description: Optional within this object. Pause between batches in milliseconds. Ignored.
                  type: integer
                waitForClusterSleepIntervalMillis:
                  default: 5000
                  description: Optional within this object. Cluster wait interval in milliseconds. Ignored.
                  type: integer
              type: object
        description: Tuning parameters for the migration job.
        required: false
      responses:
        '200':
          content:
            text/plain:
              schema:
                description: A confirmation line.
                type: string
          description: Not returned.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not returned.
        '401':
          description: Rejected credentials.
        '403':
          description: Caller is not an administrator.
      summary: Start the SHA-256 migration
      tags:
      - system
      x-tier: stub
  /api/system/migration/sha2/stop:
    post:
      description: Not implemented; answers 501.
      operationId: stopSha256Migration
      parameters:
      - description: Optional query parameter. Pause before stopping, in milliseconds. Ignored.
        in: query
        name: sleepIntervalMillis
        required: false
        schema:
          default: 5000
          type: integer
      responses:
        '200':
          content:
            text/plain:
              schema:
                description: A confirmation line.
                type: string
          description: Not returned.
        '401':
          description: Rejected credentials.
        '403':
          description: Caller is not an administrator.
      summary: Stop the SHA-256 migration
      tags:
      - system
      x-tier: stub
  /api/system/ping:
    get:
      description: Returns the plain text OK.
      operationId: systemPing
      responses:
        '200':
          content:
            text/plain:
              schema:
                example: OK
                type: string
          description: The service is up.
        '500':
          description: The service is up but cannot serve requests.
      summary: Liveness ping
      tags:
      - system
      - handwritten
      x-handwritten: true
  /api/system/support/bundle:
    post:
      description: Not implemented; answers 501. A support bundle would package logs, configuration and thread dumps.
      operationId: createSupportBundle
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportBundleConfig'
        description: What the bundle should include.
        required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportBundleCreated'
          description: Not returned.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not returned.
        '401':
          description: Rejected credentials.
        '403':
          description: Caller is not an administrator.
      summary: Create a support bundle
      tags:
      - system
      x-tier: stub
  /api/system/support/bundle/{bundleId}:
    delete:
      description: Not implemented; answers 501.
      operationId: deleteSupportBundle
      parameters:
      - $ref: '#/components/parameters/BundleId'
      responses:
        '204':
          description: Not returned.
        '401':
          description: Rejected credentials.
        '403':
          description: Caller is not an administrator.
        '404':
          description: No bundle has that id.
      summary: Delete a support bundle
      tags:
      - system
      x-tier: stub
    get:
      description: Not implemented; answers 501.
      operationId: getSupportBundleMetadata
      parameters:
      - $ref: '#/components/parameters/BundleId'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportBundleMetadata'
          description: Not returned.
        '401':
          description: Rejected credentials.
        '403':
          description: Caller is not an administrator.
        '404':
          description: No bundle has that id.
      summary: Read support bundle metadata
      tags:
      - system
      x-tier: stub
