# Declarations every service shares (decision 0043, "Where the declarations
# live"). make bundle merges this fragment into each of the seven bundles, and
# adds TooManyRequests as the 429 and ServiceUnavailable as the 503 of every
# operation whose x-cost is not exempt and that does not declare that status
# itself. It sits beside the service directories, not in one, because the
# bundler, the scaffold and the parity tools treat every directory under
# api/src as a service. The responses' bodies reference each service's own
# ErrorResponse, so every bundle answers in its own envelope.
components:
  parameters:
    IdempotencyKey:
      description: >-
        Optional header parameter. A quoted
        ASCII key (1-128 letters, digits, dot, underscore, colon or hyphen), for
        example "8e03978e-40d5-43e8-bc93-6894a57f9324". For 24 hours, a retry
        with the same key, credential, canonical resource and identical body
        bytes does not repeat the operation's effect: it answers the original
        success status, with the body built from the committed result after
        the current credential and permissions are checked again. Reuse with
        different bytes, or with a changed parameter that alters the effect,
        returns 422. A resource deleted since answers 404, one moved out of the
        request's scope 409. Only a success is kept, so a retry after a failure
        runs the operation again. Concurrent requests wait up to 30 seconds;
        503 with Retry-After means retry the same key within its retention
        window. An operation that does not declare this parameter answers a key
        with 400.
      in: header
      name: Idempotency-Key
      x-artifactweave-extension: true
      schema:
        type: string
        minLength: 3
        maxLength: 130
  headers:
    RetryAfter:
      description: >-
        Seconds to wait before retrying, at least 1: the rest of the blocked
        window for a rate refusal, otherwise 1. Also sent on an operation's own
        503 that reports a transient condition; a 503 that reports
        configuration or a size bound carries none.
      required: true
      x-artifactweave-extension: true
      schema:
        type: integer
        minimum: 1
    RateLimit:
      description: >-
        The caller's remaining allowance under the policy admission evaluated,
        in RateLimit draft-11 syntax, for example `"api";r=5999;t=42`: the
        policy, the requests left and the seconds until its window resets.
        Also sent on every other response after admission, whatever its
        status, and on every response under the `recovery` policy, though no
        other response declares it. Not sent on health probes, on a refusal
        reached before any allowance was evaluated, or on an authentication
        401 or a restriction 403.
      x-artifactweave-extension: true
      schema:
        type: string
    RateLimitPolicy:
      description: >-
        The policy admission evaluated, in RateLimit draft-11 syntax, for
        example `"api";q=6000;w=60`: the policy name (`api`, `expensive`,
        `authentication` or `recovery`), its quota and its window in seconds.
        Sent wherever `RateLimit` is.
      x-artifactweave-extension: true
      schema:
        type: string
    LinkNext:
      description: >-
        The next page, as `<target>; rel="next"` (RFC 8288): the path and query
        the client sent, every parameter kept and only the position changed.
        Sent only while more items remain, so its absence marks the last page.
        Declared only by the operations that send it.
      x-artifactweave-extension: true
      schema:
        type: string
  responses:
    TooManyRequests:
      description: >-
        A request limit refused the request: a rate allowance or a concurrency
        permit. Wait for `Retry-After` before retrying. `RateLimit` and
        `RateLimit-Policy` report the allowance; they are absent when the
        process's concurrency permits refused the request before any allowance
        was evaluated.
      x-artifactweave-extension: true
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: >-
        A dependency of the request is briefly unavailable: admission or
        restriction storage, or, for a retry with an `Idempotency-Key`, the
        first request still running when the retry's wait budget ran out.
        Wait for `Retry-After` before retrying. `RateLimit` and
        `RateLimit-Policy` are present when the answer follows admission, as a
        keyed retry's does.
      x-artifactweave-extension: true
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
