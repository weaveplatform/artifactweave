  /api/v1/system/info:
    get:
      description: Returns the version, service id and health of the distribution service. `status` is UNSTABLE,
        with `message` naming the failing dependency, when the database or blob store is unavailable.
      operationId: getDistributionSystemInfo
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
          description: The system information.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
      summary: Get distribution system information
      tags:
      - system
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/getdistributionsysteminfo.md
  /api/v1/system/ping:
    get:
      description: Answers 200 with message OK when the instance's distribution features are usable, meaning the
        database and blob store are reachable. The distribution service is the instance itself. Anonymous callers
        may use it unless anonymous access is disabled.
      operationId: distributionPing
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageStatusResponse'
          description: Healthy.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: A dependency is unavailable; the message names it.
      summary: Ping the distribution service
      tags:
      - system
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/distributionping.md
