paths:
  /api/v1/maintenance/distributeByLastDays:
    post:
      description: Redistributes to one edge every release bundle version distributed in a window of days ending
        on `date`, for example after the edge was rebuilt. The window length runs from 1 to the configured maximum,
        7 by default. Administrators only.
      operationId: distributeByLastDays
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DistributeByLastDaysRequest'
        description: The window and the edge.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistributeByLastDaysResult'
          description: The distributions started.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The date or window is invalid, or the edge is unknown.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller lacks the permission this operation needs. Distribution administration needs an
            administrator; distributing and deleting need a destination permission covering every selected edge.
      summary: Redistribute recent release bundles to an edge
      tags:
      - system
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/distributebylastdays.md
  /api/v1/maintenance/execute/{actionType}:
    post:
      description: Runs a maintenance action using a token from the token operation, sent as the plain-text body.
        UNLOCK_STUCK releases every stuck distribution so it can be retried or cleaned up; STOP_ALL force-stops
        every in-progress distribution, ends every non-final tracker and empties the pending work queue. `dryRun`
        defaults to true and reports what would change without changing it. Administrators only.
      operationId: executeMaintenanceAction
      parameters:
      - description: 'Required path parameter. The maintenance action: UNLOCK_STUCK or STOP_ALL.'
        in: path
        name: actionType
        required: true
        schema:
          enum:
          - STOP_ALL
          - UNLOCK_STUCK
          type: string
      - description: Optional query parameter. When true, the default, the action is simulated and the report shows
          what would change. Pass false to perform it.
        in: query
        name: dryRun
        required: false
        schema:
          default: true
          type: boolean
      requestBody:
        content:
          text/plain:
            schema:
              type: string
        description: The maintenance token from the token operation, as plain text.
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/UnlockStuckReport'
                - $ref: '#/components/schemas/ForceStopAllReport'
          description: The action ran (or was simulated); the body reports what it affected.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The token is missing, expired, already used or for another action.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller lacks the permission this operation needs. Distribution administration needs an
            administrator; distributing and deleting need a destination permission covering every selected edge.
      summary: Run a maintenance action
      tags:
      - system
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/executemaintenanceaction.md
  /api/v1/maintenance/generate_token/{actionType}:
    get:
      description: Issues a single-use token for one maintenance action. The token expires after 3 minutes and must
        be sent as the body of the execute operation. Administrators only.
      operationId: generateMaintenanceExecutionToken
      parameters:
      - description: 'Required path parameter. The maintenance action: UNLOCK_STUCK or STOP_ALL.'
        in: path
        name: actionType
        required: true
        schema:
          enum:
          - STOP_ALL
          - UNLOCK_STUCK
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                description: A maintenance token.
                properties:
                  token:
                    description: Optional within this object. Single-use token, valid for 3 minutes, to send as
                      the body of the execute operation.
                    type: string
                type: object
          description: The token.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request was malformed or failed validation; the body explains which.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller lacks the permission this operation needs. Distribution administration needs an
            administrator; distributing and deleting need a destination permission covering every selected edge.
      summary: Get a maintenance token
      tags:
      - system
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/generatemaintenanceexecutiontoken.md
  /api/v1/maintenance/stuck_distributions:
    get:
      description: Lists distributions stuck in a non-final state, for example after an edge disappeared mid-transfer.
        Unlock them with the UNLOCK_STUCK maintenance action. Administrators only.
      operationId: getStuckDistributions
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/StuckDistribution'
                type: array
          description: The stuck distributions.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller lacks the permission this operation needs. Distribution administration needs an
            administrator; distributing and deleting need a destination permission covering every selected edge.
      summary: List stuck distributions
      tags:
      - system
      x-oracle-source: https://docs.jfrog.com/artifactory/reference/getstuckdistributions.md
