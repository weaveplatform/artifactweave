openapi: 3.0.3
# x-artifactweave-extension on info marks the whole document as having no
# counterpart in the published definitions the parity oracle compares
# (decision 0021): specoracle.LoadOurs leaves it out, so make parity and
# TestAccSpecParity never see these operations, and
# TestAccPeerServiceOutsideParityOracle fails if the marker goes, if any
# operation gains an x-oracle-source or if the service leaves the
# generated-mux check.
info:
  title: Peer REST API
  version: '1.0'
  x-artifactweave-extension: true
  description: >-
    The protocol between paired instances, served under `/artifactweave/peer/v1`: pairing, ordered event streams
    with a pull mode and snapshots, content blobs, federated repository configuration and a signed liveness and
    version read. Every request carries `Artifactweave-Peer-Protocol`, `Date`, `Signature` and `Signature-Input`,
    and `Content-Digest` when it has a body: an HTTP Message Signature (RFC 9421) made with the sender's Ed25519
    key (RFC 8032) over `@method`, `@target-uri`, `date` and, with a body, `content-digest`, whose `keyid` is the
    sender's instance id and whose `nonce` is never reused. A request whose key is unknown, whose `created` or
    `Date` is more than five minutes from the receiver's clock, or whose nonce the receiver has seen within that
    window answers 401. Every answer to a verified request carries the same headers, signed the same way with the
    answering instance's key, so the caller verifies it before acting on it. The protocol version is
    `<major>.<minor>`; this document describes 1.0. A request with another major version answers 400. Minor
    versions only add operations, fields and event types, and every receiver ignores fields and event types it
    does not know. Errors use the flat envelope ErrorResponse, a symbolic code with a message.
servers:
  - url: /artifactweave/peer/v1
    description: The peer service prefix on the single listener.
tags:
  - name: handwritten
    description: Marker tag. Operations with this tag are implemented by hand and excluded from generation.
  - name: pairing
    description: Redeeming a pairing token and cancelling a trust.
  - name: streams
    description: Ordered event delivery, by push or by pull, and snapshots for a full sync.
  - name: blobs
    description: Content that events and snapshot entries reference, fetched by SHA-256.
  - name: repositories
    description: Federated repository configuration sent to every member.
  - name: status
    description: The signed liveness and version read behind a peer's status.
