components:
  schemas:
    CleanupVersion:
      type: object
      required: [package, version]
      properties:
        package:
          description: Required within this object. Exact logical package name on this repository.
          type: string
          minLength: 1
          maxLength: 4096
        version:
          description: Required within this object. Exact logical version string on this member.
          type: string
          minLength: 1
          maxLength: 4096
    CleanupDownloadBatch:
      type: object
      required: [sourceRepository, packageType, challenge, versions]
      properties:
        packageType:
          description: Required within this object. The expected or observed repository package type, identical on both members.
          type: string
          minLength: 1
          maxLength: 64
        sourceRepository:
          description: Required within this object. The requester repository named by current reciprocal membership.
          type: string
          minLength: 1
          maxLength: 1024
        challenge:
          description: Required within this object. A fresh unpredictable challenge echoed in the signed answer.
          type: string
          minLength: 16
          maxLength: 128
        versions:
          description: Required within this object. One bounded batch of logical version identities or observations.
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/CleanupVersion'
    CleanupDownload:
      type: object
      required: [package, version, id, revision, created, lastDownloaded, admittedAt, admissionRevision]
      properties:
        package:
          description: Required within this object. Exact logical package name on this repository.
          type: string
          minLength: 1
          maxLength: 4096
        version:
          description: Required within this object. Exact logical version string on this member.
          type: string
          minLength: 1
          maxLength: 4096
        id:
          description: Required within this object. The immutable version identity on this member.
          type: integer
          format: int64
          minimum: 1
        revision:
          description: Required within this object. The independent generation of recorded downloads for this version.
          type: string
          minLength: 1
          maxLength: 128
        created:
          description: Required within this object. The recorded creation instant, used conservatively when no download is known.
          type: string
          format: date-time
        lastDownloaded:
          description: Required within this object. The latest recorded local, linked-item or known remote download; zero when absent.
          type: string
          format: date-time
        admittedAt:
          description: Required within this object. Latest hidden admission evidence, independent of public statistics.
          type: string
          format: date-time
        admissionRevision:
          description: Required within this object. Independent generation of all hosted download admissions including statistics opt-outs.
          type: string
          minLength: 1
          maxLength: 256
    CleanupDownloadObservation:
      type: object
      required: [instance, incarnation, generation, grant, packageType, challenge, versions]
      properties:
        packageType:
          description: Required within this object. The expected or observed repository package type, identical on both members.
          type: string
          minLength: 1
          maxLength: 64
        instance:
          description: Required within this object. The responding member instance identity.
          type: string
          minLength: 1
          maxLength: 128
        incarnation:
          description: Required within this object. The current durable repository lifetime on the responding member.
          type: string
          minLength: 1
          maxLength: 128
        generation:
          description: Required within this object. The current repository configuration generation on the responding member.
          type: string
          minLength: 1
          maxLength: 128
        grant:
          description: Required within this object. The current reciprocal trust generation on the responding member.
          type: string
          minLength: 1
          maxLength: 128
        challenge:
          description: Required within this object. A fresh unpredictable challenge echoed in the signed answer.
          type: string
          minLength: 16
          maxLength: 128
        versions:
          description: Required within this object. One bounded batch of logical version identities or observations.
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/CleanupDownload'
    CleanupExclusionVersion:
      type: object
      required: [package, version, id]
      properties:
        package:
          description: Required within this object. Exact logical package name.
          type: string
          minLength: 1
          maxLength: 4096
        version:
          description: Required within this object. Exact logical version string.
          type: string
          minLength: 1
          maxLength: 4096
        id:
          description: Required within this object. Immutable member-local version identity.
          type: integer
          format: int64
          minimum: 1
    CleanupExclusion:
      type: object
      required: [id, owner, repository, incarnation, generation, versions]
      properties:
        id:
          description: Required within this object. Durable coordinator operation identity.
          type: string
          minLength: 16
          maxLength: 128
        owner:
          description: Required within this object. Coordinator instance identity.
          type: string
          minLength: 1
          maxLength: 128
        repository:
          description: Required within this object. Exact participant repository key.
          type: string
          minLength: 1
          maxLength: 1024
        incarnation:
          description: Required within this object. Durable participant repository lifetime.
          type: string
          minLength: 1
          maxLength: 128
        generation:
          description: Required within this object. Participant repository configuration generation.
          type: string
          minLength: 1
          maxLength: 128
        versions:
          description: Required within this object. Exact bounded participant versions.
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/CleanupExclusionVersion'
    CleanupCoordinationRequest:
      type: object
      required: [action, sourceRepository, packageType, exclusion]
      properties:
        action:
          description: Required within this object. Prepare closes admissions, outcome reads irreversible state, release verifies the outcome and applied frontier.
          type: string
          enum: [prepare, outcome, release]
        sourceRepository:
          description: Required within this object. Current reciprocal requester repository key.
          type: string
          minLength: 1
          maxLength: 1024
        packageType:
          description: Required within this object. Expected repository package type.
          type: string
          minLength: 1
          maxLength: 64
        exclusion:
          description: Required within this object. Exact durable participant binding.
          $ref: '#/components/schemas/CleanupExclusion'
    CleanupCoordinationOutcome:
      type: object
      required: [state, watermark, exclusion]
      properties:
        state:
          description: Required within this object. Durable coordinator state, or acknowledged participant preparation.
          type: string
          enum: [preparing, prepared, committed, aborted]
        watermark:
          description: Required within this object. Final coordinator repository stream frontier for a committed operation; zero otherwise.
          type: integer
          format: int64
          minimum: 0
        exclusion:
          description: Required within this object. Exact echoed participant binding.
          $ref: '#/components/schemas/CleanupExclusion'
paths:
  /repositories/{repoKey}/downloads:
    post:
      operationId: observeRepositoryDownloads
      summary: Observe a bounded batch of member version downloads
      description: >-
        Read-only cleanup evidence for a current enabled member of this federated repository. Every requested
        logical version must exist with an indexed hosted file, otherwise the observation is unavailable.
        The signed answer echoes a fresh challenge and identifies the repository lifetime, configuration
        generation and independent download revision of every version. Receiving-only members can supply
        observations; this grants no event or configuration write. Each answer is an individual observation,
        not an atomic view across members. The requester bounds observation use to five seconds.
        Destructive cleanup additionally requires durable exclusion on every member; observation freshness alone grants no deletion permission.
      tags: [repositories]
      parameters:
        - name: repoKey
          description: Required path parameter. The current repository key on the responding member.
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/PeerProtocol'
        - $ref: '#/components/parameters/PeerDate'
        - $ref: '#/components/parameters/PeerSignature'
        - $ref: '#/components/parameters/PeerSignatureInput'
        - $ref: '#/components/parameters/PeerContentDigest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CleanupDownloadBatch'
      responses:
        '200':
          description: Current bounded download observations, bound to the request challenge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CleanupDownloadObservation'
        '400':
          description: The request has invalid, duplicate or excessive version identities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/PeerUnauthorized'
        '403':
          description: Current trust or enabled repository membership does not permit this observation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The repository no longer exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A requested version or current lifetime/membership observation is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/PeerInternalError'
      x-idempotency: safe
      x-cost: ordinary
  /repositories/{repoKey}/cleanup-exclusions:
    post:
      operationId: coordinateRepositoryCleanup
      summary: Coordinate durable federated cleanup exclusion
      description: >-
        Signed participant preparation, coordinator outcome lookup and release for one exact durable cleanup
        operation. Preparation closes new member download admissions and refuses active or ambiguous readers.
        The reservation never expires by time. Release requires an irreversible fenced abort or local application
        of the coordinator's final committed repository watermark. All requests are idempotent for the same
        immutable operation binding. Unavailable peers and ambiguous outcomes retain exclusion. Member redirects
        are accounted through the member response; later direct object-store URL use is outside this boundary.
      tags: [repositories]
      parameters:
        - name: repoKey
          description: Required path parameter. The current repository key on the responding member.
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/PeerProtocol'
        - $ref: '#/components/parameters/PeerDate'
        - $ref: '#/components/parameters/PeerSignature'
        - $ref: '#/components/parameters/PeerSignatureInput'
        - $ref: '#/components/parameters/PeerContentDigest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CleanupCoordinationRequest'
      responses:
        '200':
          description: Acknowledged durable participant state with the exact operation binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CleanupCoordinationOutcome'
        '400':
          description: The request has invalid, duplicate or excessive version identities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/PeerUnauthorized'
        '403':
          description: Current trust or enabled repository membership does not permit this observation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The repository no longer exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A requested version or current lifetime/membership observation is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/PeerInternalError'
      x-idempotency: natural
      x-idempotency-natural:
        - path:repoKey
        - body:/action
        - body:/exclusion/owner
        - body:/exclusion/id
      x-cost: ordinary
