components:
  parameters:
    FederationId:
      description: Required path parameter. Id of the federation, as returned at creation.
      in: path
      name: id
      required: true
      schema:
        type: string
    JpdId:
      description: Required path parameter. Id of the follower JPD, as given when it was added.
      in: path
      name: id
      required: true
      schema:
        type: string
  schemas:
    ConnectionGroup:
      description: The follower instances a federation sends to.
      properties:
        target_jpd_ids:
          description: Required within this object. Ids of follower JPDs, each previously added with POST /pfed/api/v1/jpd.
            Duplicates are rejected.
          items:
            description: A follower JPD id.
            type: string
          type: array
      required:
      - target_jpd_ids
      type: object
    CreateFederationRequest:
      description: A new platform federation on this (controller) instance. Only name, description and the follower
        ids are free choices; the connection group key and the entity list are fixed by the protocol.
      properties:
        connection_groups:
          additionalProperties:
            $ref: '#/components/schemas/ConnectionGroup'
          description: Required within this object. Must contain exactly one key, source-jpd, mapping to the connection
            group that lists the followers. Any other key answers 400.
          type: object
        description:
          description: Optional within this object. Free text describing what the federation is for.
          type: string
        entities:
          description: Required within this object. The entity types to federate. Must list all four types of
            the EntityConfig type enum, each once. The federation and its membership are recorded, but these types
            carry no data to synchronise. Identity replication between peers is configured through /access/api/v1/system/federation
            instead.
          items:
            $ref: '#/components/schemas/EntityConfig'
          type: array
        name:
          description: Required within this object. Unique name of the federation on this instance.
          type: string
      required:
      - name
      - connection_groups
      - entities
      type: object
    CreateJpdRequest:
      description: A follower instance to add to this controller. Obtain pairing_token on the follower with POST
        /access/api/v1/service_trust/pairing/platform-federation; the token is used once to establish mutual trust
        and is not stored.
      properties:
        id:
          description: Required within this object. Label for the follower, unique on this controller; referenced
            from connection groups.
          type: string
        pairing_token:
          description: Required within this object. Write-only. The pairing token issued by the follower for the
            platform-federation use case. Rejected with 400 when expired, already used or issued for another use
            case.
          type: string
          writeOnly: true
        url:
          description: Required within this object. Base URL of the follower instance.
          type: string
      required:
      - id
      - url
      - pairing_token
      type: object
    EntityConfig:
      description: One entity type a federation covers.
      properties:
        type:
          description: Required within this object. Entity type identifier in <service>.<entityType> form. These
            types are recorded but carry no data to synchronise. Identity replication between peers is configured
            through /access/api/v1/system/federation instead.
          enum:
          - catalog.customLabels
          - xray.curationCondition
          - xray.curationPkgType
          - xray.curationPolicy
          type: string
      required:
      - type
      type: object
    FederationDetails:
      description: A stored platform federation.
      properties:
        connection_groups:
          additionalProperties:
            $ref: '#/components/schemas/ConnectionGroup'
          description: Optional within this object. The connection groups keyed by group name; always the single
            source-jpd group.
          type: object
        description:
          description: Optional within this object. The federation description, empty when none was given.
          type: string
        entities:
          description: Optional within this object. The federated entity types.
          items:
            $ref: '#/components/schemas/EntityConfig'
          type: array
        id:
          description: Optional within this object. Server-owned. Identifier assigned at creation and used in /federations/{id}.
          type: string
        name:
          description: Optional within this object. The federation name.
          type: string
      type: object
    FederationSummary:
      description: A federation as listed.
      properties:
        id:
          description: Optional within this object. Server-owned. The federation id.
          type: string
        name:
          description: Optional within this object. The federation name.
          type: string
      type: object
    JpdResponse:
      description: A follower instance as listed.
      properties:
        id:
          description: Optional within this object. The follower id.
          type: string
        url:
          description: Optional within this object. The follower's base URL.
          type: string
      type: object
    JpdUrlResponse:
      description: A single follower instance.
      properties:
        url:
          description: Optional within this object. The follower's base URL.
          type: string
      type: object
    UpdateJpdRequest:
      description: Replacement URL and a fresh pairing token for an existing follower, used to move a follower or
        rotate trust. Both fields are required even when only one changes.
      properties:
        pairing_token:
          description: Required within this object. Write-only. A new platform-federation pairing token from the
            follower; the previous trust keys are replaced once it is accepted.
          type: string
          writeOnly: true
        url:
          description: Required within this object. The follower's base URL.
          type: string
      required:
      - url
      - pairing_token
      type: object
paths:
  /api/v1/federations:
    get:
      description: Returns every platform federation defined on this controller instance. Administrators only.
      operationId: listFederations
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Federations ordered by name.
                items:
                  $ref: '#/components/schemas/FederationSummary'
                type: array
          description: The federations; an empty array when none exist.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller is not an administrator.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unexpected server error.
      summary: List platform federations
      tags:
      - federation
      x-oracle-source: https://docs.jfrog.com/administration/reference/listfederations.md
    post:
      description: Defines a federation on this controller that groups previously added follower instances. Every
        follower id in the connection group must already exist (POST /pfed/api/v1/jpd). The federation and its
        membership are recorded, but its entity types carry no data to synchronise. Identity replication between
        peers is configured through /access/api/v1/system/federation instead. Administrators only.
      operationId: createFederation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFederationRequest'
        description: The federation to create.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FederationDetails'
          description: Federation created; the body is the stored federation.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Invalid body: a missing field, a connection group key other than source-jpd, an unknown
            follower id, or an entity list other than the four required types.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller is not an administrator.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: A federation with this name already exists.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unexpected server error.
      summary: Create a platform federation
      tags:
      - federation
      x-oracle-source: https://docs.jfrog.com/administration/reference/createfederation.md
  /api/v1/federations/{id}:
    delete:
      description: Removes a federation. The follower instances stay registered and paired and can join another
        federation. Administrators only.
      operationId: deleteFederation
      parameters:
      - $ref: '#/components/parameters/FederationId'
      responses:
        '204':
          description: Federation deleted.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller is not an administrator.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No federation has this id.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unexpected server error.
      summary: Delete a platform federation
      tags:
      - federation
      x-oracle-source: https://docs.jfrog.com/administration/reference/deletefederation.md
    get:
      description: Returns one federation with its connection group and entity types. Administrators only.
      operationId: getFederation
      parameters:
      - $ref: '#/components/parameters/FederationId'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FederationDetails'
          description: The federation.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller is not an administrator.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No federation has this id.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unexpected server error.
      summary: Get a platform federation
      tags:
      - federation
      x-oracle-source: https://docs.jfrog.com/administration/reference/getfederation.md
  /api/v1/jpd:
    get:
      description: Returns every follower instance added to this controller. A follower is always a peer instance
        paired over the peer protocol. Administrators only.
      operationId: listFollowerJpds
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Followers ordered by id.
                items:
                  $ref: '#/components/schemas/JpdResponse'
                type: array
          description: The followers; an empty array when none exist.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller is not an administrator.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unexpected server error.
      summary: List follower instances
      tags:
      - federation
      x-oracle-source: https://docs.jfrog.com/administration/reference/listfollowerjpds.md
    post:
      description: Adds a follower and establishes mutual trust with it by redeeming the follower's platform-federation
        pairing token over the peer protocol. The token is consumed; the resulting per-peer keys are sealed at
        rest. Administrators only.
      operationId: addFollowerJpd
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJpdRequest'
        description: The follower to add.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JpdResponse'
          description: Follower added and paired.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid body, an unreachable follower, or a pairing token the follower rejects.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller is not an administrator.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: A follower with this id already exists.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unexpected server error.
      summary: Add a follower instance
      tags:
      - federation
      x-oracle-source: https://docs.jfrog.com/administration/reference/addfollowerjpd.md
  /api/v1/jpd/{id}:
    delete:
      description: Removes a follower from this controller and forgets its trust keys. It is also removed from every
        federation that listed it. Administrators only.
      operationId: deleteFollowerJpd
      parameters:
      - $ref: '#/components/parameters/JpdId'
      responses:
        '204':
          description: Follower removed.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller is not an administrator.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No follower has this id.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unexpected server error.
      summary: Remove a follower instance
      tags:
      - federation
      x-oracle-source: https://docs.jfrog.com/administration/reference/deletefollowerjpd.md
    get:
      description: Returns the base URL of one follower. Administrators only.
      operationId: getFollowerJpd
      parameters:
      - $ref: '#/components/parameters/JpdId'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JpdUrlResponse'
          description: The follower.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller is not an administrator.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No follower has this id.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unexpected server error.
      summary: Get a follower instance
      tags:
      - federation
      x-oracle-source: https://docs.jfrog.com/administration/reference/getfollowerjpd.md
    put:
      description: Replaces a follower's URL and re-pairs with it using a fresh pairing token, for example after
        the follower moved or to rotate the trust keys. Federations that reference the follower keep working. Administrators
        only.
      operationId: updateFollowerJpd
      parameters:
      - $ref: '#/components/parameters/JpdId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateJpdRequest'
        description: The new URL and pairing token.
        required: true
      responses:
        '204':
          description: Follower updated and re-paired.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid body, an unreachable follower, or a rejected pairing token.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Credentials were missing or rejected.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller is not an administrator.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No follower has this id.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unexpected server error.
      summary: Update a follower instance
      tags:
      - federation
      x-oracle-source: https://docs.jfrog.com/administration/reference/updatefollowerjpd.md
