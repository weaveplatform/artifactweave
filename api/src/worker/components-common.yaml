components:
  schemas:
    ErrorResponse:
      type: object
      description: The error envelope for /worker. For a run stopped by a limit, code carries the errorCode and
        message the matching errorMessage.
      x-unverified: true
      required:
      - errors
      properties:
        errors:
          type: array
          description: Required within this object. One entry per error.
          items:
            type: object
            required:
            - code
            - message
            properties:
              code:
                type: string
                description: Required within this object. A symbolic code such as NOT_FOUND.
              message:
                type: string
                description: Required within this object. Human readable explanation.
