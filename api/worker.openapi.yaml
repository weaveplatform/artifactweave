# Generated by `make bundle` from api/src/worker/; edit the fragments, not this file.
openapi: 3.0.3
info:
  title: artifactweave Workers-compatible REST API
  version: 0.1.0
  description: >-
    The serverless worker surface: worker definitions, the action catalogue, test, execute, rerun and execution history (decision 0026), served under /worker. Paths and shapes mirror JFrog's documented API (docs/research/16). Authored by the artifactweave project; cites JFrog's documentation and copies nothing from it.
servers:
  - url: /worker
    description: The worker service prefix on the single artifactweave listener.
tags:
  - name: handwritten
    description: Marker tag. Operations with this tag are implemented by hand and excluded from generation.
paths:
  /api/v1/actions:
    get:
      description: Returns the names of the actions this instance can trigger. Platform administrators only.
      operationId: getWorkerActions
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  description: One action name.
                  type: string
                type: array
          description: The action names.
        '401':
          $ref: '#/components/responses/WorkerUnauthorized'
      summary: List action names
      tags:
        - workers
      x-oracle-source: https://docs.jfrog.com/administration/reference/getworkeractions.md
  /api/v1/execute/{workerKey}:
    post:
      description: 'Runs a GENERIC_EVENT worker synchronously with the given input and returns {data, executionStatus}. Administrators, or any authenticated user when the worker is shared. A worker for any other action is rejected with 400; a run that breaches a limit is terminated, recorded in the execution history with its errorCode, and answered with 400. Each execution runs alone in a helper process (the artifactweave binary''s hidden worker-host subcommand) under JFrog''s documented default limits: 64 MiB of memory (the run is interrupted on breach and the helper replaced at twice that), 1 s of CPU time, 5 s per platform or HTTP call, 20 s overall, a call stack depth of 100, 100 KiB of JSON input and of result, and source of at most 100,000 characters. Helpers form a pool of min(4, GOMAXPROCS); a run that waits longer than 30 s for a helper fails (JFrog''s maxWaitingInQueueMillis default).'
      operationId: executeHttpTriggeredWorker
      parameters:
        - description: Required path parameter. Key of the worker.
          in: path
          name: workerKey
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerExecutionPayload'
        description: The input passed to the worker; omit for none.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerExecutionResult'
          description: The worker ran and this is what it returned.
        '400':
          $ref: '#/components/responses/WorkerBadRequest'
        '401':
          $ref: '#/components/responses/WorkerUnauthorized'
        '403':
          $ref: '#/components/responses/WorkerForbidden'
        '404':
          $ref: '#/components/responses/WorkerNotFound'
      summary: Execute a worker
      tags:
        - workers
      x-oracle-source: https://docs.jfrog.com/administration/reference/executehttptriggeredworker.md
  /api/v1/execution_history:
    get:
      description: 'Returns recorded executions, newest first. Successful runs are recorded only for workers with debug true; failures, including runs stopped by a limit, always are, with errorCode set. Each execution runs alone in a helper process (the artifactweave binary''s hidden worker-host subcommand) under JFrog''s documented default limits: 64 MiB of memory (the run is interrupted on breach and the helper replaced at twice that), 1 s of CPU time, 5 s per platform or HTTP call, 20 s overall, a call stack depth of 100, 100 KiB of JSON input and of result, and source of at most 100,000 characters. Helpers form a pool of min(4, GOMAXPROCS); a run that waits longer than 30 s for a helper fails (JFrog''s maxWaitingInQueueMillis default). Platform administrators only.'
      operationId: getWorkerExecutionHistory
      parameters:
        - description: Optional query parameter. Return at most this many entries.
          in: query
          name: maxItems
          schema:
            type: integer
        - description: Optional query parameter. Exclude executions that started before this time, in epoch milliseconds.
          in: query
          name: start
          schema:
            format: int64
            type: integer
        - description: Optional query parameter. Exclude executions that started after this time, in epoch milliseconds.
          in: query
          name: end
          schema:
            format: int64
            type: integer
        - description: Optional query parameter. Only runs of this worker.
          in: query
          name: workerKey
          required: false
          schema:
            type: string
        - description: Optional query parameter. When true, test runs are included. Defaults to false.
          in: query
          name: showTestRun
          required: false
          schema:
            type: boolean
        - description: Optional query parameter. Project scope; required for project administrators.
          in: query
          name: projectKey
          required: false
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/WorkerExecutionHistoryEntry'
                type: array
          description: The entries.
        '401':
          $ref: '#/components/responses/WorkerUnauthorized'
        '403':
          $ref: '#/components/responses/WorkerForbidden'
      summary: List recorded executions
      tags:
        - workers
      x-oracle-source: https://docs.jfrog.com/administration/reference/getworkerexecutionhistory.md
  /api/v1/rerun/{workerKey}:
    post:
      description: Runs the worker's current script again with the input of a recorded execution. Any authenticated user allowed to run the worker; others get 403.
      operationId: rerunWorker
      parameters:
        - description: Required path parameter. Key of the worker.
          in: path
          name: workerKey
          required: true
          schema:
            type: string
        - description: Optional query parameter. Record this run in the history even when the worker has debug false. Defaults to false.
          in: query
          name: forceRecord
          schema:
            default: false
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              description: Identifies a recorded execution.
              properties:
                historyEntryId:
                  description: Required within this object. id of the history entry whose input is replayed.
                  type: string
              required:
                - historyEntryId
              type: object
        description: The execution to repeat.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerExecutionResult'
          description: The worker ran and this is what it returned.
        '400':
          $ref: '#/components/responses/WorkerBadRequest'
        '401':
          $ref: '#/components/responses/WorkerUnauthorized'
        '403':
          $ref: '#/components/responses/WorkerForbidden'
        '404':
          $ref: '#/components/responses/WorkerNotFound'
      summary: Rerun a recorded execution
      tags:
        - workers
      x-oracle-source: https://docs.jfrog.com/administration/reference/rerunworker.md
  /api/v1/scaffold/tsconfig:
    get:
      description: Returns the TypeScript configuration worker scripts are compiled with. Platform administrators, or project administrators with projectKey.
      operationId: getWorkerScaffoldTsConfig
      parameters:
        - description: Optional query parameter. Project to act for. Required for project administrators, who must also name the same project in the worker.
          in: query
          name: projectKey
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerScaffoldTsConfig'
          description: The configuration.
        '401':
          $ref: '#/components/responses/WorkerUnauthorized'
        '403':
          $ref: '#/components/responses/WorkerForbidden'
      summary: Get the TypeScript settings
      tags:
        - workers
      x-oracle-source: https://docs.jfrog.com/administration/reference/getworkerscaffoldtsconfig.md
  /api/v1/system/liveness:
    get:
      description: Answers when the Workers service is running. No authentication. In artifactweave the service is part of the single process, so this mirrors the process liveness probe.
      operationId: checkWorkersLiveness
      responses:
        '200':
          content:
            text/plain:
              schema:
                type: string
          description: The service is alive; the body is a short status text.
      summary: Workers liveness
      tags:
        - system
      x-oracle-source: https://docs.jfrog.com/administration/reference/checkworkersliveness.md
  /api/v1/system/readiness:
    get:
      description: Answers when the Workers service can run workers. No authentication.
      operationId: checkWorkersReadiness
      responses:
        '200':
          content:
            text/plain:
              schema:
                type: string
          description: The service is ready; the body is a short status text.
      summary: Workers readiness
      tags:
        - system
      x-oracle-source: https://docs.jfrog.com/administration/reference/checkworkersreadiness.md
  /api/v1/test:
    post:
      description: 'Transpiles and runs a script that is not saved, with the given action and input, and returns its outcome keyed by action. Nothing is stored. A run that breaches a limit is terminated and answered with 400, its errorCode in the message. Each execution runs alone in a helper process (the artifactweave binary''s hidden worker-host subcommand) under JFrog''s documented default limits: 64 MiB of memory (the run is interrupted on breach and the helper replaced at twice that), 1 s of CPU time, 5 s per platform or HTTP call, 20 s overall, a call stack depth of 100, 100 KiB of JSON input and of result, and source of at most 100,000 characters. Helpers form a pool of min(4, GOMAXPROCS); a run that waits longer than 30 s for a helper fails (JFrog''s maxWaitingInQueueMillis default). Platform administrators only.'
      operationId: executeWorkerTestGeneric
      parameters:
        - description: Optional query parameter. When true the run's log lines are kept with the result. Defaults to false.
          in: query
          name: debug
          required: false
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerTestRequest'
        description: The script, its action and its input.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerTestResult'
          description: The script ran and this is what it returned.
        '400':
          $ref: '#/components/responses/WorkerBadRequest'
        '401':
          $ref: '#/components/responses/WorkerUnauthorized'
        '403':
          $ref: '#/components/responses/WorkerForbidden'
      summary: Test an unsaved script
      tags:
        - workers
      x-oracle-source: https://docs.jfrog.com/administration/reference/executeworkertestgeneric.md
  /api/v1/test/{workerKey}:
    post:
      description: 'Runs the given script in the context of a saved worker: its secrets and properties apply, overlaid by any staged ones, and a BEFORE_ decision is returned without being applied to a real operation. This is what jf worker test-run calls. A run that breaches a limit is terminated and answered with 400. Each execution runs alone in a helper process (the artifactweave binary''s hidden worker-host subcommand) under JFrog''s documented default limits: 64 MiB of memory (the run is interrupted on breach and the helper replaced at twice that), 1 s of CPU time, 5 s per platform or HTTP call, 20 s overall, a call stack depth of 100, 100 KiB of JSON input and of result, and source of at most 100,000 characters. Helpers form a pool of min(4, GOMAXPROCS); a run that waits longer than 30 s for a helper fails (JFrog''s maxWaitingInQueueMillis default). Platform administrators, or project administrators for the worker''s project.'
      operationId: executeWorkerTest
      parameters:
        - description: Required path parameter. Key of the worker.
          in: path
          name: workerKey
          required: true
          schema:
            type: string
        - description: Optional query parameter. When true the run's log lines are kept with the result. Defaults to false.
          in: query
          name: debug
          required: false
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerTestRequest'
        description: The input passed to the worker.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerTestResult'
          description: The worker ran and this is what it returned.
        '400':
          $ref: '#/components/responses/WorkerBadRequest'
        '401':
          $ref: '#/components/responses/WorkerUnauthorized'
        '403':
          $ref: '#/components/responses/WorkerForbidden'
        '404':
          $ref: '#/components/responses/WorkerNotFound'
      summary: Test a saved worker
      tags:
        - workers
      x-oracle-source: https://docs.jfrog.com/administration/reference/executeworkertest.md
  /api/v1/workers:
    get:
      description: Returns every worker. Platform administrators only.
      operationId: getWorkers
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Worker'
                type: array
          description: The workers, ordered by key.
        '401':
          $ref: '#/components/responses/WorkerUnauthorized'
        '403':
          $ref: '#/components/responses/WorkerForbidden'
      summary: List workers
      tags:
        - workers
      x-oracle-source: https://docs.jfrog.com/administration/reference/getworkers.md
    post:
      description: Saves a new worker after transpiling its script. Platform administrators, or project administrators with projectKey for actions that support projects. A duplicate key is rejected with 400.
      operationId: createWorker
      parameters:
        - description: Optional query parameter. Project to act for. Required for project administrators, who must also name the same project in the worker.
          in: query
          name: projectKey
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerCreateRequest'
        description: The worker to create.
        required: true
      responses:
        '201':
          description: The worker is saved.
        '400':
          $ref: '#/components/responses/WorkerBadRequest'
        '401':
          $ref: '#/components/responses/WorkerUnauthorized'
        '403':
          $ref: '#/components/responses/WorkerForbidden'
      summary: Create a worker
      tags:
        - workers
      x-oracle-source: https://docs.jfrog.com/administration/reference/createworker.md
    put:
      description: Changes an existing worker, identified by key in the body; a new script is transpiled before it is saved. Platform administrators only.
      operationId: updateWorker
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerUpdateRequest'
        description: The worker's new settings.
        required: true
      responses:
        '200':
          description: The worker is updated.
        '400':
          $ref: '#/components/responses/WorkerBadRequest'
        '401':
          $ref: '#/components/responses/WorkerUnauthorized'
        '403':
          $ref: '#/components/responses/WorkerForbidden'
        '404':
          $ref: '#/components/responses/WorkerNotFound'
      summary: Update a worker
      tags:
        - workers
      x-oracle-source: https://docs.jfrog.com/administration/reference/updateworker.md
  /api/v1/workers/{workerKey}:
    delete:
      description: Deletes a worker; its recorded executions are removed with it. Platform administrators only.
      operationId: deleteWorker
      parameters:
        - description: Required path parameter. Key of the worker.
          in: path
          name: workerKey
          required: true
          schema:
            type: string
      responses:
        '204':
          description: The worker is deleted.
        '401':
          $ref: '#/components/responses/WorkerUnauthorized'
        '403':
          $ref: '#/components/responses/WorkerForbidden'
        '404':
          $ref: '#/components/responses/WorkerNotFound'
      summary: Delete a worker
      tags:
        - workers
      x-oracle-source: https://docs.jfrog.com/administration/reference/deleteworker.md
    get:
      description: Returns one worker, including its script. Platform administrators only.
      operationId: getWorker
      parameters:
        - description: Required path parameter. Key of the worker.
          in: path
          name: workerKey
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Worker'
          description: The worker.
        '401':
          $ref: '#/components/responses/WorkerUnauthorized'
        '403':
          $ref: '#/components/responses/WorkerForbidden'
        '404':
          $ref: '#/components/responses/WorkerNotFound'
      summary: Get a worker
      tags:
        - workers
      x-oracle-source: https://docs.jfrog.com/administration/reference/getworker.md
  /api/v2/actions:
    get:
      description: 'Returns the metadata of each action this instance can trigger: sample input, TypeScript types, filter rules and sample code. Platform administrators, or project administrators with projectKey.'
      operationId: getWorkerActionsMetadata
      parameters:
        - description: Optional query parameter. Project to act for. Required for project administrators, who must also name the same project in the worker.
          in: query
          name: projectKey
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ActionMetadata'
                type: array
          description: One entry per action.
        '401':
          $ref: '#/components/responses/WorkerUnauthorized'
        '403':
          $ref: '#/components/responses/WorkerForbidden'
      summary: Describe the actions
      tags:
        - workers
      x-oracle-source: https://docs.jfrog.com/administration/reference/getworkeractionsmetadata.md
components:
  responses:
    WorkerBadRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: The request was malformed or failed validation, for example a script that does not transpile. The body carries the error envelope.
    WorkerForbidden:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: The caller lacks the privilege the operation needs. The body carries the error envelope.
    WorkerNotFound:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: No worker, or no history entry, has the key or id given. The body carries the error envelope.
    WorkerUnauthorized:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: Credentials were missing or rejected. The body carries the error envelope.
  schemas:
    ActionMetadata:
      description: Everything needed to write a worker for one action.
      properties:
        action:
          description: Optional within this object. Identity of the action.
          properties:
            application:
              description: Optional within this object. Service that raises the action, such as artifactory or access.
              type: string
            name:
              description: Optional within this object. Action name, one of the values accepted by action on create.
              type: string
          type: object
        async:
          description: Optional within this object. True for actions that run after the operation has committed (the AFTER_ actions and SCHEDULED_EVENT), which cannot change its outcome.
          type: boolean
        description:
          description: Optional within this object. What the action is for.
          type: string
        executionRequestType:
          description: Optional within this object. Name of the input type in typesDefinitions, such as BeforeDownloadRequest.
          type: string
        filterType:
          description: 'Optional within this object. Which filterCriteria member applies: FILTER_REPO for artifactFilterCriteria, SCHEDULE for schedule. Absent for actions that take no filter.'
          enum:
            - FILTER_REPO
            - SCHEDULE
          type: string
        mandatoryFilter:
          description: Optional within this object. When true the action requires the filterCriteria member named by filterType; when absent or false the action rejects a filter.
          type: boolean
        requestSchema:
          description: Optional within this object. JSON schema of the input as text, when available.
          type: string
        sampleCode:
          description: Optional within this object. Example worker script.
          type: string
        samplePayload:
          description: Optional within this object. Example input as JSON text.
          type: string
        supportProjects:
          description: Optional within this object. Whether project administrators may create workers for this action.
          type: boolean
        typesDefinitions:
          description: Optional within this object. TypeScript declarations of the input and result types. Status enums are numeric (for example DOWNLOAD_PROCEED = 1); workers may return either the number or the member name as a string, and artifactweave accepts both.
          type: string
        wikiUrl:
          description: Optional within this object. Link to documentation for the action.
          type: string
      type: object
    ErrorResponse:
      type: object
      description: 'The error envelope for /worker. No JFrog source shows a Workers error body: the JFrog CLI prints error bodies verbatim and the platform Terraform provider reports them as text, so clients do not depend on its fields. JFrog''s own MCP client reads errors[0].message and falls back to message. artifactweave answers with the Access shape below; for a run stopped by a limit, code carries the errorCode and message JFrog''s wording.'
      x-unverified: true
      required:
        - errors
      properties:
        errors:
          type: array
          description: Required within this object. One entry per error; clients read the first.
          items:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: string
                description: Required within this object. A symbolic code such as NOT_FOUND.
              message:
                type: string
                description: Required within this object. Human readable explanation.
    Worker:
      description: 'A worker definition. Source is TypeScript or JavaScript, sent as plain text or as base64:<encoded>, transpiled by esbuild when saved and run by the embedded goja engine (decision 0026). Each execution runs alone in a helper process (the artifactweave binary''s hidden worker-host subcommand) under JFrog''s documented default limits: 64 MiB of memory (the run is interrupted on breach and the helper replaced at twice that), 1 s of CPU time, 5 s per platform or HTTP call, 20 s overall, a call stack depth of 100, 100 KiB of JSON input and of result, and source of at most 100,000 characters. Helpers form a pool of min(4, GOMAXPROCS); a run that waits longer than 30 s for a helper fails (JFrog''s maxWaitingInQueueMillis default).'
      properties:
        action:
          description: Optional within this object. The event that runs the worker. BEFORE_ actions run synchronously inside the operation and can veto or alter it; AFTER_ actions run after it has committed; GENERIC_EVENT workers run only when called through the execute operation. The server accepts only the actions it can trigger, which GET /api/v2/actions lists; any other value is rejected with 400.
          type: string
        debug:
          description: Optional within this object. When true every run is recorded in the execution history; when false, the default, only failed runs are.
          type: boolean
        description:
          description: Optional within this object. Free text shown with the worker.
          type: string
        enabled:
          description: Optional within this object. Whether the worker runs when its event occurs.
          type: boolean
        filterCriteria:
          allOf:
            - $ref: '#/components/schemas/WorkerFilterCriteria'
          description: Optional within this object. Which events trigger the worker. Required for actions whose metadata has mandatoryFilter true, ignored for GENERIC_EVENT.
        key:
          description: Optional within this object. Identifier of the worker.
          type: string
        projectKey:
          description: Optional within this object. Project that owns the worker; empty for a platform-level worker. Must match the projectKey query parameter when a project administrator makes the call.
          type: string
        properties:
          description: Optional within this object. Clear-text settings for the worker, merged by key on update.
          items:
            $ref: '#/components/schemas/WorkerProperty'
          type: array
        secrets:
          description: Optional within this object. Secrets for the worker. On update, entries are merged by key; markedForRemoval deletes one. Values are never returned.
          items:
            $ref: '#/components/schemas/WorkerSecret'
          type: array
        shared:
          description: Optional within this object. When true, users who are not administrators may execute the worker through the execute operation. Only meaningful for GENERIC_EVENT. Defaults to false.
          type: boolean
        sourceCode:
          description: Optional within this object. The script exactly as last saved.
          type: string
      type: object
    WorkerCreateRequest:
      description: 'A worker definition. Source is TypeScript or JavaScript, sent as plain text or as base64:<encoded>, transpiled by esbuild when saved and run by the embedded goja engine (decision 0026). Each execution runs alone in a helper process (the artifactweave binary''s hidden worker-host subcommand) under JFrog''s documented default limits: 64 MiB of memory (the run is interrupted on breach and the helper replaced at twice that), 1 s of CPU time, 5 s per platform or HTTP call, 20 s overall, a call stack depth of 100, 100 KiB of JSON input and of result, and source of at most 100,000 characters. Helpers form a pool of min(4, GOMAXPROCS); a run that waits longer than 30 s for a helper fails (JFrog''s maxWaitingInQueueMillis default).'
      properties:
        action:
          description: Required within this object. The event that runs the worker. BEFORE_ actions run synchronously inside the operation and can veto or alter it; AFTER_ actions run after it has committed; GENERIC_EVENT workers run only when called through the execute operation. SCHEDULED_EVENT workers run on the cron schedule in filterCriteria.schedule. The server accepts only the actions it can trigger, which GET /api/v2/actions lists; any other value is rejected with 400. The enum is the union of JFrog's documented list and the names a live catalogue and JFrog's samples use (BEFORE_REMOTE_INFO, AFTER_WORKLOAD_STATE_CHANGE, SCHEDULED_EVENT); AFTER_SAVE, BEFORE_UPLOAD_REQUEST, BEFORE_REMOTE_INFO_REQUEST and AFTER_WORKLOAD_STATE_CHANGE_REQUEST appear only in the reference list and are accepted as aliases.
          enum:
            - AFTER_BUILD_INFO_SAVE
            - AFTER_COPY
            - AFTER_CREATE
            - AFTER_DELETE
            - AFTER_DOWNLOAD
            - AFTER_DOWNLOAD_ERROR
            - AFTER_MOVE
            - AFTER_PROPERTY_CREATE
            - AFTER_PROPERTY_DELETE
            - AFTER_REMOTE_DOWNLOAD
            - AFTER_REPO_CREATE
            - AFTER_REPO_DELETE
            - AFTER_REPO_UPDATE
            - AFTER_SAVE
            - AFTER_WORKLOAD_STATE_CHANGE
            - AFTER_WORKLOAD_STATE_CHANGE_REQUEST
            - ALT_ALL_RESPONSES
            - ALT_REMOTE_CONTENT
            - ALT_REMOTE_PATH
            - ALT_RESPONSE
            - BEFORE_BUILD_INFO_SAVE
            - BEFORE_COPY
            - BEFORE_CREATE
            - BEFORE_CREATE_TOKEN
            - BEFORE_DELETE
            - BEFORE_DELETE_REPLICATION
            - BEFORE_DIRECTORY_REPLICATION
            - BEFORE_DOWNLOAD
            - BEFORE_DOWNLOAD_REQUEST
            - BEFORE_FILE_REPLICATION
            - BEFORE_MOVE
            - BEFORE_PROPERTY_CREATE
            - BEFORE_PROPERTY_DELETE
            - BEFORE_PROPERTY_REPLICATION
            - BEFORE_REMOTE_DOWNLOAD
            - BEFORE_REMOTE_INFO
            - BEFORE_REMOTE_INFO_REQUEST
            - BEFORE_REPO_CREATE
            - BEFORE_REPO_DELETE
            - BEFORE_REPO_UPDATE
            - BEFORE_REVOKE_TOKEN
            - BEFORE_STATISTICS_REPLICATION
            - BEFORE_TOKEN_EXPIRY
            - BEFORE_UPLOAD
            - BEFORE_UPLOAD_REQUEST
            - GENERIC_EVENT
            - SCHEDULED_EVENT
          type: string
        debug:
          description: Optional within this object. When true every run is recorded in the execution history; when false, the default, only failed runs are.
          type: boolean
        description:
          description: Optional within this object. Free text shown with the worker.
          type: string
        enabled:
          default: true
          description: Required within this object. Whether the worker runs when its event occurs.
          type: boolean
        filterCriteria:
          allOf:
            - $ref: '#/components/schemas/WorkerFilterCriteria'
          description: Optional within this object. Which events trigger the worker. Required for actions whose metadata has mandatoryFilter true, ignored for GENERIC_EVENT.
        key:
          description: Required within this object. Identifier of the worker, unique on the instance.
          type: string
        projectKey:
          description: Optional within this object. Project that owns the worker; empty for a platform-level worker. Must match the projectKey query parameter when a project administrator makes the call.
          type: string
        properties:
          description: Optional within this object. Clear-text settings for the worker, merged by key on update.
          items:
            $ref: '#/components/schemas/WorkerProperty'
          type: array
        secrets:
          description: Optional within this object. Secrets for the worker. On update, entries are merged by key; markedForRemoval deletes one. Values are never returned.
          items:
            $ref: '#/components/schemas/WorkerSecret'
          type: array
        shared:
          description: Optional within this object. When true, users who are not administrators may execute the worker through the execute operation. Only meaningful for GENERIC_EVENT. Defaults to false.
          type: boolean
        sourceCode:
          description: Required within this object. The worker script, TypeScript or JavaScript, as plain text or as base64:<encoded source>. A script that does not transpile is rejected with 400 and the compiler message.
          type: string
      required:
        - key
        - enabled
        - sourceCode
        - action
      type: object
    WorkerExecutionHistoryEntry:
      description: One recorded run.
      properties:
        endTimeMillis:
          description: Optional within this object. When the run ended, epoch milliseconds.
          format: int64
          type: integer
        errorCode:
          description: 'Optional within this object. Set when the run failed. Codes are artifactweave''s; the matching errorMessage reuses JFrog''s wording so existing alerting keeps matching: WORKER_MEMORY_LIMIT (''Worker used too much memory''), WORKER_CPU_LIMIT (''Worker used too much cpu time''), WORKER_EXECUTION_TIMEOUT (''Worker execution timeout''), WORKER_QUEUE_TIMEOUT (''Worker waited for too long in the queue''), WORKER_KILLED (''The worker has been killed unexpectedly''), WORKER_FLOATING_PROMISE (''Floating promises are not allowed. Make sure to await all promises''); WORKER_SCRIPT_ERROR for an exception thrown by the script and WORKER_PAYLOAD_TOO_LARGE for input or result over 100 KiB have no JFrog message.'
          enum:
            - WORKER_MEMORY_LIMIT
            - WORKER_CPU_LIMIT
            - WORKER_EXECUTION_TIMEOUT
            - WORKER_QUEUE_TIMEOUT
            - WORKER_KILLED
            - WORKER_FLOATING_PROMISE
            - WORKER_SCRIPT_ERROR
            - WORKER_PAYLOAD_TOO_LARGE
          type: string
        errorMessage:
          description: Optional within this object. Human readable reason for a failed run.
          type: string
        executedVersion:
          description: Optional within this object. Version of the worker that ran, when the worker is versioned.
          type: string
        executionStatus:
          description: Required within this object. STATUS_SUCCESS, or STATUS_FAILURE for a failed run (see errorCode).
          type: string
          x-unverified: true
        startTimeMillis:
          description: Required within this object. When the run started, epoch milliseconds.
          format: int64
          type: integer
        testRun:
          description: Optional within this object. True for runs made through the test operations; listed only with showTestRun=true.
          type: boolean
        traceId:
          description: Optional within this object. Request trace identifier, for correlating with server logs.
          type: string
        triggeredBy:
          description: Optional within this object. User or token subject whose operation raised the event, or the scheduler.
          type: string
        workerKey:
          description: Required within this object. The worker that ran.
          type: string
        workerProjectKey:
          description: Optional within this object. Project of the worker; empty at platform level.
          type: string
        workerType:
          description: Optional within this object. The action the worker handles, such as BEFORE_DOWNLOAD.
          type: string
      required:
        - workerKey
        - executionStatus
        - startTimeMillis
      type: object
    WorkerExecutionPayload:
      additionalProperties: true
      description: Input handed to the worker as its data argument. Its shape depends on the action; GET /api/v2/actions gives a sample payload and TypeScript types for each one.
      type: object
    WorkerExecutionResult:
      additionalProperties: true
      description: 'The outcome of one run: the script''s return value under data, and executionStatus.'
      properties:
        data:
          additionalProperties: true
          description: Optional within this object. What the script returned, unchanged. For BEFORE_ actions it carries the decision (status and message) in the shape the action's types define.
          type: object
        errorCode:
          description: 'Optional within this object. Set when the run failed. Codes are artifactweave''s; the matching errorMessage reuses JFrog''s wording so existing alerting keeps matching: WORKER_MEMORY_LIMIT (''Worker used too much memory''), WORKER_CPU_LIMIT (''Worker used too much cpu time''), WORKER_EXECUTION_TIMEOUT (''Worker execution timeout''), WORKER_QUEUE_TIMEOUT (''Worker waited for too long in the queue''), WORKER_KILLED (''The worker has been killed unexpectedly''), WORKER_FLOATING_PROMISE (''Floating promises are not allowed. Make sure to await all promises''); WORKER_SCRIPT_ERROR for an exception thrown by the script and WORKER_PAYLOAD_TOO_LARGE for input or result over 100 KiB have no JFrog message.'
          enum:
            - WORKER_MEMORY_LIMIT
            - WORKER_CPU_LIMIT
            - WORKER_EXECUTION_TIMEOUT
            - WORKER_QUEUE_TIMEOUT
            - WORKER_KILLED
            - WORKER_FLOATING_PROMISE
            - WORKER_SCRIPT_ERROR
            - WORKER_PAYLOAD_TOO_LARGE
          type: string
        errorMessage:
          description: Optional within this object. Human readable reason for a failed run; see errorCode.
          type: string
        executionStatus:
          description: Optional within this object. STATUS_SUCCESS when the script completed. artifactweave writes STATUS_FAILURE for a failed run; JFrog's failure value is not published.
          type: string
          x-unverified: true
      type: object
    WorkerFilterCriteria:
      description: 'Selects the events that trigger a worker: artifactFilterCriteria for repository actions whose metadata filterType is FILTER_REPO, schedule for SCHEDULED_EVENT (filterType SCHEDULE). Repository keys and the any* switches combine with OR.'
      properties:
        artifactFilterCriteria:
          description: Optional within this object. Selection for artifact and repository actions.
          properties:
            anyFederated:
              default: false
              description: Optional within this object. When true, events in every federated repository trigger the worker.
              type: boolean
            anyLocal:
              default: false
              description: Optional within this object. When true, events in every local repository trigger the worker.
              type: boolean
            anyRemote:
              default: false
              description: Optional within this object. When true, events in every remote repository and its cache trigger the worker.
              type: boolean
            excludePatterns:
              default: []
              description: Optional within this object. Ant patterns of paths that never trigger the worker; empty excludes nothing.
              items:
                description: One entry.
                type: string
              type: array
            includePatterns:
              default: []
              description: Optional within this object. Ant patterns of paths that trigger the worker; empty means every path.
              items:
                description: One entry.
                type: string
              type: array
            repoKeys:
              description: Optional within this object. Repository keys whose events trigger the worker.
              items:
                description: One entry.
                type: string
              type: array
          type: object
        schedule:
          description: Optional within this object. Cron schedule for SCHEDULED_EVENT workers; required for that action and rejected for others.
          properties:
            cron:
              description: Required within this object. Cron expression for when the worker runs.
              type: string
            timezone:
              description: Optional within this object. IANA time zone the expression is evaluated in. Defaults to UTC.
              type: string
          required:
            - cron
          type: object
      type: object
    WorkerProperty:
      description: A named clear-text setting available to the worker. Unlike secrets, values are stored and returned as given.
      properties:
        key:
          description: Required within this object. Property name, unique within the worker.
          type: string
        markedForRemoval:
          description: Optional within this object. On update, true deletes the property named by key. Defaults to false.
          type: boolean
        value:
          description: Optional within this object. The property value.
          type: string
      required:
        - key
      type: object
    WorkerScaffoldTsConfig:
      description: The TypeScript settings worker scripts are compiled with, for editors and local type checking.
      properties:
        compilerOptions:
          additionalProperties: true
          description: Optional within this object. Compiler options matching what esbuild applies when a worker is saved.
          type: object
        exclude:
          description: Optional within this object. Paths excluded from compilation.
          items:
            description: One entry.
            type: string
          type: array
        include:
          description: Optional within this object. Glob patterns of the files to compile.
          items:
            description: One entry.
            type: string
          type: array
      type: object
    WorkerSecret:
      description: A named secret available to the worker as context.secrets.get(key). Values are sealed at rest (decision 0017) and never returned.
      properties:
        key:
          description: Required within this object. Secret name, unique within the worker.
          type: string
        markedForRemoval:
          description: Optional within this object. On update, true deletes the secret named by key. Defaults to false.
          type: boolean
        value:
          description: Optional within this object. The secret value. Omitted on reads; on update, omitting it keeps the stored value.
          type: string
          writeOnly: true
      required:
        - key
      type: object
    WorkerTestRequest:
      description: A test run of a script. The script runs with the given action and input without being saved; staged secrets and properties overlay the saved worker's when the run names one.
      properties:
        action:
          description: Required within this object. The action whose input and result types apply, such as BEFORE_DOWNLOAD or GENERIC_EVENT.
          type: string
        code:
          description: Required within this object. The script to run, TypeScript or JavaScript, plain or base64:<encoded>. Import statements are not allowed.
          type: string
        data:
          additionalProperties: true
          description: Required within this object. The input handed to the script as its data argument, in the action's request shape (GET /api/v2/actions gives a sample).
          type: object
        stagedProperties:
          description: Optional within this object. Properties for this run only, merged over the saved worker's by key.
          items:
            $ref: '#/components/schemas/WorkerProperty'
          type: array
        stagedSecrets:
          description: Optional within this object. Secrets for this run only, merged over the saved worker's by key.
          items:
            $ref: '#/components/schemas/WorkerSecret'
          type: array
      required:
        - code
        - action
        - data
      type: object
    WorkerTestResult:
      additionalProperties:
        $ref: '#/components/schemas/WorkerExecutionResult'
      description: 'Test run outcome keyed by the action name in lower camel case, for example {"genericEvent": {"data": ..., "executionStatus": "STATUS_SUCCESS"}} for GENERIC_EVENT or beforeDownload for BEFORE_DOWNLOAD.'
      type: object
    WorkerUpdateRequest:
      description: 'A worker definition. Source is TypeScript or JavaScript, sent as plain text or as base64:<encoded>, transpiled by esbuild when saved and run by the embedded goja engine (decision 0026). Each execution runs alone in a helper process (the artifactweave binary''s hidden worker-host subcommand) under JFrog''s documented default limits: 64 MiB of memory (the run is interrupted on breach and the helper replaced at twice that), 1 s of CPU time, 5 s per platform or HTTP call, 20 s overall, a call stack depth of 100, 100 KiB of JSON input and of result, and source of at most 100,000 characters. Helpers form a pool of min(4, GOMAXPROCS); a run that waits longer than 30 s for a helper fails (JFrog''s maxWaitingInQueueMillis default).'
      properties:
        action:
          description: Optional within this object. The event that runs the worker. BEFORE_ actions run synchronously inside the operation and can veto or alter it; AFTER_ actions run after it has committed; GENERIC_EVENT workers run only when called through the execute operation. SCHEDULED_EVENT workers run on the cron schedule in filterCriteria.schedule. The server accepts only the actions it can trigger, which GET /api/v2/actions lists; any other value is rejected with 400. The enum is the union of JFrog's documented list and the names a live catalogue and JFrog's samples use (BEFORE_REMOTE_INFO, AFTER_WORKLOAD_STATE_CHANGE, SCHEDULED_EVENT); AFTER_SAVE, BEFORE_UPLOAD_REQUEST, BEFORE_REMOTE_INFO_REQUEST and AFTER_WORKLOAD_STATE_CHANGE_REQUEST appear only in the reference list and are accepted as aliases.
          enum:
            - AFTER_BUILD_INFO_SAVE
            - AFTER_COPY
            - AFTER_CREATE
            - AFTER_DELETE
            - AFTER_DOWNLOAD
            - AFTER_DOWNLOAD_ERROR
            - AFTER_MOVE
            - AFTER_PROPERTY_CREATE
            - AFTER_PROPERTY_DELETE
            - AFTER_REMOTE_DOWNLOAD
            - AFTER_REPO_CREATE
            - AFTER_REPO_DELETE
            - AFTER_REPO_UPDATE
            - AFTER_SAVE
            - AFTER_WORKLOAD_STATE_CHANGE
            - AFTER_WORKLOAD_STATE_CHANGE_REQUEST
            - ALT_ALL_RESPONSES
            - ALT_REMOTE_CONTENT
            - ALT_REMOTE_PATH
            - ALT_RESPONSE
            - BEFORE_BUILD_INFO_SAVE
            - BEFORE_COPY
            - BEFORE_CREATE
            - BEFORE_CREATE_TOKEN
            - BEFORE_DELETE
            - BEFORE_DELETE_REPLICATION
            - BEFORE_DIRECTORY_REPLICATION
            - BEFORE_DOWNLOAD
            - BEFORE_DOWNLOAD_REQUEST
            - BEFORE_FILE_REPLICATION
            - BEFORE_MOVE
            - BEFORE_PROPERTY_CREATE
            - BEFORE_PROPERTY_DELETE
            - BEFORE_PROPERTY_REPLICATION
            - BEFORE_REMOTE_DOWNLOAD
            - BEFORE_REMOTE_INFO
            - BEFORE_REMOTE_INFO_REQUEST
            - BEFORE_REPO_CREATE
            - BEFORE_REPO_DELETE
            - BEFORE_REPO_UPDATE
            - BEFORE_REVOKE_TOKEN
            - BEFORE_STATISTICS_REPLICATION
            - BEFORE_TOKEN_EXPIRY
            - BEFORE_UPLOAD
            - BEFORE_UPLOAD_REQUEST
            - GENERIC_EVENT
            - SCHEDULED_EVENT
          type: string
        debug:
          description: Optional within this object. When true every run is recorded in the execution history; when false, the default, only failed runs are.
          type: boolean
        description:
          description: Optional within this object. Free text shown with the worker.
          type: string
        enabled:
          description: Optional within this object. Whether the worker runs when its event occurs.
          type: boolean
        filterCriteria:
          allOf:
            - $ref: '#/components/schemas/WorkerFilterCriteria'
          description: Optional within this object. Which events trigger the worker. Required for actions whose metadata has mandatoryFilter true, ignored for GENERIC_EVENT.
        key:
          description: Required within this object. Identifier of the worker to update; it cannot be changed.
          type: string
        projectKey:
          description: Optional within this object. Project that owns the worker; empty for a platform-level worker. Must match the projectKey query parameter when a project administrator makes the call.
          type: string
        properties:
          description: Optional within this object. Clear-text settings for the worker, merged by key on update.
          items:
            $ref: '#/components/schemas/WorkerProperty'
          type: array
        secrets:
          description: Optional within this object. Secrets for the worker. On update, entries are merged by key; markedForRemoval deletes one. Values are never returned.
          items:
            $ref: '#/components/schemas/WorkerSecret'
          type: array
        shared:
          description: Optional within this object. When true, users who are not administrators may execute the worker through the execute operation. Only meaningful for GENERIC_EVENT. Defaults to false.
          type: boolean
        sourceCode:
          description: Optional within this object. The worker script, TypeScript or JavaScript, as plain text or as base64:<encoded source>. A script that does not transpile is rejected with 400 and the compiler message.
          type: string
      required:
        - key
      type: object
