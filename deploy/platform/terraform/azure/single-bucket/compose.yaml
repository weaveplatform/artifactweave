# artifactweave in a local container, storing blobs in the acceptance storage
# account. Port 8082, so it can run beside the GCS environment's 8081.
# credentials.sh renders .local/ from the Terraform outputs first. The project
# name keeps the data volume (acceptance-azure_data) from before the move.
name: acceptance-azure
services:
  artifactweave:
    build:
      context: ${ARTIFACTWEAVE_ROOT:?run through make, or set ARTIFACTWEAVE_ROOT to the repository root}
      args:
        VERSION: ${VERSION:-devel}
        COMMIT: ${COMMIT:-unknown}
    image: artifactweave:acceptance
    ports:
      - "8082:8081"
    env_file: .local/env
    volumes:
      - ./.local/artifactweave.yaml:/etc/artifactweave/artifactweave.yaml:ro
      - data:/data
volumes:
  data: {}
