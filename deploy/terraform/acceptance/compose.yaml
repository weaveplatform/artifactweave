# artifactweave in a local container, storing blobs in the acceptance bucket.
# up.sh renders .local/artifactweave.yaml and .local/env from the Terraform
# outputs first.
services:
  artifactweave:
    build:
      context: ../../..
      args:
        VERSION: ${VERSION:-devel}
        COMMIT: ${COMMIT:-unknown}
    image: artifactweave:acceptance
    ports:
      - "8081:8081"
    env_file: .local/env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /etc/artifactweave/gcp-credentials.json
    volumes:
      - ./.local/artifactweave.yaml:/etc/artifactweave/artifactweave.yaml:ro
      - ./.secrets/container-credentials.json:/etc/artifactweave/gcp-credentials.json:ro
      - data:/data
volumes:
  data: {}
