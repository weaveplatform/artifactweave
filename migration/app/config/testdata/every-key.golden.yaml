        write_quorum: 0
        zone: ""
        member_timeout: 0s
master_key: <redacted>
master_key_previous: <redacted>
bootstrap:
    admin_password: <redacted>
    descriptor: /srv/desc.yaml
docker:
    subdomain_match: true
log:
    level: warn
    format: text
gc:
    interval: 0s
    grace_period: 0s
download:
    redirect:
        min_size: 4MiB
        ttl: 1m30s
    folder:
        max_concurrent_requests: 3
search:
    aql:
        max_results: 1000
        non_admin_scan_factor: 3
    user_query_limit: 50
    limit_anonymous_users_only: false
work:
    workers: 8
    lease: 5m0s
    max_attempts: 4
build:
    block_duplicate_entries: false
npm:
    login_token_expiry: 48h0m0s
    tag_latest_by_publish: true
    enforce_path: false
    max_publish_size: 256MiB
token:
    allow_basic_auth: true
deploy:
    enforce_permission_check_on_identical_checksum_deploy: true
environments:
    global_limit: 30
aql_timeout:
    query: 10m0s
    streamed: 1h0m0s
maven:
    snapshot_cleanup_interval: 2m0s
helm:
    relative_urls: false
nuget:
    snapshot_cleanup_interval: 3m0s
huggingface:
    xet_enabled: false
conda:
    shards_enabled: false
pypi:
    enforce_layout: false
    enforce_naming_normalization: false
    simple_json: false
    core_metadata: false
cran:
    archive_mover_enabled: false
remote:
    allowed_private_origins: []
api:
    enabled: false
    authentication_per_minute: 1000
    global_per_minute: 900
    principal_per_minute: 100
    project_per_minute: 500
    repository_per_minute: 400
    expensive_per_minute: 50
    expensive_principal_per_minute: 10
    max_concurrent: 12
    expensive_concurrent: 4
    expensive_principal_concurrent: 1
    max_keys: 64
    budget_timeout: 250ms
    expensive_timeout: 1m0s
