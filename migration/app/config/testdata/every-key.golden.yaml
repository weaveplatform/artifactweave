        bucket: archive
        prefix: ""
        endpoint: ""
        credentials_file: ""
        google_access_id: ""
        part_size: "0"
        cdn:
            cloud_cdn:
                domain: ""
                key_name: ""
                key_file: ""
                path_prefix: ""
    azure:
        account: ""
        endpoint: ""
        container: ""
        prefix: ""
        credential: ""
        account_key: ""
        sas_token: ""
        connection_string: ""
        managed_identity_client_id: ""
        part_size: "0"
        copy_range_size: "0"
        concurrency: 0
        cdn:
            front_door:
                endpoint: ""
                path_prefix: ""
    stores: {}
