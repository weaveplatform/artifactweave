listen: :9000
base_url: https://repo.example.com
data_dir: /srv/aw
compat:
    artifactory_version: 7.160.1
database:
    driver: postgres
    dsn: postgres://u:redacted@db/aw
blob:
    backend: s3
    fs:
        root: /ignored
    s3:
        bucket: b
        prefix: p
        endpoint: http://minio:9000
        region: eu-west-1
        path_style: true
        profile: ""
        cdn:
            cloudfront:
                domain: d111.cloudfront.net
                key_pair_id: K2JCJMDEHXQW5F
                private_key_file: /srv/cloudfront.pem
                hash: sha256
                path_prefix: p
    gcs:
        bucket: g
        prefix: gp
        endpoint: http://gcs:4443
        credentials_file: /srv/sa.json
        google_access_id: aw@p.iam.gserviceaccount.com
        part_size: 32MiB
        cdn:
            cloud_cdn:
                domain: cdn.example.com
                key_name: key-1
                key_file: /srv/cloud-cdn.key
                path_prefix: gp
    azure:
        account: acct
        endpoint: https://acct.blob.core.windows.net/
        container: c
        prefix: ap
        credential: managed_identity
        account_key: <redacted>
        sas_token: <redacted>
        connection_string: <redacted>
        managed_identity_client_id: mi
        part_size: 16MiB
        copy_range_size: 64MiB
        concurrency: 4
        cdn:
            front_door:
                endpoint: artifacts-x1.z01.azurefd.net
                path_prefix: c
    stores: {}
    mirror:
        members: []
        redundancy: 0
        write_quorum: 0
        zone: ""
        member_timeout: 0s
