    backend: gcs
    fs:
        root: ""
    s3:
        bucket: ""
        prefix: ""
        endpoint: ""
        region: ""
        path_style: false
        profile: ""
        cdn:
            cloudfront:
                domain: ""
                key_pair_id: ""
                private_key_file: ""
                hash: ""
                path_prefix: ""
