listen: ":9000"
base_url: https://repo.example.com
data_dir: /srv/aw
compat:
  artifactory_version: 7.160.1
database:
  driver: postgres
  dsn: postgres://u:p@db/aw
blob:
  backend: s3
  fs:
    root: /ignored
  s3:
    bucket: b
    prefix: p
    endpoint: http://minio:9000
    region: eu-west-1
    path_style: true
    cdn:
      cloudfront:
        domain: d111.cloudfront.net
        key_pair_id: K2JCJMDEHXQW5F
        private_key_file: /srv/cloudfront.pem
        hash: sha256
        path_prefix: p
  gcs:
    bucket: g
    prefix: gp
    endpoint: http://gcs:4443
    credentials_file: /srv/sa.json
    google_access_id: aw@p.iam.gserviceaccount.com
    part_size: 32MiB
    cdn:
      cloud_cdn:
        domain: cdn.example.com
        key_name: key-1
        key_file: /srv/cloud-cdn.key
        path_prefix: gp
  azure:
    account: acct
    endpoint: https://acct.blob.core.windows.net/
    container: c
    prefix: ap
    credential: managed_identity
    account_key: ak
    sas_token: st
    connection_string: cs
    managed_identity_client_id: mi
    part_size: 16MiB
    copy_range_size: 64MiB
    concurrency: 4
    cdn:
      front_door:
        endpoint: artifacts-x1.z01.azurefd.net
        path_prefix: c
cold_blob:
  backend: gcs
  gcs:
    bucket: archive
master_key: k
master_key_previous: kp
bootstrap:
  admin_password: pw
  descriptor: /srv/desc.yaml
docker:
  subdomain_match: true
log:
  level: warn
  format: text
download:
  redirect:
    min_size: 4MiB
    ttl: 90s
  folder:
    max_concurrent_requests: 3
search:
  aql:
    max_results: 1000
    non_admin_scan_factor: 3
  user_query_limit: 50
  limit_anonymous_users_only: false
work:
  workers: 8
  lease: 5m
  max_attempts: 4
build:
  block_duplicate_entries: false
npm:
  login_token_expiry: 48h
  max_publish_size: 256MiB
  tag_latest_by_publish: true
token:
  allow_basic_auth: true
deploy:
  enforce_permission_check_on_identical_checksum_deploy: true
environments:
  global_limit: 30
aql_timeout:
  query: 10m
  streamed: 1h
maven:
  snapshot_cleanup_interval: 2m
helm:
  relative_urls: false
nuget:
  snapshot_cleanup_interval: 3m
api:
  enabled: false
  authentication_per_minute: 1000
  global_per_minute: 900
  principal_per_minute: 100
  project_per_minute: 500
  repository_per_minute: 400
  expensive_per_minute: 50
  expensive_principal_per_minute: 10
  max_concurrent: 12
  expensive_concurrent: 4
  expensive_principal_concurrent: 1
  max_keys: 64
  budget_timeout: 250ms
  expensive_timeout: 1m
